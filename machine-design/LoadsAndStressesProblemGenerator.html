  labels.push(text(add(add([0,0],E1,0.5),u(al),off+10),`${p.L1}`,`text-anchor="middle" class="halo"`));
  const xd=hw+45;

  labels.push(text([xd+6,-p.L2/2-4],`${p.L2}`,`class="halo"`));
  g+=line([0,0],[xd+20,0],`stroke="#222" stroke-width="0.9"`);
  const ar=[];for(let a=0;a<=al+1e-6;a+=3)ar.push(P(0.8*off*Math.cos(a*c),0.8*off*Math.sin(a*c)));
  g+=`<polyline points="${ar.join(" ")}" fill="none" stroke="#222"/>`;

  // ---------- section A-A, true proportions, scale k
  const k=2.0, X0=Math.max(xd+70,...pts.map(q=>q[0]))+40, Y0=-0.45*p.L2;
  const SX=r=>X0+k*r/1, SY=y=>Y0+k*y;

  const marks=[0,s.ri,w1[2],h1[2],h2[1],h2[2],s.ro], rows=[H2+30,H2+30,H2+20,H2+10,H2+10,H2+20,H2+30];
  marks.forEach((r,i)=>{if(i>0)g+=sl(r,(i===1||i===6)?t2+1:H2+1,r,rows[i]+3,EXT)});
  g+=sl(0,H2+10,0,H2+33,EXT);
  const segs=[[0,s.ri,H2+30],[s.ri,w1[2],H2+20],[w1[2],h1[2],H2+10],[h1[2],h2[1],H2+10],[h2[1],h2[2],H2+10],[h2[2],s.ro,H2+20]];
  segs.forEach(([a,b,y])=>{g+=sl(a,y,b,y,DIM);labels.push(st((a+b)/2,y+2,`${fmt(b-a)}`,`text-anchor="middle" font-size="20" class="halo"`))});
  g+=sl(s.ri,-t2-1,s.ri,-H2-18,EXT)+sl(s.ro,-t2-1,s.ro,-H2-18,EXT)+sl(s.ri,-H2-15,s.ro,-H2-15,DIM);

  g+=sl(h2[2]+1,H2,xr+26,H2,EXT)+sl(h2[2]+1,-H2,xr+26,-H2,EXT)+sl(xr+23,H2,xr+23,-H2,DIM);

function bcSolution(p,s){
  const rows=s.pieces.map(([b,a,c2],i)=>`<tr><td>${["Inner web","Inner hub wall","Outer hub wall","Outer web"][i]}</td><td>${fmt(a)}–${fmt(c2)}</td><td>${b}</td><td>${fmt(b*(c2-a))}</td><td>${fmt(b*Math.log(c2/a),3)}</td></tr>`).join("");
  return `<h3>1. Equilibrium</h3>
  <p>Moments about the pivot: <span class="eq">F<sub>1</sub>(${p.L1}) = F<sub>2</sub>(${p.L2})</span>, so</p>
  <p class="final">F<sub>1</sub> = ${fmt(s.F1,3)} kN.</p>
  <p>The bending moment at section <i>A</i>–<i>A</i> is <span class="eq">M = F<sub>2</sub> L<sub>2</sub> = ${fmt(s.M/1000,1)} N·m</span>. Both forces tend to open the inner corner, so the inner surface is in tension.</p>
  <h3>2. Section properties</h3>
  <p>Radii are measured from the center of the corner radius: <span class="eq">r<sub>i</sub> = ${s.ri} mm, r<sub>o</sub> = ${s.ro} mm</span>. The bushing and bore carry no bending stress.</p>
  <table><tr><th>Piece</th><th>r (mm)</th><th>b (mm)</th><th>A (mm²)</th><th>b ln(r<sub>out</sub>/r<sub>in</sub>)</th></tr>${rows}</table>
  <p><span class="eq">A = ${fmt(s.A)} mm²</span>&nbsp; <span class="eq">r<sub>c</sub> = ${fmt(s.rc,3)} mm</span>&nbsp; <span class="eq">r<sub>n</sub> = A / Σ b ln(r<sub>out</sub>/r<sub>in</sub>) = ${fmt(s.rn,3)} mm</span>&nbsp; <span class="eq">e = ${fmt(s.e,3)} mm</span></p>
  <h3>3. Inner surface</h3>
  <p><span class="eq">σ<sub>i</sub> = M(r<sub>n</sub> − r<sub>i</sub>)/(A e r<sub>i</sub>)</span></p>
  <p class="final">σ<sub>i</sub> = ${fmt(s.si,1)} MPa (tension)</p>
  <h3>4. Outer surface</h3>
  <p><span class="eq">σ<sub>o</sub> = −M(r<sub>o</sub> − r<sub>n</sub>)/(A e r<sub>o</sub>)</span></p>
  <p class="final">σ<sub>o</sub> = ${fmt(s.so,1)} MPa (compression)</p>
  <h3>5. Effect of curvature</h3>
  <p>Straight-beam theory gives ${fmt(s.stI,1)} MPa and ${fmt(s.stO,1)} MPa. The bore removes material near the middle of the section, which moves the neutral axis ${fmt(s.e,1)} mm toward the inner surface. Cast iron is weaker in tension than in compression, so the inner surface governs.</p>`;
}

// ===== two-member pin-jointed frame (statics, stress, pin shear, buckling; SI units)
const FR_E=207000;   // MPa
function frSolve(p){
  const th=p.theta*Math.PI/180;
  const u=p.dir==="down"?[0,-1]:p.dir==="left"?[-Math.cos(th),-Math.sin(th)]:[Math.cos(th),-Math.sin(th)];
  const F=[u[0]*p.F*1000,u[1]*p.F*1000];
  const B=[p.bx,p.h], A=[p.ax,0];
  const L2=Math.hypot(B[0],B[1]), L3=Math.hypot(A[0]-B[0],A[1]-B[1]);
  const uBO=[-B[0]/L2,-B[1]/L2], uBA=[(A[0]-B[0])/L3,(A[1]-B[1])/L3];
  const det=uBO[0]*uBA[1]-uBO[1]*uBA[0];
  const F2=(-F[0]*uBA[1]+F[1]*uBA[0])/det, F3=(-uBO[0]*F[1]+uBO[1]*F[0])/det;   // tension positive
  const RO=[F2*uBO[0],F2*uBO[1]], RA=[F3*uBA[0],F3*uBA[1]];                     // support reactions on the frame
  const A2=Math.PI*p.d2**2/4, A3=p.b3*p.t3, Ap=Math.PI*p.dp**2/4;
  const I2=Math.PI*p.d2**4/64, I3=p.b3*p.t3**3/12;
  const Pcr2=Math.PI**2*FR_E*I2/(L2*1000)**2, Pcr3=Math.PI**2*FR_E*I3/(L3*1000)**2;
  const n2=F2<0?Pcr2/-F2:Infinity, n3=F3<0?Pcr3/-F3:Infinity;
  const crit=n2<=n3?"2":"3";
  return {u,F,L2,L3,uBO,uBA,F2,F3,RO,RA,ROm:Math.abs(F2),RAm:Math.abs(F3),A2,A3,Ap,I2,I3,Pcr2,Pcr3,n2,n3,crit,n:Math.min(n2,n3),
    s2:F2/A2,s3:F3/A3,tO:Math.abs(F2)/(2*Ap),tA:Math.abs(F3)/(2*Ap)};
}

function frGenerate(seed){
  const r=mulberry32(seed);
  for(let k=0;k<5000;k++){
    const dir=pick(r,["left","left","right","down"]);
    const sec=pick(r,[[20,6],[25,6],[25,8],[30,8]]);
    const p={bx:pick(r,[0,0.2,0.3,0.4]), h:pick(r,[0.6,0.7,0.8,0.9,1.0]), ax:pick(r,[0.8,0.9,1.0,1.1,1.2,1.3,1.4]),
      dir, theta:dir==="down"?90:pick(r,dir==="left"?[0,20,30,45,60]:[20,30,45,60]),
      F:pick(r,range(0.8,3,0.1)), d2:pick(r,[10,12,14,16]), b3:sec[0], t3:sec[1], dp:pick(r,[6,8,10])};
    p.F=+p.F.toFixed(1);
    if(p.ax-p.bx<0.4) continue;
    const s=frSolve(p);
    if(!(s.n>=1.2&&s.n<=6)) continue;                     // a compression link with a meaningful buckling check
    if(Math.min(Math.abs(s.F2),Math.abs(s.F3))<0.1*p.F*1000) continue;
    if(isFinite(s.n2)&&isFinite(s.n3)&&Math.abs(s.n2-s.n3)/s.n<0.05) continue;
    return {p,s};
  }
  throw new Error("no valid problem");
}

function frLoadText(p){
  return p.dir==="down"?"vertically downward":`directed ${p.theta===0?"horizontally":`down at ${p.theta}° below the horizontal and`} to the ${p.dir}`.replace("horizontally to the","horizontally to the");
}

function frStatement(p){
  const where=p.bx===0?`directly above <i>O</i>, ${fmt(p.h,2)} m up`:`${fmt(p.bx,2)} m to the right of <i>O</i> and ${fmt(p.h,2)} m above it`;
  return `<p>The frame shown consists of the ground (link 1) and two links pinned together at <i>B</i>. Link 2 is pinned to the ground at <i>O</i>, and link 3 at <i>A</i>. Joint <i>B</i> is ${where}, and <i>A</i> is ${fmt(p.ax,2)} m to the right of <i>O</i> at the level of <i>O</i>. A load <i>F</i> = ${fmt(p.F,1)} kN acts at <i>B</i>, ${frLoadText(p)}. Link 2 is a ${p.d2} mm diameter round steel bar; link 3 is a ${p.b3} × ${p.t3} mm flat steel bar (<i>E</i> = 207 GPa for both). The pins at <i>O</i> and <i>A</i> are ${p.dp} mm in diameter and act in double shear. Take <i>x</i> to the right and <i>y</i> upward, and neglect the weights of the links.</p>
  <p>Find (a) the force in each link, tension positive; (b) the reactions at <i>O</i> and <i>A</i>; (c) the normal stress in each link; (d) the shear stress in the pins at <i>O</i> and <i>A</i>; and (e) which link buckles first and its factor of safety against buckling, treating each link as a pinned-pinned column (link 3 buckles about its thin direction).</p>`;
}

    pts.forEach(q=>Gr(X(q[0]),Y(q[1])));return `<polygon points="${pts.map(q=>f1(X(q[0]))+","+f1(Y(q[1]))).join(" ")}" fill="#b9c8d8" stroke="#28405a" stroke-width="1.6"/>`};
  g+=clevis(O)+clevis(A);

  else{g+=line([0,yd],[p.ax,yd],DIM);labels.push(text([p.ax/2,yd-0.045],`${fmt(p.ax,2)} m`,`text-anchor="middle"`));}
  // section note

  g+=labels.join("");
  const pad=16,W=bb.mxX-bb.mnX+2*pad,H=bb.mxY-bb.mnY+2*pad;
  return `<svg viewBox="${f1(bb.mnX-pad)} ${f1(bb.mnY-pad)} ${f1(W)} ${f1(H)}" xmlns="http://www.w3.org/2000/svg" font-family="Georgia,serif" font-size="22" style="max-height:520px">
  <defs>
   <pattern id="fr-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#28405a" stroke-width="1"/></pattern>
   <marker id="fr-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#aa1e28"/></marker>
   <marker id="fr-dm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#222"/></marker>
  </defs>${g}</svg>`;
}

function frSolution(p,s){
  const ang2=Math.atan2(p.h,p.bx)*180/Math.PI, ang3=Math.atan2(p.h,-(p.ax-p.bx))*180/Math.PI;
  const tc=v=>v>=0?"tension":"compression";
  const buck=(lab,F,Pcr,n,I,L)=>F<0?`<tr><td>Link ${lab}</td><td>${fmt(I,1)}</td><td>${fmt(L*1000,1)}</td><td>${fmt(Pcr)}</td><td>${fmt(-F)}</td><td>${fmt(n,2)}</td></tr>`:`<tr><td>Link ${lab}</td><td colspan="5">in tension, cannot buckle</td></tr>`;
  return `<h3>1. Two-force members</h3>
  <p>Each link is loaded only at its two pins, so its force acts along the line between them. Link 2 is at ${fmt(ang2,2)}° from the +<i>x</i> axis with length ${fmt(s.L2,4)} m; link 3 is at ${fmt(ang3,2)}° with length ${fmt(s.L3,4)} m.</p>
  <h3>2. (a) Equilibrium of pin B</h3>
  <p>With unit vectors from <i>B</i> along each link, <span class="eq">u<sub>BO</sub> = (${fmt(s.uBO[0],3)}, ${fmt(s.uBO[1],3)})</span> and <span class="eq">u<sub>BA</sub> = (${fmt(s.uBA[0],3)}, ${fmt(s.uBA[1],3)})</span>, and the load <span class="eq">F = (${fmt(s.F[0],1)}, ${fmt(s.F[1],1)}) N</span>, equilibrium <span class="eq">F<sub>2</sub> u<sub>BO</sub> + F<sub>3</sub> u<sub>BA</sub> + F = 0</span> gives</p>
  <p class="final">F<sub>2</sub> = ${fmt(s.F2,1)} N (${tc(s.F2)}), F<sub>3</sub> = ${fmt(s.F3,1)} N (${tc(s.F3)}).</p>
  <h3>3. (b) Reactions</h3>
  <p>At <i>O</i>: <span class="eq">R<sub>O</sub> = (${fmt(s.RO[0],1)}, ${fmt(s.RO[1],1)}) N</span>, magnitude ${fmt(s.ROm,1)} N. At <i>A</i>: <span class="eq">R<sub>A</sub> = (${fmt(s.RA[0],1)}, ${fmt(s.RA[1],1)}) N</span>, magnitude ${fmt(s.RAm,1)} N. Check: the reactions and <i>F</i> sum to zero.</p>
  <h3>4. (c) Normal stresses</h3>
  <p><span class="eq">σ<sub>2</sub> = F<sub>2</sub>/A<sub>2</sub> = ${fmt(s.F2,1)}/${fmt(s.A2,1)} = ${fmt(s.s2,2)} MPa</span>&nbsp; <span class="eq">σ<sub>3</sub> = F<sub>3</sub>/A<sub>3</sub> = ${fmt(s.F3,1)}/${fmt(s.A3,1)} = ${fmt(s.s3,2)} MPa</span></p>
  <h3>5. (d) Pin shear (double shear)</h3>
  <p><span class="eq">τ<sub>O</sub> = |F<sub>2</sub>|/(2A<sub>p</sub>) = ${fmt(s.tO,2)} MPa</span>&nbsp; <span class="eq">τ<sub>A</sub> = |F<sub>3</sub>|/(2A<sub>p</sub>) = ${fmt(s.tA,2)} MPa</span>, with <span class="eq">A<sub>p</sub> = ${fmt(s.Ap,2)} mm²</span>.</p>
  <h3>6. (e) Buckling, P<sub>cr</sub> = π²EI/L²</h3>
  <table><tr><th>Link</th><th>I (mm⁴)</th><th>L (mm)</th><th>P<sub>cr</sub> (N)</th><th>|F| (N)</th><th>n</th></tr>${buck("2",s.F2,s.Pcr2,s.n2,s.I2,s.L2)}${buck("3",s.F3,s.Pcr3,s.n3,s.I3,s.L3)}</table>
  <p class="final">Link ${s.crit} buckles first, with a factor of safety n = ${fmt(s.n,2)}.</p>
  <p>The compressive stress in link ${s.crit} is only ${fmt(Math.abs(s.crit==="2"?s.s2:s.s3),1)} MPa, far below yield; buckling, not stress, governs this link.</p>`;
}

// ===== Mohr's circle for plane stress (tau_xy positive = ccw on the x face)
function mcSolve(p){
  const C=(p.sx+p.sy)/2, a=(p.sx-p.sy)/2, R=Math.round(Math.hypot(a,p.txy)*1e9)/1e9;   // remove floating noise from integer radii
  const tp=0.5*Math.atan2(p.txy,a)*180/Math.PI;          // x axis to sigma_1, ccw positive, in (-90, 90]
  const ts=tp-45>-90?tp-45:tp+45;                         // face carrying +R (ccw shear), 45 deg from the principal planes
  const tauAt=t=>{const r=2*t*Math.PI/180;return -a*Math.sin(r)+p.txy*Math.cos(r)};
  const tsPos=tauAt(ts)>0?ts:(ts>0?ts-90:ts+90);
  return {C,a,R,s1:C+R,s2:C-R,tp,ts:tsPos,dir:tp>=0?"ccw":"cw"};
}

function mcGenerate(seed){
  const r=mulberry32(seed);
  const triples=[[3,4,5],[5,12,13],[8,15,17],[7,24,25],[6,8,10],[20,21,29],[9,12,15]];
  for(let k=0;k<5000;k++){
    const unit=pick(r,["kpsi","kpsi","MPa"]), sc=unit==="MPa"?5:1;
    let [m,n,R]=pick(r,triples);
    const f=R<=10?pick(r,[1,2]):1;
    m*=f;n*=f;R*=f;
    if(R>30) continue;
    if(r()<0.5)[m,n]=[n,m];
    const a=(r()<0.5?-1:1)*m, t=(r()<0.5?-1:1)*n, C=pick(r,range(-10,15,1));
    const p={sx:(C+a)*sc, sy:(C-a)*sc, txy:t*sc, unit};
    if(p.sx===0||p.sy===0) continue;
    return {p,s:mcSolve(p)};
  }
  throw new Error("no valid problem");
}

const mcFmt=v=>fmt(v,Number.isInteger(v)?0:2);
function mcStatement(p){
  return `<p>For the plane stress state <i>σ<sub>x</sub></i> = ${mcFmt(p.sx)} ${p.unit}, <i>σ<sub>y</sub></i> = ${mcFmt(p.sy)} ${p.unit}, <i>τ<sub>xy</sub></i> = ${mcFmt(Math.abs(p.txy))} ${p.unit} ${p.txy>0?"ccw":"cw"} (the sense of the shear on the <i>x</i> face), draw a properly labeled Mohr's circle with clockwise shear plotted above the <i>σ</i> axis.</p>
  <p>Find the principal normal stresses, the extreme shear stresses and the normal stress on their planes, and the angle from the <i>x</i> axis to <i>σ</i><sub>1</sub>. Draw the principal and maximum-shear stress elements and label all stresses and angles.</p>`;
}

// stress element as SVG: rotation (deg, ccw), normal signs for x' and y' faces, shear sign (+ = ccw on the x' face)
function mcElement(rot,nx,ny,sh,cx,cy,labels){
  const st=`stroke="#aa1e28" stroke-width="2.4" marker-end="url(#mc-ar)"`;

  if(nx>0)q+=L(48,0,80,0)+L(-48,0,-80,0); if(nx<0)q+=L(80,0,48,0)+L(-80,0,-48,0);
  if(ny>0)q+=L(0,48,0,80)+L(0,-48,0,-80); if(ny<0)q+=L(0,80,0,48)+L(0,-80,0,-48);
  if(sh>0)q+=L(43,-24,43,24)+L(-43,24,-43,-24)+L(-24,43,24,43)+L(24,-43,-24,-43);
  if(sh<0)q+=L(43,24,43,-24)+L(-43,-24,-43,24)+L(24,43,-24,43)+L(-24,-43,24,-43);

}
const mcDefs=`<defs><marker id="mc-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#aa1e28"/></marker>

function mcFigure(p,s){

function mcSolution(p,s){

  <p class="final">σ<sub>1</sub> acts ${fmt(Math.abs(s.tp),1)}° ${s.dir} from the x axis.</p>

  <p>The extreme-shear planes are 45° from the principal planes. The face rotated ${fmt(Math.abs(s.ts),1)}° ${s.ts>=0?"ccw":"cw"} from <i>x</i> carries τ = ${mcFmt(s.R)} ${u} ccw.</p>

// ===== strain gauges on a free surface: plane-stress Hooke's law
const SG_MAT=[["Aluminum alloy",71.7,10.4,0.333],["Brass",106,15.4,0.324],["Carbon steel",207,30.0,0.292],["Copper",119,17.2,0.326],
  ["Magnesium alloy",44.8,6.5,0.350],["Stainless steel (18-8)",190,27.6,0.305],["Titanium alloy",114,16.5,0.34]];
function sgSolve(p){
  const m=SG_MAT[p.mat], E=p.us?m[2]*1e3:m[1]*1e3, nu=m[3], k=E/(1-nu*nu), ex=p.ex*1e-6, ey=p.ey*1e-6;   // E in kpsi or MPa
  const sx=k*(ex+nu*ey), sy=k*(ey+nu*ex);
  return {m,E,nu,k,ex,ey,sx,sy,ez:-nu/(1-nu)*(ex+ey)*1e6};
}
function sgGenerate(seed){
  const r=mulberry32(seed);

    const ex=pick(r,range(300,3000,10)), p={mat:Math.floor(r()*SG_MAT.length),us:r()<0.4,ex,ey:-Math.round(ex*(0.05+0.55*r())/10)*10};
    if(r()<0.3){p.ex=-p.ex;p.ey=-p.ey}                                    // compressive cases
    const s=sgSolve(p), sMPa=Math.abs(s.sx)*(p.us?6.895:1);
    if(sMPa<50||sMPa>500||Math.abs(s.sy)<0.04*Math.abs(s.sx)) continue;   // σy must be clearly nonzero
    return {p,s};
  }

}
function sgTable(p){

}
function sgStatement(p,s){

  <p>Using the properties below, find σ<sub><i>x</i></sub> and σ<sub><i>y</i></sub> in ${p.us?"kpsi":"MPa"}, and the strain ε<sub><i>z</i></sub> normal to the surface in microstrain (με).</p>${sgTable(p)}`;

function sgFigure(p,s){

function sgSolution(p,s){
  const u=p.us?"kpsi":"MPa", Eu=p.us?"kpsi":"MPa", e=v=>v.toExponential(4);
  return `<h3>1. Plane stress at a free surface</h3>
  <p>With σ<sub>z</sub> = 0, Hooke's law gives <span class="eq">ε<sub>x</sub> = (σ<sub>x</sub> − νσ<sub>y</sub>)/E</span> and <span class="eq">ε<sub>y</sub> = (σ<sub>y</sub> − νσ<sub>x</sub>)/E</span>. Solving for the stresses:</p>
  <p><span class="eq">σ<sub>x</sub> = E(ε<sub>x</sub> + νε<sub>y</sub>)/(1 − ν²)</span>&nbsp; <span class="eq">σ<sub>y</sub> = E(ε<sub>y</sub> + νε<sub>x</sub>)/(1 − ν²)</span></p>
  <h3>2. Numbers</h3>
  <p>${s.m[0]}: E = ${fmt(s.E,0)} ${Eu}, ν = ${fmt(s.nu,3)}, so <span class="eq">E/(1 − ν²) = ${fmt(s.k,0)} ${Eu}</span>.</p>
  <p><span class="eq">σ<sub>x</sub> = ${fmt(s.k,0)}[${e(s.ex)} + ${fmt(s.nu,3)}(${e(s.ey)})] = ${fmt(s.sx,p.us?2:1)} ${u}</span></p>
  <p><span class="eq">σ<sub>y</sub> = ${fmt(s.k,0)}[${e(s.ey)} + ${fmt(s.nu,3)}(${e(s.ex)})] = ${fmt(s.sy,p.us?2:1)} ${u}</span></p>
  <h3>3. Strain normal to the surface</h3>
  <p><span class="eq">ε<sub>z</sub> = −ν(σ<sub>x</sub> + σ<sub>y</sub>)/E = −ν(ε<sub>x</sub> + ε<sub>y</sub>)/(1 − ν) = ${fmt(s.ez,0)} με</span></p>
  <p class="final">σ<sub>x</sub> = ${fmt(s.sx,p.us?2:1)} ${u}, σ<sub>y</sub> = ${fmt(s.sy,p.us?2:1)} ${u}, ε<sub>z</sub> = ${fmt(s.ez,0)} με.</p>
  <p class="note">Check: (σ<sub>x</sub> − νσ<sub>y</sub>)/E returns ε<sub>x</sub>. σ<sub>y</sub> and ε<sub>y</sub> need not have the same sign, because the Poisson effect of σ<sub>x</sub> also contributes to ε<sub>y</sub>.</p>`;
}

// ===== composite cross sections: second moment of area, neutral axis, bending stresses at every level
const XS_FR={1:"⅛",2:"¼",3:"⅜",4:"½",5:"⅝",6:"¾",7:"⅞"};
function xsLen(v,us){if(!us) return fmt(v,Number.isInteger(v)?0:1);const n=Math.round(v*8),w=Math.floor(n/8),r=n%8;
  if(!r) return `${w}`; const g=r%2?1:r%4?2:4; return (w?w:"")+XS_FR[r];}  // eighths shown as vulgar fractions
function xsBuild(p){
  const d=p.d, L=[], D=[];                                  // layers [y0,y1,[[x0,x1],...]] bottom up; width dimensions
  let H;

    D.push({x0:-W/2,x1:-d.g/2,y:H,out:1,v:d.s},{x0:-d.g/2,x1:d.g/2,y:H,out:1,v:d.g,inner:true});}
  else if(p.fam==="box"){H=d.H;const W=d.W;
    L.push([0,d.tb,[[-W/2,-W/2+d.L],[W/2-d.L,W/2]]],[d.tb,H-d.tt,[[-W/2,-W/2+d.s],[W/2-d.s,W/2]]],[H-d.tt,H,[[-W/2,W/2]]]);

function xsSolve(p){

function xsGenerate(seed){
  const r=mulberry32(seed);
  for(let k=0;k<5000;k++){
    const us=r()<0.4, fam=pick(r,["I","U","box","T"]), e8=(a,b)=>pick(r,range(a*8,b*8,1))/8, d={};
    if(fam==="I"){ if(us){d.B1=e8(1,3);d.t1=e8(0.25,0.75);d.tw=e8(0.125,0.5);d.hw=e8(0.75,2.5);d.B2=e8(1,3);d.t2=e8(0.25,0.75)}
        else{d.B1=pick(r,range(30,80,5));d.t1=pick(r,range(8,25,1));d.tw=pick(r,range(5,12,1));d.hw=pick(r,range(20,60,5));d.B2=pick(r,range(30,80,5));d.t2=pick(r,range(8,25,1))}
        if(d.tw>0.5*Math.min(d.B1,d.B2)) continue; }
    else if(fam==="U"){ if(us){d.s=e8(0.25,0.5);d.g=e8(1,2.5);d.H=e8(1,2.5);d.tw=e8(0.25,0.5);d.e=pick(r,[0,0.25,0.5,0.75])}
        else{d.s=pick(r,[6,8,10,12]);d.g=pick(r,range(30,80,5));d.H=pick(r,range(40,90,5));d.tw=pick(r,range(6,15,1));d.e=pick(r,[0,10,15,20])}
        if(d.H-d.e-d.tw<(us?0.5:15)) continue; }
    else if(fam==="box"){ if(us){d.W=e8(2,4);d.H=e8(2,4);d.s=e8(0.25,0.5);d.tt=e8(0.25,0.5);d.tb=e8(0.25,0.5);d.L=e8(d.s+0.25,d.W/2-0.5)}
        else{d.W=pick(r,range(60,120,10));d.H=pick(r,range(60,120,10));d.s=pick(r,[8,10,12,15]);d.tt=pick(r,range(8,15,1));d.tb=pick(r,range(8,15,1));d.L=pick(r,range(d.s+5,d.W/2-10,5))}
        if(!(d.L>d.s)||d.W-2*d.L<(us?0.5:15)) continue; }
    else { if(us){d.b=e8(2,5);d.tf=e8(0.375,1);d.tw=e8(0.375,1);d.h=e8(1.5,3.5)}
        else{d.b=pick(r,range(40,100,5));d.tf=pick(r,range(8,20,1));d.tw=pick(r,range(6,20,1));d.h=pick(r,range(30,80,5))}
        if(d.tw>0.5*d.b) continue; }
    const p={fam,us,flip:r()<0.35,d,M:us?pick(r,range(1,40,0.5)):pick(r,range(0.2,5,0.05))};
    const s=xsSolve(p);
    if(us?(s.smax<3||s.smax>35):(s.smax<20||s.smax>250)) continue;
    if(s.pts.some(q=>Math.abs(q.y-s.yb)<0.03*s.H)) continue;      // no level sits on the neutral axis

function xsStatement(p,s){
  const M=p.us?`${fmt(p.M,1)} kip·in`:`${fmt(p.M,2)} kN·m`, n=s.pts.length, names=s.pts.map(q=>q.name);
  return `<p>The cross section shown (dimensions in ${p.us?"inches":"millimeters"}) transmits a positive bending moment about the <i>z</i> axis, <i>M<sub>z</sub></i> = ${M}. Points ${names.slice(0,-1).join(", ")} and ${names[n-1]} mark the bottom surface, every abrupt change in the section, and the top surface.</p>
  <p>Find the second moment of area about the neutral axis, the location of the neutral axis measured from the bottom surface ${names[0]}, the distances from the neutral axis to the top and bottom surfaces, and the bending stress at each of ${names.join(", ")}.</p>`;
}
function xsFigure(p,s){
  const {L,D,H}=xsBuild(p), us=p.us, Wm=Math.max(...L.flatMap(l=>l[2].flatMap(v=>v.map(Math.abs))))*2;
  const S=Math.min(280/H,330/Wm), X=x=>x*S, Y=y=>-y*S, f1=v=>v.toFixed(1), it=v=>`<tspan font-style="italic">${v}</tspan>`;
  const ln=(x1,y1,x2,y2,attr)=>`<line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2)}" y2="${f1(y2)}" ${attr}/>`;
  const tx=(x,y,t,attr="")=>`<text x="${f1(x)}" y="${f1(y)}" ${attr}>${t}</text>`;
  const DIM=`stroke="#222" stroke-width="0.9" marker-start="url(#xs-dm)" marker-end="url(#xs-dm)"`, EXT=`stroke="#999" stroke-width="0.8"`, OL=`stroke="#7d5014" stroke-width="1.8" stroke-linecap="square"`;
  let g="";
  L.forEach(([y0,y1,iv])=>iv.forEach(([x0,x1])=>{g+=`<rect x="${f1(X(x0))}" y="${f1(Y(y1))}" width="${f1((x1-x0)*S)}" height="${f1((y1-y0)*S)}" fill="#eec878" stroke="#eec878" stroke-width="0.8"/>`}));
  // outline: vertical edges of every interval, horizontal edges where coverage changes between layers
  L.forEach(([y0,y1,iv])=>iv.forEach(([x0,x1])=>{g+=ln(X(x0),Y(y0),X(x0),Y(y1),OL)+ln(X(x1),Y(y0),X(x1),Y(y1),OL)}));
  const cov=(iv,x)=>iv.some(([a,b])=>x>a&&x<b);
  for(let i=0;i<=L.length;i++){const below=i>0?L[i-1][2]:[], above=i<L.length?L[i][2]:[], y=i<L.length?L[i][0]:L[i-1][1];
    const xs=[...new Set([...below,...above].flat())].sort((a,b)=>a-b);
    for(let j=0;j+1<xs.length;j++){const m=(xs[j]+xs[j+1])/2;if(cov(below,m)!==cov(above,m)) g+=ln(X(xs[j]),Y(y),X(xs[j+1]),Y(y),OL)}}
  // axes
  const CL=`stroke="#888" stroke-width="0.9" stroke-dasharray="10 3 2 3"`;
  g+=ln(0,Y(H)-58,0,Y(0)+46,CL)+tx(6,Y(H)-62,it("y"));
  g+=ln(X(-Wm/2)-60,Y(s.yb),X(Wm/2)+30,Y(s.yb),CL)+tx(X(-Wm/2)-68,Y(s.yb)+6,it("z"),`text-anchor="end"`);
  // level letters, to the right of the outline
  const ext=y=>Math.max(...L.filter(l=>y>=l[0]-1e-9&&y<=l[1]+1e-9).flatMap(l=>l[2].map(v=>v[1])));
  s.pts.forEach(q=>{g+=tx(X(ext(q.y))+8,Y(q.y)+(q.y===0?-4:q.y===H?16:6),it(q.name),`class="halo"`)});
  // vertical chain on the right
  const xc=X(Wm/2)+48;
  s.pts.forEach(q=>{g+=ln(X(ext(q.y))+(q.name.length?26:4),Y(q.y),xc+8,Y(q.y),EXT)});
  for(let i=0;i+1<s.pts.length;i++){const a=s.pts[i].y,b=s.pts[i+1].y;g+=ln(xc,Y(a),xc,Y(b),DIM)+tx(xc+8,(Y(a)+Y(b))/2+6,xsLen(b-a,us),`class="halo"`)}
  // width dimensions
  D.forEach(q=>{
    if(q.c){const yy=Y(q.y);g+=ln(X(q.x0)-36,yy,X(q.x0)-1,yy,`stroke="#222" stroke-width="0.9" marker-end="url(#xs-dm)"`)+ln(X(q.x1)+36,yy,X(q.x1)+1,yy,`stroke="#222" stroke-width="0.9" marker-end="url(#xs-dm)"`)+
      tx(X(q.x0)-40,yy+6,xsLen(q.v,us),`text-anchor="end" class="halo"`);return}
    const yy=Y(q.y)-q.out*(q.inner?26:30);
    g+=ln(X(q.x0),Y(q.y)-q.out*4,X(q.x0),yy-q.out*6,EXT)+ln(X(q.x1),Y(q.y)-q.out*4,X(q.x1),yy-q.out*6,EXT)+ln(X(q.x0),yy,X(q.x1),yy,DIM)+
      tx((X(q.x0)+X(q.x1))/2,yy+(q.out>0?-6:18),xsLen(q.v,us),`text-anchor="middle" class="halo"`)});
  const x0=X(-Wm/2)-120, x1=xc+70, y0=Y(H)-84, y1=Y(0)+70;
  g+=tx(x1-4,y1-6,`Dimensions in ${us?"in":"mm"}`,`text-anchor="end" font-size="15"`);
  return `<svg viewBox="${f1(x0)} ${f1(y0)} ${f1(x1-x0)} ${f1(y1-y0)}" xmlns="http://www.w3.org/2000/svg" font-family="Georgia,serif" font-size="18" style="max-height:440px">
  <defs><marker id="xs-dm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#222"/></marker></defs>${g}</svg>`;

function xsSolution(p,s){

  return `<h3>1. Neutral axis</h3>
  <p>Divide the section into horizontal layers; y is measured up from the bottom surface ${s.pts[0].name}.</p>
  <table><tr><th>Layer</th><th>b × h (${u})</th><th>A (${u}²)</th><th>y<sub>i</sub> (${u})</th><th>bh³/12 (${u}⁴)</th><th>d = y<sub>i</sub> − ȳ</th><th>Ad² (${u}⁴)</th></tr>${rows}</table>
  <p><span class="eq">ȳ = ΣA<sub>i</sub>y<sub>i</sub>/ΣA<sub>i</sub> = ${fmt(s.yb,4)} ${u}</span> above ${s.pts[0].name}; the neutral axis is the centroidal z axis.</p>
  <h3>2. Second moment of area</h3>
  <p><span class="eq">I = Σ(bh³/12 + Ad²) = ${p.us?fmt(s.I,4):e(s.I)} ${u}⁴</span></p>
  <p class="final">I = ${p.us?fmt(s.I,4):e(s.I)} ${u}⁴; ȳ = ${fmt(s.yb,4)} ${u}; c<sub>top</sub> = ${fmt(s.ct,4)} ${u}, c<sub>bottom</sub> = ${fmt(s.cb,4)} ${u}.</p>
  <h3>3. Stresses</h3>
  <p>For a positive M<sub>z</sub>, <span class="eq">σ<sub>x</sub> = −M<sub>z</sub>(y − ȳ)/I</span>: compression above the neutral axis, tension below.</p>
  <table><tr><th>Point</th><th>y − ȳ (${u})</th><th>σ<sub>x</sub> (${su})</th></tr>${s.pts.map(q=>`<tr><td>${q.name}</td><td>${fmt(q.y-s.yb,4)}</td><td>${fmt(q.sig,p.us?2:1)}</td></tr>`).join("")}</table>
  <p class="note">The stress is linear in y and continuous across an abrupt change of width, so each change point has a single stress.</p>`;
}

const $=id=>document.getElementById(id);

function render(key,seed){
  curKey=key; const T=TEMPLATES[key];
  cur=T.generate(seed); const {p,s}=cur;
  $("typeSel").value=key; $("seedIn").value=seed;
  try{history.replaceState(null,"","#"+key+"-"+seed)}catch(e){}
  $("fig").innerHTML=T.figure(p,s);
  $("statement").innerHTML=T.statement(p,s);
  $("answers").innerHTML=T.fields.map(f=>`<label for="in-${f.id}">${f.label}</label><span>${f.choices
    ?`<select id="in-${f.id}"><option value="">choose</option>${f.choices.map(c=>`<option>${c}</option>`).join("")}</select>`
    :`<input id="in-${f.id}" type="text" inputmode="decimal"> <span class="note">${f.unit}</span>`}</span><span class="mark" id="mk-${f.id}"></span>`).join("");
  $("ansNote").textContent="Answers within 2% are accepted. "+T.note;
  const sol=$("solution"); sol.style.display="none"; sol.innerHTML=T.solution(p,s);
  $("solBtn").textContent="Show solution";
}

function check(){
  const T=TEMPLATES[curKey], truth=T.truth(cur.s);
  const scale=Math.max(...Object.values(truth).filter(v=>typeof v==="number").map(Math.abs));
  T.fields.forEach(f=>{
    const el=$("mk-"+f.id), raw=$("in-"+f.id).value.replace(/,/g,"").trim();
    if(raw===""){el.textContent="";el.className="mark";return}
    if(f.choices){const ok=raw===truth[f.id];el.textContent=ok?"Correct":"Not yet";el.className="mark "+(ok?"ok":"bad");return}
    let v=parseFloat(raw), t=truth[f.id];
    if(!f.signed){v=Math.abs(v);t=Math.abs(t)}
    const tol=f.tolAbs!==undefined?f.tolAbs:0.02*Math.max(Math.abs(t),f.signed?0.05*scale:0);
    const ok=isFinite(v)&&Math.abs(v-t)<=tol;
    el.textContent=ok?"Correct":"Not yet"; el.className="mark "+(ok?"ok":"bad");
  });
}

const newSeed=()=>1+Math.floor(Math.random()*999999);
$("typeSel").innerHTML=Object.entries(TEMPLATES).map(([k,t])=>`<option value="${k}">${t.name}</option>`).join("");
$("typeSel").onchange=e=>render(e.target.value,newSeed());
$("newBtn").onclick=()=>render(curKey,newSeed());
$("loadBtn").onclick=()=>{const v=parseInt($("seedIn").value,10);if(v>0)render(curKey,v)};
$("checkBtn").onclick=check;
$("solBtn").onclick=e=>{const s=$("solution"),show=s.style.display!=="block";
  s.style.display=show?"block":"none";e.target.textContent=show?"Hide solution":"Show solution"};
(function(){
  const m=/^#([a-z-]+)-(\d+)$/.exec(location.hash);
  if(m&&TEMPLATES[m[1]]) render(m[1],parseInt(m[2],10));
  else{const old=/^#seed-(\d+)$/.exec(location.hash);render("beam-tee",old?parseInt(old[1],10):newSeed())}
})();

</script>
</body>
</html>
