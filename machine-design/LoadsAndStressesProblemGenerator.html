<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loads and Stresses Problem Generator</title>
<style>
  :root{
    --ink:#1f2328; --muted:#5b6470; --line:#d9dde3; --bg:#fbfaf7; --card:#ffffff;
    --beam:#f7e2c4; --beamline:#78461a; --load:#aa1e28; --sec:#cde1cd; --secline:#1e5a32;
    --accent:#1e5a32; --ok:#1e7a3c; --bad:#b3261e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.55 "Georgia","Times New Roman",serif}
  header{padding:22px 24px 8px;max-width:980px;margin:0 auto}
  h1{font-size:1.45rem;margin:0 0 4px;font-weight:600}
  .sub{color:var(--muted);font-family:system-ui,sans-serif;font-size:.9rem}
  main{max-width:980px;margin:0 auto;padding:8px 24px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:14px 0}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-family:system-ui,sans-serif;font-size:.9rem}
  button{font:inherit;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:7px;padding:7px 14px;cursor:pointer}
  button.ghost{background:#fff;color:var(--accent)}
  button:hover{filter:brightness(1.08)}
  input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:9em}
  label{color:var(--muted)}
  .tag{display:inline-block;font-family:system-ui,sans-serif;font-size:.78rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 9px;margin-left:6px}
  svg{width:100%;height:auto;display:block}
  .statement p{margin:.3em 0}
  .answers{display:grid;grid-template-columns:auto auto auto;gap:8px 12px;align-items:center;font-family:system-ui,sans-serif;font-size:.92rem}
  .mark{font-weight:600;min-width:7em}
  .mark.ok{color:var(--ok)} .mark.bad{color:var(--bad)}
  #solution{display:none}
  #solution h3{font-size:1.05rem;margin:1.1em 0 .3em}
  table{border-collapse:collapse;font-family:system-ui,sans-serif;font-size:.88rem;margin:.4em 0}
  td,th{border-bottom:1px solid var(--line);padding:4px 12px;text-align:right}
  th{color:var(--muted);font-weight:600}
  td:first-child,th:first-child{text-align:left}
  .eq{font-family:"Cambria Math","STIX Two Math",Georgia,serif;background:#f4f5f2;border-radius:6px;padding:6px 10px;display:inline-block;margin:3px 0}
  .note{color:var(--muted);font-size:.92rem}
  .final{font-weight:600}
  @media (max-width:640px){.answers{grid-template-columns:1fr 1fr}.answers .mark{grid-column:span 2}}

  select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;max-width:100%}
  .answers input{width:8em}
  .halo{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
</style>
</head>
<body>
<header>
  <h1>Loads and Stresses Problem Generator</h1>
  <div class="sub">Each problem is generated from a seed and solved exactly in the browser. Share the seed to reproduce a problem.</div>
</header>
<main>
  <div class="card bar">
    <label for="typeSel">Problem type</label><select id="typeSel"></select>
  </div>
  <div class="card bar">
    <button id="newBtn">New problem</button>
    <label for="seedIn">Seed</label><input id="seedIn" type="number" min="1" step="1">
    <button class="ghost" id="loadBtn">Load seed</button>
  </div>
  <div class="card"><div id="fig"></div></div>
  <div class="card statement" id="statement"></div>
  <div class="card">
    <div class="answers" id="answers"></div>
    <div class="bar" style="margin-top:12px">
      <button id="checkBtn">Check answers</button>
      <button class="ghost" id="solBtn">Show solution</button>
      <span class="note" id="ansNote"></span>
    </div>
  </div>
  <div class="card" id="solution"></div>
</main>
<script>

// ----- seeded random numbers
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pick=(r,arr)=>arr[Math.floor(r()*arr.length)];
const range=(a,b,s)=>{const o=[];for(let v=a;v<=b+1e-9;v+=s)o.push(+v.toFixed(4));return o};

// ----- section: list of rectangles {b, y0, y1}, y measured from bottom
function sectionProps(rects){
  let A=0,Ay=0;
  rects.forEach(r=>{const a=r.b*(r.y1-r.y0);A+=a;Ay+=a*(r.y0+r.y1)/2});
  const ybar=Ay/A;let I=0;
  rects.forEach(r=>{const h=r.y1-r.y0,a=r.b*h,d=(r.y0+r.y1)/2-ybar;I+=r.b*h**3/12+a*d*d});
  const H=Math.max(...rects.map(r=>r.y1));
  const Qabove=y=>{let q=0;rects.forEach(r=>{const lo=Math.max(r.y0,y);if(r.y1>lo){q+=r.b*(r.y1-lo)*((r.y1+lo)/2-ybar)}});return q};
  const width=y=>{let w=0;rects.forEach(r=>{if(y>=r.y0&&y<=r.y1)w=Math.max(w,r.b)});return w};
  return {A,ybar,I,H,ctop:H-ybar,cbot:ybar,Qabove,width};
}

// ----- generator with constraints
function beamGenerate(seed){
  const r=mulberry32(seed);
  for(let k=0;k<5000;k++){
    const p={
      P:pick(r,range(600,2000,100)), a:pick(r,[6,8,10,12,14,16]),
      L:pick(r,[24,30,36,42,48]), w:pick(r,range(100,400,25)),
      bf:pick(r,[3,4,5,6]), tf:pick(r,[0.75,1,1.25]),
      tw:pick(r,[0.75,1]), hw:pick(r,[3,4,5,6]),
      flangeTop:r()<0.5
    };
    if(p.bf<3*p.tw) continue;
    const s=beamSolve(p);
    if(s.RC<=0||s.RB-p.P<=0) continue;            // no uplift at C; shear changes sign in span
    if(s.x0<=0||s.x0>=p.L||s.Mmax<=0) continue;
    const ratio=-s.MB/s.Mmax;
    if(ratio<0.3||ratio>1.5) continue;            // both moment signs matter
    if(s.tensionAtB===s.tensionAtSpan) {}         // either outcome is allowed
    return {p,s};
  }
  throw new Error("no valid problem");
}

function rectsOf(p){
  const H=p.tf+p.hw;
  return p.flangeTop
    ? [{b:p.tw,y0:0,y1:p.hw},{b:p.bf,y0:p.hw,y1:H}]
    : [{b:p.bf,y0:0,y1:p.tf},{b:p.tw,y0:p.tf,y1:H}];
}

function beamSolve(p){
  const W=p.w*p.L;
  const RB=(p.P*(p.a+p.L)+W*p.L/2)/p.L, RC=p.P+W-RB;
  const x0=(RB-p.P)/p.w;                         // from B, where V=0
  const MB=-p.P*p.a;
  const Mmax=MB+(RB-p.P)*x0-p.w*x0*x0/2;
  const sec=sectionProps(rectsOf(p));
  const yj=p.flangeTop?p.hw:p.tf;                // web-flange junction
  // bending stresses (tension positive): sigma = -M (y - ybar)/I
  const sig=(M,y)=>-M*(y-sec.ybar)/sec.I;
  const cand=[
    {where:"top fiber at B",       v:sig(MB,sec.H)},
    {where:"bottom fiber at B",    v:sig(MB,0)},
    {where:`top fiber at x = ${fmt(x0,2)} in from B`,    v:sig(Mmax,sec.H)},
    {where:`bottom fiber at x = ${fmt(x0,2)} in from B`, v:sig(Mmax,0)}
  ];
  const tens=cand.reduce((m,c)=>c.v>m.v?c:m), comp=cand.reduce((m,c)=>c.v<m.v?c:m);
  // shear: largest |V| and the y that maximizes Q/b
  const Vs=[{v:p.P,where:"segment AB"},{v:RB-p.P,where:"just right of B"},{v:RC,where:"just left of C"}];
  const Vmax=Vs.reduce((m,c)=>c.v>m.v?c:m);
  const ny=2000;let best={qb:0,y:sec.ybar};
  for(let i=0;i<=ny;i++){
    const y=sec.H*i/ny; for(const e of [-1e-9,1e-9]){
      const yy=Math.min(sec.H,Math.max(0,y+e)), b=sec.width(yy); if(!b) continue;
      const qb=sec.Qabove(yy)/b; if(qb>best.qb) best={qb,y:yy};
    }}
  const tauV=Vmax.v*best.qb/sec.I;
  // maximum shear stress: scan x and y
  const Mx=x=>x<=p.a?-p.P*x:-p.P*x+RB*(x-p.a)-p.w*(x-p.a)**2/2;
  const Vx=(x,side)=>x<p.a||(x===p.a&&side<0)?-p.P:-p.P+RB-p.w*(x-p.a);
  const xs=[];for(let i=0;i<=600;i++)xs.push((p.a+p.L)*i/600);
  xs.push(p.a,p.a+x0);
  let tmax={v:0};
  const ys=[];for(let i=0;i<=400;i++)ys.push(sec.H*i/400);ys.push(yj-1e-9,yj+1e-9,sec.ybar);
  for(const x of xs)for(const side of [-1,1]){
    const M=Mx(x),V=Vx(x,side);
    for(const y of ys){const b=sec.width(y);if(!b)continue;
      const s=sig(M,y),t=V*sec.Qabove(y)/(sec.I*b),tm=Math.hypot(s/2,t);
      if(tm>tmax.v)tmax={v:tm,x,y,s,t,M,V};}
  }
  return {W,RB,RC,x0,MB,Mmax,sec,yj,cand,tens,comp,Vmax,best,tauV,tmax};
}

// ----- formatting
function fmt(v,d=0){if(Math.abs(v)<0.5*10**-d)v=0;return Number(v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d})}
const psi=v=>fmt(Math.abs(v))+" psi";

// ----- figure
function beamFigure(p,s){
  const X0=60,Xs=520/(p.a+p.L),beamY=150,bh=34;
  const xA=X0,xB=X0+p.a*Xs,xC=X0+(p.a+p.L)*Xs;
  const jFrac=(p.flangeTop?p.hw:p.tf)/(p.tf+p.hw);
  const yJ=beamY+bh-jFrac*bh;
  let g=`<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="Georgia,serif" font-size="16">
  <defs>
   <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--load)"/></marker>
   <marker id="dm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#222"/></marker>
   <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="var(--secline)" stroke-width="1"/></pattern>
   <pattern id="gnd" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#333" stroke-width="1"/></pattern>
  </defs>
  <rect x="${xA}" y="${beamY}" width="${xC-xA}" height="${bh}" fill="var(--beam)" stroke="var(--beamline)" stroke-width="2"/>
  <line x1="${xA}" y1="${yJ}" x2="${xC}" y2="${yJ}" stroke="var(--beamline)" stroke-width="1"/>`;
  // pin at B
  const yb=beamY+bh;
  g+=`<path d="M${xB},${yb} l-14,24 h28 z" fill="#fff" stroke="#222" stroke-width="2"/>
      <rect x="${xB-22}" y="${yb+24}" width="44" height="8" fill="url(#gnd)"/><line x1="${xB-22}" y1="${yb+24}" x2="${xB+22}" y2="${yb+24}" stroke="#222"/>`;
  // roller at C
  g+=`<path d="M${xC},${yb} l-14,18 h28 z" fill="#fff" stroke="#222" stroke-width="2"/>
      <circle cx="${xC-7}" cy="${yb+22}" r="4" fill="#fff" stroke="#222" stroke-width="1.5"/><circle cx="${xC+7}" cy="${yb+22}" r="4" fill="#fff" stroke="#222" stroke-width="1.5"/>
      <rect x="${xC-22}" y="${yb+26}" width="44" height="8" fill="url(#gnd)"/><line x1="${xC-22}" y1="${yb+26}" x2="${xC+22}" y2="${yb+26}" stroke="#222"/>`;
  // loads
  g+=`<line x1="${xA+2}" y1="${beamY-80}" x2="${xA+2}" y2="${beamY-2}" stroke="var(--load)" stroke-width="3" marker-end="url(#ar)"/>
      <text x="${xA+2}" y="${beamY-88}" text-anchor="middle" fill="var(--load)">${fmt(p.P)} lbf</text>
      <line x1="${xB}" y1="${beamY-42}" x2="${xC}" y2="${beamY-42}" stroke="var(--load)" stroke-width="2"/>`;
  const n=Math.max(6,Math.round((xC-xB)/26));
  for(let i=0;i<=n;i++){const x=xB+(xC-xB)*i/n;g+=`<line x1="${x}" y1="${beamY-42}" x2="${x}" y2="${beamY-3}" stroke="var(--load)" stroke-width="1.6" marker-end="url(#ar)"/>`}
  g+=`<text x="${(xB+xC)/2}" y="${beamY-52}" text-anchor="middle" fill="var(--load)">w = ${fmt(p.w)} lbf/in</text>
      <text x="${xA-10}" y="${beamY+22}" text-anchor="end" font-style="italic">A</text>
      <text x="${xB-8}" y="${beamY-8}" text-anchor="end" font-style="italic">B</text>
      <text x="${xC+10}" y="${beamY+22}" font-style="italic">C</text>`;
  // dimensions
  const dy=yb+62;
  g+=`<g stroke="#222" stroke-width="1">
      <line x1="${xA}" y1="${yb+6}" x2="${xA}" y2="${dy+8}"/><line x1="${xB}" y1="${yb+36}" x2="${xB}" y2="${dy+8}"/><line x1="${xC}" y1="${yb+38}" x2="${xC}" y2="${dy+8}"/>
      <line x1="${xA}" y1="${dy}" x2="${xB}" y2="${dy}" marker-start="url(#dm)" marker-end="url(#dm)"/>
      <line x1="${xB}" y1="${dy}" x2="${xC}" y2="${dy}" marker-start="url(#dm)" marker-end="url(#dm)"/></g>
      <text x="${(xA+xB)/2}" y="${dy+20}" text-anchor="middle">${fmt(p.a)} in</text>
      <text x="${(xB+xC)/2}" y="${dy+20}" text-anchor="middle">${fmt(p.L)} in</text>`;
  // cross section, to scale
  const H=p.tf+p.hw, sc=Math.min(150/H,150/p.bf), cx=740, base=212;
  const Y=y=>base-y*sc, Xc=x=>cx+x*sc;
  const pts=[];rectsOf(p).forEach(r=>pts.push(r));
  let poly;
  if(!p.flangeTop){
    poly=[[-p.bf/2,0],[p.bf/2,0],[p.bf/2,p.tf],[p.tw/2,p.tf],[p.tw/2,H],[-p.tw/2,H],[-p.tw/2,p.tf],[-p.bf/2,p.tf]];
  }else{
    poly=[[-p.tw/2,0],[p.tw/2,0],[p.tw/2,p.hw],[p.bf/2,p.hw],[p.bf/2,H],[-p.bf/2,H],[-p.bf/2,p.hw],[-p.tw/2,p.hw]];
  }
  const d=poly.map(([x,y],i)=>(i?"L":"M")+Xc(x).toFixed(1)+","+Y(y).toFixed(1)).join(" ")+"Z";
  g+=`<path d="${d}" fill="var(--sec)"/><path d="${d}" fill="url(#hatch)"/><path d="${d}" fill="none" stroke="var(--secline)" stroke-width="2"/>`;
  // section dimensions
  const R=Xc(Math.max(p.bf,p.tw)/2)+22, fy0=p.flangeTop?p.hw:0, fy1=p.flangeTop?H:p.tf, wy0=p.flangeTop?0:p.tf, wy1=p.flangeTop?p.hw:H;
  g+=`<g stroke="#222" stroke-width="1">
     <line x1="${R}" y1="${Y(fy0)}" x2="${R}" y2="${Y(fy1)}" marker-start="url(#dm)" marker-end="url(#dm)"/>
     <line x1="${R}" y1="${Y(wy0)}" x2="${R}" y2="${Y(wy1)}" marker-start="url(#dm)" marker-end="url(#dm)"/>
     <line x1="${Xc(Math.max(p.bf,p.tw)/2)+4}" y1="${Y(0)}" x2="${R+8}" y2="${Y(0)}"/>
     <line x1="${Xc(p.flangeTop?p.bf/2:p.tw/2)+4}" y1="${Y(p.flangeTop?p.hw:p.tf)}" x2="${R+8}" y2="${Y(p.flangeTop?p.hw:p.tf)}"/>
     <line x1="${Xc(Math.max(p.bf,p.tw)/2)+4}" y1="${Y(H)}" x2="${R+8}" y2="${Y(H)}"/></g>
     <text x="${R+6}" y="${(Y(fy0)+Y(fy1))/2+5}">${fmt(p.tf,2).replace(/\.?0+$/,"")} in</text>
     <text x="${R+6}" y="${(Y(wy0)+Y(wy1))/2+5}">${fmt(p.hw)} in</text>`;
  // flange width and web width
  const fyLine=p.flangeTop?Y(H)-16:Y(0)+18, wyLine=p.flangeTop?Y(0)+18:Y(H)-16;
  g+=`<g stroke="#222" stroke-width="1">
     <line x1="${Xc(-p.bf/2)}" y1="${fyLine}" x2="${Xc(p.bf/2)}" y2="${fyLine}" marker-start="url(#dm)" marker-end="url(#dm)"/>
     <line x1="${Xc(-p.tw/2)-26}" y1="${wyLine}" x2="${Xc(-p.tw/2)}" y2="${wyLine}" marker-end="url(#dm)"/>
     <line x1="${Xc(p.tw/2)+26}" y1="${wyLine}" x2="${Xc(p.tw/2)}" y2="${wyLine}" marker-end="url(#dm)"/></g>
     <text x="${cx}" y="${fyLine+(p.flangeTop?-6:18)}" text-anchor="middle">${fmt(p.bf)} in</text>
     <text x="${Xc(p.tw/2)+30}" y="${wyLine+5}">${fmt(p.tw,2).replace(/\.?0+$/,"")} in</text>
     <text x="${cx}" y="${Y(0)+64}" text-anchor="middle" font-size="14">Cross section</text>`;
  return g+"</svg>";
}

function beamSolution(p,s){
  const sec=s.sec, rr=rectsOf(p);
  const rows=rr.map((r,i)=>{const h=r.y1-r.y0,A=r.b*h,yc=(r.y0+r.y1)/2,d=yc-sec.ybar;
    return `<tr><td>${(p.flangeTop?["Web","Flange"]:["Flange","Web"])[i]}</td><td>${fmt(r.b,2)} × ${fmt(h,2)}</td><td>${fmt(A,3)}</td><td>${fmt(yc,3)}</td><td>${fmt(r.b*h**3/12,3)}</td><td>${fmt(A*d*d,3)}</td></tr>`}).join("");
  const tm=s.tmax, xLoc=tm.x<=p.a?`${fmt(tm.x,2)} in from A`:`${fmt(tm.x-p.a,2)} in right of B`;
  const yLoc=Math.abs(tm.y-sec.H)<1e-6?"top fiber":Math.abs(tm.y)<1e-6?"bottom fiber":`y = ${fmt(tm.y,3)} in above the bottom`;
  return `<h3>1. Reactions</h3>
  <p>The distributed load totals <span class="eq">W = wL = ${fmt(s.W)} lbf</span>, acting at the middle of <i>BC</i>. Moments about <i>C</i> and vertical equilibrium give</p>
  <p><span class="eq">R<sub>B</sub> = [P(a + L) + W L/2] / L = ${fmt(s.RB,1)} lbf</span>&nbsp; <span class="eq">R<sub>C</sub> = P + W − R<sub>B</sub> = ${fmt(s.RC,1)} lbf</span></p>
  <h3>2. Shear and moment</h3>
  <p>On <i>AB</i>, V = −${fmt(p.P)} lbf. Just right of <i>B</i>, V = ${fmt(s.RB-p.P,1)} lbf, and it falls linearly to −${fmt(s.RC,1)} lbf at <i>C</i>. The two moment extremes are</p>
  <p><span class="eq">M<sub>B</sub> = −P a = ${fmt(s.MB)} lbf·in</span>&nbsp; <span class="eq">M<sub>max</sub> = ${fmt(s.Mmax,1)} lbf·in at x = ${fmt(s.x0,2)} in right of B</span></p>
  <h3>3. Section properties</h3>
  <table><tr><th>Part</th><th>b × h (in)</th><th>A (in²)</th><th>ȳ<sub>i</sub> (in)</th><th>b h³/12 (in⁴)</th><th>A d² (in⁴)</th></tr>${rows}</table>
  <p><span class="eq">ȳ = ${fmt(sec.ybar,4)} in</span>&nbsp; <span class="eq">I = ${fmt(sec.I,4)} in⁴</span>&nbsp; <span class="eq">c<sub>top</sub> = ${fmt(sec.ctop,4)} in, c<sub>bot</sub> = ${fmt(sec.cbot,4)} in</span></p>
  <h3>4. (a) Bending stresses, σ = −M y / I</h3>
  <table><tr><th>Location</th><th>σ (psi)</th></tr>${s.cand.map(c=>`<tr><td>${c.where}</td><td>${fmt(c.v)}</td></tr>`).join("")}</table>
  <p class="final">Maximum tension: ${psi(s.tens.v)} at the ${s.tens.where}. Maximum compression: ${psi(s.comp.v)} at the ${s.comp.where}.</p>
  <h3>5. (b) Transverse shear, τ = V Q / (I b)</h3>
  <p>The largest shear force is <span class="eq">|V|<sub>max</sub> = ${fmt(s.Vmax.v,1)} lbf</span> (${s.Vmax.where}). Q/b is largest at <span class="eq">y = ${fmt(s.best.y,3)} in</span> above the bottom${Math.abs(s.best.y-sec.ybar)<1e-3?" (the neutral axis)":" (the web side of the junction, not the neutral axis)"}, where <span class="eq">Q = ${fmt(sec.Qabove(s.best.y),4)} in³, b = ${fmt(sec.width(s.best.y),2)} in</span>.</p>
  <p class="final">τ<sub>max</sub> due to V = ${psi(s.tauV)}.</p>
  <h3>6. (c) Maximum shear stress, τ<sub>max</sub> = √[(σ/2)² + τ²]</h3>
  <p>A scan over ${601} sections along the beam and ${403} points through the depth (including both sides of the junction) gives the largest value at the ${yLoc}, ${xLoc}, where σ = ${fmt(tm.s)} psi and τ = ${fmt(tm.t)} psi.</p>
  <p class="final">Maximum shear stress in the beam = ${psi(tm.v)}.</p>`;
}


// ===== countershaft template
const CS_UNIT={"+z":[0,0,1],"-z":[0,0,-1],"-y":[0,-1,0]};
const CS_DIRTEXT={"+z":"horizontally, in the +<i>z</i> direction","-z":"horizontally, in the &minus;<i>z</i> direction","-y":"vertically downward (&minus;<i>y</i>)"};

// contact points (y,z) of the two belt strands for a belt pulling along dir
function csPoints(dir,r){return dir==="-y"?[[0,r],[0,-r]]:[[r,0],[-r,0]]}
// torque about x of a strand at (y,z) with tension t along unit u
const csMx=(pt,u,t)=>(pt[0]*u[2]-pt[1]*u[1])*t;
// largest -z arrow length (in) before reaching pulley B (from A) or the front corner of bearing C (from B)
const csRoomA=p=>(0.2157*p.b-1.5)/0.1053;
const csRoomB=p=>2.05*p.c-13;
// arrow length (in) that keeps a -z lower strand clear of the shaft and the far bearing
function csLen(dir,r,d,maxLen){
  if(dir==="-y") return 11;
  if(dir==="+z") return 9;
  return Math.min(11,(0.229*r-0.229*d/2-0.4)/0.0645,maxLen);
}

function csSolve(p){
  const L=p.a+p.b+p.c, xA=p.a, xB=p.a+p.b;
  const T=(p.Tt-p.Tl)*p.dA/2;
  const T2=T/((p.dB/2)*(1-p.f)), T1=p.f*T2;
  const uA=CS_UNIT[p.dirA], uB=CS_UNIT[p.dirB];
  const FA=uA.map(u=>u*(p.Tt+p.Tl)), FB=uB.map(u=>u*(T1+T2));
  const RO=[0,0,0], RC=[0,0,0];
  for(const k of [1,2]){RC[k]=-(FA[k]*xA+FB[k]*xB)/L;RO[k]=-(FA[k]+FB[k])-RC[k]}
  const Mk=(k,x)=>RO[k]*x+(x>xA?FA[k]*(x-xA):0)+(x>xB?FB[k]*(x-xB):0);
  const MA=Math.hypot(Mk(1,xA),Mk(2,xA)), MB=Math.hypot(Mk(1,xB),Mk(2,xB));
  const crit=MA>=MB?"A":"B", M=Math.max(MA,MB);
  const pd3=Math.PI*p.d**3;
  const sigma=32*M/pd3, tau=16*T/pd3, R=Math.hypot(sigma/2,tau);
  // strand placement for the figure: tight side at A first point, B opposite torque
  const ptsA=csPoints(p.dirA,p.dA/2), ptsB=csPoints(p.dirB,p.dB/2);
  const MxA=csMx(ptsA[0],uA,p.Tt)+csMx(ptsA[1],uA,p.Tl);
  const MxB0=csMx(ptsB[0],uB,T2)+csMx(ptsB[1],uB,T1);
  const tightB=Math.sign(MxB0)===-Math.sign(MxA)?0:1;
  return {L,xA,xB,T,T1,T2,FA,FB,RO,RC,Mk,MA,MB,crit,M,sigma,tau,s1:sigma/2+R,s2:sigma/2-R,tmax:R,
    ROm:Math.hypot(RO[1],RO[2]),RCm:Math.hypot(RC[1],RC[2]),tightB};
}

function csGenerate(seed){
  const r=mulberry32(seed);
  for(let k=0;k<5000;k++){
    const p={a:pick(r,[8,10,12,14]), b:pick(r,range(14,24,2)), c:pick(r,[8,10,12]),
      dA:pick(r,[8,10,12]), dB:pick(r,[6,8,10]),
      Tt:pick(r,range(300,800,20)), Tl:pick(r,range(40,160,10)),
      f:pick(r,[0.10,0.15,0.20,0.25]),
      dirA:pick(r,["-z","-y"]), dirB:pick(r,["-z","-y"]), d:0};
    if(p.Tl>0.3*p.Tt) continue;
    const ds=[1,1.25,1.5,1.75,2,2.25,2.5];
    let ok=false;
    for(const d of ds){p.d=d;const s=csSolve(p);if(s.sigma>=8000&&s.sigma<=35000){ok=true;break}}
    if(!ok) continue;
    const s=csSolve(p);
    if(Math.abs(s.MA-s.MB)/s.M<0.05) continue;     // critical section must be clear
    if(csLen(p.dirA,p.dA/2,p.d,csRoomA(p))<6||csLen(p.dirB,p.dB/2,p.d,csRoomB(p))<6) continue;  // figure must draw cleanly
    return {p,s};
  }
  throw new Error("no valid problem");
}

function csStatement(p){
  const both=p.dirA===p.dirB;
  return `<p>A countershaft of diameter ${fmtIn(p.d)} in rotates at constant speed in bearings at <i>O</i> and <i>C</i>, which act as simple supports. It carries a ${fmt(p.dA)} in diameter V-belt pulley at <i>A</i> and a ${fmt(p.dB)} in diameter V-belt pulley at <i>B</i>, with <i>OA</i> = ${fmt(p.a)} in, <i>AB</i> = ${fmt(p.b)} in, and <i>BC</i> = ${fmt(p.c)} in. A motor drives pulley <i>A</i> through a belt that pulls ${CS_DIRTEXT[p.dirA]}, with tensions of ${fmt(p.Tt)} lbf and ${fmt(p.Tl)} lbf. Pulley <i>B</i> delivers the power to a belt that pulls ${CS_DIRTEXT[p.dirB]}. The slack-side tension at <i>B</i> is ${fmt(p.f*100)} percent of the tight-side tension. Determine:</p>
  <p>(a) the belt tensions at <i>B</i>,<br>(b) the magnitudes of the bearing reactions,<br>(c) the shear-force and bending-moment diagrams${both?"":" in the <i>xy</i> and <i>xz</i> planes"},<br>(d) the bending stress and torsional shear stress at the point of largest bending moment, and<br>(e) the principal stresses and maximum shear stress at that point.</p>`;
}
const fmtIn=v=>{const w=Math.floor(v),fr=v-w;const m={0.25:"&frac14;",0.5:"&frac12;",0.75:"&frac34;"};return fr?(w?w:"")+(m[fr]||fr):String(w)};

function csFigure(p,s){
  const K=52, ex=[0.2157,-0.0315], ey=[0,0.2290], ez=[-0.1053,-0.0645];
  let mnX=1e9,mnY=1e9,mxX=-1e9,mxY=-1e9;
  const P=(x,y,z)=>{const X=K*(x*ex[0]+y*ey[0]+z*ez[0]), Y=-K*(x*ex[1]+y*ey[1]+z*ez[1]);
    mnX=Math.min(mnX,X);mxX=Math.max(mxX,X);mnY=Math.min(mnY,Y);mxY=Math.max(mxY,Y);return [X,Y]};
  const pt=a=>a[0].toFixed(1)+","+a[1].toFixed(1);
  const poly=(pts,fill,stroke,sw=1.6)=>`<polygon points="${pts.map(pt).join(" ")}" fill="${fill}" stroke="${stroke||"none"}" stroke-width="${sw}" stroke-linejoin="round"/>`;
  const line=(a,b,attr)=>`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" ${attr}/>`;
  const text=(a,str,attr="")=>{mnX=Math.min(mnX,a[0]-60);mxX=Math.max(mxX,a[0]+80);mnY=Math.min(mnY,a[1]-18);mxY=Math.max(mxY,a[1]+8);
    return `<text x="${a[0].toFixed(1)}" y="${a[1].toFixed(1)}" ${attr}>${str}</text>`};
  let g="";
  const box=(x0,x1,y0,y1,z0,z1,c)=>
    poly([P(x1,y0,z0),P(x1,y1,z0),P(x1,y1,z1),P(x1,y0,z1)],c[0],"#28405a")+
    poly([P(x0,y1,z0),P(x1,y1,z0),P(x1,y1,z1),P(x0,y1,z1)],c[1],"#28405a")+
    poly([P(x0,y0,z1),P(x1,y0,z1),P(x1,y1,z1),P(x0,y1,z1)],c[2],"#28405a");
  const bearing=x=>box(x-3.2,x+3.2,-4.3,-3.5,-3.6,3.6,["#7f8b99","#d3dde7","#98a6b6"])+
                   box(x-1.6,x+1.6,-3.5,1.2,-2.6,2.6,["#87909b","#c4d3e1","#b7c8d8"]);
  const shaft=(x0,x1)=>{const a=P(x0,0,0),b=P(x1,0,0),w=K*p.d*0.229;
    return line(a,b,`stroke="#464b55" stroke-width="${(w+2.5).toFixed(1)}"`)+line(a,b,`stroke="#969ba5" stroke-width="${w.toFixed(1)}"`)+
      line(P(x0,p.d*0.22,0),P(x1,p.d*0.22,0),`stroke="#c9ccd2" stroke-width="1.2"`)};
  const ell=(x,r,t0=0,t1=360)=>{const o=[];for(let t=t0;t<=t1+1e-6;t+=5)o.push(P(x,r*Math.cos(t*Math.PI/180),r*Math.sin(t*Math.PI/180)));return o};
  const tsA=-19.23, tsB=160.77;
  const pulley=(x,r,pw)=>{
    const xl=x-pw/2, xr=x+pw/2, c=Math.PI/180;
    const sA=[r*Math.cos(tsA*c),r*Math.sin(tsA*c)], sB=[r*Math.cos(tsB*c),r*Math.sin(tsB*c)];
    let q=poly(ell(xl,r),"#c9a865")+poly([P(xl,...sA),P(xr,...sA),P(xr,...sB),P(xl,...sB)],"#c9a865");
    q+=`<polyline points="${ell(xl,r,tsA,tsB).map(pt).join(" ")}" fill="none" stroke="#7d5014" stroke-width="1.6"/>`;
    q+=line(P(xl,...sA),P(xr,...sA),`stroke="#7d5014" stroke-width="1.6"`)+line(P(xl,...sB),P(xr,...sB),`stroke="#7d5014" stroke-width="1.6"`);
    q+=poly(ell(xr,r),"#eec878","#7d5014")+poly(ell(xr,0.8*r),"none","#7d5014",0.8)+poly(ell(xr,0.3*r),"#a8884c","#7d5014",0.8);
    return q};
  const labels=[];
  const arrows=(x,dir,r,tight,loose,tightIdx,which,maxLen)=>{
    const u=CS_UNIT[dir], pts=csPoints(dir,r);
    const len=csLen(dir,r,p.d,maxLen);
    let q="";
    pts.forEach((pp,i)=>{
      const behind=(dir==="-z"&&i===1)||(dir==="-y"&&i===1);
      if((which==="before")!==behind) return;
      const a=P(x,pp[0],pp[1]), b=P(x+len*u[0],pp[0]+len*u[1],pp[1]+len*u[2]);
      q+=line(a,b,`stroke="#aa1e28" stroke-width="2.6" marker-end="url(#csar)"`);
      const lab=i===tightIdx?tight:loose;
      labels.push(dir==="-y"?text([b[0],b[1]+22],lab,`text-anchor="middle" fill="#aa1e28" class="halo"`):text([b[0]+8,b[1]+(i===1?17:4)],lab,`fill="#aa1e28" class="halo"`));
    });
    return q};
  const rA=p.dA/2, rB=p.dB/2, pwA=Math.max(2,0.24*p.dA), pwB=Math.max(2,0.24*p.dB);
  const labA=fmt(p.Tt)+" lbf", labAl=fmt(p.Tl)+" lbf";
  const yd=Math.max(rA,rB)+7;
  g+=bearing(0);
  g+=line(P(0,1.2,0),P(0,yd+1,0),`stroke="#888" stroke-dasharray="4 3"`)+line(P(0,yd+1,0),P(0,yd+4,0),`stroke="#222" stroke-width="1.6" marker-end="url(#csax)"`)+text(P(0,yd+5,0),"<tspan font-style='italic'>y</tspan>",`text-anchor="middle"`);
  g+=line(P(0,0,2.6),P(0,0,6),`stroke="#888" stroke-dasharray="4 3"`)+line(P(0,0,6),P(0,0,10),`stroke="#222" stroke-width="1.6" marker-end="url(#csax)"`)+text(P(0,-1.5,11.5),"<tspan font-style='italic'>z</tspan>",`text-anchor="end"`);
  g+=shaft(1.6,s.xA);
  g+=arrows(s.xA,p.dirA,rA,labA,labAl,0,"before",csRoomA(p))+pulley(s.xA,rA,pwA)+arrows(s.xA,p.dirA,rA,labA,labAl,0,"after",csRoomA(p));
  g+=shaft(s.xA+pwA/2,s.xB);
  g+=arrows(s.xB,p.dirB,rB,"<tspan font-style='italic'>T</tspan><tspan baseline-shift='sub' font-size='12'>2</tspan>","<tspan font-style='italic'>T</tspan><tspan baseline-shift='sub' font-size='12'>1</tspan>",s.tightB,"before",csRoomB(p))
     +pulley(s.xB,rB,pwB)
     +arrows(s.xB,p.dirB,rB,"<tspan font-style='italic'>T</tspan><tspan baseline-shift='sub' font-size='12'>2</tspan>","<tspan font-style='italic'>T</tspan><tspan baseline-shift='sub' font-size='12'>1</tspan>",s.tightB,"after",csRoomB(p));
  g+=shaft(s.xB+pwB/2,s.L-1.6);
  g+=bearing(s.L);
  g+=line(P(s.L+1.6,0,0),P(s.L+5,0,0),`stroke="#888" stroke-dasharray="4 3"`)+line(P(s.L+5,0,0),P(s.L+8,0,0),`stroke="#222" stroke-width="1.6" marker-end="url(#csax)"`)+text(P(s.L+9,0,0),"<tspan font-style='italic'>x</tspan>");
  // labels
  g+=text(P(-1.2,2.4,-2.6),"<tspan font-style='italic'>O</tspan>",`text-anchor="end"`);
  g+=text(P(s.L+1.2,2.4,-2.6),"<tspan font-style='italic'>C</tspan>");
  g+=text(P(s.xA-pwA/2-0.5,rA+1,0),`<tspan font-style='italic'>A</tspan> (${fmt(p.dA)} in dia.)`,`text-anchor="end" class="halo"`);
  g+=text(P(s.xB-pwB/2-0.5,rB+1,0),`<tspan font-style='italic'>B</tspan> (${fmt(p.dB)} in dia.)`,`text-anchor="end" class="halo"`);
  // shaft callout
  const xm=s.xA+0.62*p.b, cs=P(xm,-p.d*0.4,0), ce=P(xm+1.2,-Math.max(rA,rB)-2,0);
  g+=line(cs,ce,`stroke="#222" stroke-width="0.9"`)+text([ce[0],ce[1]+16],`${fmtIn(p.d)} in dia.`,`text-anchor="middle"`);
  // dimensions along x
  const tops=[[0,1.5],[s.xA,rA+0.6],[s.xB,rB+0.6],[s.L,1.5]];
  tops.forEach(([x,y0])=>{g+=line(P(x,y0,0),P(x,yd+0.8,0),`stroke="#999" stroke-width="0.8"`)});
  [[0,s.xA,p.a],[s.xA,s.xB,p.b],[s.xB,s.L,p.c]].forEach(([x0,x1,v])=>{
    g+=line(P(x0,yd,0),P(x1,yd,0),`stroke="#222" stroke-width="0.9" marker-start="url(#csdm)" marker-end="url(#csdm)"`);
    const m=P((x0+x1)/2,yd+0.9,0);g+=text(m,`${fmt(v)} in`,`text-anchor="middle" font-size="14"`)});
  g+=labels.join("");
  const pad=14, W=mxX-mnX+2*pad, H=mxY-mnY+2*pad;
  return `<svg viewBox="${(mnX-pad).toFixed(0)} ${(mnY-pad).toFixed(0)} ${W.toFixed(0)} ${H.toFixed(0)}" xmlns="http://www.w3.org/2000/svg" font-family="Georgia,serif" font-size="15" style="max-height:520px">
  <defs>
   <marker id="csar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#aa1e28"/></marker>
   <marker id="csax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#222"/></marker>
   <marker id="csdm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#222"/></marker>
  </defs>${g}</svg>`;
}

// shear and moment diagram for one plane (k = 1 for xy, 2 for xz)
function csDiagram(p,s,k,title){
  const xs=[0,s.xA,s.xB,s.L], names=["O","A","B","C"];
  const V=[s.RO[k], s.RO[k]+s.FA[k], s.RO[k]+s.FA[k]+s.FB[k]];
  const M=xs.map(x=>s.Mk(k,x));
  const W=600,ml=60,mr=20,h=110,gap=34;
  const X=x=>ml+(W-ml-mr)*x/s.L;
  const vmax=Math.max(...V.map(Math.abs))||1, mmax=Math.max(...M.map(Math.abs))||1;
  const panel=(y0,vals,isV,label,unit)=>{
    const Y=v=>y0+h/2-(h/2-14)*v/(isV?vmax:mmax);
    let d=`M${X(0)},${Y(0)}`;
    if(isV){for(let i=0;i<3;i++){d+=` L${X(xs[i])},${Y(vals[i])} L${X(xs[i+1])},${Y(vals[i])}`}d+=` L${X(s.L)},${Y(0)} Z`}
    else{xs.forEach((x,i)=>d+=` L${X(x)},${Y(vals[i])}`);d+=" Z"}
    let q=`<path d="${d}" fill="${isV?"#dbe7f3":"#f3e2c8"}" stroke="${isV?"#2b5d8a":"#8a5a14"}" stroke-width="1.6"/>`;
    q+=`<line x1="${X(0)}" y1="${Y(0)}" x2="${X(s.L)}" y2="${Y(0)}" stroke="#333" stroke-width="0.8"/>`;
    q+=`<text x="${ml-8}" y="${y0+h/2+4}" text-anchor="end" font-size="13">${label}</text><text x="${ml-8}" y="${y0+h/2+18}" text-anchor="end" font-size="11" fill="#666">${unit}</text>`;
    if(isV){vals.forEach((v,i)=>{const xm=(X(xs[i])+X(xs[i+1]))/2;q+=`<text x="${xm}" y="${Y(v)+(v>=0?-5:15)}" text-anchor="middle" font-size="12">${fmt(v,1)}</text>`})}
    else{[1,2].forEach(i=>{const v=vals[i];q+=`<text x="${X(xs[i])}" y="${Y(v)+(v>=0?-6:16)}" text-anchor="middle" font-size="12">${fmt(v)}</text>`})}
    return q};
  let g=panel(0,V,true,"V","lbf")+panel(h+gap,M,false,"M","lbf·in");
  xs.forEach((x,i)=>{g+=`<line x1="${X(x)}" y1="0" x2="${X(x)}" y2="${2*h+gap}" stroke="#bbb" stroke-dasharray="3 3"/><text x="${X(x)}" y="${2*h+gap+16}" text-anchor="middle" font-style="italic" font-size="13">${names[i]}</text>`});
  return `<p class="note" style="margin:.6em 0 .2em">${title}</p><svg viewBox="0 -6 ${W} ${2*h+gap+26}" style="max-width:600px" font-family="system-ui,sans-serif">${g}</svg>`;
}

function csSolution(p,s){
  const comp=(v,k)=>`${fmt(Math.abs(v),1)} lbf`;
  const planes=[[1,"<i>xy</i> plane (vertical loads)"],[2,"<i>xz</i> plane (horizontal loads)"]].filter(([k])=>Math.abs(s.FA[k])+Math.abs(s.FB[k])>0);
  const rows=planes.map(([k,t])=>`<tr><td>${t.replace(/ \(.*\)/,"")}</td><td>${fmt(Math.abs(s.RO[k]),1)}</td><td>${fmt(Math.abs(s.RC[k]),1)}</td></tr>`).join("");
  const mrow=x=>{const a=Math.abs(s.Mk(1,x)),b=Math.abs(s.Mk(2,x));return `√(${fmt(a)}² + ${fmt(b)}²) = ${fmt(Math.hypot(a,b))} lbf·in`};
  const pd3=Math.PI*p.d**3;
  return `<h3>1. (a) Belt tensions at B</h3>
  <p>The torque delivered at <i>A</i> is <span class="eq">T = (${fmt(p.Tt)} − ${fmt(p.Tl)})(${fmt(p.dA/2)}) = ${fmt(s.T)} lbf·in</span>. At constant speed, pulley <i>B</i> carries the same torque, so <span class="eq">(T<sub>2</sub> − ${fmt(p.f,2)} T<sub>2</sub>)(${fmt(p.dB/2)}) = ${fmt(s.T)}</span>.</p>
  <p class="final">T<sub>2</sub> = ${fmt(s.T2,1)} lbf (tight side), T<sub>1</sub> = ${fmt(s.T1,1)} lbf (slack side).</p>
  <h3>2. (b) Bearing reactions</h3>
  <p>The net belt force is ${fmt(p.Tt+p.Tl)} lbf at <i>A</i> and ${fmt(s.T1+s.T2,1)} lbf at <i>B</i>. Each plane is solved as a simply supported beam.</p>
  <table><tr><th>Plane</th><th>R<sub>O</sub> (lbf)</th><th>R<sub>C</sub> (lbf)</th></tr>${rows}
  <tr><td><b>Resultant</b></td><td><b>${fmt(s.ROm,1)}</b></td><td><b>${fmt(s.RCm,1)}</b></td></tr></table>
  <h3>3. (c) Shear and moment diagrams</h3>
  ${planes.map(([k,t])=>csDiagram(p,s,k,t)).join("")}
  <p>Each plane's moment is piecewise linear with corners at the loads, so the resultant moment is largest at <i>A</i> or <i>B</i>:</p>
  <p><span class="eq">M<sub>A</sub> = ${mrow(s.xA)}</span><br><span class="eq">M<sub>B</sub> = ${mrow(s.xB)}</span></p>
  <p>The critical section is at <i>${s.crit}</i>. The torque ${fmt(s.T)} lbf·in acts on segment <i>AB</i>, so it is present on the <i>AB</i> side of that section.</p>
  <h3>4. (d) Bending and torsional stresses at ${s.crit}</h3>
  <p><span class="eq">σ = 32M/(πd³) = 32(${fmt(s.M)})/${fmt(pd3,3)} = ${fmt(s.sigma)} psi</span>&nbsp; <span class="eq">τ = 16T/(πd³) = 16(${fmt(s.T)})/${fmt(pd3,3)} = ${fmt(s.tau)} psi</span></p>
  <h3>5. (e) Principal stresses and maximum shear stress</h3>
  <p><span class="eq">σ<sub>1,2</sub> = σ/2 ± √[(σ/2)² + τ²]</span></p>
  <p class="final">σ<sub>1</sub> = ${fmt(s.s1)} psi, σ<sub>2</sub> = ${fmt(s.s2)} psi, τ<sub>max</sub> = ${fmt(s.tmax)} psi.</p>`;
}

// ===== gear countershaft template (gear B overhung beyond bearing C)
// shared drawing helpers for the orthographic shaft figures
function makeIso(K){
  const ex=[0.2157,-0.0315], ey=[0,0.2290], ez=[-0.1053,-0.0645];
  const bb={mnX:1e9,mnY:1e9,mxX:-1e9,mxY:-1e9};
  const grow=(X,Y)=>{bb.mnX=Math.min(bb.mnX,X);bb.mxX=Math.max(bb.mxX,X);bb.mnY=Math.min(bb.mnY,Y);bb.mxY=Math.max(bb.mxY,Y)};
  const P=(x,y,z)=>{const X=K*(x*ex[0]+y*ey[0]+z*ez[0]), Y=-K*(x*ex[1]+y*ey[1]+z*ez[1]);grow(X,Y);return [X,Y]};
  const pt=a=>a[0].toFixed(1)+","+a[1].toFixed(1);
  const poly=(pts,fill,stroke,sw=1.6)=>`<polygon points="${pts.map(pt).join(" ")}" fill="${fill}" stroke="${stroke||"none"}" stroke-width="${sw}" stroke-linejoin="round"/>`;
  const line=(a,b,attr)=>`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" ${attr}/>`;
  const text=(a,str,attr="")=>{grow(a[0]-70,a[1]-18);grow(a[0]+90,a[1]+8);return `<text x="${a[0].toFixed(1)}" y="${a[1].toFixed(1)}" ${attr}>${str}</text>`};
  const box=(x0,x1,y0,y1,z0,z1,c)=>
    poly([P(x1,y0,z0),P(x1,y1,z0),P(x1,y1,z1),P(x1,y0,z1)],c[0],"#28405a")+
    poly([P(x0,y1,z0),P(x1,y1,z0),P(x1,y1,z1),P(x0,y1,z1)],c[1],"#28405a")+
    poly([P(x0,y0,z1),P(x1,y0,z1),P(x1,y1,z1),P(x0,y1,z1)],c[2],"#28405a");
  const bearing=x=>box(x-3.2,x+3.2,-4.3,-3.5,-3.6,3.6,["#7f8b99","#d3dde7","#98a6b6"])+
                   box(x-1.6,x+1.6,-3.5,1.2,-2.6,2.6,["#87909b","#c4d3e1","#b7c8d8"]);
  const shaft=(x0,x1,d)=>{const a=P(x0,0,0),b=P(x1,0,0),w=K*d*0.229;
    return line(a,b,`stroke="#464b55" stroke-width="${(w+2.5).toFixed(1)}"`)+line(a,b,`stroke="#969ba5" stroke-width="${w.toFixed(1)}"`)+
      line(P(x0,d*0.22,0),P(x1,d*0.22,0),`stroke="#c9ccd2" stroke-width="1.2"`)};
  const ell=(x,r,t0=0,t1=360)=>{const o=[];for(let t=t0;t<=t1+1e-6;t+=5)o.push(P(x,r*Math.cos(t*Math.PI/180),r*Math.sin(t*Math.PI/180)));return o};
  const tsA=-19.23, tsB=160.77;   // silhouette angles for this projection
  const disc=(x,r,pw)=>{
    const xl=x-pw/2, xr=x+pw/2, c=Math.PI/180;
    const sA=[r*Math.cos(tsA*c),r*Math.sin(tsA*c)], sB=[r*Math.cos(tsB*c),r*Math.sin(tsB*c)];
    let q=poly(ell(xl,r),"#c9a865")+poly([P(xl,...sA),P(xr,...sA),P(xr,...sB),P(xl,...sB)],"#c9a865");
    q+=`<polyline points="${ell(xl,r,tsA,tsB).map(pt).join(" ")}" fill="none" stroke="#7d5014" stroke-width="1.6"/>`;
    q+=line(P(xl,...sA),P(xr,...sA),`stroke="#7d5014" stroke-width="1.6"`)+line(P(xl,...sB),P(xr,...sB),`stroke="#7d5014" stroke-width="1.6"`);
    q+=poly(ell(xr,r),"#eec878","#7d5014")+poly(ell(xr,0.8*r),"none","#7d5014",0.8)+poly(ell(xr,0.3*r),"#a8884c","#7d5014",0.8);
    return q};
  const svg=(g,defs)=>{const pad=14,W=bb.mxX-bb.mnX+2*pad,H=bb.mxY-bb.mnY+2*pad;
    return `<svg viewBox="${(bb.mnX-pad).toFixed(0)} ${(bb.mnY-pad).toFixed(0)} ${W.toFixed(0)} ${H.toFixed(0)}" xmlns="http://www.w3.org/2000/svg" font-family="Georgia,serif" font-size="15" style="max-height:540px"><defs>${defs}</defs>${g}</svg>`};
  return {P,line,text,poly,bearing,shaft,disc,svg};
}

function gearSolve(p){
  const xA=p.a, xC=p.a+p.b, xB=p.a+p.b+p.c, phi=p.phi*Math.PI/180;
  const rA=p.dA/2, rB=p.dB/2, sB=-p.sA;              // tangential signs at A and B (+1 up, -1 down)
  const uA=[0,p.sA*Math.cos(phi),-Math.sin(phi)], uB=[0,sB*Math.cos(phi),-Math.sin(phi)];
  const T=p.FA*Math.cos(phi)*rA;
  const FBm=T/(rB*Math.cos(phi));
  const FA=uA.map(u=>u*p.FA), FB=uB.map(u=>u*FBm);
  const RO=[0,0,0], RC=[0,0,0];
  for(const k of [1,2]){RC[k]=-(FA[k]*xA+FB[k]*xB)/xC;RO[k]=-(FA[k]+FB[k])-RC[k]}
  const Mk=(k,x)=>RO[k]*x+(x>xA?FA[k]*(x-xA):0)+(x>xC?RC[k]*(x-xC):0);
  const MA=Math.hypot(Mk(1,xA),Mk(2,xA)), MC=Math.hypot(Mk(1,xC),Mk(2,xC));
  const crit=MA>=MC?"A":"C", M=Math.max(MA,MC);
  const pd3=Math.PI*p.d**3, sigma=32*M/pd3, tau=16*T/pd3, R=Math.hypot(sigma/2,tau);
  return {xA,xC,xB,T,FBm,FA,FB,RO,RC,Mk,MA,MC,crit,M,sigma,tau,s1:sigma/2+R,s2:sigma/2-R,tmax:R,
    ROm:Math.hypot(RO[1],RO[2]),RCm:Math.hypot(RC[1],RC[2])};
}

function gearGenerate(seed){
  const r=mulberry32(seed);
  for(let k=0;k<5000;k++){
    const p={a:pick(r,[10,12,14,16]), b:pick(r,range(12,20,2)), c:pick(r,[6,8,10]),
      dA:pick(r,[12,14,16,18,20]), dB:pick(r,[4,5,6,8]),
      FA:pick(r,range(200,600,25)), phi:pick(r,[20,25]), sA:pick(r,[-1,1]), d:0};
    if(p.dB>=p.dA*0.6) continue;
    let ok=false;
    for(const d of [1,1.25,1.5,1.75,2,2.25,2.5]){p.d=d;const s=gearSolve(p);if(s.sigma>=8000&&s.sigma<=35000){ok=true;break}}
    if(!ok) continue;
    const s=gearSolve(p);
    if(Math.abs(s.MA-s.MC)/s.M<0.05) continue;       // critical section must be clear
    return {p,s};
  }
  throw new Error("no valid problem");
}

function gearStatement(p){
  return `<p>A countershaft of diameter ${fmtIn(p.d)} in in a gear reducer is supported by bearings at <i>O</i> and <i>C</i>, which act as simple supports. Gear <i>A</i> (${fmt(p.dA)} in pitch diameter) is ${fmt(p.a)} in from <i>O</i>, bearing <i>C</i> is ${fmt(p.b)} in beyond <i>A</i>, and gear <i>B</i> (${fmt(p.dB)} in pitch diameter) overhangs ${fmt(p.c)} in beyond <i>C</i>. Gear <i>A</i> receives power from a mating gear through a force <i>F<sub>A</sub></i> = ${fmt(p.FA)} lbf at a ${p.phi}° pressure angle, applied at the front of the gear and directed ${p.sA<0?"downward":"upward"} as shown. Gear <i>B</i> delivers the power through a force <i>F<sub>B</sub></i> at the same pressure angle, also applied at the front of the gear. The shaft runs at constant speed. Determine:</p>
  <p>(a) the force <i>F<sub>B</sub></i>,<br>(b) the magnitudes of the bearing reactions,<br>(c) the shear-force and bending-moment diagrams in the <i>xy</i> and <i>xz</i> planes,<br>(d) the bending stress and torsional shear stress at the point of largest bending moment, and<br>(e) the principal stresses and maximum shear stress at that point.</p>`;
}

function gearFigure(p,s){
  const I=makeIso(48), {P,line,text}=I;
  const rA=p.dA/2, rB=p.dB/2, pwA=Math.max(2.2,0.17*p.dA), pwB=Math.max(1.8,0.3*p.dB), c=Math.PI/180;
  let g="", labels=[];
  const yd=rA+7;
  // force at the front of a gear, with pressure-angle reference line and arc
  const force=(x,r,sgn,L,lab)=>{
    const ph=p.phi*c, C=[x,0,r];
    const tail=[x,-sgn*L*Math.cos(ph),r+L*Math.sin(ph)];
    let q=line(P(...C),P(x,-sgn*(L+1),r),`stroke="#888" stroke-dasharray="4 3"`);
    const arc=[];for(let t=0;t<=p.phi;t+=2)arc.push(P(x,-sgn*6*Math.cos(t*c),r+6*Math.sin(t*c)));
    q+=`<polyline points="${arc.map(a=>a[0].toFixed(1)+","+a[1].toFixed(1)).join(" ")}" fill="none" stroke="#222"/>`;
    const lp=P(x+1.9,-sgn*7.8*Math.cos(p.phi*c/2),r+7.8*Math.sin(p.phi*c/2));
    labels.push(text([lp[0],lp[1]+5],`${p.phi}°`,`font-size="13" class="halo"`));
    q+=line(P(...tail),P(...C),`stroke="#aa1e28" stroke-width="3" marker-end="url(#gear-ar)"`);
    const tp=P(...tail);
    labels.push(text([tp[0]-6,tp[1]+(sgn<0?-6:18)],lab,`text-anchor="end" fill="#aa1e28" class="halo"`));
    return q};
  g+=I.bearing(0);
  g+=line(P(0,1.2,0),P(0,yd+1,0),`stroke="#888" stroke-dasharray="4 3"`)+line(P(0,yd+1,0),P(0,yd+4,0),`stroke="#222" stroke-width="1.6" marker-end="url(#gear-ax)"`);
  labels.push(text(P(0,yd+5,0),"<tspan font-style='italic'>y</tspan>",`text-anchor="middle"`));
  g+=line(P(0,0,2.6),P(0,0,6),`stroke="#888" stroke-dasharray="4 3"`)+line(P(0,0,6),P(0,0,10),`stroke="#222" stroke-width="1.6" marker-end="url(#gear-ax)"`);
  labels.push(text(P(0,-1.5,11.5),"<tspan font-style='italic'>z</tspan>",`text-anchor="end"`));
  g+=I.shaft(1.6,s.xA,p.d)+I.disc(s.xA,rA,pwA);
  g+=force(s.xA,rA,p.sA,12,`<tspan font-style='italic'>F</tspan><tspan baseline-shift='sub' font-size='11'>A</tspan> = ${fmt(p.FA)} lbf`);
  g+=I.shaft(s.xA+pwA/2,s.xC-1.6,p.d)+I.bearing(s.xC)+I.shaft(s.xC+1.6,s.xB,p.d)+I.disc(s.xB,rB,pwB)+I.shaft(s.xB+pwB/2,s.xB+3,p.d);
  g+=force(s.xB,rB,-p.sA,12,`<tspan font-style='italic'>F</tspan><tspan baseline-shift='sub' font-size='11'>B</tspan>`);
  g+=line(P(s.xB+3,0,0),P(s.xB+6,0,0),`stroke="#888" stroke-dasharray="4 3"`)+line(P(s.xB+6,0,0),P(s.xB+9,0,0),`stroke="#222" stroke-width="1.6" marker-end="url(#gear-ax)"`);
  labels.push(text(P(s.xB+10,0,0),"<tspan font-style='italic'>x</tspan>"));
  labels.push(text(P(-1.2,2.4,-2.6),"<tspan font-style='italic'>O</tspan>",`text-anchor="end"`));
  labels.push(text(P(s.xC-1.2,2.4,-2.6),"<tspan font-style='italic'>C</tspan>",`text-anchor="end" class="halo"`));
  // callouts: start at the rim, mid-width
  const a0=P(s.xA,rA,0), a1=P(s.xA+3.5,rA+3.5,0);
  g+=line(a0,a1,`stroke="#222" stroke-width="0.9"`);labels.push(text([a1[0]+4,a1[1]-2],`Gear <tspan font-style='italic'>A</tspan>, ${fmt(p.dA)} in dia.`,`class="halo"`));
  const bUp=p.sA<0;                                  // F_B points up: callout goes above the gear
  const b0=P(s.xB,bUp?rB:-rB*0.5,bUp?0:rB*0.87), b1=P(s.xB+4,bUp?rB+6:-rB-6,0);
  g+=line(b0,b1,`stroke="#222" stroke-width="0.9"`);labels.push(text([b1[0]+4,b1[1]+(bUp?-4:16)],`Gear <tspan font-style='italic'>B</tspan>, ${fmt(p.dB)} in dia.`,`class="halo"`));
  const m0=P(s.xA+0.55*p.b,-p.d*0.4,0), m1=P(s.xA+0.55*p.b+1,-rA*0.6-3,0);
  g+=line(m0,m1,`stroke="#222" stroke-width="0.9"`);labels.push(text([m1[0],m1[1]+16],`${fmtIn(p.d)} in dia.`,`text-anchor="middle" class="halo"`));
  // dimensions
  [[0,1.5],[s.xA,rA+0.6],[s.xC,1.8],[s.xB,rB+0.6]].forEach(([x,y0])=>{g+=line(P(x,y0,0),P(x,yd+0.8,0),`stroke="#999" stroke-width="0.8"`)});
  [[0,s.xA,p.a],[s.xA,s.xC,p.b],[s.xC,s.xB,p.c]].forEach(([x0,x1,v])=>{
    g+=line(P(x0,yd,0),P(x1,yd,0),`stroke="#222" stroke-width="0.9" marker-start="url(#gear-dm)" marker-end="url(#gear-dm)"`);
    labels.push(text(P((x0+x1)/2,yd+0.9,0),`${fmt(v)} in`,`text-anchor="middle" font-size="14"`))});
  g+=labels.join("");
  return I.svg(g,`<marker id="gear-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#aa1e28"/></marker>
   <marker id="gear-ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#222"/></marker>
   <marker id="gear-dm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#222"/></marker>`);
}

// shear and moment diagram for one plane, stations O, A, C, B
function gearDiagram(s,k,title){
  const xs=[0,s.xA,s.xC,s.xB], names=["O","A","C","B"];
  const V=[s.RO[k], s.RO[k]+s.FA[k], s.RO[k]+s.FA[k]+s.RC[k]];
  const M=xs.map(x=>s.Mk(k,x));
  const W=600,ml=60,mr=20,h=110,gap=34, L=s.xB;
  const X=x=>ml+(W-ml-mr)*x/L;
  const vmax=Math.max(...V.map(Math.abs))||1, mmax=Math.max(...M.map(Math.abs))||1;
  const panel=(y0,vals,isV,label,unit)=>{
    const Y=v=>y0+h/2-(h/2-14)*v/(isV?vmax:mmax);
    let d=`M${X(0)},${Y(0)}`;
    if(isV){for(let i=0;i<3;i++){d+=` L${X(xs[i])},${Y(vals[i])} L${X(xs[i+1])},${Y(vals[i])}`}d+=` L${X(L)},${Y(0)} Z`}
    else{xs.forEach((x,i)=>d+=` L${X(x)},${Y(vals[i])}`);d+=" Z"}
    let q=`<path d="${d}" fill="${isV?"#dbe7f3":"#f3e2c8"}" stroke="${isV?"#2b5d8a":"#8a5a14"}" stroke-width="1.6"/>`;
    q+=`<line x1="${X(0)}" y1="${Y(0)}" x2="${X(L)}" y2="${Y(0)}" stroke="#333" stroke-width="0.8"/>`;
    q+=`<text x="${ml-8}" y="${y0+h/2+4}" text-anchor="end" font-size="13">${label}</text><text x="${ml-8}" y="${y0+h/2+18}" text-anchor="end" font-size="11" fill="#666">${unit}</text>`;
    if(isV){vals.forEach((v,i)=>{const xm=(X(xs[i])+X(xs[i+1]))/2;q+=`<text x="${xm}" y="${Y(v)+(v>=0?-5:15)}" text-anchor="middle" font-size="12">${fmt(v,1)}</text>`})}
    else{[1,2].forEach(i=>{const v=vals[i];q+=`<text x="${X(xs[i])}" y="${Y(v)+(v>=0?-6:16)}" text-anchor="middle" font-size="12">${fmt(v)}</text>`})}
    return q};
  let g=panel(0,V,true,"V","lbf")+panel(h+gap,M,false,"M","lbf·in");
  xs.forEach((x,i)=>{g+=`<line x1="${X(x)}" y1="0" x2="${X(x)}" y2="${2*h+gap}" stroke="#bbb" stroke-dasharray="3 3"/><text x="${X(x)}" y="${2*h+gap+16}" text-anchor="middle" font-style="italic" font-size="13">${names[i]}</text>`});
  return `<p class="note" style="margin:.6em 0 .2em">${title}</p><svg viewBox="0 -6 ${W} ${2*h+gap+26}" style="max-width:600px" font-family="system-ui,sans-serif">${g}</svg>`;
}

function gearSolution(p,s){
  const ph=p.phi, rows=[[1,"<i>xy</i>"],[2,"<i>xz</i>"]].map(([k,t])=>`<tr><td>${t}</td><td>${fmt(Math.abs(s.RO[k]),1)}</td><td>${fmt(Math.abs(s.RC[k]),1)}</td></tr>`).join("");
  const mrow=x=>{const a=Math.abs(s.Mk(1,x)),b=Math.abs(s.Mk(2,x));return `√(${fmt(a)}² + ${fmt(b)}²) = ${fmt(Math.hypot(a,b))} lbf·in`};
  const pd3=Math.PI*p.d**3;
  return `<h3>1. (a) Force at B</h3>
  <p>Only the tangential component at <i>A</i> produces torque: <span class="eq">T = F<sub>A</sub> cos ${ph}° (d<sub>A</sub>/2) = ${fmt(p.FA)} cos ${ph}° (${fmt(p.dA/2)}) = ${fmt(s.T)} lbf·in</span>. At constant speed, <span class="eq">F<sub>B</sub> cos ${ph}° (${fmt(p.dB/2)}) = ${fmt(s.T)}</span>.</p>
  <p class="final">F<sub>B</sub> = ${fmt(s.FBm,1)} lbf.</p>
  <p>Components: at <i>A</i>, ${fmt(Math.abs(s.FA[1]),1)} lbf tangential (${p.sA<0?"&minus;":"+"}<i>y</i>) and ${fmt(Math.abs(s.FA[2]),1)} lbf radial (&minus;<i>z</i>); at <i>B</i>, ${fmt(Math.abs(s.FB[1]),1)} lbf tangential (${p.sA<0?"+":"&minus;"}<i>y</i>) and ${fmt(Math.abs(s.FB[2]),1)} lbf radial (&minus;<i>z</i>).</p>
  <h3>2. (b) Bearing reactions</h3>
  <p>Every gear force has components in both planes, so each plane is solved separately, with moments about <i>O</i>. Gear <i>B</i> lies outside the span.</p>
  <table><tr><th>Plane</th><th>R<sub>O</sub> (lbf)</th><th>R<sub>C</sub> (lbf)</th></tr>${rows}
  <tr><td><b>Resultant</b></td><td><b>${fmt(s.ROm,1)}</b></td><td><b>${fmt(s.RCm,1)}</b></td></tr></table>
  <h3>3. (c) Shear and moment diagrams</h3>
  ${gearDiagram(s,1,"<i>xy</i> plane (vertical components)")}${gearDiagram(s,2,"<i>xz</i> plane (horizontal components)")}
  <p>The moment is zero at <i>O</i> and at the free end <i>B</i>, so the resultant is largest at <i>A</i> or <i>C</i>. At <i>C</i> it equals the overhang load times its arm, F<sub>B</sub> × ${fmt(p.c)} in.</p>
  <p><span class="eq">M<sub>A</sub> = ${mrow(s.xA)}</span><br><span class="eq">M<sub>C</sub> = ${mrow(s.xC)}</span></p>
  <p>The critical section is at <i>${s.crit}</i>. The torque ${fmt(s.T)} lbf·in acts on segment <i>AB</i>, so it is present there.</p>
  <h3>4. (d) Bending and torsional stresses at ${s.crit}</h3>
  <p><span class="eq">σ = 32M/(πd³) = 32(${fmt(s.M)})/${fmt(pd3,3)} = ${fmt(s.sigma)} psi</span>&nbsp; <span class="eq">τ = 16T/(πd³) = 16(${fmt(s.T)})/${fmt(pd3,3)} = ${fmt(s.tau)} psi</span></p>
  <h3>5. (e) Principal stresses and maximum shear stress</h3>
  <p><span class="eq">σ<sub>1,2</sub> = σ/2 ± √[(σ/2)² + τ²]</span></p>
  <p class="final">σ<sub>1</sub> = ${fmt(s.s1)} psi, σ<sub>2</sub> = ${fmt(s.s2)} psi, τ<sub>max</sub> = ${fmt(s.tmax)} psi.</p>`;
}

// ===== gear-driven sprocket shaft template (SI units)
function spStations(p){
  return p.layout==="between"
    ? {xB:p.e, xC:p.e+p.f, xD:p.e+p.f+p.g, order:["A","B","C","D"]}
    : {xC:p.e, xD:p.e+p.f, xB:p.e+p.f+p.g, order:["A","C","D","B"]};
}

function spSolve(p){
  const st=spStations(p), phi=p.phi*Math.PI/180;
  const rF=p.c/2, rC=p.b/2, rB=p.a/2;
  const Ft=p.T*1000/rF, T2=Ft*rC, P=T2/rB, Fr=Ft*Math.tan(phi);   // N, N*mm
  // chain strand at z = side*rB pulls in -y; gear force at the top of C balances its torque
  const loads=[{x:st.xC,F:[0,-Fr,-p.side*Ft]},{x:st.xB,F:[0,-P,0]}];
  const RA=[0,0,0], RD=[0,0,0];
  for(const k of [1,2]){RD[k]=-loads.reduce((s,l)=>s+l.F[k]*l.x,0)/st.xD;RA[k]=-loads.reduce((s,l)=>s+l.F[k],0)-RD[k]}
  const Mk=(k,x)=>RA[k]*x+loads.reduce((s,l)=>s+(x>l.x?l.F[k]*(x-l.x):0),0)+(x>st.xD?RD[k]*(x-st.xD):0);
  const cands=[["B",st.xB],["C",st.xC]].concat(p.layout==="overhung"?[["D",st.xD]]:[]).map(([n,x])=>({n,x,M:Math.hypot(Mk(1,x),Mk(2,x))}));
  cands.sort((u,v)=>v.M-u.M);
  const crit=cands[0], M=crit.M;                       // N*mm
  // tensile point on the surface: sigma = -(M1*y + M2*z)/I, largest along -(M1, M2)
  const m1=Mk(1,crit.x), m2=Mk(2,crit.x), r=p.d/2;
  const ty=-m1/M*r, tz=-m2/M*r;
  const pd3=Math.PI*p.d**3;
  const sigma=32*M/pd3, tau=16*T2/pd3, R=Math.hypot(sigma/2,tau);   // MPa
  return {...st,Ft,T2,P,Fr,loads,RA,RD,Mk,cands,crit,M,ty,tz,sigma,tau,s1:sigma/2+R,s2:sigma/2-R,tmax:R,
    RAm:Math.hypot(RA[1],RA[2]),RDm:Math.hypot(RD[1],RD[2]),margin:(cands[0].M-cands[1].M)/cands[0].M};
}

function spGenerate(seed){
  const r=mulberry32(seed);
  for(let k=0;k<5000;k++){
    const layout=pick(r,["between","overhung"]);
    const p={layout, T:pick(r,range(80,200,10)), c:pick(r,[100,110,120,125,140,150]),
      b:pick(r,[200,220,240,250,280]), a:pick(r,[120,140,150,160,180,200]),
      phi:pick(r,[20,25]), side:pick(r,[-1,1]), d:0,
      e:layout==="between"?pick(r,range(60,100,10)):pick(r,range(100,180,20)),
      f:layout==="between"?pick(r,range(180,280,20)):pick(r,range(160,240,20)),
      g:layout==="between"?pick(r,range(100,160,20)):pick(r,range(60,120,10))};
    if(p.b<1.6*p.c||p.a>p.b-40) continue;
    let ok=false;
    for(const d of [20,25,30,35,40,45,50]){p.d=d;const s=spSolve(p);if(s.sigma>=40&&s.sigma<=140){ok=true;break}}
    if(!ok) continue;
    const s=spSolve(p);
    if(s.margin<0.05) continue;                        // critical section must be clear
    return {p,s};
  }
  throw new Error("no valid problem");
}

function spStatement(p){
  const where=p.layout==="between"?"between bearing <i>A</i> and gear <i>C</i>":"on an overhang beyond bearing <i>D</i>";
  return `<p>A torque <i>T</i> = ${fmt(p.T)} N·m is applied to shaft <i>EFG</i>, which runs at constant speed and carries gear <i>F</i>. Gear <i>F</i> drives gear <i>C</i> on shaft <i>ABCD</i>, which in turn drives a chain sprocket <i>B</i> located ${where}. The chain transmits a force <i>P</i> on one strand, as shown; the slack strand carries no tension. Sprocket <i>B</i>, gear <i>C</i>, and gear <i>F</i> have pitch diameters <i>a</i> = ${p.a} mm, <i>b</i> = ${p.b} mm, and <i>c</i> = ${p.c} mm, and the gears mesh at a pressure angle <i>φ</i> = ${p.phi}°. Shaft <i>ABCD</i> has diameter <i>d</i> = ${p.d} mm. Neglect friction losses, and treat bearings <i>A</i>, <i>D</i>, <i>E</i>, and <i>G</i> as simple supports.</p>
  <p>Find the chain force <i>P</i> and the bearing reactions on shaft <i>ABCD</i>. Locate the point on shaft <i>ABCD</i> with the largest tensile bending stress and the largest torsional shear stress, and at that point determine the maximum principal normal stress and the maximum shear stress.</p>`;
}

function spFigure(p,s){
  const rF=p.c/2, rC=p.b/2, rB=p.a/2, yF=rC+rF, hd=Math.max(p.d,20)/2;
  const bb={mnX:1e9,mnY:1e9,mxX:-1e9,mxY:-1e9};
  const G=(X,Y)=>{bb.mnX=Math.min(bb.mnX,X);bb.mxX=Math.max(bb.mxX,X);bb.mnY=Math.min(bb.mnY,Y);bb.mxY=Math.max(bb.mxY,Y)};
  const f1=v=>v.toFixed(1);
  let g="", labels=[];
  const rect=(x0,y0,x1,y1,attr)=>{G(x0,-y0);G(x1,-y1);return `<rect x="${f1(Math.min(x0,x1))}" y="${f1(-Math.max(y0,y1))}" width="${f1(Math.abs(x1-x0))}" height="${f1(Math.abs(y1-y0))}" ${attr}/>`};
  const ln=(x0,y0,x1,y1,attr)=>{G(x0,-y0);G(x1,-y1);return `<line x1="${f1(x0)}" y1="${f1(-y0)}" x2="${f1(x1)}" y2="${f1(-y1)}" ${attr}/>`};
  const circ=(x,y,r,attr)=>{G(x-r,-y-r);G(x+r,-y+r);return `<circle cx="${f1(x)}" cy="${f1(-y)}" r="${f1(r)}" ${attr}/>`};
  const tx=(x,y,str,attr="")=>{const w=12*str.replace(/<[^>]*>/g,"").length, a=/text-anchor="end"/.test(attr)?[w,0]:/text-anchor="middle"/.test(attr)?[w/2,w/2]:[0,w];
    G(x-a[0]-4,-y-18);G(x+a[1]+4,-y+8);return `<text x="${f1(x)}" y="${f1(-y)}" ${attr}>${str}</text>`};
  const it=v=>`<tspan font-style="italic">${v}</tspan>`;
  const CL=`stroke="#888" stroke-width="0.9" stroke-dasharray="10 3 2 3"`, EXT=`stroke="#999" stroke-width="0.8"`;
  const DIM=`stroke="#222" stroke-width="0.9" marker-start="url(#sp-dm)" marker-end="url(#sp-dm)"`;
  const bearing=(x,y,h)=>rect(x-9,y-h,x+9,y-h-24,`fill="#97a3b0" stroke="#28405a"`)+rect(x-30,y-h-24,x+30,y-h-31,`fill="url(#sp-hatch)"`)+
    ln(x-30,y-h-24,x+30,y-h-24,`stroke="#222"`)+rect(x-14,y-h,x+14,y+h,`fill="#b9c8d8" stroke="#28405a" stroke-width="1.6"`)+
    circ(x,y,8,`fill="none" stroke="#28405a"`)+circ(x,y,2.5,`fill="#28405a"`);
  const gearSide=(x,y,h,w)=>{let q=rect(x-w,y-h,x+w,y+h,`fill="#eec878"`)+rect(x-w,y+h,x+w,y+h-10,`fill="#c9a865"`)+rect(x-w,y-h,x+w,y-h+10,`fill="#c9a865"`);
    for(let yy=y-h+12;yy<y+h;yy+=12)q+=ln(x-w,yy,x+w,yy,`stroke="#7d5014" stroke-width="0.5"`);
    return q+rect(x-w,y-h,x+w,y+h,`fill="none" stroke="#7d5014" stroke-width="1.6"`)};
  // ---------- front elevation
  const xR=Math.max(s.xB,s.xD)+25;
  g+=rect(s.xC-90,yF-12.5,s.xC+125,yF+12.5,`fill="#a9adb6" stroke="#464b55"`)+ln(s.xC-110,yF,s.xC+145,yF,CL);
  g+=rect(-20,-hd,xR,hd,`fill="#a9adb6" stroke="#464b55"`)+ln(-40,0,xR+20,0,CL);
  g+=bearing(0,0,30)+bearing(s.xD,0,30)+bearing(s.xC-60,yF,22)+bearing(s.xC+60,yF,22);
  g+=gearSide(s.xC,0,rC,20)+gearSide(s.xC,yF,rF,20)+circ(s.xC,0,3.5,`fill="#464b55"`)+circ(s.xC,yF,3.5,`fill="#464b55"`);
  g+=rect(s.xB-11,-rB,s.xB+11,rB,`fill="#c9a865" stroke="#7d5014" stroke-width="1.6"`);
  for(let yy=-rB+11.4;yy<rB;yy+=11.4)g+=ln(s.xB-11,yy,s.xB+11,yy,`stroke="#7d5014" stroke-width="0.5"`);
  for(let i=0;i<10;i++){const yy=-rB-17*i;g+=rect(s.xB-8,yy,s.xB+8,yy-15,`fill="#fff" stroke="#6e737d" stroke-width="1.6" rx="3"`)+circ(s.xB,yy-3.5,2,`fill="#6e737d"`)+circ(s.xB,yy-11.5,2,`fill="#6e737d"`)}
  const yP=-rB-170;
  g+=ln(s.xB,yP,s.xB,yP-55,`stroke="#aa1e28" stroke-width="3" marker-end="url(#sp-ar)"`);
  labels.push(tx(s.xB+8,yP-45,it("P"),`fill="#aa1e28"`));
  // torque on shaft EFG
  const xt=s.xC+133;
  g+=`<path d="M${f1(xt)},${f1(-(yF+24))} A7,24 0 1,1 ${f1(xt-6)},${f1(-(yF-14))}" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#sp-ax)"/>`;
  labels.push(tx(xt+14,yF-6,`${it("T")} = ${fmt(p.T)} N·m`));
  labels.push(tx(0,38,it("A"),`text-anchor="middle"`),tx(s.xD,38,it("D"),`text-anchor="middle"`),tx(s.xB-14,rB+6,it("B"),`text-anchor="end"`),
    tx(s.xC+26,22,it("C"),`class="halo"`),tx(s.xC-60,yF+30,it("E"),`text-anchor="middle"`),tx(s.xC+60,yF+30,it("G"),`text-anchor="middle"`),tx(s.xC,yF+rF+8,it("F"),`text-anchor="middle"`));
  g+=ln(xR+20,0,xR+50,0,`stroke="#222" stroke-width="1.6" marker-end="url(#sp-ax)"`);labels.push(tx(xR+56,-5,it("x")));
  g+=ln(0,38+18,0,90,EXT)+ln(0,90,0,118,`stroke="#222" stroke-width="1.6" marker-end="url(#sp-ax)"`);labels.push(tx(0,124,it("y"),`text-anchor="middle"`));
  // section plane a-a
  const between=p.layout==="between", xs=between?s.xC+38:s.xC-38, dirx=between?-1:1;
  const ytop=yF+rF+40, ybot=-rC-30;
  g+=ln(xs,ytop,xs,ytop-18,`stroke="#222" stroke-width="1.6"`)+ln(xs,ytop,xs+18*dirx,ytop,`stroke="#222" stroke-width="1.6" marker-end="url(#sp-ax)"`);
  g+=ln(xs,ybot,xs,ybot+18,`stroke="#222" stroke-width="1.6"`)+ln(xs,ybot,xs+18*dirx,ybot,`stroke="#222" stroke-width="1.6" marker-end="url(#sp-ax)"`);
  labels.push(tx(xs+30*dirx,ytop-6,it("a"),`text-anchor="middle"`),tx(xs+30*dirx,ybot-6,it("a"),`text-anchor="middle"`));
  // shaft diameter
  const xd=(s.xC+s.xD)/2;
  g+=ln(xd,hd+30,xd,hd,`stroke="#222" marker-end="url(#sp-ax)"`)+ln(xd,-hd-30,xd,-hd,`stroke="#222" marker-end="url(#sp-ax)"`);
  labels.push(tx(xd,-hd-50,`${it("d")} = ${p.d} mm`,`text-anchor="middle" class="halo"`));
  // dimensions
  const yd=Math.min(-rC-45,yP-75);
  const tops={A:-62,B:yP-62,C:-rC-6,D:-62}, xsOf={A:0,B:s.xB,C:s.xC,D:s.xD};
  s.order.forEach(n=>{g+=ln(xsOf[n],tops[n],xsOf[n],yd-12,EXT)});
  ["e","f","g"].forEach((nm,i)=>{const x0=xsOf[s.order[i]],x1=xsOf[s.order[i+1]];
    g+=ln(x0,yd,x1,yd,DIM);labels.push(tx((x0+x1)/2,yd-24,`${it(nm)} = ${p[nm]} mm`,`text-anchor="middle"`))});
  // ---------- section a-a
  const zs=between?-1:1;                                    // screen x = zs * z
  const Xs=Math.max(xR+90,xt+250)+rC+40+(zs>0?190:0);       // dimensions sit on the left when z points right
  const sx=z=>Xs+zs*z;
  g+=circ(Xs,0,rC,`fill="#eec878" stroke="#7d5014" stroke-width="1.6"`)+circ(Xs,0,rB,`fill="none" stroke="#7d5014" stroke-dasharray="6 4"`);
  g+=circ(Xs,0,p.d/2,`fill="#fff"`)+circ(Xs,0,p.d/2,`fill="url(#sp-hatch)" stroke="#222" stroke-width="1.6"`);
  const yh=-Math.sqrt(rC*rC-rB*rB);
  for(const zz of [-rB,rB]){
    g+=ln(sx(zz),0,sx(zz),yh,`stroke="#6e737d" stroke-dasharray="5 4"`);
    for(let yy=yh-2;yy>yP+8;yy-=16)g+=`<ellipse cx="${f1(sx(zz))}" cy="${f1(-(yy-7))}" rx="6" ry="7.5" fill="#fff" stroke="#6e737d" stroke-width="1.6"/>`;
  }
  const zP=p.side*rB;
  g+=ln(sx(zP),yP,sx(zP),yP-55,`stroke="#aa1e28" stroke-width="3" marker-end="url(#sp-ar)"`);labels.push(tx(sx(zP)+8,yP-45,it("P"),`fill="#aa1e28"`));
  g+=circ(Xs,yF,rF,`fill="#eec878" stroke="#7d5014" stroke-width="1.6"`)+circ(Xs,yF,12.5,`fill="#fff"`)+circ(Xs,yF,12.5,`fill="url(#sp-hatch)" stroke="#222" stroke-width="1.6"`);
  // torque on F: applied torque about x is +side*T; it looks counterclockwise when x points at the viewer
  const ccw=(p.side>0)===between, rr=Math.min(30,rF-8), a0=ccw?20:160, a1=ccw?160:20;
  const pa=a=>[Xs+rr*Math.cos(a*Math.PI/180),-(yF+rr*Math.sin(a*Math.PI/180))];
  const [p0x,p0y]=pa(a0),[p1x,p1y]=pa(a1);
  g+=`<path d="M${f1(p0x)},${f1(p0y)} A${rr},${rr} 0 0,${ccw?0:1} ${f1(p1x)},${f1(p1y)}" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#sp-ax)"/>`;
  labels.push(tx(Xs+(ccw?-1:1)*(rr+14),yF+rr+4,it("T"),`text-anchor="middle"`));
  // tangent at the pitch point and line of action of the force on C
  const tphi=Math.tan(p.phi*Math.PI/180), up=zs*p.side;    // screen side on which the line of action rises
  g+=ln(Xs-rC-30,rC,Xs+rC+30,rC,`stroke="#222" stroke-width="0.9"`);
  g+=ln(Xs-up*(rC+30),rC-(rC+30)*tphi,Xs+up*(rC+40),rC+(rC+40)*tphi,`stroke="#222" stroke-width="0.9"`);
  const Ra=Math.min(110,rC);const arc=[];for(let t=0;t<=p.phi;t+=2)arc.push(`${f1(Xs+up*Ra*Math.cos(t*Math.PI/180))},${f1(-(rC+Ra*Math.sin(t*Math.PI/180)))}`);
  g+=`<polyline points="${arc.join(" ")}" fill="none" stroke="#222"/>`;
  labels.push(tx(Xs+up*(Ra+10),rC+Ra*Math.sin(p.phi*Math.PI/360)-4,it("φ"),`text-anchor="${up>0?"start":"end"}" class="halo"`));
  // axes in the section
  g+=ln(Xs,-rC-20,Xs,yF+rF+25,CL)+ln(Xs,yF+rF+25,Xs,yF+rF+55,`stroke="#222" stroke-width="1.6" marker-end="url(#sp-ax)"`);labels.push(tx(Xs,yF+rF+62,it("y"),`text-anchor="middle"`));
  g+=ln(Xs-zs*(rC+20),0,Xs+zs*(rC+25),0,CL)+ln(Xs+zs*(rC+25),0,Xs+zs*(rC+55),0,`stroke="#222" stroke-width="1.6" marker-end="url(#sp-ax)"`);
  labels.push(tx(Xs+zs*(rC+68),-5,it("z"),`text-anchor="middle"`));
  // section dimensions, on the side away from the z axis
  const dx=Xs-zs*(rC+45), ex=Xs-zs*(rC+55);
  g+=ln(Xs,yF+rF,ex,yF+rF,EXT)+ln(Xs,rC,ex,rC,EXT)+ln(Xs,-rC,ex,-rC,EXT);
  g+=ln(dx,yF+rF,dx,rC,DIM)+ln(dx,rC,dx,-rC,DIM);
  const anc=zs>0?"end":"start", off=-zs*8;
  labels.push(tx(dx+off,(yF+rF+rC)/2-5,`${it("c")} = ${p.c} mm`,`text-anchor="${anc}" class="halo"`),tx(dx+off,-5,`${it("b")} = ${p.b} mm`,`text-anchor="${anc}" class="halo"`));
  const ya=yP-80;
  g+=ln(sx(-rB),yP-2,sx(-rB),ya-12,EXT)+ln(sx(rB),yP-62,sx(rB),ya-12,EXT)+ln(sx(-rB),ya,sx(rB),ya,DIM);
  labels.push(tx(Xs,ya-24,`${it("a")} = ${p.a} mm`,`text-anchor="middle"`),tx(Xs,ya-58,`Section ${it("a")}–${it("a")}`,`text-anchor="middle" font-size="15"`));
  g+=labels.join("");
  const pad=16,W=bb.mxX-bb.mnX+2*pad,H=bb.mxY-bb.mnY+2*pad;
  return `<svg viewBox="${f1(bb.mnX-pad)} ${f1(bb.mnY-pad)} ${f1(W)} ${f1(H)}" xmlns="http://www.w3.org/2000/svg" font-family="Georgia,serif" font-size="19" style="max-height:600px">
  <defs>
   <pattern id="sp-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#222" stroke-width="1"/></pattern>
   <marker id="sp-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#aa1e28"/></marker>
   <marker id="sp-ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#222"/></marker>
   <marker id="sp-dm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#222"/></marker>
  </defs>${g}</svg>`;
}

function spSolution(p,s){
  const N=v=>fmt(Math.abs(v),1), Nm=v=>fmt(Math.abs(v)/1000,1);
  const rows=[[1,"<i>xy</i>"],[2,"<i>xz</i>"]].map(([k,t])=>`<tr><td>${t}</td><td>${N(s.RA[k])}</td><td>${N(s.RD[k])}</td></tr>`).join("");
  const mrows=s.cands.slice().sort((u,v)=>u.x-v.x).map(c=>`<tr><td><i>${c.n}</i> (x = ${fmt(c.x)} mm)</td><td>${Nm(s.Mk(1,c.x))}</td><td>${Nm(s.Mk(2,c.x))}</td><td>${fmt(c.M/1000,1)}</td></tr>`).join("");
  const pd3=Math.PI*p.d**3, deg=Math.atan2(s.tz,s.ty)*180/Math.PI;
  const torqueNote=s.crit.n==="D"?"Section <i>D</i> lies between <i>C</i> and <i>B</i>, so it carries the full torque.":`The torque acts on segment <i>BC</i>, so it is present on the <i>BC</i> side of section <i>${s.crit.n}</i>.`;
  return `<h3>1. Gear and chain forces</h3>
  <p><span class="eq">F<sub>t</sub> = T/(c/2) = ${fmt(p.T*1000)}/${fmt(p.c/2,1)} = ${fmt(s.Ft,1)} N</span>&nbsp; <span class="eq">T<sub>ABCD</sub> = F<sub>t</sub>(b/2) = ${fmt(s.T2/1000,1)} N·m</span></p>
  <p><span class="eq">P = T<sub>ABCD</sub>/(a/2) = ${fmt(s.P,1)} N</span>&nbsp; <span class="eq">F<sub>r</sub> = F<sub>t</sub> tan ${p.phi}° = ${fmt(s.Fr,1)} N</span></p>
  <p>On gear <i>C</i>, F<sub>t</sub> acts in the ${p.side>0?"&minus;":"+"}<i>z</i> direction and F<sub>r</sub> in &minus;<i>y</i>, at x = ${fmt(s.xC)} mm. P acts in &minus;<i>y</i> at x = ${fmt(s.xB)} mm.</p>
  <h3>2. Bearing reactions</h3>
  <table><tr><th>Plane</th><th>R<sub>A</sub> (N)</th><th>R<sub>D</sub> (N)</th></tr>${rows}
  <tr><td><b>Resultant</b></td><td><b>${fmt(s.RAm,1)}</b></td><td><b>${fmt(s.RDm,1)}</b></td></tr></table>
  <h3>3. Bending moments at the candidate sections</h3>
  <table><tr><th>Section</th><th>M<sub>xy</sub> (N·m)</th><th>M<sub>xz</sub> (N·m)</th><th>M (N·m)</th></tr>${mrows}</table>
  <p>The moment is largest at <i>${s.crit.n}</i>, ${fmt((s.margin)*100,1)}% above the next section. ${torqueNote}</p>
  <h3>4. Location of the critical point</h3>
  <p>The tensile bending stress is largest on the surface of section <i>${s.crit.n}</i> at <span class="eq">y = ${fmt(s.ty,1)} mm, z = ${fmt(s.tz,1)} mm</span>, which is ${fmt(Math.abs(deg),1)}° from the +<i>y</i> axis toward ${s.tz>=0?"+":"&minus;"}<i>z</i>. The torsional shear stress is the same everywhere on that surface.</p>
  <h3>5. Combined stresses</h3>
  <p><span class="eq">σ = 32M/(πd³) = 32(${fmt(s.M)})/${fmt(pd3)} = ${fmt(s.sigma,2)} MPa</span>&nbsp; <span class="eq">τ = 16T/(πd³) = 16(${fmt(s.T2)})/${fmt(pd3)} = ${fmt(s.tau,2)} MPa</span></p>
  <p><span class="eq">σ<sub>1,2</sub> = σ/2 ± √[(σ/2)² + τ²]</span></p>
  <p class="final">σ<sub>1</sub> = ${fmt(s.s1,2)} MPa, σ<sub>2</sub> = ${fmt(s.s2,2)} MPa, τ<sub>max</sub> = ${fmt(s.tmax,2)} MPa.</p>`;
}

// ===== cantilevered crank template (critical element in rod AB)
const CR_LEVER={down:[0,-1,0],up:[0,1,0],away:[0,0,-1]};
const CR_LOADS={down:["+z","-z"],up:["+z","-z"],away:["+y","-y"]};
const CR_UNIT={"+y":[0,1,0],"-y":[0,-1,0],"+z":[0,0,1],"-z":[0,0,-1]};
const CR_LOADTEXT={"+y":"upward (+<i>y</i>)","-y":"downward (&minus;<i>y</i>)","+z":"in the +<i>z</i> direction (toward the viewer)","-z":"in the &minus;<i>z</i> direction (away from the viewer)"};
const CR_SURF={"+y":"+y (top)","-y":"−y (bottom)","+z":"+z (front)","-z":"−z (back)"};

function crSolve(p){
  const lv=CR_LEVER[p.lever], u=CR_UNIT[p.load];
  const D=[p.L1+p.L3, lv[1]*p.L2, lv[2]*p.L2], F=u.map(c=>c*p.F);
  const M=[D[1]*F[2]-D[2]*F[1], D[2]*F[0]-D[0]*F[2], D[0]*F[1]-D[1]*F[0]];   // moment of F about A
  const T=Math.abs(M[0]), Mb=Math.hypot(M[1],M[2]);
  const A=Math.PI*p.d**2/4, pd3=Math.PI*p.d**3;
  const sigma=32*Mb/pd3, tau=16*T/pd3, tv=4*p.F/(3*A), R=Math.hypot(sigma/2,tau);
  // bending stress sigma = (My z - Mz y)/I is largest in tension along (y,z) ~ (-Mz, My)
  const ty=-M[2]/Mb, tz=M[1]/Mb;
  const surf=Math.abs(ty)>Math.abs(tz)?(ty>0?"+y":"-y"):(tz>0?"+z":"-z");
  return {D,F,M,T,Mb,sigma,tau,tv,s1:sigma/2+R,s2:sigma/2-R,tmax:R,surf,naShear:tau+tv};
}

function crGenerate(seed){
  const r=mulberry32(seed);
  for(let k=0;k<5000;k++){
    const lever=pick(r,["down","up","away"]);
    const p={lever, load:pick(r,CR_LOADS[lever]), L1:pick(r,[5,6,7,8,9]), L2:pick(r,[3,4,5]), L3:pick(r,[2,2.5,3]),
      F:pick(r,range(100,500,25)), d:0};
    let ok=false;

function crSolution(p,s){
  const pd3=Math.PI*p.d**3, A=Math.PI*p.d**2/4;
  const other=CR_SURF[{"+y":"-y","-y":"+y","+z":"-z","-z":"+z"}[s.surf]];
  const plane=Math.abs(s.M[1])>Math.abs(s.M[2])?"<i>xz</i> (horizontal)":"<i>xy</i> (vertical)";
  return `<h3>1. Loads on rod AB at the wall</h3>
  <p>The load acts at <span class="eq">D = (${fmt(s.D[0],2)}, ${fmt(s.D[1],2)}, ${fmt(s.D[2],2)}) in</span>. Its moment about <i>A</i> is <span class="eq">r × F = (${fmt(s.M[0])}, ${fmt(s.M[1])}, ${fmt(s.M[2])}) lbf·in</span>.</p>
  <p>Rod <i>AB</i> therefore carries a torque <span class="eq">T = ${fmt(s.T)} lbf·in</span>, a bending moment <span class="eq">M = ${fmt(s.Mb)} lbf·in</span> in the ${plane} plane, and a transverse shear <span class="eq">V = ${fmt(p.F)} lbf</span>. The bending moment grows linearly toward the wall, so the critical section is at <i>A</i>.</p>
  <h3>2. (a) Location of the critical element</h3>
  <p class="final">The tensile critical element is on the ${CR_SURF[s.surf]} surface of rod <i>AB</i> at the wall.</p>
  <p>The element on the ${other} surface carries the same stresses with compression; for a ductile material it is equally critical.</p>
  <h3>3. (b) Stresses on the element</h3>
  <p><span class="eq">σ<sub>x</sub> = 32M/(πd³) = 32(${fmt(s.Mb)})/${fmt(pd3,3)} = ${fmt(s.sigma)} psi</span> (tension, along the rod axis)</p>
  <p><span class="eq">τ = 16T/(πd³) = 16(${fmt(s.T)})/${fmt(pd3,3)} = ${fmt(s.tau)} psi</span> (torsion, tangent to the surface)</p>
  <p>Transverse shear is zero on the surface where σ<sub>x</sub> is largest. Its maximum, <span class="eq">4V/(3A) = ${fmt(s.tv)} psi</span>, occurs 90° away, where the bending stress is zero. There, torsion and transverse shear add to ${fmt(s.naShear)} psi, below the ${fmt(s.tmax)} psi found at the critical element, so neglecting transverse shear is justified.</p>
  <h3>4. (c) Principal stresses and maximum shear stress</h3>
  <p><span class="eq">σ<sub>1,2</sub> = σ<sub>x</sub>/2 ± √[(σ<sub>x</sub>/2)² + τ²]</span></p>
  <p class="final">σ<sub>1</sub> = ${fmt(s.s1)} psi, σ<sub>2</sub> = ${fmt(s.s2)} psi, τ<sub>max</sub> = ${fmt(s.tmax)} psi.</p>`;
}

// ===== S-hook curved beam template (SI units)
function hkSolve(p){
  const r=p.d/2, ri=p.Di/2, ro=ri+p.d, rc=ri+r, th=p.theta*Math.PI/180;
  const rn=r*r/(2*(rc-Math.sqrt(rc*rc-r*r))), e=rc-rn, A=Math.PI*r*r;
  const F=p.F*1000, N=F*Math.sin(th), V=F*Math.cos(th), M=F*rc*Math.sin(th);   // N, N*mm
  const sa=N/A, bi=M*(rn-ri)/(A*e*ri), bo=M*(ro-rn)/(A*e*ro);
  const sb=32*M/(Math.PI*p.d**3);
  return {r,ri,ro,rc,rn,e,A,N,V,M,sa,bi,bo,si:sa+bi,so:sa-bo,straightI:sa+sb,straightO:sa-sb};
}

function hkGenerate(seed){
  const rnd=mulberry32(seed);
  for(let k=0;k<5000;k++){
    const p={Di:pick(rnd,range(40,100,5)), F:pick(rnd,range(1,6,0.25)), L:pick(rnd,range(180,300,20)),
      theta:pick(rnd,[90,90,60,45]), d:0};
    let ok=false;
    for(const d of [8,10,12,14,16,18,20,22,25]){
      if(p.Di<2.5*d||p.Di>7*d) continue;
      p.d=d;const s=hkSolve(p);if(s.si>=120&&s.si<=420){ok=true;break}}
    if(!ok) continue;
    return {p,s:hkSolve(p)};
  }
  throw new Error("no valid problem");
}

function hkStatement(p){
  const where=p.theta===90
    ?"at the bottom of the left loop, directly below its center"
    :`on the left loop, on a radial line at <i>θ</i> = ${p.theta}° below the line of action of <i>F</i>`;
  return `<p>A utility hook is bent from round rod of diameter <i>d</i> = ${p.d} mm into the shape shown. The loops have inside diameter <i>D<sub>i</sub></i> = ${p.Di} mm, and their centers are <i>L</i> = ${p.L} mm apart. Equal and opposite forces <i>F</i> = ${fmt(p.F,2).replace(/\.?0+$/,"")} kN act through the loop centers, and the load on the left loop is carried to the shank through the lower half of the loop. Section <i>B</i>–<i>B</i> is ${where}.</p>
  <p>Find the stresses at the inner and outer surfaces of the rod at section <i>B</i>–<i>B</i>.</p>`;
}

function hkFigure(p,s){
  const S=Math.min(3.2,620/(p.L+2*s.ro+80));               // px per mm

  const pt=(x,y)=>{G(X(x),Y(y));return f1(X(x))+","+f1(Y(y))};
  const line=(x0,y0,x1,y1,attr)=>`<line x1="${f1(X(x0))}" y1="${f1(Y(y0))}" x2="${f1(X(x1))}" y2="${f1(Y(y1))}" ${attr}/>`+(G(X(x0),Y(y0)),G(X(x1),Y(y1)),"");

  const it=v=>`<tspan font-style="italic">${v}</tspan>`, c=Math.PI/180, rc=s.rc, L=p.L;

  g+=`<polyline points="${pts.map(q=>pt(q[0]-0.06*p.d,q[1]+0.12*p.d)).join(" ")}" fill="none" stroke="#f8e4b4" stroke-width="${f1(Math.max(1.5,0.16*w))}" stroke-linejoin="round"/>`;
  for(const a of [55]) g+=line(s.ri*Math.cos(a*c),s.ri*Math.sin(a*c),s.ro*Math.cos(a*c),s.ro*Math.sin(a*c),`stroke="#7d5014" stroke-width="1.6"`);
  g+=line(L+s.ri*Math.cos(-182*c),s.ri*Math.sin(-182*c),L+s.ro*Math.cos(-182*c),s.ro*Math.sin(-182*c),`stroke="#7d5014" stroke-width="1.6"`);
  let labels=[];
  // loads
  const fl=0.7*s.ri;
  g+=line(0,0,-fl,0,`stroke="#aa1e28" stroke-width="3" marker-end="url(#hk-ar)"`)+line(L,0,L+fl,0,`stroke="#aa1e28" stroke-width="3" marker-end="url(#hk-ar)"`);
  labels.push(text(-fl*0.55,8/S,it("F"),`fill="#aa1e28" text-anchor="middle" class="halo"`),text(L+fl*0.55,-5/S-14/S,it("F"),`fill="#aa1e28" text-anchor="middle" class="halo"`));
  for(const x0 of [0,L]) g+=line(x0-4/S*1.5,0,x0+4/S*1.5,0,`stroke="#222"`)+line(x0,-6/S,x0,6/S,`stroke="#222"`)+`<circle cx="${f1(X(x0))}" cy="0" r="2.5" fill="#222"/>`;
  // inside diameters
  const D=(cx,a,lab)=>{const x0=cx+s.ri*Math.cos(a*c),y0=s.ri*Math.sin(a*c),x1=cx-s.ri*Math.cos(a*c),y1=-s.ri*Math.sin(a*c);
    return line(x0,y0,x1,y1,`stroke="#222" stroke-width="0.9" marker-start="url(#hk-dm)" marker-end="url(#hk-dm)"`)};
  g+=D(L,40);                                               // both loops share D_i; dimension the right one only
  labels.push(text(L+0.45*s.ri*Math.cos(40*c),0.45*s.ri*Math.sin(40*c)+3/S,`${it("D")}<tspan baseline-shift="sub" font-size="12">i</tspan>`,`text-anchor="middle" class="halo"`));
  // section B-B at polar angle 180 + theta on the left loop
  const ph=(180+p.theta)*c, ux=Math.cos(ph), uy=Math.sin(ph), tx=-uy, ty=ux;   // radial and tangent (ccw) directions
  const a0=s.ri-10/S, a1=s.ro+14/S;
  g+=line(a0*ux,a0*uy,a1*ux,a1*uy,`stroke="#222" stroke-width="1.6" stroke-dasharray="6 4"`);
  const tick=10/S;
  for(const rr of [a0,a1]){
    g+=line(rr*ux,rr*uy,rr*ux-tick*tx,rr*uy-tick*ty,`stroke="#222" stroke-width="1.6" marker-end="url(#hk-ax)"`);
    labels.push(text(rr*ux-tick*tx*2.2,rr*uy-tick*ty*2.2-5/S,it("B"),`text-anchor="middle" class="halo"`));
  }
  if(p.theta!==90){
    const ra=0.28*s.ri, arc=[];for(let a=180;a<=180+p.theta;a+=3)arc.push(pt(ra*Math.cos(a*c),ra*Math.sin(a*c)));
    g+=line(0,0,a0*ux,a0*uy,`stroke="#888" stroke-width="0.9"`)+`<polyline points="${arc.join(" ")}" fill="none" stroke="#222"/>`;
    const am=(180+p.theta/2)*c;labels.push(text(0.44*s.ri*Math.cos(am),0.44*s.ri*Math.sin(am)-5/S,it("θ"),`text-anchor="middle" class="halo"`));
  }

  const mx=0.55*L, my=-rc+0.55*2*rc, sl=Math.hypot(L,2*rc), nx=-2*rc/sl, ny=L/sl, h0=p.d/2+4/S, h1=p.d/2+22/S;
  g+=line(mx+nx*h1,my+ny*h1,mx+nx*h0,my+ny*h0,`stroke="#222" marker-end="url(#hk-ax)"`)+line(mx-nx*h1,my-ny*h1,mx-nx*h0,my-ny*h0,`stroke="#222" marker-end="url(#hk-ax)"`);
  labels.push(text(mx-nx*(h1+12/S),my-ny*(h1+12/S)-6/S,it("d"),`text-anchor="middle"`));
  // center distance

  g+=line(0,s.ro+6/S,0,yt+8/S,`stroke="#999" stroke-width="0.8"`)+line(L,s.ro+6/S,L,yt+8/S,`stroke="#999" stroke-width="0.8"`);

  labels.push(text(L/2,yt+6/S,it("L"),`text-anchor="middle" class="halo"`));

  const pad=18,W=bb.mxX-bb.mnX+2*pad,H=bb.mxY-bb.mnY+2*pad;

}

function hkSolution(p,s){
  const th=p.theta, sin=Math.sin(th*Math.PI/180);
  const loads=th===90
    ?`The section is perpendicular to the line of <i>F</i>, a distance r<sub>c</sub> from it. It carries an axial tension <span class="eq">N = F = ${fmt(s.N)} N</span> and a bending moment <span class="eq">M = F r<sub>c</sub> = ${fmt(s.M)} N·mm</span>.`
    :`The section lies at θ = ${th}° from the line of <i>F</i>, so its centroid is <span class="eq">r<sub>c</sub> sin θ = ${fmt(s.rc*sin,2)} mm</span> from that line. It carries an axial tension <span class="eq">N = F sin θ = ${fmt(s.N)} N</span>, a shear force <span class="eq">V = F cos θ = ${fmt(s.V)} N</span>, and a bending moment <span class="eq">M = F r<sub>c</sub> sin θ = ${fmt(s.M)} N·mm</span>. The shear stress from V is zero at the inner and outer surfaces.`;
  const up=(s.si-s.straightI)/s.straightI*100;
  return `<h3>1. Section geometry</h3>
  <p><span class="eq">r = ${fmt(s.r,1)} mm, r<sub>i</sub> = ${fmt(s.ri,1)} mm, r<sub>o</sub> = ${fmt(s.ro,1)} mm, r<sub>c</sub> = ${fmt(s.rc,1)} mm</span></p>
  <p>For a round section, the neutral axis lies at <span class="eq">r<sub>n</sub> = r² / [2(r<sub>c</sub> − √(r<sub>c</sub>² − r²))] = ${fmt(s.rn,4)} mm</span>, so <span class="eq">e = r<sub>c</sub> − r<sub>n</sub> = ${fmt(s.e,4)} mm</span>. The area is <span class="eq">A = ${fmt(s.A,2)} mm²</span>.</p>
  <h3>2. Loads at section B–B</h3>
  <p>${loads} The moment tends to open the loop, so the inner surface is in tension.</p>
  <h3>3. Inner surface</h3>
  <p><span class="eq">σ<sub>i</sub> = N/A + M(r<sub>n</sub> − r<sub>i</sub>)/(A e r<sub>i</sub>) = ${fmt(s.sa,2)} + ${fmt(s.bi,2)}</span></p>
  <p class="final">σ<sub>i</sub> = ${fmt(s.si,1)} MPa</p>
  <h3>4. Outer surface</h3>
  <p><span class="eq">σ<sub>o</sub> = N/A − M(r<sub>o</sub> − r<sub>n</sub>)/(A e r<sub>o</sub>) = ${fmt(s.sa,2)} − ${fmt(s.bo,2)}</span></p>
  <p class="final">σ<sub>o</sub> = ${fmt(s.so,1)} MPa</p>
  <h3>5. Effect of curvature</h3>
  <p>Straight-beam theory gives ${fmt(s.straightI,1)} MPa and ${fmt(s.straightO,1)} MPa at the same two points. Curvature raises the inner-surface stress by ${fmt(up,1)}%.</p>`;
}

// ===== cast-iron bell crank, curved section through the pivot (SI units)
function bcGeom(p){
  const half=(180-p.alpha)/2*Math.PI/180, hw=p.w/2;
  const sIn=Math.round((hw+p.rf)/Math.sin(half)-p.rf), sOut=Math.round(hw/Math.sin(half));
  const ri=p.rf, rp=ri+sIn, Dh=p.Db+2*p.wall;
  const pieces=[[p.t,ri,rp-Dh/2],[p.H,rp-Dh/2,rp-p.Db/2],[p.H,rp+p.Db/2,rp+Dh/2],[p.t,rp+Dh/2,rp+sOut]];
  return {half,hw,sIn,sOut,ri,ro:rp+sOut,rp,Dh,pieces};
}

function bcSolve(p){
  const G=bcGeom(p);
  const A=G.pieces.reduce((s,[b,a,c])=>s+b*(c-a),0);
  const rc=G.pieces.reduce((s,[b,a,c])=>s+b*(c-a)*(a+c)/2,0)/A;
  const rn=A/G.pieces.reduce((s,[b,a,c])=>s+b*Math.log(c/a),0);
  const e=rc-rn, M=p.F2*1000*p.L2, F1=p.F2*p.L2/p.L1;
  const si=M*(rn-G.ri)/(A*e*G.ri), so=-M*(G.ro-rn)/(A*e*G.ro);
  const I=G.pieces.reduce((s,[b,a,c])=>s+b*(c-a)**3/12+b*(c-a)*((a+c)/2-rc)**2,0);
  return {...G,A,rc,rn,e,M,F1,si,so,I,stI:M*(rc-G.ri)/I,stO:-M*(G.ro-rc)/I};
}

function bcGenerate(seed){
  const r=mulberry32(seed);
  for(let k=0;k<5000;k++){
    const p={alpha:pick(r,[40,45,50,55,60]), L1:pick(r,range(180,260,20)), L2:pick(r,range(120,200,20)),
      F2:pick(r,range(1.5,4,0.25)), w:pick(r,[60,70,80]), rf:pick(r,[20,25,30]), t:pick(r,[8,10,12]),
      H:pick(r,[28,32,36]), Db:pick(r,[24,30,36]), wall:pick(r,[8,10,11,12])};
    if(p.H<2.5*p.t) continue;
    const G=bcGeom(p);
    if(G.sIn-G.Dh/2<6||G.sOut-G.Dh/2<6) continue;      // webs on both sides of the hub
    const s=bcSolve(p);
    if(s.si<15||s.si>150) continue;
    return {p,s};
  }
  throw new Error("no valid problem");
}

function bcStatement(p){
  const F1=p.F2*p.L2/p.L1;
  return `<p>The cast-iron bell crank shown pivots on a pin at its center. Arm 1 is ${p.L1} mm long and makes the ${p.alpha}° angle shown; arm 2 is ${p.L2} mm long and vertical. Forces <i>F</i><sub>1</sub> and <i>F</i><sub>2</sub> = ${fmt(p.F2,2).replace(/\.?0+$/,"")} kN act at the arm ends, each perpendicular to its arm, and the crank is in equilibrium. The inner corner at the pivot is rounded to <i>r<sub>i</sub></i> = ${p.rf} mm. Section <i>A</i>–<i>A</i> runs from the center of that radius through the pivot to the outer corner; it consists of a ${p.t} mm web, a ${p.H} mm hub with a ${p.Db} mm bore lined with a nylon bushing, and the web again, with the radial dimensions shown.</p>
  <p>Find <i>F</i><sub>1</sub>, and estimate the stresses at the inner and outer surfaces of the curved portion at section <i>A</i>–<i>A</i>. Treat the section as a curved beam carrying the bending moment of <i>F</i><sub>2</sub> about the pivot, and neglect the direct force at the section.</p>`;
}

function bcFigure(p,s){
  const S=1.55, f1=v=>v.toFixed(1), c=Math.PI/180;
  const bb={mnX:1e9,mnY:1e9,mxX:-1e9,mxY:-1e9};
  const Gr=(X,Y)=>{bb.mnX=Math.min(bb.mnX,X);bb.mxX=Math.max(bb.mxX,X);bb.mnY=Math.min(bb.mnY,Y);bb.mxY=Math.max(bb.mxY,Y)};
  const P=(x,y)=>{Gr(x*S,-y*S);return f1(x*S)+","+f1(-y*S)};
  const line=(a,b,attr)=>`<line x1="${f1(a[0]*S)}" y1="${f1(-a[1]*S)}" x2="${f1(b[0]*S)}" y2="${f1(-b[1]*S)}" ${attr}/>`+(Gr(a[0]*S,-a[1]*S),Gr(b[0]*S,-b[1]*S),"");
  const circ=(q,r,attr)=>{Gr((q[0]-r)*S,-(q[1]+r)*S);Gr((q[0]+r)*S,-(q[1]-r)*S);return `<circle cx="${f1(q[0]*S)}" cy="${f1(-q[1]*S)}" r="${f1(r*S)}" ${attr}/>`};
  const text=(q,str,attr="")=>{const w=13*str.replace(/<[^>]*>/g,"").length,al=/text-anchor="end"/.test(attr)?[w,0]:/text-anchor="middle"/.test(attr)?[w/2,w/2]:[0,w];

  const u=a=>[Math.cos(a*c),Math.sin(a*c)], add=(a,b,k=1)=>[a[0]+k*b[0],a[1]+k*b[1]], it=v=>`<tspan font-style="italic">${v}</tspan>`;
  const al=p.alpha, hw=s.hw, rf=p.rf, half=s.half;
  const E1=[p.L1*Math.cos((90+al)*c),p.L1*Math.sin((90+al)*c)], E2=[0,-p.L2];
  const beta=180+al/2, dc=(hw+rf)/Math.sin(half), Cf=[dc*Math.cos(beta*c),dc*Math.sin(beta*c)];
  const Oc=add([0,0],u(al/2),hw/Math.sin(half));

  const OL=`stroke="#7d5014" stroke-width="1.6" stroke-linejoin="round"`, EXT=`stroke="#999" stroke-width="0.8"`, CL=`stroke="#888" stroke-width="0.9" stroke-dasharray="10 3 2 3"`;
  const DIM=`stroke="#222" stroke-width="0.9" marker-start="url(#bc-dm)" marker-end="url(#bc-dm)"`, AX=`stroke="#222" stroke-width="1.6" marker-end="url(#bc-ax)"`;
  // outline

  for(let a=al;a<=al+180+1e-6;a+=6)pts.push(add(E1,u(a),hw));

  let g=`<polygon points="${pts.map(q=>P(q[0],q[1])).join(" ")}" fill="#eec878" ${OL}/>`;

  for(const E of [E1,E2]) g+=circ(E,0.32*p.w,`fill="#f2d391" ${OL}`)+circ(E,0.14*p.w,`fill="#fff" ${OL}`);

  let labels=[];
  // loads

  // section A-A
  const sa=add(Cf,[-Cf[0],-Cf[1]],0.2), sb=add([0,0],Oc,1.35), nrm=u(al/2-90);
  g+=line(sa,sb,`stroke="#222" stroke-width="1.6" stroke-dasharray="7 4"`)+line(sa,add(sa,nrm,12),AX)+line(sb,add(sb,nrm,12),AX);
  labels.push(text(add(add(sa,nrm,20),[-4,-6]),it("A"),`text-anchor="middle" class="halo"`),text(add(add(sb,nrm,16),[8,0]),it("A"),`class="halo"`));
  g+=line(Cf,add(Cf,u(al/2),rf),`stroke="#222" marker-end="url(#bc-ax)"`)+circ(Cf,1.2,`fill="#222"`);
  labels.push(text(add(Cf,[-6,-4]),`${it("r")}<tspan baseline-shift="sub" font-size="17">i</tspan>`,`text-anchor="end" class="halo"`));
