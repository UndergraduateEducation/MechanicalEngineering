<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shaft Analysis Problem Generator</title>
<style>
  :root{
    --ink:#1f2328; --muted:#5b6470; --line:#d9dde3; --bg:#fbfaf7; --card:#ffffff;
    --beam:#f7e2c4; --beamline:#78461a; --load:#aa1e28; --sec:#cde1cd; --secline:#1e5a32;
    --accent:#1e5a32; --ok:#1e7a3c; --bad:#b3261e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.55 "Georgia","Times New Roman",serif}
  header{padding:22px 24px 8px;max-width:980px;margin:0 auto}
  h1{font-size:1.45rem;margin:0 0 4px;font-weight:600}
  .sub{color:var(--muted);font-family:system-ui,sans-serif;font-size:.9rem}
  main{max-width:980px;margin:0 auto;padding:8px 24px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:14px 0}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-family:system-ui,sans-serif;font-size:.9rem}
  button{font:inherit;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:7px;padding:7px 14px;cursor:pointer}
  button.ghost{background:#fff;color:var(--accent)}
  button:hover{filter:brightness(1.08)}
  input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:9em}
  label{color:var(--muted)}
  .tag{display:inline-block;font-family:system-ui,sans-serif;font-size:.78rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 9px;margin-left:6px}
  svg{width:100%;height:auto;display:block}
  .statement p{margin:.3em 0}
  .answers{display:grid;grid-template-columns:auto auto auto;gap:8px 12px;align-items:center;font-family:system-ui,sans-serif;font-size:.92rem}
  .mark{font-weight:600;min-width:7em}
  .mark.ok{color:var(--ok)} .mark.bad{color:var(--bad)}
  #solution{display:none}
  #solution h3{font-size:1.05rem;margin:1.1em 0 .3em}
  table{border-collapse:collapse;font-family:system-ui,sans-serif;font-size:.88rem;margin:.4em 0}
  td,th{border-bottom:1px solid var(--line);padding:4px 12px;text-align:right}
  th{color:var(--muted);font-weight:600}
  td:first-child,th:first-child{text-align:left}
  .eq{font-family:"Cambria Math","STIX Two Math",Georgia,serif;background:#f4f5f2;border-radius:6px;padding:6px 10px;display:inline-block;margin:3px 0}
  .note{color:var(--muted);font-size:.92rem}
  .final{font-weight:600}
  @media (max-width:640px){.answers{grid-template-columns:1fr 1fr}.answers .mark{grid-column:span 2}}

  select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;max-width:100%}
  .answers input{width:8em}
  .answers input.expr{width:19em;font-family:ui-monospace,Menlo,Consolas,monospace}
  .halo{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
</style>
</head>
<body>
<header>
  <h1>Shaft Analysis Problem Generator</h1>
  <div class="sub">Each problem is generated from a seed and solved exactly in the browser. Share the seed to reproduce a problem.</div>
</header>
<main>
  <div class="card bar">
    <label for="typeSel">Problem type</label><select id="typeSel"></select>
  </div>
  <div class="card bar">
    <button id="newBtn">New problem</button>
    <label for="seedIn">Seed</label><input id="seedIn" type="number" min="1" step="1">
    <button class="ghost" id="loadBtn">Load seed</button>
  </div>
  <div class="card"><div id="fig"></div></div>
  <div class="card statement" id="statement"></div>
  <div class="card">
    <div class="answers" id="answers"></div>
    <div class="bar" style="margin-top:12px">
      <button id="checkBtn">Check answers</button>
      <button class="ghost" id="solBtn">Show solution</button>
      <span class="note" id="ansNote"></span>
    </div>
  </div>
  <div class="card" id="solution"></div>
</main>
<script>


// ----- seeded random numbers
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pick=(r,arr)=>arr[Math.floor(r()*arr.length)];
const range=(a,b,s)=>{const o=[];for(let v=a;v<=b+1e-9;v+=s)o.push(+v.toFixed(4));return o};

function fmt(v,d=0){if(Math.abs(v)<0.5*10**-d)v=0;return Number(v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d})}
// ===== shared helpers for the problem types below
const SF_MAT=[["AISI 1006 CD",280,330,41,48],["AISI 1015 HR",190,340,27.5,50],["AISI 1018 CD",370,440,54,64],["AISI 1020 CD",390,470,57,68],
  ["AISI 1030 HR",260,470,37.5,68],["AISI 1035 CD",460,550,67,80],["AISI 1040 HR",290,520,42,76],["AISI 1050 CD",580,690,84,100]];
const gF=v=>v.toFixed(1);
const gL=(x1,y1,x2,y2,attr)=>`<line x1="${gF(x1)}" y1="${gF(y1)}" x2="${gF(x2)}" y2="${gF(y2)}" ${attr}/>`;
const gT=(x,y,t,attr="")=>`<text x="${gF(x)}" y="${gF(y)}" ${attr}>${t}</text>`;
const gI=v=>`<tspan font-style="italic">${v}</tspan>`;
const gSub=(a,b)=>`${gI(a)}<tspan baseline-shift="sub" font-size="13">${b}</tspan>`;
const G_AR=`stroke="#aa1e28" stroke-width="3" marker-end="url(#g-ar)"`, G_DIM=`stroke="#222" stroke-width="0.9" marker-start="url(#g-dm)" marker-end="url(#g-dm)"`;
const G_EXT=`stroke="#999" stroke-width="0.8"`, G_CL=`stroke="#888" stroke-width="0.9" stroke-dasharray="10 3 2 3"`, G_PART=`fill="#eec878" stroke="#7d5014" stroke-width="1.8"`;
function gSvg(vb,body,maxh=380){return `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" font-family="Georgia,serif" font-size="18" style="max-height:${maxh}px">
  <defs><marker id="g-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#aa1e28"/></marker>
  <marker id="g-ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="#222"/></marker>
  <marker id="g-dm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#222"/></marker>
  <pattern id="g-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#c9d5e2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#28405a" stroke-width="1"/></pattern></defs>${body}</svg>`}
function gMatTable(rows,us,cols){return `<table><tr><th>Material</th>${cols.map(c=>`<th>${c} (${us?"kpsi":"MPa"})</th>`).join("")}</tr>${rows.map(r=>`<tr><td>${r[0]}</td>${r.slice(1).map(v=>`<td>${fmt(v,1)}</td>`).join("")}</tr>`).join("")}</table>`}
const gSF=us=>SF_MAT.map(m=>[m[0],us?m[3]:m[1],us?m[4]:m[2]]);

// ===== shared fatigue relations (Marin factors, S-N line, criteria)
const FA_SURF={"Ground":[1.34,1.58,-0.085],"Machined or cold-drawn":[2.70,4.51,-0.265],"Hot-rolled":[14.4,57.7,-0.718],"As-forged":[39.9,272,-0.995]};
const FA_REL={"50":1,"90":0.897,"95":0.868,"99":0.814,"99.9":0.753};
const FA_KC={"Bending":1,"Axial":0.85,"Torsion":0.59};
function faSe0(Sut,us){return us?(Sut<=200?0.5*Sut:100):(Sut<=1400?0.5*Sut:700)}
function faKa(surf,Sut,us){const c=FA_SURF[surf];return (us?c[0]:c[1])*Sut**c[2]}
function faKb(d,us){return us?(d<=2?(d/0.3)**-0.107:0.91*d**-0.157):(d<=51?(d/7.62)**-0.107:1.51*d**-0.157)}
function faF(Sut,us){const s=Math.min(200,us?Sut:Sut/6.894757);return s<70?0.9:Math.round((1.06-2.8e-3*s+6.9e-6*s*s)*100)/100}
function faAB(Sut,Se,f){return {a:(f*Sut)**2/Se,b:-Math.log10(f*Sut/Se)/3}}
function faGood(sa,sm,Se,Sut){return 1/(sa/Se+sm/Sut)}
function faGerb(sa,sm,Se,Sut){if(sm<=0)return Se/sa;return 0.5*(Sut/sm)**2*(sa/Se)*(-1+Math.sqrt(1+(2*sm*Se/(Sut*sa))**2))}
function faAsme(sa,sm,Se,Sy){return 1/Math.sqrt((sa/Se)**2+(sm/Sy)**2)}
const faU=us=>us?"kpsi":"MPa";
function faSNplot(Sut,Se,f,mark){                                  // log-log S-N sketch, optional marked point [N,S]
  const X=N=>40+(Math.log10(N)-0)*68, Y=S=>250-200*(Math.log10(S)-Math.log10(0.6*Se))/(Math.log10(1.1*Sut)-Math.log10(0.6*Se));
  let g=gL(40,250,40,30,`stroke="#222" stroke-width="1.3" marker-end="url(#g-ax)"`)+gL(40,250,500,250,`stroke="#222" stroke-width="1.3" marker-end="url(#g-ax)"`);
  for(let e=0;e<=7;e++){g+=gL(X(10**e),250,X(10**e),255,`stroke="#222"`)+gT(X(10**e),272,`10<tspan baseline-shift="super" font-size="11">${e}</tspan>`,`text-anchor="middle" font-size="14"`)}
  g+=`<polyline points="${gF(X(1))},${gF(Y(Sut))} ${gF(X(1e3))},${gF(Y(f*Sut))} ${gF(X(1e6))},${gF(Y(Se))} ${gF(X(1e7))},${gF(Y(Se))}" fill="none" stroke="#7d5014" stroke-width="2.4"/>`;
  g+=gL(40,Y(f*Sut),X(1e3),Y(f*Sut),`stroke="#999" stroke-dasharray="4 3"`)+gL(40,Y(Se),X(1e6),Y(Se),`stroke="#999" stroke-dasharray="4 3"`);
  g+=gT(34,Y(Sut)+5,gSub("S","ut"),`text-anchor="end" font-size="15"`)+gT(34,Y(f*Sut)+5,`${gI("f")}${gSub("S","ut")}`,`text-anchor="end" font-size="15"`)+gT(34,Y(Se)+5,gSub("S","e"),`text-anchor="end" font-size="15"`);
  if(mark) g+=`<circle cx="${gF(X(mark[0]))}" cy="${gF(Y(mark[1]))}" r="5" fill="#aa1e28"/>`;
  g+=gT(500,292,`Cycles ${gI("N")}`,`text-anchor="end" font-size="15"`)+gT(48,26,`Fatigue strength ${gI("S")}<tspan baseline-shift="sub" font-size="12">f</tspan> (log scale)`,`font-size="15"`);
  return gSvg("-30 0 560 305",g,300);
}

// ===== 1. shaft diameter from DE-Goodman, DE-Gerber, DE-ASME elliptic and DE-Soderberg
function ddSolve(p){const c=p.us?1:1000, A=Math.sqrt(4*(p.Kf*p.Ma*c)**2+3*(p.Kfs*p.Ta*c)**2), B=Math.sqrt(4*(p.Kf*p.Mm*c)**2+3*(p.Kfs*p.Tm*c)**2), n=p.n, Se=p.Se*(p.us?1000:1), Su=p.Su*(p.us?1000:1), Sy=p.Sy*(p.us?1000:1);
  const dG=(16*n/Math.PI*(A/Se+B/Su))**(1/3), dS=(16*n/Math.PI*(A/Se+B/Sy))**(1/3), dR=(8*n*A/(Math.PI*Se)*(1+Math.sqrt(1+(2*B*Se/(A*Su))**2)))**(1/3);
  const dE=(16*n/Math.PI*Math.sqrt(4*(p.Kf*p.Ma*c/Se)**2+3*(p.Kfs*p.Ta*c/Se)**2+4*(p.Kf*p.Mm*c/Sy)**2+3*(p.Kfs*p.Tm*c/Sy)**2))**(1/3);
  return {A,B,dG,dS,dR,dE}}
function ddGenerate(seed){const r=mulberry32(seed);
  for(let k=0;k<5000;k++){const us=r()<0.4,st=us?1:5,Su=us?pick(r,range(60,180,5)):pick(r,range(400,1200,25)),p={us,Su,Sy:Math.round(Su*(0.6+0.3*r())/st)*st,Se:Math.round(Su*(0.25+0.15*r())/st)*st,
      Kf:pick(r,[1.5,1.7,1.9,2.0,2.2,2.5]),Kfs:pick(r,[1.3,1.5,1.6,1.8,2.0]),n:pick(r,[1.5,2,2.5,3])};
    const v=()=>us?pick(r,range(0,6000,100)):pick(r,range(0,600,5)); p.Ma=v();p.Ta=r()<0.6?0:v();p.Mm=r()<0.6?0:v();p.Tm=v();
    if(!p.Ma&&!p.Ta) continue; if(!p.Mm&&!p.Tm) continue;
    const s=ddSolve(p); if(us?(s.dG<0.4||s.dG>4):(s.dG<10||s.dG>100)) continue; return {p,s}}}
function ddStatement(p,s){const M=p.us?"lbf·in":"N·m",u=p.us?"kpsi":"MPa";
  return `<p>At a critical shoulder, a rotating shaft carries M<sub>a</sub> = ${fmt(p.Ma)} ${M}, T<sub>a</sub> = ${fmt(p.Ta)} ${M}, M<sub>m</sub> = ${fmt(p.Mm)} ${M} and T<sub>m</sub> = ${fmt(p.Tm)} ${M}. For the shaft, S<sub>ut</sub> = ${fmt(p.Su)} ${u}, S<sub>y</sub> = ${fmt(p.Sy)} ${u}, and a fully corrected endurance limit S<sub>e</sub> = ${fmt(p.Se)} ${u} is assumed. Let K<sub>f</sub> = ${p.Kf} and K<sub>fs</sub> = ${p.Kfs}.</p>
  <p>With a design factor of ${fmt(p.n,1)}, find the minimum acceptable diameter using the DE-Goodman, DE-Gerber, DE-ASME elliptic and DE-Soderberg criteria.</p>`}
function ddFigure(p,s){let g=`<rect x="60" y="80" width="200" height="56" ${G_PART}/><rect x="260" y="92" width="200" height="32" ${G_PART}/>`+gL(30,108,490,108,G_CL);
  g+=`<path d="M258,80 Q262,92 268,92" fill="none" stroke="#aa1e28" stroke-width="0"/>`+`<circle cx="262" cy="92" r="9" fill="none" stroke="#28405a" stroke-width="1.4" stroke-dasharray="3 2"/>`+gT(275,76,"critical shoulder",`font-size="15"`);
  g+=`<path d="M40,60 A30,40 0 0,0 40,156" fill="none" stroke="#aa1e28" stroke-width="2.6" marker-end="url(#g-ar)"/><path d="M480,156 A30,40 0 0,0 480,60" fill="none" stroke="#aa1e28" stroke-width="2.6" marker-end="url(#g-ar)"/>`+gT(20,50,gI("M"),`fill="#aa1e28"`)+gT(488,50,gI("M"),`fill="#aa1e28"`);
  g+=`<path d="M150,62 A12,30 0 1,0 150,154" fill="none" stroke="#28405a" stroke-width="2.4" marker-end="url(#g-ar)"/>`+gT(150,186,gI("T"),`text-anchor="middle" fill="#28405a"`)+gL(360,124,380,160,`stroke="#222" stroke-width="0.9"`)+gT(384,172,gI("d"));
  return gSvg("0 30 520 170",g,220)}
function ddSolution(p,s){const L=p.us?"in":"mm",d=p.us?3:1;
  return `<h3>1. Combined moments</h3><p>With moments in ${p.us?"lbf·in":"N·mm"}: <span class="eq">A = √[4(K<sub>f</sub>M<sub>a</sub>)² + 3(K<sub>fs</sub>T<sub>a</sub>)²] = ${fmt(s.A)}</span>&nbsp; <span class="eq">B = √[4(K<sub>f</sub>M<sub>m</sub>)² + 3(K<sub>fs</sub>T<sub>m</sub>)²] = ${fmt(s.B)}</span></p>
  <h3>2. Diameters</h3><table><tr><th>Criterion</th><th>Formula</th><th>d (${L})</th></tr>
  <tr><td>DE-Goodman</td><td>[(16n/π)(A/S<sub>e</sub> + B/S<sub>ut</sub>)]<sup>1/3</sup></td><td>${fmt(s.dG,d)}</td></tr>
  <tr><td>DE-Gerber</td><td>{(8nA/(πS<sub>e</sub>))[1 + √(1 + (2BS<sub>e</sub>/(AS<sub>ut</sub>))²)]}<sup>1/3</sup></td><td>${fmt(s.dR,d)}</td></tr>
  <tr><td>DE-ASME elliptic</td><td>{(16n/π)[4(K<sub>f</sub>M<sub>a</sub>/S<sub>e</sub>)² + 3(K<sub>fs</sub>T<sub>a</sub>/S<sub>e</sub>)² + 4(K<sub>f</sub>M<sub>m</sub>/S<sub>y</sub>)² + 3(K<sub>fs</sub>T<sub>m</sub>/S<sub>y</sub>)²]<sup>1/2</sup>}<sup>1/3</sup></td><td>${fmt(s.dE,d)}</td></tr>
  <tr><td>DE-Soderberg</td><td>[(16n/π)(A/S<sub>e</sub> + B/S<sub>y</sub>)]<sup>1/3</sup></td><td>${fmt(s.dS,d)}</td></tr></table>
  <p class="note">Soderberg is the most conservative, then Goodman; Gerber is the least conservative. The ASME ellipse usually falls between Goodman and Gerber.</p>`}

// ===== 2. fatigue and yield check at a shaft shoulder (Marin factors computed)
const SC_MAT=[["AISI 1018 CD",440,370,64,54],["AISI 1020 CD",470,390,68,57],["AISI 1030 HR",470,260,68,37.5],["AISI 1035 CD",550,460,80,67],["AISI 1040 CD",590,490,85,71],["AISI 1050 CD",690,580,100,84]];
function scSolve(p){const m=SC_MAT[p.mat],Su=p.us?m[3]:m[1],Sy=p.us?m[4]:m[2],S0=faSe0(Su,p.us),ka=faKa("Machined or cold-drawn",Su,p.us),kb=faKb(p.d,p.us),Se=ka*kb*S0;
  const Kf=1+p.q*(p.Kt-1),Kfs=1+p.qs*(p.Kts-1),c=p.us?1/1000:1000, K=p.us?1:1;
  const z=Math.PI*p.d**3, sa=Kf*32*p.Ma*(p.us?1:1000)/z/(p.us?1000:1), sm=Kf*32*p.Mm*(p.us?1:1000)/z/(p.us?1000:1), ta=Kfs*16*p.Ta*(p.us?1:1000)/z/(p.us?1000:1), tm=Kfs*16*p.Tm*(p.us?1:1000)/z/(p.us?1000:1);
  const va=Math.hypot(sa,Math.sqrt(3)*ta), vm=Math.hypot(sm,Math.sqrt(3)*tm), vx=Math.hypot(sa+sm,Math.sqrt(3)*(ta+tm));
  return {m,Su,Sy,S0,ka,kb,Se,Kf,Kfs,sa,sm,ta,tm,va,vm,vx,nG:faGood(va,vm,Se,Su),nA:faAsme(va,vm,Se,Sy),nR:faGerb(va,vm,Se,Su),ny:Sy/vx}}
function scGenerate(seed){const r=mulberry32(seed);
  for(let k=0;k<5000;k++){const us=r()<0.4,p={us,mat:Math.floor(r()*SC_MAT.length),Kt:pick(r,[1.6,1.8,2.0,2.2,2.5,2.7]),Kts:pick(r,[1.4,1.5,1.7,2.0,2.2]),q:pick(r,[0.75,0.8,0.85,0.9]),qs:pick(r,[0.8,0.85,0.9,0.95])};
    p.d=us?pick(r,range(0.75,2.5,0.125)):pick(r,range(20,60,5));const v=()=>us?pick(r,range(200,8000,100)):pick(r,range(20,900,10));
    p.Ma=v();p.Mm=0;p.Ta=0;p.Tm=v();if(r()<0.3){p.Ta=Math.round(p.Tm*0.2/(us?10:1))*(us?10:1)}
    const s=scSolve(p); if(s.nG<1.1||s.nG>4) continue; return {p,s}}}
function scStatement(p,s){const L=p.us?"in":"mm",M=p.us?"lbf·in":"N·m";
  return `<p>A rotating ${s.m[0]} steel shaft, machined all over, is ${fmt(p.d,p.us?3:0)} ${L} in diameter at a shoulder fillet where it carries a completely reversed bending moment of ${fmt(p.Ma)} ${M} (from rotation) and a torque with steady part ${fmt(p.Tm)} ${M}${p.Ta?` and alternating part ${fmt(p.Ta)} ${M}`:""}. At the fillet K<sub>t</sub> = ${p.Kt}, K<sub>ts</sub> = ${p.Kts}, and the notch sensitivities are q = ${p.q} and q<sub>shear</sub> = ${p.qs}.</p>
  <p>Using S′<sub>e</sub> = 0.5S<sub>ut</sub> with the machined surface factor and the rotating-bending size factor, find the endurance limit, the von Mises alternating and mean stresses, the fatigue factors of safety by DE-Goodman and DE-ASME elliptic, and the yield factor of safety.</p>
  ${gMatTable(SC_MAT.map(m=>[m[0],p.us?m[3]:m[1],p.us?m[4]:m[2]]),p.us,["S<sub>ut</sub>","S<sub>y</sub>"])}`}
function scFigure(p,s){let g=`<rect x="60" y="70" width="220" height="80" ${G_PART}/><rect x="280" y="86" width="220" height="48" ${G_PART}/>`+gL(30,110,530,110,G_CL);
  g+=`<path d="M280,86 Q280,78 270,70" fill="none" stroke="#7d5014" stroke-width="1.8"/>`+gL(282,84,320,40,`stroke="#222" stroke-width="0.9"`)+gT(324,38,`fillet: ${gSub("K","t")} = ${p.Kt}, ${gSub("K","ts")} = ${p.Kts}`,`font-size="15"`);
  g+=gL(380,134,400,170,`stroke="#222" stroke-width="0.9"`)+gT(404,182,`${gI("d")} = ${fmt(p.d,p.us?3:0)} ${p.us?"in":"mm"}`,`font-size="15"`);
  g+=gT(120,190,`${gSub("M","a")} = ${fmt(p.Ma)} ${p.us?"lbf·in":"N·m"} (rotating),  ${gSub("T","m")} = ${fmt(p.Tm)}${p.Ta?`, ${gSub("T","a")} = ${fmt(p.Ta)}`:""}`,`font-size="15"`);
  return gSvg("0 20 600 185",g,220)}
function scSolution(p,s){const u=faU(p.us),d=p.us?2:1;

  g+=gL(-R,8,-R,R+40,G_EXT)+gL(R,8,R,R+40,G_EXT)+gL(-R,R+32,R,R+32,G_DIM)+gT(0,R+26,`${fmt(p.do)} OD`,`text-anchor="middle" class="halo"`);
  g+=gL(0,0,ri*0.707,-ri*0.707,`stroke="#222" stroke-width="0.9" marker-end="url(#g-dm)"`)+gT(ri*0.707+8,-ri*0.707-6,`${fmt(p.d)} shaft`,`class="halo"`);
  g+=gT(R+20,-R+10,"hub",`font-size="15"`)+gT(R+150,R+62,`Dimensions in mm; hub length ${fmt(p.l)}`,`text-anchor="end" font-size="14"`);
  return gSvg(`${-R-50} ${-R-40} ${2*R+220} ${2*R+120}`,g,300)}
function pfSolution(p,s){return `<h3>1. Pressure</h3><p>For a solid shaft and a hub of the same material, <span class="eq">p = (Eδ/(2d))[1 − (d/d<sub>o</sub>)²]</span> with δ the diametral interference.</p>
  <p class="final">p<sub>min</sub> = ${fmt(s.pmin,1)} MPa (δ = ${p.imin} μm), p<sub>max</sub> = ${fmt(s.pmax,1)} MPa (δ = ${p.imax} μm)</p>
  <h3>2. Yield at assembly (worst case, p<sub>max</sub>)</h3><p>Hub bore: <span class="eq">σ<sub>t</sub> = p(d<sub>o</sub>² + d²)/(d<sub>o</sub>² − d²) = ${fmt(s.hubT,1)} MPa</span>, σ<sub>r</sub> = −p; <span class="eq">σ′ = ${fmt(s.vh,1)} MPa</span>. Solid shaft: σ<sub>t</sub> = σ<sub>r</sub> = −p, so σ′ = p.</p>
  <p class="final">n<sub>hub</sub> = ${fmt(s.nh,2)}, n<sub>shaft</sub> = ${fmt(s.ns,2)}</p>
  <h3>3. Torque capacity (p<sub>min</sub>)</h3><p><span class="eq">T = (π/2)fpld²</span></p><p class="final">T = ${fmt(s.T,1)} N·m</p>`}
const add2=(a,b)=>[a[0]+b[0],a[1]+b[1]];
// ===== template registry: each entry has the same interface
const TEMPLATES={
  "de-diameter":{ name:"Shaft diameter: DE-Goodman, DE-Gerber, DE-ASME elliptic, DE-Soderberg",
    generate:ddGenerate, figure:ddFigure, solution:ddSolution, statement:ddStatement,
    get fields(){const u=cur&&cur.p.us?"in":"mm";return [{id:"dG",label:"d, DE-Goodman",unit:u},{id:"dR",label:"d, DE-Gerber",unit:u},{id:"dE",label:"d, DE-ASME elliptic",unit:u},{id:"dS",label:"d, DE-Soderberg",unit:u}]},
    truth:s=>({dG:s.dG,dR:s.dR,dE:s.dE,dS:s.dS}), note:"Diameters before rounding to a standard size." },
  "shoulder-check":{ name:"Fatigue and yield check at a shaft shoulder",
    generate:scGenerate, figure:scFigure, solution:scSolution, statement:scStatement,
    get fields(){const u=cur&&cur.p.us?"kpsi":"MPa";return [{id:"Se",label:"Endurance limit S<sub>e</sub>",unit:u},{id:"va",label:"σ′<sub>a</sub>",unit:u},{id:"vm",label:"σ′<sub>m</sub>",unit:u},
      {id:"nG",label:"n, DE-Goodman",unit:""},{id:"nA",label:"n, DE-ASME elliptic",unit:""},{id:"ny",label:"Yield factor of safety",unit:""}]},
    truth:s=>({Se:s.Se,va:s.va,vm:s.vm,nG:s.nG,nA:s.nA,ny:s.ny}), note:"Stresses in the units of the problem." },
  "critical-speed":{ name:"Critical speed of a uniform shaft and scaling (SI)",
    generate:cvGenerate2, figure:cvFigure2, solution:cvSolution2, statement:cvStatement2,
    fields:[{id:"N",label:"(a) First critical speed",unit:"rev/min"},{id:"dNew",label:"(b) New diameter",unit:"mm"},{id:"Nmodel",label:"(c) Critical speed of the model",unit:"rev/min"}],
    truth:s=>({N:s.N,dNew:s.dNew,Nmodel:s.Nmodel}), note:"Simply supported, uniform solid steel shaft." },
  "rayleigh":{ name:"Critical speed with two gears: Rayleigh and Dunkerley (SI)",
    generate:rlGenerate, figure:rlFigure, solution:rlSolution, statement:rlStatement,
    fields:[{id:"NL",label:"(a) Gears alone, Rayleigh",unit:"rev/min"},{id:"NS",label:"(b) Shaft alone",unit:"rev/min"},{id:"NC",label:"(c) Combination, Dunkerley",unit:"rev/min"}],
    truth:s=>({NL:s.NL,NS:s.NS,NC:s.NC}), note:"Speeds within 2% are accepted." },
  "square-key":{ name:"Square key: length for shear and for bearing",
    generate:kyGenerate, figure:kyFigure, solution:kySolution, statement:kyStatement,
    get fields(){const us=cur&&cur.p.us;return [{id:"F",label:"Force on the key",unit:us?"lbf":"N"},{id:"ls",label:"Length for shear",unit:us?"in":"mm"},{id:"lb",label:"Length for bearing",unit:us?"in":"mm"}]},
    truth:s=>({F:s.F,ls:s.ls,lb:s.lb}), note:"Force at the shaft surface; bearing on half the key height." },
  "iso-fit":{ name:"ISO limits and fits: hole and shaft limits, clearance (SI)",
    generate:ftGenerate, figure:ftFigure, solution:ftSolution, statement:ftStatement,
    fields:[{id:"Hmax",label:"Maximum hole diameter",unit:"mm",tolAbs:0.0005},{id:"smin",label:"Minimum shaft diameter",unit:"mm",tolAbs:0.0005},{id:"smax",label:"Maximum shaft diameter",unit:"mm",tolAbs:0.0005},
      {id:"cmax",label:"Largest clearance",unit:"μm",signed:true,tolAbs:0.6},{id:"cmin",label:"Smallest clearance (negative = interference)",unit:"μm",signed:true,tolAbs:0.6}],
    truth:s=>({Hmax:s.Hmax,smin:s.smin,smax:s.smax,cmax:s.cmax*1000,cmin:s.cmin*1000}), note:"Diameters to 0.001 mm; clearances in μm." },
  "press-fit":{ name:"Press-fitted hub: pressure, yield at assembly, torque capacity (SI)",
    generate:pfGenerate, figure:pfFigure, solution:pfSolution, statement:pfStatement,
    fields:[{id:"pmin",label:"Minimum pressure",unit:"MPa"},{id:"pmax",label:"Maximum pressure",unit:"MPa"},{id:"nh",label:"Factor of safety, hub",unit:""},{id:"ns",label:"Factor of safety, shaft",unit:""},{id:"T",label:"Torque without slipping",unit:"N·m"}],
    truth:s=>({pmin:s.pmin,pmax:s.pmax,nh:s.nh,ns:s.ns,T:s.T}), note:"Same E for hub and shaft; plane stress." }
};

// ===== page
let curKey="beam-tee", cur=null;
const $=id=>document.getElementById(id);

function render(key,seed){
  curKey=key; const T=TEMPLATES[key];
  cur=T.generate(seed); const {p,s}=cur;
  $("typeSel").value=key; $("seedIn").value=seed;
  try{history.replaceState(null,"","#"+key+"-"+seed)}catch(e){}
  $("fig").innerHTML=T.figure(p,s);
  $("statement").innerHTML=T.statement(p,s);
  const fields=T.fields.filter(f=>!(f.skip&&f.skip(p)));
  $("answers").innerHTML=fields.map(f=>`<label for="in-${f.id}">${f.label}</label><span>${f.choices
    ?`<select id="in-${f.id}"><option value="">choose</option>${f.choices.map(c=>`<option>${c}</option>`).join("")}</select>`
    :f.expr?`<input id="in-${f.id}" type="text" class="expr" spellcheck="false" autocomplete="off">`
    :`<input id="in-${f.id}" type="text" inputmode="decimal"> <span class="note">${f.unit}</span>`}</span><span class="mark" id="mk-${f.id}"></span>`).join("");
  $("ansNote").textContent=(T.symbolic?"Answers are checked for algebraic equivalence. ":"Answers within 2% are accepted. ")+T.note;
  const sol=$("solution"); sol.style.display="none"; sol.innerHTML=T.solution(p,s);
  $("solBtn").textContent="Show solution";
}

function check(){
  const T=TEMPLATES[curKey], truth=T.truth(cur.s);
  const scale=Math.max(...Object.values(truth).filter(v=>typeof v==="number").map(Math.abs));
  T.fields.filter(f=>!(f.skip&&f.skip(cur.p))).forEach(f=>{
    const el=$("mk-"+f.id), raw=$("in-"+f.id).value.replace(/,/g,"").trim();
    if(raw===""){el.textContent="";el.className="mark";return}
    if(f.choices){const ok=raw===truth[f.id];el.textContent=ok?"Correct":"Not yet";el.className="mark "+(ok?"ok":"bad");return}
    if(f.expr){const r=exprEquivalent(raw,f);el.textContent=r.ok?"Correct":r.msg?"Cannot read: "+r.msg:"Not yet";el.className="mark "+(r.ok?"ok":"bad");return}
    let v=parseFloat(raw), t=truth[f.id];
    if(!f.signed){v=Math.abs(v);t=Math.abs(t)}
    const tol=f.tolAbs!==undefined?f.tolAbs:0.02*Math.max(Math.abs(t),f.signed?0.05*scale:0);
    const ok=isFinite(v)&&Math.abs(v-t)<=tol;
    el.textContent=ok?"Correct":"Not yet"; el.className="mark "+(ok?"ok":"bad");
  });
}

const newSeed=()=>1+Math.floor(Math.random()*999999);
$("typeSel").innerHTML=Object.entries(TEMPLATES).map(([k,t])=>`<option value="${k}">${t.name}</option>`).join("");
$("typeSel").onchange=e=>render(e.target.value,newSeed());
$("newBtn").onclick=()=>render(curKey,newSeed());
$("loadBtn").onclick=()=>{const v=parseInt($("seedIn").value,10);if(v>0)render(curKey,v)};
$("checkBtn").onclick=check;
$("solBtn").onclick=e=>{const s=$("solution"),show=s.style.display!=="block";
  s.style.display=show?"block":"none";e.target.textContent=show?"Hide solution":"Show solution"};
(function(){
  const m=/^#([a-z-]+)-(\d+)$/.exec(location.hash);
  if(m&&TEMPLATES[m[1]]) render(m[1],parseInt(m[2],10));
  else render(Object.keys(TEMPLATES)[0],newSeed());
})();


</script>
