<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Structural Analysis and Machines Problem Generator</title>
<style>
  :root{
    --ink:#1f2328; --muted:#5b6470; --line:#d9dde3; --bg:#fbfaf7; --card:#ffffff;
    --load:#aa1e28; --accent:#1e5a32; --ok:#1e7a3c; --bad:#b3261e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.55 "Georgia","Times New Roman",serif}
  header{padding:22px 24px 8px;max-width:980px;margin:0 auto}
  h1{font-size:1.45rem;margin:0 0 4px;font-weight:600}
  .sub{color:var(--muted);font-family:system-ui,sans-serif;font-size:.9rem}
  main{max-width:980px;margin:0 auto;padding:8px 24px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:14px 0}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-family:system-ui,sans-serif;font-size:.9rem}
  button{font:inherit;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:7px;padding:7px 14px;cursor:pointer}
  button.ghost{background:#fff;color:var(--accent)}
  button:hover{filter:brightness(1.08)}
  input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:9em}
  label{color:var(--muted)}
  svg{width:100%;height:auto;display:block}
  .statement p{margin:.3em 0}
  .answers{display:grid;grid-template-columns:auto auto auto;gap:8px 12px;align-items:center;font-family:system-ui,sans-serif;font-size:.92rem}
  .mark{font-weight:600;min-width:7em}
  .mark.ok{color:var(--ok)} .mark.bad{color:var(--bad)}
  #solution{display:none}
  #solution h3{font-size:1.05rem;margin:1.1em 0 .3em}
  table{border-collapse:collapse;font-family:system-ui,sans-serif;font-size:.88rem;margin:.4em 0}
  td,th{border-bottom:1px solid var(--line);padding:4px 12px;text-align:right}
  th{color:var(--muted);font-weight:600}
  td:first-child,th:first-child{text-align:left}
  .eq{font-family:"Cambria Math","STIX Two Math",Georgia,serif;background:#f4f5f2;border-radius:6px;padding:6px 10px;display:inline-block;margin:3px 0}
  .note{color:var(--muted);font-size:.92rem}
  .final{font-weight:600}
  @media (max-width:640px){.answers{grid-template-columns:1fr 1fr}.answers .mark{grid-column:span 2}}
  select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;max-width:100%}
  .answers input{width:8em}
  .halo{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
</style>
</head>
<body>
<header>
  <h1>Structural Analysis and Machines Problem Generator</h1>
  <div class="sub">Each problem is generated from a seed and solved exactly in the browser. Share the seed to reproduce a problem.</div>
</header>
<main>
  <div class="card bar">
    <label for="typeSel">Problem type</label><select id="typeSel"></select>
  </div>
  <div class="card bar">
    <button id="newBtn">New problem</button>
    <label for="seedIn">Seed</label><input id="seedIn" type="number" min="1" step="1">
    <button class="ghost" id="loadBtn">Load seed</button>
  </div>
  <div class="card"><div id="fig"></div></div>
  <div class="card statement" id="statement"></div>
  <div class="card">
    <div class="answers" id="answers"></div>
    <div class="bar" style="margin-top:12px">
      <button id="checkBtn">Check answers</button>
      <button class="ghost" id="solBtn">Show solution</button>
      <span class="note" id="ansNote"></span>
    </div>
  </div>
  <div class="card" id="solution"></div>
</main>
<script>

// ----- seeded random numbers
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pick=(r,arr)=>arr[Math.floor(r()*arr.length)];
const range=(a,b,s)=>{const o=[];for(let v=a;v<=b+1e-9;v+=s)o.push(+v.toFixed(4));return o};

// ----- helpers
const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
const cs=d=>Math.cos(rad(d)), sn=d=>Math.sin(rad(d));
const sub=(a,b)=>a.map((x,i)=>x-b[i]);
const nrm=a=>Math.hypot(...a);
const unit=a=>{const n=nrm(a);return a.map(x=>x/n)};
const det3=m=>m[0][0]*(m[1][1]*m[2][2]-m[1][2]*m[2][1])-m[0][1]*(m[1][0]*m[2][2]-m[1][2]*m[2][0])+m[0][2]*(m[1][0]*m[2][1]-m[1][1]*m[2][0]);
function solve3(M,b){const D=det3(M);return [0,1,2].map(j=>{const X=M.map((row,i)=>row.map((v,k)=>k===j?b[i]:v));return det3(X)/D})}

function fmt(v,d=0){if(Math.abs(v)<0.5*10**-d)v=0;return Number(v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d})}
const sig=(x,n=4)=>{if(Math.abs(x)<1e-9)return "0";const d=Math.max(0,n-1-Math.floor(Math.log10(Math.abs(x))));return Number(x).toFixed(Math.min(d,8)).replace("-","−")};
const fv=(v,n=4)=>"("+v.map(x=>sig(x,n)).join(", ")+")";
const ang=t=>sig(t,3).replace(/\.0+$/,"")+"°";
const FU=p=>p.us?"lbf":"N", LU=p=>p.us?"ft":"m", SU=p=>p.us?"in":"mm", KU=p=>p.us?"lbf/in":"N/mm";
const eq=s=>`<span class="eq">${s}</span>`;
const it=v=>`<tspan font-style="italic">${v}</tspan>`;
const sb=(a,b)=>`${it(a)}<tspan baseline-shift="sub" font-size="12">${b}</tspan>`;

// ----- figure toolkit
const COL={k:"#222",r:"#aa1e28",b:"#2b5d8a",g:"#1e5a32",m:"#7d5014",x:"#888"};
function draw(els,W=560,H=340){
  const pts=[];els.forEach(e=>{[e.a,e.b,e.p].forEach(q=>q&&pts.push(q));(e.pts||[]).forEach(q=>pts.push(q));
    if(e.t==="arc"){pts.push([e.p[0]+e.r,e.p[1]+e.r],[e.p[0]-e.r,e.p[1]-e.r])}});
  const x0=Math.min(...pts.map(q=>q[0])),x1=Math.max(...pts.map(q=>q[0])),y0=Math.min(...pts.map(q=>q[1])),y1=Math.max(...pts.map(q=>q[1]));
  const mx=90,my=50,s=Math.min((W-2*mx)/Math.max(x1-x0,1e-6),(H-2*my)/Math.max(y1-y0,1e-6));
  const X=q=>mx+(q[0]-x0)*s+(W-2*mx-(x1-x0)*s)/2, Y=q=>H-my-(q[1]-y0)*s-(H-2*my-(y1-y0)*s)/2, f1=v=>v.toFixed(1);
  let o=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="Georgia,serif" font-size="16" style="max-height:${H+40}px"><defs>`;
  for(const k in COL)o+=`<marker id="vx${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="${k==="r"?5:6}" markerHeight="${k==="r"?5:6}" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 z" fill="${COL[k]}"/></marker>`;
  o+=`<marker id="vxd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#222"/></marker></defs>`;
  els.forEach(e=>{
    const c=e.c||"k";
    if(e.t==="pt"){const px=X(e.p),py=Y(e.p);o+=`<circle cx="${f1(px)}" cy="${f1(py)}" r="${e.r||3.6}" fill="${COL[c]}"/>`;
      if(e.l)o+=`<text x="${f1(px+(e.dx??8))}" y="${f1(py+(e.dy??-8))}" text-anchor="${e.an||"start"}" class="halo">${e.l}</text>`;return}
    if(e.t==="txt"){o+=`<text x="${f1(X(e.p))}" y="${f1(Y(e.p))}" text-anchor="${e.an||"middle"}" class="halo">${e.l}</text>`;return}
    if(e.t==="poly"){o+=`<polygon points="${e.pts.map(q=>f1(X(q))+","+f1(Y(q))).join(" ")}" fill="${e.fill||"#eec878"}" stroke="#7d5014" stroke-width="1.6"/>`;return}
    if(e.t==="pulley"){const px=X(e.p),py=Y(e.p);o+=`<circle cx="${f1(px)}" cy="${f1(py)}" r="${e.r||12}" fill="#fff" stroke="#222" stroke-width="1.8"/><circle cx="${f1(px)}" cy="${f1(py)}" r="2.5" fill="#222"/>`;return}
    if(e.t==="arc"){const n=[];for(let t=e.t0;t<=e.t1+1e-6;t+=2)n.push(f1(X([e.p[0]+e.r*cs(t),0]))+","+f1(Y([0,e.p[1]+e.r*sn(t)])));
      o+=`<polyline points="${n.join(" ")}" fill="none" stroke="#222" stroke-width="1.1"/>`;
      if(e.l){const m=(e.t0+e.t1)/2,rr=e.r+(e.lr||0)/s;o+=`<text x="${f1(X([e.p[0]+rr*cs(m),0])+(cs(m)>=0?6:-6))}" y="${f1(Y([0,e.p[1]+rr*sn(m)])+5)}" text-anchor="${cs(m)>=0?"start":"end"}" font-size="14" class="halo">${e.l}</text>`}return}
    const ax=X(e.a),ay=Y(e.a),bx=X(e.b),by=Y(e.b),dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy)||1;
    if(e.t==="hatch"){const sd=e.side||1,nx=-dy/L*sd,ny=dx/L*sd,ux=dx/L,uy=dy/L;
      o+=`<line x1="${f1(ax)}" y1="${f1(ay)}" x2="${f1(bx)}" y2="${f1(by)}" stroke="#222" stroke-width="2.2"/>`;
      for(let d=4;d<L;d+=9){const qx=ax+ux*d,qy=ay+uy*d;o+=`<line x1="${f1(qx)}" y1="${f1(qy)}" x2="${f1(qx+nx*9+ux*7)}" y2="${f1(qy+ny*9+uy*7)}" stroke="#555" stroke-width="1"/>`}return}
    if(e.t==="spring"){const ux=dx/L,uy=dy/L,nx=-uy,ny=ux,a=Math.min(.16*L,22),n=9,cl=L-2*a,P=[[ax,ay],[ax+ux*a,ay+uy*a]];
      for(let i=0;i<n;i++){const d=a+cl*(i+.5)/n,sg=i%2?-1:1;P.push([ax+ux*d+nx*8*sg,ay+uy*d+ny*8*sg])}
      P.push([bx-ux*a,by-uy*a],[bx,by]);o+=`<polyline points="${P.map(q=>f1(q[0])+","+f1(q[1])).join(" ")}" fill="none" stroke="#464b55" stroke-width="2"/>`;return}
    if(e.t==="dim"){o+=`<line x1="${f1(ax)}" y1="${f1(ay)}" x2="${f1(bx)}" y2="${f1(by)}" stroke="#222" stroke-width="0.9" marker-start="url(#vxd)" marker-end="url(#vxd)"/>`;
      if(e.l){let nx=-dy/L,ny=dx/L;if(e.flip){nx=-nx;ny=-ny}o+=`<text x="${f1((ax+bx)/2+nx*13)}" y="${f1((ay+by)/2+ny*13+5)}" text-anchor="middle" class="halo">${e.l}</text>`}return}
    const head=e.t==="ln"?"":` marker-end="url(#vx${c})"`;
    o+=`<line x1="${f1(ax)}" y1="${f1(ay)}" x2="${f1(bx)}" y2="${f1(by)}" stroke="${COL[c]}" stroke-width="${e.w||(c==="r"||c==="b"||c==="g"?2.6:1.4)}" ${e.d?'stroke-dasharray="5 4"':""}${head}/>`;
    if(e.l&&e.mid){const mxp=(ax+bx)/2,myp=(ay+by)/2;let nx=-dy/L,ny=dx/L;if(ny>0){nx=-nx;ny=-ny}
      o+=`<text x="${f1(mxp+nx*16)}" y="${f1(myp+ny*16+5)}" text-anchor="${nx>.3?"start":nx<-.3?"end":"middle"}" fill="${COL[c]}" class="halo">${e.l}</text>`}
    else if(e.l){const ux=dx/L,uy=dy/L,an=Math.abs(ux)<.3?"middle":ux>0?"start":"end";
      o+=`<text x="${f1(bx+ux*(e.off??12))}" y="${f1(by+uy*(e.off??12)+(uy>.5?14:uy<-.5?-2:5))}" text-anchor="${an}" fill="${COL[c]}" class="halo">${e.l}</text>`}
  });
  return o+"</svg>";
}
const P3=q=>[q[1]-0.42*q[0],q[2]-0.3*q[0]];
function axes3(pts){const e=Math.max(2,...pts.flat().map(Math.abs))+1.2;
  return [["x",[e,0,0]],["y",[0,e,0]],["z",[0,0,e]]].map(([n,v])=>({a:P3([0,0,0]),b:P3(v),l:`<tspan font-style="italic">${n}</tspan>`,c:"x",d:1,w:1.1,off:10}))}
const lab3=(n,q,dx,dy,an)=>({t:"pt",p:P3(q),l:`<tspan font-style="italic">${n}</tspan>(${q.join(", ")})`,dx,dy,an});
const sk3=(pts,extra)=>draw([...axes3(pts),...extra],580,380);
const Wl=(p,n="W")=>`${it(n)} = ${p.W??p.F} ${FU(p)}`;

const thArc=(P,th,r0)=>({t:"arc",p:P,r:r0,t0:th>180?th-360:0,t1:th>180?0:th,l:ang(th)});
// ----- templates
const crs=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const MU=p=>p.us?"lbf·ft":"N·m";
const ri=(r,a,b)=>a+Math.floor(r()*(b-a+1));
const sbt=(a,b)=>`<tspan font-style="italic">${a}</tspan><tspan baseline-shift="sub" font-size="12">${b}</tspan>`;
const TC=v=>Math.abs(v)<1e-9?"zero force":v>0?"tension":"compression";
const TEMPLATES={};
const pinS=(x,y,k)=>[{t:"poly",pts:[[x,y],[x-.45*k,y-.8*k],[x+.45*k,y-.8*k]]},{t:"hatch",a:[x-.8*k,y-.8*k],b:[x+.8*k,y-.8*k],side:1}];
const rollS=(x,y,k)=>[{t:"pulley",p:[x,y-.3*k],r:7},{t:"hatch",a:[x-.8*k,y-.62*k],b:[x+.8*k,y-.62*k],side:1}];
function trussEls(N,M,s){const e=[];
  M.forEach(([a,b])=>e.push({a:N[a],b:N[b],c:"m",t:"ln",w:4}));
  const xs=Object.values(N).map(q=>q[0]),x0=Math.min(...xs),x1=Math.max(...xs);
  Object.entries(N).forEach(([n,q])=>{const top=q[1]>0.01,edge=q[0]<=x0+1e-9?-1:q[0]>=x1-1e-9?1:0;
    e.push({t:"pt",p:q,l:it(n),dx:top?10:edge*16,dy:top?-12:edge?20:24,an:top?"start":edge<0?"end":edge>0?"start":"middle",r:4})});
  return e}
const dnArrow=(x,y,s,lbl,below,ex=0)=>below?[{a:[x,y-.05*s],b:[x,y-1.5*s],c:"r"},{t:"txt",p:[x,y-1.95*s-ex*s],l:lbl}]:[{a:[x,y+1.5*s],b:[x,y+.12*s],c:"r"},{t:"txt",p:[x,y+1.85*s],l:lbl}];
const hArrow=(x,y,s,H,lbl)=>[{a:[H>0?x-1.8*s:x+1.8*s,y],b:[x,y],c:"r"},{t:"txt",p:[H>0?x-1.8*s:x+1.8*s,y+1.0*s],l:lbl,an:H>0?"end":"start"}];
const dimsB=(xs,y,p,sc)=>xs.slice(1).map((x,i)=>({t:"dim",a:[xs[i],y],b:[x,y],l:`${+(x-xs[i]).toFixed(2)} ${LU(p)}`,flip:1}));

// 1. simple triangular truss: method of joints
TEMPLATES["truss-triangle"]={
  name:"Triangular truss: reactions and method of joints",
  generate(seed){const r=mulberry32(seed);
    for(let k=0;k<5000;k++){
      const L=ri(r,6,12),p={us:r()<.5,L,xc:ri(r,2,L-2),h:ri(r,3,7),P:pick(r,range(200,1500,50)),th:pick(r,range(230,310,5))};
      const Px=p.P*cs(p.th),Py=p.P*sn(p.th),By=-(p.xc*Py-p.h*Px)/L,Ax=-Px,Ay=-Py-By;
      const L1=Math.hypot(p.xc,p.h),L2=Math.hypot(L-p.xc,p.h);
      // joint C: F_AC*(-xc,-h)/L1 + F_BC*(L-xc,-h)/L2 + P = 0
      const a11=-p.xc/L1,a12=(L-p.xc)/L2,a21=-p.h/L1,a22=-p.h/L2,D=a11*a22-a12*a21;
      const FAC=(-Px*a22+a12*Py)/D,FBC=(-a11*Py+a21*Px)/D;
      const FAB=-(Ax+FAC*p.xc/L1);
      const tot=p.P;
      if([FAC,FBC,FAB,Ay,By].some(v=>Math.abs(v)<.05*tot)) continue;
      return {p,s:{Ax,Ay,By,FAC,FBC,FAB,L1,L2,Px,Py}};}
    throw new Error("no valid problem");},
  statement:p=>`<p>A triangular truss has pin support <i>A</i> at the left end and roller support <i>B</i> ${p.L} ${LU(p)} to the right of <i>A</i>, both at the same level. Joint <i>C</i> is ${p.xc} ${LU(p)} to the right of <i>A</i> and ${p.h} ${LU(p)} above the line <i>AB</i>. A force <i>P</i> = ${p.P} ${FU(p)} acts on joint <i>C</i> at ${p.th}° counterclockwise from the positive <i>x</i> axis. Neglect the weights of the members. Determine the support reactions (right and up positive) and the force in each member using the method of joints. Report member forces with tension positive and compression negative.</p>`,
  figure:p=>{const N={A:[0,0],B:[p.L,0],C:[p.xc,p.h]},s=p.L/8,dx=cs(p.th),dy=sn(p.th),e=trussEls(N,[["A","B"],["A","C"],["B","C"]],s);
    e.forEach(z=>{if(z.l===it("C")&&dx<0){z.dx=-10;z.an="end"}});
    e.push(...pinS(0,0,s),...rollS(p.L,0,s),{a:[p.xc-2.2*s*dx,p.h-2.2*s*dy],b:N.C,c:"r"},{t:"txt",p:[p.xc-2.2*s*dx,p.h-2.2*s*dy+(dy<0?.5*s:-.9*s)],l:`${it("P")} = ${p.P} ${FU(p)}`},thArc(N.C,p.th,s*1.2),
      {a:N.C,b:[p.xc+2*s,p.h],t:"ln",c:"x",d:1,w:1},...dimsB([0,p.xc,p.L].filter((v,i,a)=>a.indexOf(v)===i),-2.4*s,p),{t:"dim",a:[p.L+1.2*s,0],b:[p.L+1.2*s,p.h],l:`${p.h} ${LU(p)}`});
    return draw(e,620,360)},
  solution:(p,s)=>`<h3>1. Support reactions</h3>
  <p>The components of <i>P</i> are <i>P<sub>x</sub></i> = ${sig(s.Px)} ${FU(p)} and <i>P<sub>y</sub></i> = ${sig(s.Py)} ${FU(p)}. Moments about <i>A</i> (counterclockwise positive):</p>
  <p>${eq(`ΣM<sub>A</sub> = 0: ${p.L}B<sub>y</sub> + ${p.xc}(${sig(s.Py)}) &minus; ${p.h}(${sig(s.Px)}) = 0`)} so ${eq(`B<sub>y</sub> = ${sig(s.By)} ${FU(p)}`)}</p>
  <p>${eq(`A<sub>x</sub> = &minus;P<sub>x</sub> = ${sig(s.Ax)} ${FU(p)}`)} ${eq(`A<sub>y</sub> = &minus;P<sub>y</sub> &minus; B<sub>y</sub> = ${sig(s.Ay)} ${FU(p)}`)}</p>
  <h3>2. Joint C (two unknowns)</h3>
  <p>The member lengths are <i>L<sub>AC</sub></i> = ${sig(s.L1)} ${LU(p)} and <i>L<sub>BC</sub></i> = ${sig(s.L2)} ${LU(p)}. Assume both members are in tension, so each pulls joint <i>C</i> toward its other end.</p>
  <p>${eq(`ΣF<sub>x</sub> = 0: F<sub>AC</sub>(&minus;${p.xc}/${sig(s.L1)}) + F<sub>BC</sub>(${p.L-p.xc}/${sig(s.L2)}) + ${sig(s.Px)} = 0`)}</p>
  <p>${eq(`ΣF<sub>y</sub> = 0: F<sub>AC</sub>(&minus;${p.h}/${sig(s.L1)}) + F<sub>BC</sub>(&minus;${p.h}/${sig(s.L2)}) + ${sig(s.Py)} = 0`)}</p>
  <p>${eq(`F<sub>AC</sub> = ${sig(s.FAC)} ${FU(p)}`)} (${TC(s.FAC)}) ${eq(`F<sub>BC</sub> = ${sig(s.FBC)} ${FU(p)}`)} (${TC(s.FBC)})</p>
  <h3>3. Joint A</h3>
  <p>${eq(`ΣF<sub>x</sub> = 0: A<sub>x</sub> + F<sub>AC</sub>(${p.xc}/${sig(s.L1)}) + F<sub>AB</sub> = 0`)} so ${eq(`F<sub>AB</sub> = ${sig(s.FAB)} ${FU(p)}`)} (${TC(s.FAB)})</p>
  <p class="final">A<sub>x</sub> = ${sig(s.Ax,3)}, A<sub>y</sub> = ${sig(s.Ay,3)}, B<sub>y</sub> = ${sig(s.By,3)} ${FU(p)}; F<sub>AC</sub> = ${sig(s.FAC,3)}, F<sub>BC</sub> = ${sig(s.FBC,3)}, F<sub>AB</sub> = ${sig(s.FAB,3)} ${FU(p)}.</p>`,

    return draw(e,600,320)},
  solution:(p,s)=>`<h3>1. Free body diagram of one handle</h3>
  <p>Each handle is a lever acted on by the hand force <i>P</i>, the force <i>Q</i> from the object, and the pin force <i>R</i>. The hand force and the force from the object act in the same direction on opposite sides of the pin, and the pin force balances both.</p>
  <h3>2. Moments about the pin</h3>
  <p>${eq(`ΣM<sub>pin</sub> = 0: P(${p.a}) &minus; Q(${p.b}) = 0`)} so ${eq(`Q = P(${p.a})/${p.b}`)}${p.mode==="grip"?`, which gives ${eq(`Q = ${sig(s.Q)} ${FU(p)}`)}`:`, which gives ${eq(`P = Q(${p.b})/${p.a} = ${sig(s.P)} ${FU(p)}`)}`}</p>
  <h3>3. Force equilibrium of the handle</h3>
  <p>${eq(`R = P + Q = ${sig(s.R)} ${FU(p)}`)}</p>
  <p class="final">${p.mode==="grip"?`Q = ${sig(s.Q,3)} ${FU(p)}`:`P = ${sig(s.P,3)} ${FU(p)}`}; R = ${sig(s.R,3)} ${FU(p)}.</p>
  <p class="note">The ratio ${p.a}/${p.b} = ${sig(p.a/p.b,3)} is the mechanical advantage of the pliers.</p>`,
  fields:p=>[p.mode==="grip"?{id:"Q",label:"Gripping force Q",unit:FU(p)}:{id:"P",label:"Hand force P",unit:FU(p)},{id:"R",label:"Pin force R",unit:FU(p)}],
  truth:s=>({Q:s.Q,P:s.P,R:s.R}),
  note:"Enter magnitudes."
};

// 6. space truss: three bars at a joint
TEMPLATES["space-truss-joint"]={
  name:"Space truss: three bars meeting at a loaded joint",
  generate(seed){const r=mulberry32(seed);
    for(let k=0;k<5000;k++){
      const an=()=>[ri(r,-4,4),ri(r,-4,4),0],p={us:r()<.5,h:ri(r,3,6),A:an(),B:an(),C:an(),Fz:pick(r,range(200,1500,50)),Fx:pick(r,range(-300,300,50)),Fy:pick(r,range(-300,300,50))};
      const O=[0,0,p.h],lam=[p.A,p.B,p.C].map(q=>unit(sub(q,O))),M=[0,1,2].map(i=>lam.map(l=>l[i])),D=det3(M);
      if(Math.abs(D)<.2) continue;
      const F=[p.Fx,p.Fy,-p.Fz],T=solve3(M,F.map(v=>-v));
      if(T.some(t=>Math.abs(t)<.03*p.Fz||Math.abs(t)>6*p.Fz)) continue;
      return {p,s:{lam,T,F}};}
    throw new Error("no valid problem");},
  statement:p=>`<p>Three bars <i>OA</i>, <i>OB</i>, and <i>OC</i> are joined by a ball-and-socket joint at <i>O</i>(0, 0, ${p.h}) ${LU(p)} and are supported by ball-and-socket joints in the ground plane at <i>A</i>(${p.A.join(", ")}) ${LU(p)}, <i>B</i>(${p.B.join(", ")}) ${LU(p)}, and <i>C</i>(${p.C.join(", ")}) ${LU(p)}. The <i>z</i> axis points up. A force <b>F</b> = (${p.Fx}, ${p.Fy}, ${-p.Fz}) ${FU(p)} acts at <i>O</i>. Neglect the weights of the bars. Determine the force in each bar, with tension positive and compression negative.</p>`,
  figure:p=>{const O=[0,0,p.h],F=[p.Fx,p.Fy,-p.Fz],Fm=nrm(F),tip=O.map((v,i)=>v+3*F[i]/Fm);
    return sk3([O,p.A,p.B,p.C,tip],[{a:P3(O),b:P3(p.A),c:"m",t:"ln",w:4},{a:P3(O),b:P3(p.B),c:"m",t:"ln",w:4},{a:P3(O),b:P3(p.C),c:"m",t:"ln",w:4},
      {t:"pt",p:P3(O),l:it("O"),dx:-10,dy:-10,r:4.5,an:"end"},lab3("A",p.A,-6,18,"end"),lab3("B",p.B,8,18),lab3("C",p.C,8,-8),
      {a:P3(O),b:P3(tip),c:"r",l:`${it("F")} = (${p.Fx}, ${p.Fy}, ${-p.Fz})`,off:10}])},
  solution:(p,s)=>`<h3>1. Unit vectors from O toward each support</h3>
  <p>${eq(`λ<sub>OA</sub> = ${fv(s.lam[0])}`)} ${eq(`λ<sub>OB</sub> = ${fv(s.lam[1])}`)} ${eq(`λ<sub>OC</sub> = ${fv(s.lam[2])}`)}</p>
  <h3>2. Equilibrium of joint O</h3>
  <p>Each bar is a two-force member. Assume all bars are in tension, so each pulls on the joint toward its far end:</p>
  <p>${eq(`F<sub>OA</sub>λ<sub>OA</sub> + F<sub>OB</sub>λ<sub>OB</sub> + F<sub>OC</sub>λ<sub>OC</sub> + <b>F</b> = 0`)}</p>
  <p>${eq(`${sig(s.lam[0][0])}F<sub>OA</sub> + ${sig(s.lam[1][0])}F<sub>OB</sub> + ${sig(s.lam[2][0])}F<sub>OC</sub> = ${sig(-s.F[0])}`)}</p>
  <p>${eq(`${sig(s.lam[0][1])}F<sub>OA</sub> + ${sig(s.lam[1][1])}F<sub>OB</sub> + ${sig(s.lam[2][1])}F<sub>OC</sub> = ${sig(-s.F[1])}`)}</p>
  <p>${eq(`${sig(s.lam[0][2])}F<sub>OA</sub> + ${sig(s.lam[1][2])}F<sub>OB</sub> + ${sig(s.lam[2][2])}F<sub>OC</sub> = ${sig(-s.F[2])}`)}</p>
  <h3>3. Solve</h3>
  <p class="final">F<sub>OA</sub> = ${sig(s.T[0],3)} ${FU(p)} (${TC(s.T[0])}), F<sub>OB</sub> = ${sig(s.T[1],3)} ${FU(p)} (${TC(s.T[1])}), F<sub>OC</sub> = ${sig(s.T[2],3)} ${FU(p)} (${TC(s.T[2])}).</p>`,
  fields:p=>[{id:"TA",label:"Force in OA (tension positive)",unit:FU(p),signed:true},{id:"TB",label:"Force in OB (tension positive)",unit:FU(p),signed:true},{id:"TC",label:"Force in OC (tension positive)",unit:FU(p),signed:true}],
  truth:s=>({TA:s.T[0],TB:s.T[1],TC:s.T[2]}),
  note:"Tension is positive, compression is negative."
};

// ===== page
let curKey="truss-triangle", cur=null, curFields=[];
const $=id=>document.getElementById(id);

function render(key,seed){
  curKey=key; const T=TEMPLATES[key];
  cur=T.generate(seed); const {p,s}=cur; curFields=T.fields(p,s);
  $("typeSel").value=key; $("seedIn").value=seed;
  try{history.replaceState(null,"","#"+key+"-"+seed)}catch(e){}
  $("fig").innerHTML=T.figure(p,s);
  $("statement").innerHTML=T.statement(p,s);
  $("answers").innerHTML=curFields.map(f=>`<label for="in-${f.id}">${f.label}</label><span>${f.choices
    ?`<select id="in-${f.id}"><option value="">choose</option>${f.choices.map(c=>`<option>${c}</option>`).join("")}</select>`
    :`<input id="in-${f.id}" type="text" inputmode="decimal"> <span class="note">${f.unit}</span>`}</span><span class="mark" id="mk-${f.id}"></span>`).join("");
  $("ansNote").textContent="Answers within 2% are accepted. "+T.note;
  const sol=$("solution"); sol.style.display="none"; sol.innerHTML=T.solution(p,s);
  $("solBtn").textContent="Show solution";
}

function check(){
  const T=TEMPLATES[curKey], truth=T.truth(cur.s);
  const scaleOf=u=>Math.max(...curFields.filter(f=>f.unit===u&&typeof truth[f.id]==="number").map(f=>Math.abs(truth[f.id])));
  curFields.forEach(f=>{
    const el=$("mk-"+f.id), raw=$("in-"+f.id).value.replace(/,/g,"").trim();
    if(raw===""){el.textContent="";el.className="mark";return}
    if(f.choices){const ok=raw===truth[f.id];el.textContent=ok?"Correct":"Not yet";el.className="mark "+(ok?"ok":"bad");return}
    let v=parseFloat(raw), t=truth[f.id];
    if(!f.signed){v=Math.abs(v);t=Math.abs(t)}
    const tol=f.tolAbs!==undefined?f.tolAbs:0.02*Math.max(Math.abs(t),f.signed?0.05*scaleOf(f.unit):0);
    const ok=isFinite(v)&&Math.abs(v-t)<=tol;
    el.textContent=ok?"Correct":"Not yet"; el.className="mark "+(ok?"ok":"bad");
  });
}

if(typeof document!=="undefined"){
  const newSeed=()=>1+Math.floor(Math.random()*999999);
  $("typeSel").innerHTML=Object.entries(TEMPLATES).map(([k,t])=>`<option value="${k}">${t.name}</option>`).join("");
  $("typeSel").onchange=e=>render(e.target.value,newSeed());
  $("newBtn").onclick=()=>render(curKey,newSeed());
  $("loadBtn").onclick=()=>{const v=parseInt($("seedIn").value,10);if(v>0)render(curKey,v)};
  $("checkBtn").onclick=check;
  $("solBtn").onclick=e=>{const s=$("solution"),show=s.style.display!=="block";
    s.style.display=show?"block":"none";e.target.textContent=show?"Hide solution":"Show solution"};
  (function(){
    const m=/^#([a-z0-9-]+)-(\d+)$/.exec(location.hash);
    if(m&&TEMPLATES[m[1]]) render(m[1],parseInt(m[2],10));
    else render("truss-triangle",newSeed());
  })();
}
if(typeof module!=="undefined")module.exports={TEMPLATES};

</script>
