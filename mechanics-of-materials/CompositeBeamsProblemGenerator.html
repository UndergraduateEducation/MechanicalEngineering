<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Composite Beams Problem Generator</title>
<style>
  :root{--ink:#1f2328;--muted:#5b6470;--line:#d9dde3;--bg:#fbfaf7;--card:#ffffff;--accent:#1e5a32;--ok:#1e7a3c;--bad:#b3261e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Georgia","Times New Roman",serif}
  header{padding:22px 24px 8px;max-width:980px;margin:0 auto}
  h1{font-size:1.45rem;margin:0 0 4px;font-weight:600}
  .sub{color:var(--muted);font-family:system-ui,sans-serif;font-size:.9rem}
  .sub a{color:var(--accent)}
  main{max-width:980px;margin:0 auto;padding:8px 24px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:14px 0}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-family:system-ui,sans-serif;font-size:.9rem}
  button{font:inherit;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:7px;padding:7px 14px;cursor:pointer}
  button.ghost{background:#fff;color:var(--accent)}
  button:hover{filter:brightness(1.08)}
  input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:9em}
  select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;max-width:100%}
  label{color:var(--muted)}
  svg{width:100%;height:auto;display:block}
  .statement p{margin:.3em 0}
  .answers{display:grid;grid-template-columns:auto auto auto;gap:8px 12px;align-items:center;font-family:system-ui,sans-serif;font-size:.92rem}
  .answers input{width:8em}
  .mark{font-weight:600;min-width:7em}.mark.ok{color:var(--ok)}.mark.bad{color:var(--bad)}
  #solution{display:none}
  #solution h3{font-size:1.05rem;margin:1.1em 0 .3em}
  table{border-collapse:collapse;font-family:system-ui,sans-serif;font-size:.88rem;margin:.4em 0}
  td,th{border-bottom:1px solid var(--line);padding:4px 12px;text-align:right}
  th{color:var(--muted);font-weight:600}
  td:first-child,th:first-child{text-align:left}
  .eq{font-family:"Cambria Math","STIX Two Math",Georgia,serif;background:#f4f5f2;border-radius:6px;padding:6px 10px;display:inline-block;margin:3px 0}
  .note{color:var(--muted);font-size:.92rem}
  .final{font-weight:600}
  @media (max-width:640px){.answers{grid-template-columns:1fr 1fr}.answers .mark{grid-column:span 2}}
</style>
</head>
<body>
<header>
  <h1>Mechanics of Materials: Composite Beams Problem Generator</h1>
  <div class="sub">Transformed sections, sandwich beams, and reinforced concrete beams (elastic and ultimate-moment analysis). Each problem is generated from a seed and solved exactly in the browser. Share the seed to reproduce a problem. <a href="index.html">All chapters</a></div>
</header>
<main>
  <div class="card bar"><label for="typeSel">Problem type</label><select id="typeSel"></select></div>
  <div class="card bar">
    <button id="newBtn">New problem</button>
    <label for="seedIn">Seed</label><input id="seedIn" type="number" min="1" step="1">
    <button class="ghost" id="loadBtn">Load seed</button>
  </div>
  <div class="card"><div id="fig"></div></div>
  <div class="card statement" id="statement"></div>
  <div class="card">
    <div class="answers" id="answers"></div>
    <div class="bar" style="margin-top:12px">
      <button id="checkBtn">Check answers</button>
      <button class="ghost" id="solBtn">Show solution</button>
      <span class="note" id="ansNote"></span>
    </div>
  </div>
  <div class="card" id="solution"></div>
</main>
<script>
// ===== common helpers: seeded random numbers, number formatting, SVG drawing
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pick=(r,arr)=>arr[Math.floor(r()*arr.length)];
const range=(a,b,s)=>{const o=[];for(let v=a;v<=b+1e-9;v+=s)o.push(+v.toFixed(4));return o};
function fmt(v,d=0){return Number(v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d})}
function sig(v,n=3){if(v===0)return "0";const e=Math.floor(Math.log10(Math.abs(v)));return fmt(+v.toPrecision(n),Math.min(20,Math.max(0,n-1-e)))}
function fx(v){for(let d=0;d<=4;d++)if(Math.abs(+v.toFixed(d)-v)<1e-9*Math.max(1,Math.abs(v)))return fmt(v,d);return sig(v,4)}
const FR={0.25:"¼",0.375:"⅜",0.5:"½",0.625:"⅝",0.75:"¾",0.875:"⅞",1:"1",1.25:"1¼",1.5:"1½"};
const dstr=v=>FR[v]||String(v);
const C={fill:"#f7e2c4",ln:"#78461a",load:"#aa1e28",dim:"#5b6470",ink:"#1f2328",green:"#1e5a32",light:"#cde1cd",steel:"#dfe4ea",steelln:"#46505c"};
const TX=(x,y,s,o={})=>`<text x="${x}" y="${y}" text-anchor="${o.a||"middle"}" font-size="${o.s||14}" fill="${o.c||C.ink}" font-family="Georgia,serif"${o.i?' font-style="italic"':""}>${s}</text>`;
const LN=(x1,y1,x2,y2,o={})=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.c||C.ln}" stroke-width="${o.w||1.5}"${o.d?` stroke-dasharray="${o.d}"`:""}${o.cap?' stroke-linecap="round"':""}/>`;
function AR(x1,y1,x2,y2,c=C.load,w=2.2){const a=Math.atan2(y2-y1,x2-x1),h=11,s=0.4;
  const p=(da)=>`${(x2-h*Math.cos(a+da)).toFixed(1)},${(y2-h*Math.sin(a+da)).toFixed(1)}`;
  return LN(x1,y1,x2-6*Math.cos(a),y2-6*Math.sin(a),{c,w})+`<polygon points="${x2.toFixed(1)},${y2.toFixed(1)} ${p(s)} ${p(-s)}" fill="${c}"/>`}
const RC=(x,y,w,h,o={})=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${o.f||C.fill}" stroke="${o.c||C.ln}" stroke-width="${o.w||1.5}"/>`;
const CI=(x,y,r,o={})=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${o.f||"#fff"}" stroke="${o.c||C.ln}" stroke-width="${o.w||1.5}"/>`;
function DIMH(x1,x2,y,label,o={}){const up=o.up?-6:16;
  return LN(x1,y,x2,y,{c:C.dim,w:1})+LN(x1,y-5,x1,y+5,{c:C.dim,w:1})+LN(x2,y-5,x2,y+5,{c:C.dim,w:1})+TX((x1+x2)/2,y+up,label,{s:13,c:C.dim})}
function DIMV(x,y1,y2,label,o={}){const dx=o.left?-8:8;
  return LN(x,y1,x,y2,{c:C.dim,w:1})+LN(x-5,y1,x+5,y1,{c:C.dim,w:1})+LN(x-5,y2,x+5,y2,{c:C.dim,w:1})+TX(x+dx,(y1+y2)/2+4,label,{s:13,c:C.dim,a:o.left?"end":"start"})}
function HATCH(x,y,w,h){let s=RC(x,y,w,h,{f:"#eceae4",c:C.ln,w:1});
  for(let i=-h;i<w;i+=8){const xa=Math.max(x,x+i),ya=y+(xa-(x+i)),xb=Math.min(x+w,x+i+h),yb=y+(xb-(x+i));s+=LN(xa,ya,xb,yb,{c:"#9a8f80",w:.8})}return s}
const SVG=(w,h,b)=>`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img">${b}</svg>`;
const sub=(a,b)=>`${a}<sub>${b}</sub>`;
const iv=s=>`<i>${s}</i>`;

// ===== 1. stepped bar: axial force diagram and normal stress in each segment
const NODES="ABCDEFGHIJKLMNOP";
function sbGenerate(seed){
  const r=mulberry32(seed);
  for(let k=0;k<5000;k++){
    const us=r()<0.4,n=pick(r,[3,3,4]),A=[],Ls=[],F=[];
    for(let i=0;i<n;i++){
      A.push(pick(r,us?[0.8,1.0,1.2,1.5,1.6,1.8,2.0,2.5]:[300,400,500,600,800,1000,1200]));
      Ls.push(pick(r,us?[1.0,1.2,1.5,1.6,1.8,2.0]:[0.8,1.0,1.2,1.5,2.0]));
      F.push(pick(r,us?range(1000,9000,500):range(5000,40000,1000))*pick(r,[1,-1]));
    }
    F.push(-F.reduce((a,b)=>a+b,0));                       // the bar is in equilibrium
    const lo=us?1000:5000;
    if(Math.abs(F[n])<lo||Math.max(...F.map(Math.abs))>(us?16000:70000)) continue;
    const N=[];let c=0;for(let i=0;i<n;i++){c+=F[i];N.push(-c)}
    if(N.some(v=>Math.abs(v)<lo/2)||!(N.some(v=>v>0)&&N.some(v=>v<0))) continue;
    const sg=N.map((v,i)=>v/A[i]),m=sg.map(Math.abs),mx=Math.max(...m),imax=m.indexOf(mx);
    if(m.some((v,i)=>i!==imax&&v>0.9*mx)) continue;
    return {p:{us,n,A,Ls,F},s:{N,sg,imax,smax:mx}};
  }
  throw new Error("no valid problem");
}
const sbSeg=i=>NODES[i]+NODES[i+1];
function sbFmtF(p,v){return p.us?`${fmt(Math.abs(v))} lb`:`${fmt(Math.abs(v)/1000)} kN`}
function sbFigure(p){
  const x0=90,W=580,tot=p.Ls.reduce((a,b)=>a+b,0),maxA=Math.max(...p.A),yc=165;let x=x0,b="";
  const xs=[x0];p.Ls.forEach(l=>{x+=W*l/tot;xs.push(x)});
  p.A.forEach((a,i)=>{const h=36+54*Math.sqrt(a/maxA);
    b+=RC(xs[i],yc-h/2,xs[i+1]-xs[i],h)+TX((xs[i]+xs[i+1])/2,yc+5,`${fmt(a,p.us?1:0)} ${p.us?"in.²":"mm²"}`,{s:13})
      +DIMH(xs[i],xs[i+1],262,`${fmt(p.Ls[i],1)} ${p.us?"ft":"m"}`)});
  p.F.forEach((f,i)=>{const X=xs[i],d=f>0?1:-1;
    b+=LN(X,84,X,yc-50,{c:C.dim,w:1,d:"3 3"})+AR(X,84,X+d*58,84)+TX(X+d*29,72,sbFmtF(p,f),{s:13,c:C.load})
      +TX(X,yc+75,NODES[i],{s:15,i:1})});
  return SVG(760,290,b);
}
function sbStatement(p){
  const F=p.F.map((f,i)=>`${iv(NODES[i])}: ${sbFmtF(p,f)} to the ${f>0?"right":"left"}`).join("; ");
  return `<p>The stepped bar ${NODES[0]}${NODES[p.n]} below consists of ${p.n} cylindrical segments with different cross-sectional areas and lengths, as shown. The bar is in equilibrium under the axial loads ${F}.</p>
  <p>Find the normal stress in each segment (tension positive, compression negative), and identify the segment with the largest stress magnitude.</p>`;
}
function sbSolution(p,s){
  const u=p.us?"lb":"N",su=p.us?"psi":"MPa";let h="<h3>1. Axial force in each segment</h3><p>Cut the bar inside a segment and write ΣF<sub>x</sub> = 0 for the part to the left of the cut. With tension positive, the axial force equals minus the sum of the external loads (positive to the right) to the left of the cut.</p><table><tr><th>Segment</th><th>N ("+u+")</th><th>A ("+(p.us?"in.²":"mm²")+")</th><th>σ = N/A ("+su+")</th></tr>";
  s.N.forEach((n,i)=>{h+=`<tr><td>${sbSeg(i)}</td><td>${fmt(n)} (${n>0?"T":"C"})</td><td>${fmt(p.A[i],p.us?1:0)}</td><td>${sig(s.sg[i])} (${n>0?"T":"C"})</td></tr>`});
  h+=`</table><p class="note">The segment lengths and the material do not enter the stress calculation.</p><h3>2. Largest stress</h3><p class="final">Segment ${sbSeg(s.imax)}, with |σ| = ${sig(s.smax)} ${su}.</p>`;
  return h;
}
const SB={name:"Stepped bar: axial force and normal stress in each segment",
  generate:sbGenerate,figure:sbFigure,statement:sbStatement,solution:sbSolution,
  fields:(p,s)=>[...p.A.map((_,i)=>({id:"s"+i,label:`Stress in segment ${sbSeg(i)} (signed, tension +)`,unit:p.us?"psi":"MPa",signed:true})),
    {id:"imax",label:"Segment with the largest |σ|",unit:"",choices:p.A.map((_,i)=>sbSeg(i))}],
  truth:(p,s)=>{const o={imax:sbSeg(s.imax)};s.sg.forEach((v,i)=>o["s"+i]=v);return o},
  note:"Enter signed stresses; tension is positive."};

// ===== 2. two bars meeting at a pin that carries a weight: forces and the safe weight
function tbGenerate(seed){
  const r=mulberry32(seed);
  for(let k=0;k<5000;k++){
    const us=r()<0.4,al=pick(r,range(25,65,5)),be=pick(r,range(25,65,5));
    if(al+be<60||al+be>120) continue;
    const A=[pick(r,us?range(0.2,1.0,0.1):[200,300,400,500,600,800]),pick(r,us?range(0.2,1.0,0.1):[200,300,400,500,600,800])];
    const sw=[pick(r,us?range(12,24,2):range(80,160,10)),pick(r,us?range(12,24,2):range(80,160,10))];
    const p={us,al,be,A,sw},s=tbSolve(p);
    if(Math.abs(s.W[0]-s.W[1])<0.1*Math.min(...s.W)) continue;
    return {p,s};
  }
  throw new Error("no valid problem");
}
function tbSolve(p){
  const a=p.al*Math.PI/180,b=p.be*Math.PI/180,D=Math.sin(a+b);
  const k=[Math.cos(b)/D,Math.cos(a)/D];                    // P_AB/W and P_AC/W
  const cap=p.A.map((A,i)=>p.sw[i]*A/(p.us?1:1000));          // kips (ksi·in.²), or kN (MPa·mm² = N)
  const W=cap.map((c,i)=>c/k[i]),Ws=Math.min(...W);
  return {k,cap,W,Ws,gov:W[0]<W[1]?"AB":"AC"};
}
function tbFigure(p){
  const Ax=380,Ay=205,Lp=165,a=p.al*Math.PI/180,b=p.be*Math.PI/180;
  const Bx=Ax-Lp*Math.cos(a),By=Ay-Lp*Math.sin(a),Cx=Ax+Lp*Math.cos(b),Cy=Ay-Lp*Math.sin(b);
  const arc=(cx,cy,ang,left)=>{const r=34,x2=cx+(left?-1:1)*r*Math.cos(ang),y2=cy+r*Math.sin(ang);
    return LN(cx,cy,cx+(left?-1:1)*(r+14),cy,{c:C.dim,w:1,d:"3 3"})+`<path d="M ${cx+(left?-r:r)} ${cy} A ${r} ${r} 0 0 ${left?0:1} ${x2.toFixed(1)} ${y2.toFixed(1)}" fill="none" stroke="${C.dim}" stroke-width="1.2"/>`};
  const wl=(cx,cy,ang,left)=>{const r=56;return [cx+(left?-1:1)*r*Math.cos(ang/2),cy+r*Math.sin(ang/2)+5]};
  const [al_x,al_y]=wl(Bx,By,a,false),[be_x,be_y]=wl(Cx,Cy,b,true);
  let s=HATCH(Bx-22,By-24,44,24)+HATCH(Cx-22,Cy-24,44,24)
   +LN(Bx,By,Ax,Ay,{w:6,cap:1})+LN(Cx,Cy,Ax,Ay,{w:6,cap:1})+CI(Bx,By,5)+CI(Cx,Cy,5)+CI(Ax,Ay,6,{f:"#fff"})
   +arc(Bx,By,a,false)+arc(Cx,Cy,b,true)
   +TX(al_x+4,al_y,"α",{s:15,i:1,c:C.dim})+TX(be_x-4,be_y,"β",{s:15,i:1,c:C.dim})
   +AR(Ax,Ay,Ax,Ay+70)+TX(Ax+16,Ay+60,"W",{s:16,i:1,c:C.load,a:"start"})
   +TX(Bx-30,By+5,"B",{s:15,i:1,a:"end"})+TX(Cx+30,Cy+5,"C",{s:15,i:1,a:"start"})+TX(Ax-14,Ay+22,"A",{s:15,i:1,a:"end"})
   +TX((Bx+Ax)/2-6,(By+Ay)/2+30,`AB`,{s:13,c:C.dim})+TX((Cx+Ax)/2+6,(Cy+Ay)/2+30,`AC`,{s:13,c:C.dim});
  return SVG(760,290,s);
}
function tbStatement(p){
  const u=p.us?"in.²":"mm²",su=p.us?"ksi":"MPa",Wu=p.us?"kips":"kN";
  return `<p>A weight ${iv("W")} hangs from pin ${iv("A")}, which is held by two bars. Bar ${iv("AB")} makes an angle α = ${p.al}° with the horizontal and bar ${iv("AC")} makes an angle β = ${p.be}°. The bars are pinned to the supports at ${iv("B")} and ${iv("C")}; their weight is negligible. The cross-sectional areas are ${fmt(p.A[0],p.us?1:0)} ${u} (${iv("AB")}) and ${fmt(p.A[1],p.us?1:0)} ${u} (${iv("AC")}); the working stresses are ${p.sw[0]} ${su} (${iv("AB")}) and ${p.sw[1]} ${su} (${iv("AC")}).</p>
  <p>Express the bar forces as multiples of ${iv("W")}, then find the largest weight each bar can carry and the largest weight that can be hung safely.</p>`;
}
function tbSolution(p,s){
  const Wu=p.us?"kips":"kN",Fu=p.us?"kips":"kN";
  return `<h3>1. Equilibrium of pin A</h3><p>Both bars are two-force members; assume both in tension.</p>
  <p class="eq">ΣF<sub>x</sub> = 0: P<sub>AC</sub> cos β − P<sub>AB</sub> cos α = 0</p><br><p class="eq">ΣF<sub>y</sub> = 0: P<sub>AB</sub> sin α + P<sub>AC</sub> sin β − W = 0</p>
  <p>Solving, P<sub>AB</sub> = W cos β / sin(α+β) = ${sig(s.k[0],4)} W and P<sub>AC</sub> = W cos α / sin(α+β) = ${sig(s.k[1],4)} W.</p>
  <h3>2. Weight limited by each bar</h3>
  <p>Bar AB: P<sub>AB</sub> = σ<sub>w</sub>A = ${sig(s.cap[0])} ${Fu}, so W = ${sig(s.cap[0])}/${sig(s.k[0],4)} = ${sig(s.W[0])} ${Wu}.</p>
  <p>Bar AC: P<sub>AC</sub> = σ<sub>w</sub>A = ${sig(s.cap[1])} ${Fu}, so W = ${sig(s.cap[1])}/${sig(s.k[1],4)} = ${sig(s.W[1])} ${Wu}.</p>
  <h3>3. Safe weight</h3><p class="final">W<sub>safe</sub> = ${sig(s.Ws)} ${Wu}, governed by bar ${s.gov}. The larger value must be discarded because it would overstress the other bar.</p>`;
}
const TB={name:"Two bars supporting a weight: bar forces and safe load",
  generate:tbGenerate,figure:tbFigure,statement:tbStatement,solution:tbSolution,
  fields:(p,s)=>[{id:"kAB",label:"P_AB / W",unit:""},{id:"kAC",label:"P_AC / W",unit:""},
    {id:"W1",label:"Largest W allowed by bar AB",unit:p.us?"kips":"kN"},{id:"W2",label:"Largest W allowed by bar AC",unit:p.us?"kips":"kN"},
    {id:"Ws",label:"Largest safe W",unit:p.us?"kips":"kN"},{id:"gov",label:"Governing bar",unit:"",choices:["AB","AC"]}],
  truth:(p,s)=>({kAB:s.k[0],kAC:s.k[1],W1:s.W[0],W2:s.W[1],Ws:s.Ws,gov:s.gov}),
  note:"Answers within 2% are accepted."};

// ===== 3. Warren truss: member stresses and required area (method of joints, solved numerically)
function trSolve(p){
  const n=p.n,nodes=[];
  for(let i=0;i<=n;i++)nodes.push([i*p.a,0]);
  for(let i=0;i<n;i++)nodes.push([(i+0.5)*p.a,p.h]);
  const T=j=>n+1+j,mem=[];
  for(let i=0;i<n;i++)mem.push([i,i+1]);
  for(let i=0;i<n-1;i++)mem.push([T(i),T(i+1)]);
  for(let i=0;i<n;i++){mem.push([i,T(i)]);mem.push([T(i),i+1])}
  const m=mem.length,N=nodes.length,K=m+3,M=Array.from({length:2*N},()=>new Array(K+1).fill(0));
  mem.forEach(([i,j],k)=>{const dx=nodes[j][0]-nodes[i][0],dy=nodes[j][1]-nodes[i][1],L=Math.hypot(dx,dy);
    M[2*i][k]+=dx/L;M[2*i+1][k]+=dy/L;M[2*j][k]-=dx/L;M[2*j+1][k]-=dy/L});
  M[0][m]=1;M[1][m+1]=1;M[2*n+1][m+2]=1;                    // pin at node 0, roller at node n
  p.loads.forEach(([j,f])=>{M[2*j+1][K]-=-f});                // downward load f: -f in y; move to right side
  for(let c=0;c<K;c++){let pv=c;for(let r=c+1;r<2*N;r++)if(Math.abs(M[r][c])>Math.abs(M[pv][c]))pv=r;
    [M[c],M[pv]]=[M[pv],M[c]];for(let r=0;r<2*N;r++)if(r!==c){const f=M[r][c]/M[c][c];if(f)for(let q=c;q<=K;q++)M[r][q]-=f*M[c][q]}}
  const x=[];for(let c=0;c<K;c++)x.push(M[c][K]/M[c][c]);
  return {nodes,mem,F:x.slice(0,m),R:x.slice(m)};
}
function trGenerate(seed){
  const r=mulberry32(seed);
  for(let k=0;k<5000;k++){
    const us=r()<0.4,n=pick(r,[3,4,4]),a=pick(r,us?[6,8,10]:[3,4,5]),h=pick(r,us?[6,8,9,12]:[3,4,5]);
    const cand=[];for(let j=1;j<n;j++)cand.push(j);const top=[];for(let j=0;j<n;j++)top.push(n+1+j);
    const nl=pick(r,[2,3]),pickN=[...cand,...top];const chosen=new Set();while(chosen.size<nl)chosen.add(pick(r,pickN));
    const loads=[...chosen].map(j=>[j,pick(r,us?range(5,30,5):range(20,120,10))]);
    const p={us,n,a,h,loads,A:pick(r,us?[1.2,1.8,2.4,3.0]:[800,1000,1200,1400,1800])};
    const sol=trSolve(p);

  if(bm.K.length)t+=`, wall moment ${sig(Math.abs(bm.K[0].C),4)} ${u.M} (${bm.K[0].C<0?"counterclockwise":"clockwise"} on the beam)`;return t}
const SIGNNOTE="Sign convention: V is the sum of the external forces to the left of the section, upward positive; M is positive when it bends the beam concave upward (sagging).";

// ===== Chapter 4 problem types
const pos=(r,L,st,lo=st,hi=L-st)=>pick(r,range(Math.ceil(lo/st-1e-9)*st,hi,st));
const Fv=(r,us,lo=1)=>pick(r,us?range(200,3000,100):range(5,60,5))*lo;
const Wv=(r,us)=>pick(r,us?range(50,600,50):range(2,20,1));
const Cv=(r,us)=>pick(r,us?range(500,6000,250):range(5,60,5));
const Lv=(r,us,set)=>pick(r,set||(us?[6,8,9,10,12,14,16]:[3,4,5,6,8,10]));
const sameRes=(a,b)=>Math.abs(a-b)<=0.02*Math.abs(b)+1e-9;
const bmSol=(bm,extra="")=>`<h3>1. Reactions</h3><p>From the equilibrium of the whole beam${bm.sup.kind==="hinge"?" and, first, of the part to the right of the hinge (zero moment at the hinge)":""}: ${bmReactText(bm)}.</p>
  <h3>2. Shear force and bending moment diagrams</h3><p class="note">${SIGNNOTE} The slope of the V diagram is −w; the slope of the M diagram is V. Concentrated forces cause jumps in V; couples cause jumps in M.</p>${bmDiagram(bm,"V")}${bmDiagram(bm,"M")}${extra}`;

// ----- 1. simply supported beam with concentrated loads: V and M at a section
function s1Generate(seed){
  const r=mulberry32(seed);
  for(let k=0;k<5000;k++){
    const us=r()<0.4,L=Lv(r,us),n=pick(r,[2,3]),xs=new Set();while(xs.size<n)xs.add(pos(r,L,us?1:0.5));
    const bm={us,L,sup:{kind:"ss",xa:0,xb:L},P:[...xs].sort((a,b)=>a-b).map(x=>({x,F:Fv(r,us)})),C:[],W:[]};
    bmSolve(bm);
    const cands=range(us?0.5:0.25,L-(us?0.5:0.25),us?0.5:0.25).filter(x=>!bm.ev.includes(x));const xs_=pick(r,cands);
    const V=bm.V(xs_),M=bm.M(xs_);if(Math.abs(V)<0.05*bm.Vmax||M<0.1*bm.Mpos.m) continue;
    bm.xs=xs_;return {p:bm,s:{V,M}};
  }
  throw new Error("no valid problem");
}

// ----- 2. overhanging beam with distributed and concentrated loads
function s2Generate(seed){
  const r=mulberry32(seed);
  for(let k=0;k<5000;k++){
    const us=r()<0.4,st=us?1:0.5,L=Lv(r,us,us?[8,10,12,14,16]:[4,5,6,8,10]);
    const left=r()<0.35,xa=left?pos(r,L,st,st,L/3):0,xb=pos(r,L,st,Math.max(xa+L/2,L*0.55),L-st);
    const wa=pick(r,[0,xa]),wb=pick(r,[xb,L]),W=[{a:wa,b:wb,w1:0,w2:0}];W[0].w1=W[0].w2=Wv(r,us);
    const P=[{x:pick(r,[L,xb+(L-xb)/2,...range(st,L-st,st)]),F:Fv(r,us)}];
    if(P[0].x===xa||P[0].x===xb) continue;
    const bm={us,L,sup:{kind:"ss",xa,xb},P,C:[],W};bmSolve(bm);
    if(!bm.Mpos||!bm.Mneg||bm.Mpos.m<0.15*Math.abs(bm.Mneg.m)||Math.abs(bm.Mneg.m)<0.15*bm.Mpos.m) continue;
    if(bm.R.some(q=>q.R<=0)) continue;

// ----- 3. cantilever beam with mixed loads
function s3Generate(seed){
  const r=mulberry32(seed);
  for(let k=0;k<5000;k++){
    const us=r()<0.4,st=us?1:0.5,L=Lv(r,us,us?[6,8,9,10,12]:[2,3,4,5,6]),right=r()<0.5;
    const a=pos(r,L,st,0,L-2*st),b=pos(r,L,st,a+st,L),W=[{a,b,w1:0,w2:0}];W[0].w1=W[0].w2=Wv(r,us);
    const P=[{x:pos(r,L,st,st,L),F:Fv(r,us)*pick(r,[1,1,-1])}],C=r()<0.5?[{x:pos(r,L,st,st,L),C:Cv(r,us)*pick(r,[1,-1])}]:[];
    if(right){P.forEach(q=>q.x=L-q.x);C.forEach(q=>q.x=L-q.x);W.forEach(d=>{const t=d.a;d.a=L-d.b;d.b=L-t});}
    if(P.some(q=>q.x===0||q.x===L&&right)||C.some(c=>c.x===P[0].x||c.x===0||c.x===L)) continue;

    if(Math.abs(V)<0.05*bm.Vmax||Math.abs(M)<0.05*Math.max(Math.abs(bm.Mneg?.m||0),bm.Mpos?.m||0)||Math.abs(Mw)<1e-6) continue;
    bm.xs=xs;const Mabs=Math.max(Math.abs(bm.Mneg?.m||0),bm.Mpos?.m||0);
    return {p:bm,s:{V,M,Mw,Mabs}};
  }
  throw new Error("no valid problem");
}

function s4Generate(seed){
  const r=mulberry32(seed);
  for(let k=0;k<5000;k++){

// ----- 5. beam with an applied couple
function s5Generate(seed){
  const r=mulberry32(seed);
  for(let k=0;k<5000;k++){
    const us=r()<0.4,st=us?1:0.5,L=Lv(r,us),xb=pick(r,[L,L,L-st,L-2*st]);
    const C=[{x:pos(r,L,st),C:Cv(r,us)*pick(r,[1,-1])}],P=r()<0.6?[{x:pos(r,L,st),F:Fv(r,us)}]:[],W=P.length?[]:[{a:0,b:pick(r,[xb,L/2]),w1:0,w2:0}];
    if(W.length)W[0].w1=W[0].w2=Wv(r,us);
    if(P.length&&P[0].x===C[0].x||C[0].x===xb) continue;
    const bm={us,L,sup:{kind:"ss",xa:0,xb},P,C,W};bmSolve(bm);
    const e=1e-9*L,Ml=bm.M(C[0].x-e),Mr=bm.M(C[0].x+e);
    if(Math.min(Math.abs(Ml),Math.abs(Mr))<0.05*Math.abs(C[0].C)) continue;
    const Ma=Math.max(Math.abs(bm.Mneg?.m||0),bm.Mpos?.m||0);
    return {p:bm,s:{Ml,Mr,Ma}};
  }
  throw new Error("no valid problem");
}

const SU=us=>us?{d:"in.",S:"psi",Mf:12,Vf:1}:{d:"mm",S:"MPa",Mf:1e6,Vf:1000};   // M(lb·ft)->lb·in, M(kN·m)->N·mm; V(lb)->lb, V(kN)->N
function secProps(rects){                     // rects {x0,b,y0,y1} measured from the bottom
  let A=0,Ay=0;rects.forEach(r=>{const a=r.b*(r.y1-r.y0);A+=a;Ay+=a*(r.y0+r.y1)/2});
  const yb=Ay/A;let I=0;rects.forEach(r=>{const h=r.y1-r.y0,a=r.b*h,d=(r.y0+r.y1)/2-yb;I+=r.b*h**3/12+a*d*d});
  const H=Math.max(...rects.map(r=>r.y1)),Q=y=>{let q=0;rects.forEach(r=>{const lo=Math.max(r.y0,y);if(r.y1>lo)q+=r.b*(r.y1-lo)*((r.y1+lo)/2-yb)});return q};
  const t=y=>rects.filter(r=>y>=r.y0-1e-12&&y<=r.y1+1e-12).reduce((a,r)=>a+r.b,0);
  return {A,yb,I,H,ct:H-yb,cb:yb,Q,t};
}
function secDraw(rects,labs,o={}){
  const H=Math.max(...rects.map(r=>r.y1)),Wd=Math.max(...rects.map(r=>r.x0+r.b))-Math.min(...rects.map(r=>r.x0)),k=Math.min(170/H,220/Wd),x0=300-Wd*k/2-Math.min(...rects.map(r=>r.x0))*k,y0=20+H*k;
  let s="";rects.forEach(r=>{s+=RC(x0+r.x0*k,y0-r.y1*k,r.b*k,(r.y1-r.y0)*k,{f:o.fill||"#f2d9b0",c:C.ln})});
  const xl=300-Wd*k/2,xr=300+Wd*k/2;
  (o.lines||[]).forEach(y=>{s+=LN(xl-16,y0-y*k,xr+16,y0-y*k,{c:C.green,w:1.6,d:"6 3"})});
  if(o.Hl)s+=DIMV(xl-28,y0-H*k,y0,o.Hl,{left:1});
  labs.forEach((l,i)=>{s+=TX(470,40+i*20,l,{s:13,c:C.dim,a:"start"})});
  if(o.title)s+=TX(300,y0+24,o.title,{s:13,c:C.dim});
  return SVG(760,y0+(o.title?36:16),s);
}
const R_=(x0,b,y0,y1)=>({x0,b,y0,y1});
function secT(bf,tf,tw,hw,top){return top?[R_(-tw/2,tw,0,hw),R_(-bf/2,bf,hw,hw+tf)]:[R_(-bf/2,bf,0,tf),R_(-tw/2,tw,tf,tf+hw)]}
function secI(bf,tf,tw,hw){return [R_(-bf/2,bf,0,tf),R_(-tw/2,tw,tf,tf+hw),R_(-bf/2,bf,tf+hw,2*tf+hw)]}
function secBox(B,Hh,tf,tw){return [R_(-B/2,B,0,tf),R_(-B/2,tw,tf,Hh-tf),R_(B/2-tw,tw,tf,Hh-tf),R_(-B/2,B,Hh-tf,Hh)]}

// simple loaded beams for this chapter (reuse the Chapter 4 engine)
function loadBeam(r,us,kind){

  for(let k=0;k<5000;k++){
    const L=pick(r,us?[8,10,12,14,16]:[3,4,5,6,8]);let bm;
    if(kind==="ss"){const P=[{x:pos(r,L,st),F:Fv(r,us)}],W=r()<0.6?[{a:0,b:L,w1:0,w2:0}]:[];if(W.length)W[0].w1=W[0].w2=Wv(r,us);if(!W.length)P.push({x:pos(r,L,st),F:Fv(r,us)});
      if(P.length===2&&P[0].x===P[1].x) continue;bm={us,L,sup:{kind:"ss",xa:0,xb:L},P,C:[],W}}
    else{const xb=pos(r,L,st,L*0.55,L-st),W=[{a:0,b:pick(r,[xb,L]),w1:0,w2:0}];W[0].w1=W[0].w2=Wv(r,us);
      bm={us,L,sup:{kind:"ss",xa:0,xb},P:[{x:L,F:Fv(r,us)}],C:[],W}}
    bmSolve(bm);if(kind==="oh"&&(!bm.Mpos||!bm.Mneg||bm.Mpos.m<0.3*Math.abs(bm.Mneg.m)||Math.abs(bm.Mneg.m)<0.3*bm.Mpos.m)) continue;

}

// ----- 1. rectangular beam: flexure formula

    const xs=pick(r,range(us?1:0.5,bm.L-(us?1:0.5),us?1:0.5)),d=pick(r,(us?[0.5,1,1.5,2,2.5,3]:[25,40,50,60,75,100]).filter(v=>v<h&&Math.abs(v-h/2)>0.1*h));
    const Ms=bm.M(xs),sp=-Ms*su.Mf*(h/2-d)/I;if(Math.abs(Ms)<0.2*M) continue;

// ----- 2. T-section on an overhanging beam: maximum tension and compression
function f2Generate(seed){
  const r=mulberry32(seed);
  for(let k=0;k<5000;k++){
    const us=r()<0.4,bm=loadBeam(r,us,"oh"),top=r()<0.5,bf=pick(r,us?[4,6,8]:[100,150,200]),tf=pick(r,us?[1,1.5,2]:[20,25,30,40]),tw=pick(r,us?[1,1.5,2]:[20,25,30]),hw=pick(r,us?[4,6,8]:[100,150,200]);

    const c=[{v:Mp*sp.cb/sp.I,t:"T",x:bm.Mpos.x},{v:Mp*sp.ct/sp.I,t:"C",x:bm.Mpos.x},{v:Mn*sp.ct/sp.I,t:"T",x:bm.Mneg.x},{v:Mn*sp.cb/sp.I,t:"C",x:bm.Mneg.x}];
    const T=c[0].v>c[2].v?c[0]:c[2],Cc=c[1].v>c[3].v?c[1]:c[3];
    if(Math.max(T.v,Cc.v)>(us?20000:150)||Math.max(T.v,Cc.v)<(us?2000:15)) continue;
    if(Math.abs(c[0].v/c[2].v-1)<0.05||Math.abs(c[1].v/c[3].v-1)<0.05) continue;
    return {p:{us,bm,top,bf,tf,tw,hw,rects},s:{sp,T,Cc}};

}

  statement:p=>{const u=U4(p.us),su=SU(p.us);return `<p>The overhanging beam shown has the T-shaped cross section shown, with the flange at the ${p.top?"top":"bottom"}; neglect the weight of the beam.</p>

// ----- 4. glued planks: shear stress in the glue and in the wood

// ----- 5. shear stress distribution in an I or T section

// ===== Chapter 6 deflection engine: exact integration of v'' = M/(EI) for piecewise-polynomial M
// bm from bmSolve (kN, m or lb, ft); EI(x) in kN·m² or lb·ft²; bc: {kind:"ss",xa,xb,da,db} | {kind:"fixL"} | {kind:"fixR"}
function deflSolve(bm,EIf,bc,extra=[]){
  const L=bm.L,brk=new Set([...bm.ev,...extra,...(bm.EIbrk||[])]),xs=[];const b=[...brk].filter(x=>x>=0&&x<=L).sort((a,c)=>a-c);
  for(let i=0;i+1<b.length;i++){const n=200;for(let k=0;k<n;k++)xs.push(b[i]+(b[i+1]-b[i])*k/n)}xs.push(L);

    GQ.forEach(([t,w])=>{const s=(a+c)/2+h/2*t,k=kap(Math.min(Math.max(s,a+e),c-e))*w*h/2;I1+=k;I2+=k*(c-s)});
    th.push(th[i]+I1);v.push(v[i]+th[i]*h+I2)}
  const loc=x=>{let i=xs.length-2;let lo=0,hi=xs.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(xs[m]<=x)lo=m;else hi=m}i=Math.min(lo,xs.length-2);
    const a=xs[i],h=x-a;if(h<=0)return [th[i],v[i]];let I1=0,I2=0;GQ.forEach(([t,w])=>{const s=a+h/2*(1+t),k=kap(Math.min(Math.max(s,a+e),x-e))*w*h/2;I1+=k;I2+=k*(x-s)});
    return [th[i]+I1,v[i]+th[i]*h+I2]};
  // general solution v = vp + C1 x + C2
  let C1,C2;
  if(bc.kind==="fixL"){C1=0;C2=0}
  else if(bc.kind==="fixR"){const [t,vv]=loc(L);C1=-t;C2=-vv-C1*L}
  else{const va=loc(bc.xa)[1],vb=loc(bc.xb)[1],da=bc.da||0,db=bc.db||0;C1=((db-vb)-(da-va))/(bc.xb-bc.xa);C2=da-va-C1*bc.xa}
  const V=x=>loc(x)[1]+C1*x+C2,TH=x=>loc(x)[0]+C1;
  // extremes of v: ends, breakpoints, zeros of slope
  const cand=[];b.forEach(x=>cand.push({x,v:V(x)}));
  for(let i=0;i+1<xs.length;i++){const ta=TH(xs[i]),tb=TH(xs[i+1]);if(ta===0)cand.push({x:xs[i],v:V(xs[i])});
    if(ta*tb<0){let l=xs[i],h=xs[i+1];for(let it=0;it<70;it++){const m=(l+h)/2;if(TH(m)*ta>0)l=m;else h=m}const x=(l+h)/2;cand.push({x,v:V(x),z:1})}}
  const dn=cand.reduce((a,c)=>c.v<a.v?c:a,{v:Infinity}),up=cand.reduce((a,c)=>c.v>a.v?c:a,{v:-Infinity});
  return {V,TH,dn,up,vmax:Math.abs(dn.v)>=Math.abs(up.v)?dn:up,C1,C2};
}

// ----- 3. reinforced concrete beam, elastic analysis
function rcRect(b,d,As,n){const h=(-n*As+Math.sqrt((n*As)**2+2*b*n*As*d))/b,I=b*h**3/3+n*As*(d-h)**2;return {h,I}}
function c3Generate(seed){
  const r=mulberry32(seed),us=r()<0.4;
  for(let k=0;k<20000;k++){
    const b=pick(r,us?[8,10,12,14]:[200,250,300,350]),d=pick(r,us?[14,16,18,20,24]:[350,400,450,500,600]),As=pick(r,us?[1,1.25,1.5,2,2.5,3]:[800,1000,1200,1500,2000,2400]),n=pick(r,[8,9,10]);
    const {h,I}=rcRect(b,d,As,n),cf=us?12000:1e6,M=pick(r,us?range(30,200,5):range(40,300,10)),Mn=M*cf;   // kip·ft -> lb·in.; kN·m -> N·mm
    const sco=Mn*h/I,sst=n*Mn*(d-h)/I,wc=pick(r,us?[1200,1350,1500,1800]:[8,10,12,14]),wst=pick(r,us?[18000,20000,24000]:[120,140,160]);
    if(sco>wc||sst>wst||sco<0.3*wc) continue;
    const Mc=wc*I/h/cf,Ms=wst*I/(n*(d-h))/cf;if(Math.abs(Mc/Ms-1)<0.06) continue;
    return {p:{us,b,d,As,n,M,wc,wst},s:{h,I,sco,sst,Mc,Ms,Mm:Math.min(Mc,Ms),gov:Ms<Mc?"Steel (under-reinforced)":"Concrete (over-reinforced)"}};
  }

}
const rcFig=(p,T)=>{const u=p.us?"in.":"mm",rects=T?[{x0:-p.b1/2,b:p.b1,y0:p.D-p.h1,y1:p.D,n:1,mat:"concrete"},{x0:-p.b2/2,b:p.b2,y0:0,y1:p.D-p.h1,n:1,mat:"concrete"}]:[{x0:-p.b/2,b:p.b,y0:0,y1:p.D,n:1,mat:"concrete"}];
  const bw=T?p.b2:p.b,Asn=isFinite(p.As)?p.As:(p.us?1.5:1200),rb=Math.sqrt(Asn/3/Math.PI)*0.9;
  return tDraw(rects,T?[`flange ${p.b1} × ${p.h1} ${u}`,`web width ${p.b2} ${u}`,`d = ${p.d} ${u} (top to the steel)`,`A<tspan baseline-shift="sub" font-size="10">st</tspan> = ${p.As} ${p.us?"in.²":"mm²"}`]:[`b = ${p.b} ${u}`,`d = ${p.d} ${u} (top to the steel)`,`A<tspan baseline-shift="sub" font-size="10">st</tspan> = ${p.As} ${p.us?"in.²":"mm²"}`],{title:"Cross section",dots:[[-bw/4,p.D-p.d,rb],[0,p.D-p.d,rb],[bw/4,p.D-p.d,rb]]})};
const C3={name:"Reinforced concrete beam: elastic stresses and allowable moment",generate:c3Generate,
  figure:p=>rcFig({...p,D:p.d*1.12},false),
  statement:p=>{const S=p.us?"psi":"MPa",Mu=p.us?"kip·ft":"kN·m";return `<p>A rectangular reinforced concrete beam has width b = ${p.b} ${p.us?"in.":"mm"}, effective depth d = ${p.d} ${p.us?"in.":"mm"} (top to the centroid of the steel), steel area A<sub>st</sub> = ${p.As} ${p.us?"in.²":"mm²"}, and modular ratio n = E<sub>st</sub>/E<sub>co</sub> = ${p.n}. The concrete carries no tension.</p>
  <p>Using elastic analysis, find the depth h of the neutral axis below the top, the moment of inertia of the transformed section, and the maximum concrete stress and the steel stress for M = ${p.M} ${Mu}. Then find the allowable moment for working stresses of ${fmt(p.wc)} ${S} (concrete) and ${fmt(p.wst)} ${S} (steel).</p>`},
  solution:(p,s)=>{const S=p.us?"psi":"MPa",Mu=p.us?"kip·ft":"kN·m",u=p.us?"in.":"mm";return `<h3>1. Neutral axis</h3><p>The first moment of the transformed section about the neutral axis is zero (concrete above, nA<sub>st</sub> below):</p><p class="eq">b h²/2 = nA<sub>st</sub>(d − h) ⇒ h = ${sig(s.h,4)} ${u}</p>

// ----- 4. reinforced concrete T-beam, elastic analysis
function rcT(b1,h1,b2,d,As,n){
  let h=rcRect(b1,d,As,n).h;
  if(h<=h1)return {h,I:b1*h**3/3+n*As*(d-h)**2,flange:true};
  // neutral axis in the web: b1 h1 (h - h1/2) + b2 (h-h1)^2/2 - n As (d-h) = 0
  const a=b2/2,bb=b1*h1-b2*h1+n*As,c=-b1*h1*h1/2+b2*h1*h1/2-n*As*d;h=(-bb+Math.sqrt(bb*bb-4*a*c))/(2*a);
  const I=b1*h**3/3-(b1-b2)*(h-h1)**3/3+n*As*(d-h)**2;return {h,I,flange:false};
}
function c4Generate(seed){
  const r=mulberry32(seed),us=r()<0.4;
  for(let k=0;k<20000;k++){
    const b1=pick(r,us?[24,30,36,40]:[600,750,900,1000]),h1=pick(r,us?[3,4,5,6,8]:[75,100,125,150,200]),b2=pick(r,us?[10,12,14,16]:[250,300,350,400]),d=pick(r,us?[18,20,24,28]:[450,500,600,700]),As=pick(r,us?[2,3,4,5,6]:[1500,2000,2400,3000,4000]),n=pick(r,[8,9,10]);
    const o=rcT(b1,h1,b2,d,As,n);
    const cf=us?12000:1e6,wc=pick(r,us?[1200,1350,1500,1800]:[8,10,12,14]),wst=pick(r,us?[18000,20000,24000]:[120,140,160]);
    const Mc=wc*o.I/o.h/cf,Ms=wst*o.I/(n*(d-o.h))/cf;if(Math.abs(Mc/Ms-1)<0.06) continue;if(Ms<Mc&&r()<0.85) continue;
    return {p:{us,b1,h1,b2,d,As,n,wc,wst},s:{...o,Mc,Ms,Mm:Math.min(Mc,Ms),gov:Ms<Mc?"Steel":"Concrete"}};
  }
  throw new Error("no valid problem");
}
const C4={name:"Reinforced concrete T-beam: neutral axis and allowable moment",generate:c4Generate,

  statement:p=>{const S=p.us?"psi":"MPa",u=p.us?"in.":"mm";return `<p>A reinforced concrete T-beam has a flange ${p.b1} ${u} wide and ${p.h1} ${u} thick, a web ${p.b2} ${u} wide, effective depth d = ${p.d} ${u}, and steel area A<sub>st</sub> = ${p.As} ${p.us?"in.²":"mm²"}. Use n = ${p.n} and working stresses of ${fmt(p.wc)} ${S} for concrete and ${fmt(p.wst)} ${S} for steel; the concrete carries no tension.</p>
  <p>Using elastic analysis, find the depth h of the neutral axis below the top, the moment of inertia of the transformed section, and the largest bending moment the beam can carry.</p>`},
  solution:(p,s)=>{const u=p.us?"in.":"mm",Mu=p.us?"kip·ft":"kN·m";return `<h3>1. Neutral axis</h3><p>First try the neutral axis in the flange (a rectangle of width ${p.b1}). ${s.flange?`That gives h = ${sig(s.h,4)} ${u} ≤ ${p.h1} ${u}, so the assumption holds.`:`That gives h &gt; ${p.h1} ${u}, so the axis lies in the web. The compression zone is the flange plus the part of the web between the flange and the neutral axis:`}</p>

  <h3>3. Largest moment</h3><p>Concrete: M = σ<sub>w</sub>I/h = ${sig(s.Mc,4)} ${Mu}. Steel: M = σ<sub>w</sub>I/[n(d − h)] = ${sig(s.Ms,4)} ${Mu}.</p><p class="final">M<sub>max</sub> = ${sig(s.Mm,4)} ${Mu} (${s.gov.toLowerCase()} governs)</p>`},

// ----- 5. ultimate moment (ACI stress block, Eqs. 9.10-9.13)
function ult(b,d,As,fc,fy){const h=As*fy/(0.72*b*fc),Mn=(d-0.425*h)*As*fy,est=0.003*(d-h)/h,phi=est>=0.005?0.9:0.483+83.3*est;return {h,Mn,est,phi,Mu:phi*Mn}}
function c5Generate(seed){
  const r=mulberry32(seed),us=r()<0.4;
  for(let k=0;k<20000;k++){
    const b=pick(r,us?[8,10,12,14]:[200,250,300,350]),d=pick(r,us?[14,16,18,20,24]:[350,400,450,500,600]),As=pick(r,us?[1,1.25,1.5,2,2.5,3,4]:[800,1000,1200,1500,2000,2500,3000]);
    const fc=pick(r,us?[3000,4000,5000]:[20,25,30,35]),fy=pick(r,us?[40000,60000]:[280,420]),o=ult(b,d,As,fc,fy);
    if(o.est<0.002) continue;if(o.est>=0.005&&r()<0.4) continue;
    return {p:{us,b,d,As,fc,fy},s:o};
  }
  throw new Error("no valid problem");
}
const C5={name:"Reinforced concrete beam: ultimate moment (ACI stress block)",generate:c5Generate,
  figure:p=>rcFig({...p,D:p.d*1.12},false),
  statement:p=>{const S=p.us?"psi":"MPa";return `<p>A rectangular reinforced concrete beam has b = ${p.b} ${p.us?"in.":"mm"}, d = ${p.d} ${p.us?"in.":"mm"}, and A<sub>st</sub> = ${p.As} ${p.us?"in.²":"mm²"}. The material properties are (σ<sub>co</sub>)<sub>ult</sub> = ${fmt(p.fc)} ${S} and (σ<sub>st</sub>)<sub>yp</sub> = ${fmt(p.fy)} ${S}. The beam is under-reinforced.</p>
  <p>Using the ACI stress block (compressive force 0.72bh(σ<sub>co</sub>)<sub>ult</sub> acting 0.425h below the top), find the neutral-axis depth h, the nominal ultimate moment, the steel strain at failure, the factor φ, and the ultimate moment.</p>`},
  solution:(p,s)=>{const u=p.us?"in.":"mm",Mu=p.us?"kip·ft":"kN·m",cf=p.us?12000:1e6;return `<h3>1. Neutral axis (Eq. 9.11)</h3><p class="eq">h = A<sub>st</sub>(σ<sub>st</sub>)<sub>yp</sub>/[0.72b(σ<sub>co</sub>)<sub>ult</sub>] = ${sig(s.h,4)} ${u}</p>
  <h3>2. Nominal moment (Eq. 9.12)</h3><p class="eq">M<sub>nom</sub> = (d − 0.425h)A<sub>st</sub>(σ<sub>st</sub>)<sub>yp</sub> = ${sig(s.Mn/cf,4)} ${Mu}</p>
  <h3>3. Steel strain and φ (Eqs. 9.8, 9.13b)</h3><p>ε<sub>st</sub> = 0.003(d − h)/h = ${sig(s.est,4)}. ${s.est>=0.005?"Since ε<sub>st</sub> ≥ 0.005, φ = 0.9.":`Since 0.002 ≤ ε<sub>st</sub> &lt; 0.005, φ = 0.483 + 83.3ε<sub>st</sub> = ${sig(s.phi,4)}.`}</p>
  <h3>4. Ultimate moment</h3><p class="final">M<sub>ult</sub> = φM<sub>nom</sub> = ${sig(s.Mu/cf,4)} ${Mu}</p>`},
  fields:p=>{const u=p.us?"in.":"mm",Mu=p.us?"kip·ft":"kN·m";return [{id:"h",label:"Neutral axis depth h",unit:u},{id:"Mn",label:"Nominal ultimate moment",unit:Mu},{id:"e",label:"Steel strain at failure",unit:""},{id:"phi",label:"Factor φ",unit:""},{id:"Mu",label:"Ultimate moment",unit:Mu}]},
  truth:(p,s)=>{const cf=p.us?12000:1e6;return {h:s.h,Mn:s.Mn/cf,e:s.est,phi:s.phi,Mu:s.Mu/cf}},note:"Answers within 2% are accepted."};

// ----- 6. design: steel area for a required ultimate moment
function c6Generate(seed){
  const r=mulberry32(seed),us=r()<0.4;
  for(let k=0;k<20000;k++){
    const b=pick(r,us?[8,10,12,14]:[200,250,300,350]),d=pick(r,us?[14,16,18,20,24]:[350,400,450,500,600]),fc=pick(r,us?[3000,4000,5000]:[20,25,30,35]),fy=pick(r,us?[40000,60000]:[280,420]);
    const cf=us?12000:1e6,Mreq=pick(r,us?range(40,300,10):range(50,500,10)),Mn=Mreq*cf/0.9;
    // Mn = As fy (d - 0.425 As fy /(0.72 b fc)) -> quadratic in As
    const a=0.425*fy*fy/(0.72*b*fc),bq=-fy*d,disc=bq*bq-4*a*Mn;if(disc<0) continue;const As=(-bq-Math.sqrt(disc))/(2*a);
    const o=ult(b,d,As,fc,fy);if(o.est<0.005) continue;

  throw new Error("no valid problem");
}
const C6={name:"Reinforced concrete design: steel area for a required ultimate moment",generate:c6Generate,
  figure:p=>rcFig({...p,As:"?",D:p.d*1.12},false).replace(/st<\/tspan> = \? (in\.²|mm²)/,"st</tspan> = ?"),
  statement:p=>{const S=p.us?"psi":"MPa",Mu=p.us?"kip·ft":"kN·m";return `<p>A rectangular reinforced concrete beam with b = ${p.b} ${p.us?"in.":"mm"} and d = ${p.d} ${p.us?"in.":"mm"} must have an ultimate moment M<sub>ult</sub> = ${p.Mreq} ${Mu}. The material properties are (σ<sub>co</sub>)<sub>ult</sub> = ${fmt(p.fc)} ${S} and (σ<sub>st</sub>)<sub>yp</sub> = ${fmt(p.fy)} ${S}.</p>
  <p>Assuming φ = 0.9, find the required steel area A<sub>st</sub>, the neutral-axis depth h, and the steel strain at failure (which must be at least 0.005 for the assumption to hold).</p>`},
  solution:(p,s)=>{const u=p.us?"in.":"mm",Mu=p.us?"kip·ft":"kN·m",cf=p.us?12000:1e6;return `<h3>1. Required nominal moment</h3><p>M<sub>nom</sub> = M<sub>ult</sub>/0.9 = ${sig(p.Mreq/0.9,4)} ${Mu}.</p>
  <h3>2. Steel area</h3><p>Substituting h = A<sub>st</sub>(σ<sub>st</sub>)<sub>yp</sub>/[0.72b(σ<sub>co</sub>)<sub>ult</sub>] into M<sub>nom</sub> = (d − 0.425h)A<sub>st</sub>(σ<sub>st</sub>)<sub>yp</sub> gives a quadratic in A<sub>st</sub>; the smaller root is the physical one:</p><p class="final">A<sub>st</sub> = ${sig(s.As,4)} ${p.us?"in.²":"mm²"}</p>
  <h3>3. Check</h3><p>h = ${sig(s.h,4)} ${u}; ε<sub>st</sub> = 0.003(d − h)/h = ${sig(s.est,4)} ≥ 0.005, so φ = 0.9 is confirmed.</p>`},
  fields:p=>{const u=p.us?"in.":"mm";return [{id:"As",label:"Required steel area",unit:p.us?"in.²":"mm²"},{id:"h",label:"Neutral axis depth h",unit:u},{id:"e",label:"Steel strain at failure",unit:""}]},
  truth:(p,s)=>({As:s.As,h:s.h,e:s.est}),note:"Answers within 2% are accepted."};

const TEMPLATES={"reinforced-wood":C1,"sandwich":C2,"rc-elastic":C3,"rc-t-beam":C4,"rc-ultimate":C5,"rc-design":C6};

const $=id=>document.getElementById(id);
let curKey,curSeed,cur;
const tidy=h=>h.replace(/\bin\.\.(?!\.)/g,"in.").replace(/\b([Aa]) (aluminum|inelastic|unequal)\b/g,"$1n $2");
function render(key,seed){
  curKey=key;curSeed=seed;const T=TEMPLATES[key];cur=T.generate(seed);const {p,s}=cur;
  $("typeSel").value=key;$("seedIn").value=seed;history.replaceState(null,"","#"+key+"-"+seed);
  $("fig").innerHTML=T.figure(p,s);$("statement").innerHTML=tidy(T.statement(p,s));
  $("answers").innerHTML=T.fields(p,s).map(f=>f.choices
    ?`<label>${tidy(f.label)}</label><select id="a_${f.id}"><option value="">choose</option>${f.choices.map(c=>`<option>${c}</option>`).join("")}</select><span class="mark" id="m_${f.id}"></span>`
    :`<label>${tidy(f.label)}</label><span><input type="text" id="a_${f.id}" autocomplete="off" inputmode="decimal"> ${f.unit||""}</span><span class="mark" id="m_${f.id}"></span>`).join("");
  $("ansNote").textContent=T.note||"";$("solution").innerHTML=tidy(T.solution(p,s));
  $("solution").style.display="none";$("solBtn").textContent="Show solution";
}
function check(){
  const T=TEMPLATES[curKey],{p,s}=cur,tr=T.truth(p,s);
  T.fields(p,s).forEach(f=>{
    const el=$("m_"+f.id),raw=$("a_"+f.id).value.trim();let ok=false;
    if(f.choices)ok=raw===tr[f.id];
    else{const v=parseFloat(raw.replace(/,/g,"")),t=tr[f.id];
      if(isFinite(v)&&f.abs!==undefined) ok=Math.abs(v-t)<=f.abs;
      else if(isFinite(v)) ok=f.signed?Math.abs(v-t)<=0.02*Math.abs(t)+1e-9:Math.abs(Math.abs(v)-Math.abs(t))<=0.02*Math.abs(t)+1e-9;
      if(isFinite(v)&&f.signed&&f.abs===undefined&&Math.abs(v)>0&&Math.sign(v)!==Math.sign(t)) ok=false}
    el.textContent=raw===""?"":ok?"Correct":"Not yet";el.className="mark "+(ok?"ok":"bad");
  });
}
const newSeed=()=>1+Math.floor(Math.random()*999999);
$("typeSel").innerHTML=Object.entries(TEMPLATES).map(([k,t])=>`<option value="${k}">${t.name}</option>`).join("");
$("typeSel").onchange=e=>render(e.target.value,newSeed());
$("newBtn").onclick=()=>render(curKey,newSeed());
$("loadBtn").onclick=()=>{const v=parseInt($("seedIn").value,10);if(v>0)render(curKey,v)};
$("checkBtn").onclick=check;
$("solBtn").onclick=e=>{const s=$("solution"),show=s.style.display!=="block";
  s.style.display=show?"block":"none";e.target.textContent=show?"Hide solution":"Show solution"};
(function(){const m=/^#([a-z0-9-]+?)-(\d+)$/.exec(location.hash);
  if(m&&TEMPLATES[m[1]])render(m[1],parseInt(m[2],10));else render(Object.keys(TEMPLATES)[0],newSeed())})();

</script>
</body>
</html>
