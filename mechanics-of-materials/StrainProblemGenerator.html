<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strain Problem Generator</title>
<style>
  :root{--ink:#1f2328;--muted:#5b6470;--line:#d9dde3;--bg:#fbfaf7;--card:#ffffff;--accent:#1e5a32;--ok:#1e7a3c;--bad:#b3261e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Georgia","Times New Roman",serif}
  header{padding:22px 24px 8px;max-width:980px;margin:0 auto}
  h1{font-size:1.45rem;margin:0 0 4px;font-weight:600}
  .sub{color:var(--muted);font-family:system-ui,sans-serif;font-size:.9rem}
  .sub a{color:var(--accent)}
  main{max-width:980px;margin:0 auto;padding:8px 24px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:14px 0}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-family:system-ui,sans-serif;font-size:.9rem}
  button{font:inherit;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:7px;padding:7px 14px;cursor:pointer}
  button.ghost{background:#fff;color:var(--accent)}
  button:hover{filter:brightness(1.08)}
  input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:9em}
  select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;max-width:100%}
  label{color:var(--muted)}
  svg{width:100%;height:auto;display:block}
  .statement p{margin:.3em 0}
  .answers{display:grid;grid-template-columns:auto auto auto;gap:8px 12px;align-items:center;font-family:system-ui,sans-serif;font-size:.92rem}
  .answers input{width:8em}
  .mark{font-weight:600;min-width:7em}.mark.ok{color:var(--ok)}.mark.bad{color:var(--bad)}
  #solution{display:none}
  #solution h3{font-size:1.05rem;margin:1.1em 0 .3em}
  table{border-collapse:collapse;font-family:system-ui,sans-serif;font-size:.88rem;margin:.4em 0}
  td,th{border-bottom:1px solid var(--line);padding:4px 12px;text-align:right}
  th{color:var(--muted);font-weight:600}
  td:first-child,th:first-child{text-align:left}
  .eq{font-family:"Cambria Math","STIX Two Math",Georgia,serif;background:#f4f5f2;border-radius:6px;padding:6px 10px;display:inline-block;margin:3px 0}
  .note{color:var(--muted);font-size:.92rem}
  .final{font-weight:600}
  @media (max-width:640px){.answers{grid-template-columns:1fr 1fr}.answers .mark{grid-column:span 2}}
</style>
</head>
<body>
<header>
  <h1>Mechanics of Materials: Strain Problem Generator</h1>
  <div class="sub">Axial deformation, generalized Hooke's law, statically indeterminate members, and thermal stress. Each problem is generated from a seed and solved exactly in the browser. Share the seed to reproduce a problem. <a href="index.html">All chapters</a></div>
</header>
<main>
  <div class="card bar"><label for="typeSel">Problem type</label><select id="typeSel"></select></div>
  <div class="card bar">
    <button id="newBtn">New problem</button>
    <label for="seedIn">Seed</label><input id="seedIn" type="number" min="1" step="1">
    <button class="ghost" id="loadBtn">Load seed</button>
  </div>
  <div class="card"><div id="fig"></div></div>
  <div class="card statement" id="statement"></div>
  <div class="card">
    <div class="answers" id="answers"></div>
    <div class="bar" style="margin-top:12px">
      <button id="checkBtn">Check answers</button>
      <button class="ghost" id="solBtn">Show solution</button>
      <span class="note" id="ansNote"></span>
    </div>
  </div>
  <div class="card" id="solution"></div>
</main>
<script>
// ===== common helpers: seeded random numbers, number formatting, SVG drawing
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pick=(r,arr)=>arr[Math.floor(r()*arr.length)];
const range=(a,b,s)=>{const o=[];for(let v=a;v<=b+1e-9;v+=s)o.push(+v.toFixed(4));return o};
function fmt(v,d=0){return Number(v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d})}
function sig(v,n=3){if(v===0)return "0";const e=Math.floor(Math.log10(Math.abs(v)));return fmt(+v.toPrecision(n),Math.min(20,Math.max(0,n-1-e)))}
function fx(v){for(let d=0;d<=4;d++)if(Math.abs(+v.toFixed(d)-v)<1e-9*Math.max(1,Math.abs(v)))return fmt(v,d);return sig(v,4)}
const FR={0.25:"¼",0.375:"⅜",0.5:"½",0.625:"⅝",0.75:"¾",0.875:"⅞",1:"1",1.25:"1¼",1.5:"1½"};
const dstr=v=>FR[v]||String(v);
const C={fill:"#f7e2c4",ln:"#78461a",load:"#aa1e28",dim:"#5b6470",ink:"#1f2328",green:"#1e5a32",light:"#cde1cd",steel:"#dfe4ea",steelln:"#46505c"};
const TX=(x,y,s,o={})=>`<text x="${x}" y="${y}" text-anchor="${o.a||"middle"}" font-size="${o.s||14}" fill="${o.c||C.ink}" font-family="Georgia,serif"${o.i?' font-style="italic"':""}>${s}</text>`;
const LN=(x1,y1,x2,y2,o={})=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.c||C.ln}" stroke-width="${o.w||1.5}"${o.d?` stroke-dasharray="${o.d}"`:""}${o.cap?' stroke-linecap="round"':""}/>`;
function AR(x1,y1,x2,y2,c=C.load,w=2.2){const a=Math.atan2(y2-y1,x2-x1),h=11,s=0.4;
  const p=(da)=>`${(x2-h*Math.cos(a+da)).toFixed(1)},${(y2-h*Math.sin(a+da)).toFixed(1)}`;
  return LN(x1,y1,x2-6*Math.cos(a),y2-6*Math.sin(a),{c,w})+`<polygon points="${x2.toFixed(1)},${y2.toFixed(1)} ${p(s)} ${p(-s)}" fill="${c}"/>`}
const RC=(x,y,w,h,o={})=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${o.f||C.fill}" stroke="${o.c||C.ln}" stroke-width="${o.w||1.5}"/>`;
const CI=(x,y,r,o={})=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${o.f||"#fff"}" stroke="${o.c||C.ln}" stroke-width="${o.w||1.5}"/>`;
function DIMH(x1,x2,y,label,o={}){const up=o.up?-6:16;
  return LN(x1,y,x2,y,{c:C.dim,w:1})+LN(x1,y-5,x1,y+5,{c:C.dim,w:1})+LN(x2,y-5,x2,y+5,{c:C.dim,w:1})+TX((x1+x2)/2,y+up,label,{s:13,c:C.dim})}
function DIMV(x,y1,y2,label,o={}){const dx=o.left?-8:8;
  return LN(x,y1,x,y2,{c:C.dim,w:1})+LN(x-5,y1,x+5,y1,{c:C.dim,w:1})+LN(x-5,y2,x+5,y2,{c:C.dim,w:1})+TX(x+dx,(y1+y2)/2+4,label,{s:13,c:C.dim,a:o.left?"end":"start"})}
function HATCH(x,y,w,h){let s=RC(x,y,w,h,{f:"#eceae4",c:C.ln,w:1});
  for(let i=-h;i<w;i+=8){const xa=Math.max(x,x+i),ya=y+(xa-(x+i)),xb=Math.min(x+w,x+i+h),yb=y+(xb-(x+i));s+=LN(xa,ya,xb,yb,{c:"#9a8f80",w:.8})}return s}
const SVG=(w,h,b)=>`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img">${b}</svg>`;
const sub=(a,b)=>`${a}<sub>${b}</sub>`;
const iv=s=>`<i>${s}</i>`;

// ===== 1. stepped bar: axial force diagram and normal stress in each segment
const NODES="ABCDEFGHIJKLMNOP";
function sbGenerate(seed){
  const r=mulberry32(seed);
  for(let k=0;k<5000;k++){
    const us=r()<0.4,n=pick(r,[3,3,4]),A=[],Ls=[],F=[];
    for(let i=0;i<n;i++){
      A.push(pick(r,us?[0.8,1.0,1.2,1.5,1.6,1.8,2.0,2.5]:[300,400,500,600,800,1000,1200]));
      Ls.push(pick(r,us?[1.0,1.2,1.5,1.6,1.8,2.0]:[0.8,1.0,1.2,1.5,2.0]));
      F.push(pick(r,us?range(1000,9000,500):range(5000,40000,1000))*pick(r,[1,-1]));
    }
    F.push(-F.reduce((a,b)=>a+b,0));                       // the bar is in equilibrium
    const lo=us?1000:5000;
    if(Math.abs(F[n])<lo||Math.max(...F.map(Math.abs))>(us?16000:70000)) continue;
    const N=[];let c=0;for(let i=0;i<n;i++){c+=F[i];N.push(-c)}
    if(N.some(v=>Math.abs(v)<lo/2)||!(N.some(v=>v>0)&&N.some(v=>v<0))) continue;
    const sg=N.map((v,i)=>v/A[i]),m=sg.map(Math.abs),mx=Math.max(...m),imax=m.indexOf(mx);
    if(m.some((v,i)=>i!==imax&&v>0.9*mx)) continue;
    return {p:{us,n,A,Ls,F},s:{N,sg,imax,smax:mx}};
  }
  throw new Error("no valid problem");
}
const sbSeg=i=>NODES[i]+NODES[i+1];
function sbFmtF(p,v){return p.us?`${fmt(Math.abs(v))} lb`:`${fmt(Math.abs(v)/1000)} kN`}
function sbFigure(p){
  const x0=90,W=580,tot=p.Ls.reduce((a,b)=>a+b,0),maxA=Math.max(...p.A),yc=165;let x=x0,b="";
  const xs=[x0];p.Ls.forEach(l=>{x+=W*l/tot;xs.push(x)});
  p.A.forEach((a,i)=>{const h=36+54*Math.sqrt(a/maxA);
    b+=RC(xs[i],yc-h/2,xs[i+1]-xs[i],h)+TX((xs[i]+xs[i+1])/2,yc+5,`${fmt(a,p.us?1:0)} ${p.us?"in.²":"mm²"}`,{s:13})
      +DIMH(xs[i],xs[i+1],262,`${fmt(p.Ls[i],1)} ${p.us?"ft":"m"}`)});
  p.F.forEach((f,i)=>{const X=xs[i],d=f>0?1:-1;
    b+=LN(X,84,X,yc-50,{c:C.dim,w:1,d:"3 3"})+AR(X,84,X+d*58,84)+TX(X+d*29,72,sbFmtF(p,f),{s:13,c:C.load})
      +TX(X,yc+75,NODES[i],{s:15,i:1})});
  return SVG(760,290,b);
}
function sbStatement(p){
  const F=p.F.map((f,i)=>`${iv(NODES[i])}: ${sbFmtF(p,f)} to the ${f>0?"right":"left"}`).join("; ");
  return `<p>The stepped bar ${NODES[0]}${NODES[p.n]} below consists of ${p.n} cylindrical segments with different cross-sectional areas and lengths, as shown. The bar is in equilibrium under the axial loads ${F}.</p>
  <p>Find the normal stress in each segment (tension positive, compression negative), and identify the segment with the largest stress magnitude.</p>`;
}
function sbSolution(p,s){
  const u=p.us?"lb":"N",su=p.us?"psi":"MPa";let h="<h3>1. Axial force in each segment</h3><p>Cut the bar inside a segment and write ΣF<sub>x</sub> = 0 for the part to the left of the cut. With tension positive, the axial force equals minus the sum of the external loads (positive to the right) to the left of the cut.</p><table><tr><th>Segment</th><th>N ("+u+")</th><th>A ("+(p.us?"in.²":"mm²")+")</th><th>σ = N/A ("+su+")</th></tr>";
  s.N.forEach((n,i)=>{h+=`<tr><td>${sbSeg(i)}</td><td>${fmt(n)} (${n>0?"T":"C"})</td><td>${fmt(p.A[i],p.us?1:0)}</td><td>${sig(s.sg[i])} (${n>0?"T":"C"})</td></tr>`});
  h+=`</table><p class="note">The segment lengths and the material do not enter the stress calculation.</p><h3>2. Largest stress</h3><p class="final">Segment ${sbSeg(s.imax)}, with |σ| = ${sig(s.smax)} ${su}.</p>`;
  return h;
}
const SB={name:"Stepped bar: axial force and normal stress in each segment",
  generate:sbGenerate,figure:sbFigure,statement:sbStatement,solution:sbSolution,
  fields:(p,s)=>[...p.A.map((_,i)=>({id:"s"+i,label:`Stress in segment ${sbSeg(i)} (signed, tension +)`,unit:p.us?"psi":"MPa",signed:true})),
    {id:"imax",label:"Segment with the largest |σ|",unit:"",choices:p.A.map((_,i)=>sbSeg(i))}],
  truth:(p,s)=>{const o={imax:sbSeg(s.imax)};s.sg.forEach((v,i)=>o["s"+i]=v);return o},
  note:"Enter signed stresses; tension is positive."};

// ===== 2. two bars meeting at a pin that carries a weight: forces and the safe weight
function tbGenerate(seed){
  const r=mulberry32(seed);
  for(let k=0;k<5000;k++){
    const us=r()<0.4,al=pick(r,range(25,65,5)),be=pick(r,range(25,65,5));
    if(al+be<60||al+be>120) continue;
    const A=[pick(r,us?range(0.2,1.0,0.1):[200,300,400,500,600,800]),pick(r,us?range(0.2,1.0,0.1):[200,300,400,500,600,800])];
    const sw=[pick(r,us?range(12,24,2):range(80,160,10)),pick(r,us?range(12,24,2):range(80,160,10))];
    const p={us,al,be,A,sw},s=tbSolve(p);
    if(Math.abs(s.W[0]-s.W[1])<0.1*Math.min(...s.W)) continue;
    return {p,s};
  }
  throw new Error("no valid problem");
}
function tbSolve(p){
  const a=p.al*Math.PI/180,b=p.be*Math.PI/180,D=Math.sin(a+b);
  const k=[Math.cos(b)/D,Math.cos(a)/D];                    // P_AB/W and P_AC/W
  const cap=p.A.map((A,i)=>p.sw[i]*A/(p.us?1:1000));          // kips (ksi·in.²), or kN (MPa·mm² = N)
  const W=cap.map((c,i)=>c/k[i]),Ws=Math.min(...W);
  return {k,cap,W,Ws,gov:W[0]<W[1]?"AB":"AC"};
}
function tbFigure(p){
  const Ax=380,Ay=205,Lp=165,a=p.al*Math.PI/180,b=p.be*Math.PI/180;
  const Bx=Ax-Lp*Math.cos(a),By=Ay-Lp*Math.sin(a),Cx=Ax+Lp*Math.cos(b),Cy=Ay-Lp*Math.sin(b);
  const arc=(cx,cy,ang,left)=>{const r=34,x2=cx+(left?-1:1)*r*Math.cos(ang),y2=cy+r*Math.sin(ang);
    return LN(cx,cy,cx+(left?-1:1)*(r+14),cy,{c:C.dim,w:1,d:"3 3"})+`<path d="M ${cx+(left?-r:r)} ${cy} A ${r} ${r} 0 0 ${left?0:1} ${x2.toFixed(1)} ${y2.toFixed(1)}" fill="none" stroke="${C.dim}" stroke-width="1.2"/>`};
  const wl=(cx,cy,ang,left)=>{const r=56;return [cx+(left?-1:1)*r*Math.cos(ang/2),cy+r*Math.sin(ang/2)+5]};
  const [al_x,al_y]=wl(Bx,By,a,false),[be_x,be_y]=wl(Cx,Cy,b,true);
  let s=HATCH(Bx-22,By-24,44,24)+HATCH(Cx-22,Cy-24,44,24)
   +LN(Bx,By,Ax,Ay,{w:6,cap:1})+LN(Cx,Cy,Ax,Ay,{w:6,cap:1})+CI(Bx,By,5)+CI(Cx,Cy,5)+CI(Ax,Ay,6,{f:"#fff"})
   +arc(Bx,By,a,false)+arc(Cx,Cy,b,true)
   +TX(al_x+4,al_y,"α",{s:15,i:1,c:C.dim})+TX(be_x-4,be_y,"β",{s:15,i:1,c:C.dim})
   +AR(Ax,Ay,Ax,Ay+70)+TX(Ax+16,Ay+60,"W",{s:16,i:1,c:C.load,a:"start"})
   +TX(Bx-30,By+5,"B",{s:15,i:1,a:"end"})+TX(Cx+30,Cy+5,"C",{s:15,i:1,a:"start"})+TX(Ax-14,Ay+22,"A",{s:15,i:1,a:"end"})
   +TX((Bx+Ax)/2-6,(By+Ay)/2+30,`AB`,{s:13,c:C.dim})+TX((Cx+Ax)/2+6,(Cy+Ay)/2+30,`AC`,{s:13,c:C.dim});
  return SVG(760,290,s);
}
function tbStatement(p){
  const u=p.us?"in.²":"mm²",su=p.us?"ksi":"MPa",Wu=p.us?"kips":"kN";
  return `<p>A weight ${iv("W")} hangs from pin ${iv("A")}, which is held by two bars. Bar ${iv("AB")} makes an angle α = ${p.al}° with the horizontal and bar ${iv("AC")} makes an angle β = ${p.be}°. The bars are pinned to the supports at ${iv("B")} and ${iv("C")}; their weight is negligible. The cross-sectional areas are ${fmt(p.A[0],p.us?1:0)} ${u} (${iv("AB")}) and ${fmt(p.A[1],p.us?1:0)} ${u} (${iv("AC")}); the working stresses are ${p.sw[0]} ${su} (${iv("AB")}) and ${p.sw[1]} ${su} (${iv("AC")}).</p>
  <p>Express the bar forces as multiples of ${iv("W")}, then find the largest weight each bar can carry and the largest weight that can be hung safely.</p>`;
}
function tbSolution(p,s){
  const Wu=p.us?"kips":"kN",Fu=p.us?"kips":"kN";
  return `<h3>1. Equilibrium of pin A</h3><p>Both bars are two-force members; assume both in tension.</p>
  <p class="eq">ΣF<sub>x</sub> = 0: P<sub>AC</sub> cos β − P<sub>AB</sub> cos α = 0</p><br><p class="eq">ΣF<sub>y</sub> = 0: P<sub>AB</sub> sin α + P<sub>AC</sub> sin β − W = 0</p>
  <p>Solving, P<sub>AB</sub> = W cos β / sin(α+β) = ${sig(s.k[0],4)} W and P<sub>AC</sub> = W cos α / sin(α+β) = ${sig(s.k[1],4)} W.</p>
  <h3>2. Weight limited by each bar</h3>
  <p>Bar AB: P<sub>AB</sub> = σ<sub>w</sub>A = ${sig(s.cap[0])} ${Fu}, so W = ${sig(s.cap[0])}/${sig(s.k[0],4)} = ${sig(s.W[0])} ${Wu}.</p>
  <p>Bar AC: P<sub>AC</sub> = σ<sub>w</sub>A = ${sig(s.cap[1])} ${Fu}, so W = ${sig(s.cap[1])}/${sig(s.k[1],4)} = ${sig(s.W[1])} ${Wu}.</p>
  <h3>3. Safe weight</h3><p class="final">W<sub>safe</sub> = ${sig(s.Ws)} ${Wu}, governed by bar ${s.gov}. The larger value must be discarded because it would overstress the other bar.</p>`;
}
const TB={name:"Two bars supporting a weight: bar forces and safe load",
  generate:tbGenerate,figure:tbFigure,statement:tbStatement,solution:tbSolution,
  fields:(p,s)=>[{id:"kAB",label:"P_AB / W",unit:""},{id:"kAC",label:"P_AC / W",unit:""},
    {id:"W1",label:"Largest W allowed by bar AB",unit:p.us?"kips":"kN"},{id:"W2",label:"Largest W allowed by bar AC",unit:p.us?"kips":"kN"},
    {id:"Ws",label:"Largest safe W",unit:p.us?"kips":"kN"},{id:"gov",label:"Governing bar",unit:"",choices:["AB","AC"]}],
  truth:(p,s)=>({kAB:s.k[0],kAC:s.k[1],W1:s.W[0],W2:s.W[1],Ws:s.Ws,gov:s.gov}),
  note:"Answers within 2% are accepted."};

// ===== 3. Warren truss: member stresses and required area (method of joints, solved numerically)
function trSolve(p){
  const n=p.n,nodes=[];
  for(let i=0;i<=n;i++)nodes.push([i*p.a,0]);
  for(let i=0;i<n;i++)nodes.push([(i+0.5)*p.a,p.h]);
  const T=j=>n+1+j,mem=[];
  for(let i=0;i<n;i++)mem.push([i,i+1]);
  for(let i=0;i<n-1;i++)mem.push([T(i),T(i+1)]);
  for(let i=0;i<n;i++){mem.push([i,T(i)]);mem.push([T(i),i+1])}
  const m=mem.length,N=nodes.length,K=m+3,M=Array.from({length:2*N},()=>new Array(K+1).fill(0));
  mem.forEach(([i,j],k)=>{const dx=nodes[j][0]-nodes[i][0],dy=nodes[j][1]-nodes[i][1],L=Math.hypot(dx,dy);
    M[2*i][k]+=dx/L;M[2*i+1][k]+=dy/L;M[2*j][k]-=dx/L;M[2*j+1][k]-=dy/L});
  M[0][m]=1;M[1][m+1]=1;M[2*n+1][m+2]=1;                    // pin at node 0, roller at node n
  p.loads.forEach(([j,f])=>{M[2*j+1][K]-=-f});                // downward load f: -f in y; move to right side
  for(let c=0;c<K;c++){let pv=c;for(let r=c+1;r<2*N;r++)if(Math.abs(M[r][c])>Math.abs(M[pv][c]))pv=r;
    [M[c],M[pv]]=[M[pv],M[c]];for(let r=0;r<2*N;r++)if(r!==c){const f=M[r][c]/M[c][c];if(f)for(let q=c;q<=K;q++)M[r][q]-=f*M[c][q]}}
  const x=[];for(let c=0;c<K;c++)x.push(M[c][K]/M[c][c]);
  return {nodes,mem,F:x.slice(0,m),R:x.slice(m)};
}
function trGenerate(seed){
  const r=mulberry32(seed);
  for(let k=0;k<5000;k++){
    const us=r()<0.4,n=pick(r,[3,4,4]),a=pick(r,us?[6,8,10]:[3,4,5]),h=pick(r,us?[6,8,9,12]:[3,4,5]);
    const cand=[];for(let j=1;j<n;j++)cand.push(j);const top=[];for(let j=0;j<n;j++)top.push(n+1+j);
    const nl=pick(r,[2,3]),pickN=[...cand,...top];const chosen=new Set();while(chosen.size<nl)chosen.add(pick(r,pickN));
    const loads=[...chosen].map(j=>[j,pick(r,us?range(5,30,5):range(20,120,10))]);
    const p={us,n,a,h,loads,A:pick(r,us?[1.2,1.8,2.4,3.0]:[800,1000,1200,1400,1800])};
    const sol=trSolve(p);

  return `<p>A concrete post with a square cross section ${p.b} × ${p.b} ${u.L} and length ${dL(p.L,p.us)} ${u.Lb} is reinforced axially with four symmetrically placed steel bars, each of cross-sectional area ${p.As} ${u.A}. It carries the axial compressive load P = ${fF(p.P,p.us)} ${u.F} through a rigid cap. The moduli of elasticity are ${fmt(p.Es/1000)} ${u.E} for steel and ${fmt(p.Ec/1000,1)} ${u.E} for concrete.</p>
  <p>Find the compressive stresses in the steel and in the concrete and the shortening of the post. Then find the largest safe load if the working stresses are ${p.sst} ${u.S} for steel and ${p.sco} ${u.S} for concrete.</p>`;
}
function rcSolution(p,s){
  const u=UU(p.us);
  return `<h3>1. Equilibrium and compatibility</h3><p>Equilibrium: σ<sub>st</sub>A<sub>st</sub> + σ<sub>co</sub>A<sub>co</sub> = P, with A<sub>st</sub> = ${sig(s.Ast,4)} ${u.A} and A<sub>co</sub> = ${p.b}² − A<sub>st</sub> = ${sig(s.Aco,4)} ${u.A}.</p>
  <p>Compatibility: both materials shorten equally, so σ<sub>st</sub>/E<sub>st</sub> = σ<sub>co</sub>/E<sub>co</sub>, or σ<sub>st</sub> = nσ<sub>co</sub> with n = E<sub>st</sub>/E<sub>co</sub> = ${sig(s.n,4)}.</p>
  <h3>2. Stresses and shortening</h3><p class="eq">σ<sub>co</sub> = P/(A<sub>co</sub> + nA<sub>st</sub>) = ${sig(s.sco)} ${u.S}, σ<sub>st</sub> = ${sig(s.sst)} ${u.S}</p><p>δ = σ<sub>co</sub>L/E<sub>co</sub> = ${sig(s.d)} ${u.L}.</p>
  <h3>3. Safe load</h3><p>The stresses must satisfy σ<sub>st</sub> = nσ<sub>co</sub>, so the working stresses cannot both be reached. Steel limit: P = (σ<sub>st,w</sub>/n)(A<sub>co</sub> + nA<sub>st</sub>) = ${fF(s.Pst,p.us)} ${u.F}. Concrete limit: P = σ<sub>co,w</sub>(A<sub>co</sub> + nA<sub>st</sub>) = ${fF(s.Pco,p.us)} ${u.F}.</p>
  <p class="final">P<sub>max</sub> = ${fF(s.Pm,p.us)} ${u.F}, governed by the ${s.gov.toLowerCase()}.</p>`;
}
const RCP={name:"Reinforced concrete post: stresses and safe load (indeterminate)",

    {id:"d",label:"Shortening of the post",unit:u.L},{id:"Pm",label:"Largest safe load",unit:u.F},{id:"gov",label:"Governing material",unit:"",choices:["Steel","Concrete"]}]},
  truth:(p,s)=>({sst:s.sst,sco:s.sco,d:s.d,Pm:s.Pm*UU(p.us).f,gov:s.gov}),note:"Answers within 2% are accepted."};

  <h3>3. Safe load</h3><p>Rod at its working stress: P = ${fF(s.Pa,p.us)} ${u.F}. Tube at its working stress: P<sub>t</sub> = σ<sub>w</sub>A<sub>t</sub>, δ<sub>t</sub> = P<sub>t</sub>/k<sub>t</sub>, P = P<sub>t</sub> + k<sub>r</sub>(δ<sub>t</sub> + Δ) = ${fF(s.Pb,p.us)} ${u.F}.</p>

  const r=mulberry32(seed);
  for(let k=0;k<5000;k++){
    const us=r()<0.4,u=UU(us),m=pick(r,PLs),L=pick(r,us?[3,4,5,6,8,10]:[1,1.5,2,2.5,3])*u.lb,A=pick(r,us?[0.5,0.75,1,1.5,2]:[300,500,800,1000,1200]);
    const gap=pick(r,us?[0.005,0.01,0.015,0.02]:[0.1,0.2,0.3,0.5]),dT=pick(r,us?range(40,200,10):range(20,100,5)),a=Am(m,us),E=Em(m,us);
    const dTc=gap/(a*L);if(dT<1.2*dTc) continue;
    const sg=-E*(a*dT-gap/L);if(Math.abs(sg)>(us?24:160)||Math.abs(sg)<(us?3:20)) continue;
    return {p:{us,m,L,A,gap,dT},s:{dTc,sg,F:-sg*A}};
  }
  throw new Error("no valid problem");
}
function tgFigure(p){
  const u=UU(p.us);
  let b=WALL(120,90,210)+WALL(640,90,210,false)+RC(120,130,500,40,{f:"#dfe4ea",c:C.steelln})
   +LN(620,125,620,92,{c:C.dim,w:1})+TX(630,80,`gap Δ = ${p.gap} ${u.L}`,{s:13,c:C.dim})+DIMH(120,620,240,`L = ${dL(p.L,p.us)} ${u.Lb}`)
   +TX(370,155,`${cap(MAT[p.m].n)}, A = ${p.A} ${u.A}`,{s:13});
  return SVG(760,270,b);
}
function tgStatement(p){
  const u=UU(p.us);
  return `<p>A ${MAT[p.m].n} rod of length ${dL(p.L,p.us)} ${u.Lb} and cross-sectional area ${p.A} ${u.A} is attached to the wall at the left. At the reference temperature there is a gap Δ = ${p.gap} ${u.L} between its right end and the right wall. Both walls are rigid. Use E = ${Estr(p.m,p.us)} and α = ${astr(p.m,p.us)}.</p>
  <p>Find the temperature rise at which the gap closes. Then, for a temperature rise of ${p.dT} ${u.dT}, find the stress in the rod and the force on each wall.</p>`;
}
function tgSolution(p,s){
  const u=UU(p.us);
  return `<h3>1. Closing the gap</h3><p>Free thermal expansion αΔT·L equals Δ when ΔT = Δ/(αL) = ${sig(s.dTc)} ${u.dT}.</p>
  <h3>2. Stress after closure</h3><p>Compatibility: the free expansion minus the shortening caused by the wall force P equals the gap,</p>
  <p class="eq">αΔT·L − PL/(EA) = Δ</p><p>so σ = −P/A = −E(αΔT − Δ/L) = <span class="final">${sig(s.sg)} ${u.S}</span> (compression), and the wall force is P = ${fF(s.F,p.us)} ${u.F}.</p>`;
}
const TG={name:"Thermal stress: rod with a gap at a rigid wall",
  generate:tgGenerate,figure:tgFigure,statement:tgStatement,solution:tgSolution,
  fields:p=>{const u=UU(p.us);return [{id:"dTc",label:"Temperature rise that closes the gap",unit:u.dT},{id:"sg",label:"Stress in the rod (signed, tension +)",unit:u.S,signed:true},{id:"F",label:"Force on each wall",unit:u.F}]},
  truth:(p,s)=>({dTc:s.dTc,sg:s.sg,F:s.F*UU(p.us).f}),note:"Answers within 2% are accepted; compression is negative."};

// ===== 12. compound bar between walls, temperature change
function tcGenerate(seed){
  const r=mulberry32(seed);
  for(let k=0;k<5000;k++){
    const us=r()<0.4,u=UU(us),M=[pick(r,PLs),pick(r,PLs)];if(M[0]===M[1]) continue;
    const A=[pick(r,us?[0.5,0.75,1,1.5,2,3]:[300,500,800,1000,1500,2000]),pick(r,us?[0.5,0.75,1,1.5,2,3]:[300,500,800,1000,1500,2000])];
    const L=[pick(r,us?[1,1.5,2,3,4]:[0.3,0.5,0.8,1.0,1.2])*u.lb,pick(r,us?[1,1.5,2,3,4]:[0.3,0.5,0.8,1.0,1.2])*u.lb],dT=pick(r,us?range(30,120,10):range(15,60,5))*pick(r,[1,-1]);
    const f=L.map((l,i)=>l/(Em(M[i],us)*A[i])),free=(Am(M[0],us)*L[0]+Am(M[1],us)*L[1])*dT,P=-free/(f[0]+f[1]),s1=P/A[0],s2=P/A[1];
    if(Math.max(Math.abs(s1),Math.abs(s2))>(us?24:160)||Math.min(Math.abs(s1),Math.abs(s2))<(us?2:15)) continue;
    const uB=Am(M[0],us)*L[0]*dT+P*f[0];if(Math.abs(uB)<0.05*Math.abs(Am(M[0],us)*L[0]*dT)) continue;
    return {p:{us,M,A,L,dT},s:{f,free,P,s1,s2,uB}};
  }
  throw new Error("no valid problem");
}
function tcFigure(p){
  const u=UU(p.us),x0=110,W=540,sc=W/(p.L[0]+p.L[1]),xB=x0+p.L[0]*sc,yc=150,mx=Math.max(...p.A),fill={steel:"#dfe4ea",aluminum:"#eef1f4",bronze:"#ecd3a6",copper:"#e9b996"};
  const h=i=>34+46*Math.sqrt(p.A[i]/mx);
  let b=WALL(x0,70,230)+WALL(x0+W,70,230,false)+RC(x0,yc-h(0)/2,xB-x0,h(0),{f:fill[p.M[0]],c:C.steelln})+RC(xB,yc-h(1)/2,x0+W-xB,h(1),{f:fill[p.M[1]],c:C.steelln});
  b+=TX((x0+xB)/2,yc-2,cap(MAT[p.M[0]].n),{s:13})+TX((x0+xB)/2,yc+15,`${p.A[0]} ${u.A}`,{s:12,c:C.dim})+TX((xB+x0+W)/2,yc-2,cap(MAT[p.M[1]].n),{s:13})+TX((xB+x0+W)/2,yc+15,`${p.A[1]} ${u.A}`,{s:12,c:C.dim})
   +TX(x0+12,250,"A",{s:15,i:1})+TX(xB,250,"B",{s:15,i:1})+TX(x0+W-12,250,"C",{s:15,i:1})
   +DIMH(x0,xB,275,`${dL(p.L[0],p.us)} ${u.Lb}`)+DIMH(xB,x0+W,275,`${dL(p.L[1],p.us)} ${u.Lb}`);
  return SVG(760,300,b);
}
function tcStatement(p){
  const u=UU(p.us),mt=m=>`${MAT[m].n}: E = ${Estr(m,p.us)}, α = ${astr(m,p.us)}`;
  return `<p>The compound bar ${iv("ABC")} is firmly attached to unyielding supports and is stress-free at the reference temperature. Segment ${iv("AB")} is ${MAT[p.M[0]].n} and segment ${iv("BC")} is ${MAT[p.M[1]].n}; areas and lengths are shown. Use ${mt(p.M[0])}; ${mt(p.M[1])}.</p>
  <p>The temperature ${p.dT>0?"rises":"drops"} by ${Math.abs(p.dT)} ${u.dT}. Find the stress in each segment and the displacement of the junction ${iv("B")} (positive toward ${iv("C")}).</p>`;
}
function tcSolution(p,s){
  const u=UU(p.us);
  return `<h3>1. Compatibility</h3><p>Remove the wall at C and let the bar change length freely: δ<sub>T</sub> = (α<sub>AB</sub>L<sub>AB</sub> + α<sub>BC</sub>L<sub>BC</sub>)ΔT = ${sig(s.free)} ${u.L}. The axial force P (same in both segments, tension positive) must restore the original length:</p>
  <p class="eq">δ<sub>T</sub> + P(L<sub>AB</sub>/(E<sub>AB</sub>A<sub>AB</sub>) + L<sub>BC</sub>/(E<sub>BC</sub>A<sub>BC</sub>)) = 0</p>
  <p>so P = ${fF(s.P,p.us)} ${u.F} (${s.P>0?"tension":"compression"}).</p>
  <h3>2. Stresses</h3><p>σ<sub>AB</sub> = P/A<sub>AB</sub> = ${sig(s.s1)} ${u.S}; σ<sub>BC</sub> = P/A<sub>BC</sub> = ${sig(s.s2)} ${u.S}.</p>
  <h3>3. Displacement of B</h3><p>It equals the change in length of AB, thermal plus mechanical:</p><p class="eq">u<sub>B</sub> = α<sub>AB</sub>L<sub>AB</sub>ΔT + PL<sub>AB</sub>/(E<sub>AB</sub>A<sub>AB</sub>) = ${sig(s.uB)} ${u.L}</p>`;
}
const TC={name:"Thermal stress: compound bar between rigid walls",
  generate:tcGenerate,figure:tcFigure,statement:tcStatement,solution:tcSolution,
  fields:p=>{const u=UU(p.us);return [{id:"s1",label:"Stress in AB (signed, tension +)",unit:u.S,signed:true},{id:"s2",label:"Stress in BC (signed, tension +)",unit:u.S,signed:true},{id:"uB",label:"Displacement of B (signed, toward C +)",unit:u.L,signed:true}]},
  truth:(p,s)=>({s1:s.s1,s2:s.s2,uB:s.uB}),note:"Enter signed values; tension is positive."};

// ===== 13. rigid block on three rods, load and temperature change
function b3Generate(seed){
  const r=mulberry32(seed);
  for(let k=0;k<5000;k++){
    const us=r()<0.4,u=UU(us),m1="steel",m2=pick(r,["bronze","aluminum","copper"]);
    const A1=pick(r,us?[0.5,0.75,1]:[300,400,500,600]),A2=pick(r,us?[1,1.5,2,2.5]:[600,800,1000,1200,1500]);
    const L1=pick(r,us?[2,2.5,3,4]:[0.6,0.8,1.0,1.2])*u.lb,L2=pick(r,us?[2,2.5,3,4]:[0.6,0.8,1.0,1.2])*u.lb;
    const W=pick(r,us?range(6,40,2):range(30,200,10).map(v=>v*1000)),dT=pick(r,us?range(20,120,10):range(10,60,5));
    const f1=L1/(Em(m1,us)*A1),f2=L2/(Em(m2,us)*A2),a1=Am(m1,us),a2=Am(m2,us);
    const P1=(W*f2+(a2*L2-a1*L1)*dT)/(f1+2*f2),P2=W-2*P1;
    if(P1<=0.15*W||P2<=0.1*W) continue;
    const dT0=(W/2)*f1/(a2*L2-a1*L1);if(!(dT0>dT*1.1)) continue;
    const s1=P1/A1,s2=P2/A2;if(Math.max(s1,s2)>(us?24:160)) continue;
    return {p:{us,m1,m2,A1,A2,L1,L2,W,dT},s:{f1,f2,P1,P2,s1,s2,dT0}};
  }
  throw new Error("no valid problem");
}
function b3Figure(p){
  const u=UU(p.us),Lm=Math.max(p.L1,p.L2),hs=150/Lm,yb=220,y1=yb-p.L1*hs,y2=yb-p.L2*hs,xs=[220,380,540];
  let b=CEIL(180,260,y1)+CEIL(500,580,y1)+CEIL(340,420,y2)+ROD(xs[0],y1,yb,"")+ROD(xs[2],y1,yb,"")+ROD(xs[1],y2,yb,"",{c:"#a0703a",w:6})
   +RC(170,yb,420,46,{f:"#c9ced6",c:C.steelln})+TX(380,yb+28,`W = ${fF(p.W,p.us)} ${u.F}`,{s:14})
   +TX(xs[0]-10,(y1+yb)/2,`${cap(MAT[p.m1].n)}`,{s:12,c:C.dim,a:"end"})+TX(xs[0]-10,(y1+yb)/2+15,`${p.A1} ${u.A}`,{s:12,c:C.dim,a:"end"})
   +TX(xs[2]+10,(y1+yb)/2,`${cap(MAT[p.m1].n)}`,{s:12,c:C.dim,a:"start"})+TX(xs[2]+10,(y1+yb)/2+15,`${p.A1} ${u.A}`,{s:12,c:C.dim,a:"start"})
   +TX(xs[1]+10,(y2+yb)/2,`${cap(MAT[p.m2].n)}`,{s:12,c:C.dim,a:"start"})+TX(xs[1]+10,(y2+yb)/2+15,`${p.A2} ${u.A}`,{s:12,c:C.dim,a:"start"})
   +DIMV(140,y1,yb,`${dL(p.L1,p.us)} ${u.Lb}`,{left:1})+DIMV(640,y2,yb,`${dL(p.L2,p.us)} ${u.Lb}`);
  return SVG(760,300,b);
}
function b3Statement(p){
  const u=UU(p.us),mt=m=>`${MAT[m].n}: E = ${Estr(m,p.us)}, α = ${astr(m,p.us)}`;
  return `<p>A homogeneous rigid block of weight W = ${fF(p.W,p.us)} ${u.F} is supported by three symmetrically placed vertical rods: two ${MAT[p.m1].n} rods of length ${dL(p.L1,p.us)} ${u.Lb} and a central ${MAT[p.m2].n} rod of length ${dL(p.L2,p.us)} ${u.Lb}. The lower ends of the rods were at the same level before the block was attached. Areas are shown. Use ${mt(p.m1)}; ${mt(p.m2)}.</p>
  <p>After the block is attached, the temperature of all rods rises by ${p.dT} ${u.dT}. Find the stress in each rod. Then find the temperature rise at which the entire weight is carried by the ${MAT[p.m1].n} rods.</p>`;
}
function b3Solution(p,s){
  const u=UU(p.us);
  return `<h3>1. Equilibrium</h3><p>By symmetry the two ${MAT[p.m1].n} rods carry equal forces P₁: 2P₁ + P₂ = W.</p>
  <h3>2. Compatibility</h3><p>The block stays level, so all rods elongate equally:</p>
  <p class="eq">P₁L₁/(E₁A₁) + α₁ΔT·L₁ = P₂L₂/(E₂A₂) + α₂ΔT·L₂</p>
  <p>Substituting P₂ = W − 2P₁: P₁ = [W·f₂ + (α₂L₂ − α₁L₁)ΔT]/(f₁ + 2f₂), with f = L/(EA). This gives P₁ = ${fF(s.P1,p.us)} ${u.F} and P₂ = ${fF(s.P2,p.us)} ${u.F}.</p>
  <h3>3. Stresses</h3><p>σ<sub>${MAT[p.m1].n}</sub> = ${sig(s.s1)} ${u.S}; σ<sub>${MAT[p.m2].n}</sub> = ${sig(s.s2)} ${u.S} (both tension).</p>
  <h3>4. Central rod unloaded</h3><p>Set P₂ = 0 and P₁ = W/2 in the compatibility equation: ΔT = (W/2)f₁/(α₂L₂ − α₁L₁) = <span class="final">${sig(s.dT0)} ${u.dT}</span>.</p>`;
}
const B3={name:"Rigid block on three rods: load and temperature (indeterminate)",
  generate:b3Generate,figure:b3Figure,statement:b3Statement,solution:b3Solution,
  fields:p=>{const u=UU(p.us);return [{id:"s1",label:`Stress in each ${MAT[p.m1].n} rod`,unit:u.S},{id:"s2",label:`Stress in the ${MAT[p.m2].n} rod`,unit:u.S},{id:"dT0",label:"Temperature rise that unloads the central rod",unit:u.dT}]},
  truth:(p,s)=>({s1:s.s1,s2:s.s2,dT0:s.dT0}),note:"Answers within 2% are accepted."};

const TEMPLATES={
  "tension-test":TT,"compound-bar":CB,"rigid-bar-rod":RB,"hooke-law":GH,"confined":CF,"shear-mount":SM,
  "rc-post":RCP,"rod-in-tube":RT,"bar-walls":BW,"rigid-bar-two-rods":R2,"thermal-gap":TG,"thermal-compound":TC,"block-three-rods":B3};

const $=id=>document.getElementById(id);
let curKey,curSeed,cur;
const tidy=h=>h.replace(/\bin\.\.(?!\.)/g,"in.").replace(/\b([Aa]) (aluminum|inelastic|unequal)\b/g,"$1n $2");
function render(key,seed){
  curKey=key;curSeed=seed;const T=TEMPLATES[key];cur=T.generate(seed);const {p,s}=cur;
  $("typeSel").value=key;$("seedIn").value=seed;history.replaceState(null,"","#"+key+"-"+seed);
  $("fig").innerHTML=T.figure(p,s);$("statement").innerHTML=tidy(T.statement(p,s));
  $("answers").innerHTML=T.fields(p,s).map(f=>f.choices
    ?`<label>${tidy(f.label)}</label><select id="a_${f.id}"><option value="">choose</option>${f.choices.map(c=>`<option>${c}</option>`).join("")}</select><span class="mark" id="m_${f.id}"></span>`
    :`<label>${tidy(f.label)}</label><span><input type="text" id="a_${f.id}" autocomplete="off" inputmode="decimal"> ${f.unit||""}</span><span class="mark" id="m_${f.id}"></span>`).join("");
  $("ansNote").textContent=T.note||"";$("solution").innerHTML=tidy(T.solution(p,s));
  $("solution").style.display="none";$("solBtn").textContent="Show solution";
}
function check(){
  const T=TEMPLATES[curKey],{p,s}=cur,tr=T.truth(p,s);
  T.fields(p,s).forEach(f=>{
    const el=$("m_"+f.id),raw=$("a_"+f.id).value.trim();let ok=false;
    if(f.choices)ok=raw===tr[f.id];
    else{const v=parseFloat(raw.replace(/,/g,"")),t=tr[f.id];
      if(isFinite(v)&&f.abs!==undefined) ok=Math.abs(v-t)<=f.abs;
      else if(isFinite(v)) ok=f.signed?Math.abs(v-t)<=0.02*Math.abs(t)+1e-9:Math.abs(Math.abs(v)-Math.abs(t))<=0.02*Math.abs(t)+1e-9;
      if(isFinite(v)&&f.signed&&f.abs===undefined&&Math.abs(v)>0&&Math.sign(v)!==Math.sign(t)) ok=false}
    el.textContent=raw===""?"":ok?"Correct":"Not yet";el.className="mark "+(ok?"ok":"bad");
  });
}
const newSeed=()=>1+Math.floor(Math.random()*999999);
$("typeSel").innerHTML=Object.entries(TEMPLATES).map(([k,t])=>`<option value="${k}">${t.name}</option>`).join("");
$("typeSel").onchange=e=>render(e.target.value,newSeed());
$("newBtn").onclick=()=>render(curKey,newSeed());
$("loadBtn").onclick=()=>{const v=parseInt($("seedIn").value,10);if(v>0)render(curKey,v)};
$("checkBtn").onclick=check;
$("solBtn").onclick=e=>{const s=$("solution"),show=s.style.display!=="block";
  s.style.display=show?"block":"none";e.target.textContent=show?"Hide solution":"Show solution"};
(function(){const m=/^#([a-z0-9-]+?)-(\d+)$/.exec(location.hash);
  if(m&&TEMPLATES[m[1]])render(m[1],parseInt(m[2],10));else render(Object.keys(TEMPLATES)[0],newSeed())})();

</script>
