<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combined Loads Problem Generator</title>
<style>
  :root{--ink:#1f2328;--muted:#5b6470;--line:#d9dde3;--bg:#fbfaf7;--card:#ffffff;--accent:#1e5a32;--ok:#1e7a3c;--bad:#b3261e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Georgia","Times New Roman",serif}
  header{padding:22px 24px 8px;max-width:980px;margin:0 auto}
  h1{font-size:1.45rem;margin:0 0 4px;font-weight:600}
  .sub{color:var(--muted);font-family:system-ui,sans-serif;font-size:.9rem}
  .sub a{color:var(--accent)}
  main{max-width:980px;margin:0 auto;padding:8px 24px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:14px 0}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-family:system-ui,sans-serif;font-size:.9rem}
  button{font:inherit;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:7px;padding:7px 14px;cursor:pointer}
  button.ghost{background:#fff;color:var(--accent)}
  button:hover{filter:brightness(1.08)}
  input[type=number],input[type=text]{font:inherit;border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:9em}
  select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;max-width:100%}
  label{color:var(--muted)}
  svg{width:100%;height:auto;display:block}
  .statement p{margin:.3em 0}
  .answers{display:grid;grid-template-columns:auto auto auto;gap:8px 12px;align-items:center;font-family:system-ui,sans-serif;font-size:.92rem}
  .answers input{width:8em}
  .mark{font-weight:600;min-width:7em}.mark.ok{color:var(--ok)}.mark.bad{color:var(--bad)}
  #solution{display:none}
  #solution h3{font-size:1.05rem;margin:1.1em 0 .3em}
  table{border-collapse:collapse;font-family:system-ui,sans-serif;font-size:.88rem;margin:.4em 0}
  td,th{border-bottom:1px solid var(--line);padding:4px 12px;text-align:right}
  th{color:var(--muted);font-weight:600}
  td:first-child,th:first-child{text-align:left}
  .eq{font-family:"Cambria Math","STIX Two Math",Georgia,serif;background:#f4f5f2;border-radius:6px;padding:6px 10px;display:inline-block;margin:3px 0}
  .note{color:var(--muted);font-size:.92rem}
  .final{font-weight:600}
  @media (max-width:640px){.answers{grid-template-columns:1fr 1fr}.answers .mark{grid-column:span 2}}
</style>
</head>
<body>
<header>
  <h1>Mechanics of Materials: Combined Loads Problem Generator</h1>
  <div class="sub">Pressure vessels, combined axial and bending loads, stress transformation, Mohr's circle, and strain rosettes. Each problem is generated from a seed and solved exactly in the browser. Share the seed to reproduce a problem. <a href="index.html">All chapters</a></div>
</header>
<main>
  <div class="card bar"><label for="typeSel">Problem type</label><select id="typeSel"></select></div>
  <div class="card bar">
    <button id="newBtn">New problem</button>
    <label for="seedIn">Seed</label><input id="seedIn" type="number" min="1" step="1">
    <button class="ghost" id="loadBtn">Load seed</button>
  </div>
  <div class="card"><div id="fig"></div></div>
  <div class="card statement" id="statement"></div>
  <div class="card">
    <div class="answers" id="answers"></div>
    <div class="bar" style="margin-top:12px">
      <button id="checkBtn">Check answers</button>
      <button class="ghost" id="solBtn">Show solution</button>
      <span class="note" id="ansNote"></span>
    </div>
  </div>
  <div class="card" id="solution"></div>
</main>
<script>
// ===== common helpers: seeded random numbers, number formatting, SVG drawing
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pick=(r,arr)=>arr[Math.floor(r()*arr.length)];
const range=(a,b,s)=>{const o=[];for(let v=a;v<=b+1e-9;v+=s)o.push(+v.toFixed(4));return o};
function fmt(v,d=0){return Number(v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d})}
function sig(v,n=3){if(v===0)return "0";const e=Math.floor(Math.log10(Math.abs(v)));return fmt(+v.toPrecision(n),Math.min(20,Math.max(0,n-1-e)))}
function fx(v){for(let d=0;d<=4;d++)if(Math.abs(+v.toFixed(d)-v)<1e-9*Math.max(1,Math.abs(v)))return fmt(v,d);return sig(v,4)}
const FR={0.25:"¼",0.375:"⅜",0.5:"½",0.625:"⅝",0.75:"¾",0.875:"⅞",1:"1",1.25:"1¼",1.5:"1½"};
const dstr=v=>FR[v]||String(v);
const C={fill:"#f7e2c4",ln:"#78461a",load:"#aa1e28",dim:"#5b6470",ink:"#1f2328",green:"#1e5a32",light:"#cde1cd",steel:"#dfe4ea",steelln:"#46505c"};
const TX=(x,y,s,o={})=>`<text x="${x}" y="${y}" text-anchor="${o.a||"middle"}" font-size="${o.s||14}" fill="${o.c||C.ink}" font-family="Georgia,serif"${o.i?' font-style="italic"':""}>${s}</text>`;
const LN=(x1,y1,x2,y2,o={})=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.c||C.ln}" stroke-width="${o.w||1.5}"${o.d?` stroke-dasharray="${o.d}"`:""}${o.cap?' stroke-linecap="round"':""}/>`;
function AR(x1,y1,x2,y2,c=C.load,w=2.2){const a=Math.atan2(y2-y1,x2-x1),h=11,s=0.4;
  const p=(da)=>`${(x2-h*Math.cos(a+da)).toFixed(1)},${(y2-h*Math.sin(a+da)).toFixed(1)}`;
  return LN(x1,y1,x2-6*Math.cos(a),y2-6*Math.sin(a),{c,w})+`<polygon points="${x2.toFixed(1)},${y2.toFixed(1)} ${p(s)} ${p(-s)}" fill="${c}"/>`}
const RC=(x,y,w,h,o={})=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${o.f||C.fill}" stroke="${o.c||C.ln}" stroke-width="${o.w||1.5}"/>`;
const CI=(x,y,r,o={})=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${o.f||"#fff"}" stroke="${o.c||C.ln}" stroke-width="${o.w||1.5}"/>`;
function DIMH(x1,x2,y,label,o={}){const up=o.up?-6:16;
  return LN(x1,y,x2,y,{c:C.dim,w:1})+LN(x1,y-5,x1,y+5,{c:C.dim,w:1})+LN(x2,y-5,x2,y+5,{c:C.dim,w:1})+TX((x1+x2)/2,y+up,label,{s:13,c:C.dim})}
function DIMV(x,y1,y2,label,o={}){const dx=o.left?-8:8;
  return LN(x,y1,x,y2,{c:C.dim,w:1})+LN(x-5,y1,x+5,y1,{c:C.dim,w:1})+LN(x-5,y2,x+5,y2,{c:C.dim,w:1})+TX(x+dx,(y1+y2)/2+4,label,{s:13,c:C.dim,a:o.left?"end":"start"})}
function HATCH(x,y,w,h){let s=RC(x,y,w,h,{f:"#eceae4",c:C.ln,w:1});
  for(let i=-h;i<w;i+=8){const xa=Math.max(x,x+i),ya=y+(xa-(x+i)),xb=Math.min(x+w,x+i+h),yb=y+(xb-(x+i));s+=LN(xa,ya,xb,yb,{c:"#9a8f80",w:.8})}return s}
const SVG=(w,h,b)=>`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img">${b}</svg>`;
const sub=(a,b)=>`${a}<sub>${b}</sub>`;
const iv=s=>`<i>${s}</i>`;

// ===== 1. stepped bar: axial force diagram and normal stress in each segment
const NODES="ABCDEFGHIJKLMNOP";
function sbGenerate(seed){
  const r=mulberry32(seed);
  for(let k=0;k<5000;k++){
    const us=r()<0.4,n=pick(r,[3,3,4]),A=[],Ls=[],F=[];
    for(let i=0;i<n;i++){
      A.push(pick(r,us?[0.8,1.0,1.2,1.5,1.6,1.8,2.0,2.5]:[300,400,500,600,800,1000,1200]));
      Ls.push(pick(r,us?[1.0,1.2,1.5,1.6,1.8,2.0]:[0.8,1.0,1.2,1.5,2.0]));
      F.push(pick(r,us?range(1000,9000,500):range(5000,40000,1000))*pick(r,[1,-1]));
    }
    F.push(-F.reduce((a,b)=>a+b,0));                       // the bar is in equilibrium
    const lo=us?1000:5000;
    if(Math.abs(F[n])<lo||Math.max(...F.map(Math.abs))>(us?16000:70000)) continue;
    const N=[];let c=0;for(let i=0;i<n;i++){c+=F[i];N.push(-c)}
    if(N.some(v=>Math.abs(v)<lo/2)||!(N.some(v=>v>0)&&N.some(v=>v<0))) continue;
    const sg=N.map((v,i)=>v/A[i]),m=sg.map(Math.abs),mx=Math.max(...m),imax=m.indexOf(mx);
    if(m.some((v,i)=>i!==imax&&v>0.9*mx)) continue;
    return {p:{us,n,A,Ls,F},s:{N,sg,imax,smax:mx}};
  }
  throw new Error("no valid problem");
}
const sbSeg=i=>NODES[i]+NODES[i+1];
function sbFmtF(p,v){return p.us?`${fmt(Math.abs(v))} lb`:`${fmt(Math.abs(v)/1000)} kN`}
function sbFigure(p){
  const x0=90,W=580,tot=p.Ls.reduce((a,b)=>a+b,0),maxA=Math.max(...p.A),yc=165;let x=x0,b="";
  const xs=[x0];p.Ls.forEach(l=>{x+=W*l/tot;xs.push(x)});
  p.A.forEach((a,i)=>{const h=36+54*Math.sqrt(a/maxA);
    b+=RC(xs[i],yc-h/2,xs[i+1]-xs[i],h)+TX((xs[i]+xs[i+1])/2,yc+5,`${fmt(a,p.us?1:0)} ${p.us?"in.²":"mm²"}`,{s:13})
      +DIMH(xs[i],xs[i+1],262,`${fmt(p.Ls[i],1)} ${p.us?"ft":"m"}`)});
  p.F.forEach((f,i)=>{const X=xs[i],d=f>0?1:-1;
    b+=LN(X,84,X,yc-50,{c:C.dim,w:1,d:"3 3"})+AR(X,84,X+d*58,84)+TX(X+d*29,72,sbFmtF(p,f),{s:13,c:C.load})
      +TX(X,yc+75,NODES[i],{s:15,i:1})});
  return SVG(760,290,b);
}
function sbStatement(p){
  const F=p.F.map((f,i)=>`${iv(NODES[i])}: ${sbFmtF(p,f)} to the ${f>0?"right":"left"}`).join("; ");
  return `<p>The stepped bar ${NODES[0]}${NODES[p.n]} below consists of ${p.n} cylindrical segments with different cross-sectional areas and lengths, as shown. The bar is in equilibrium under the axial loads ${F}.</p>
  <p>Find the normal stress in each segment (tension positive, compression negative), and identify the segment with the largest stress magnitude.</p>`;
}
function sbSolution(p,s){
  const u=p.us?"lb":"N",su=p.us?"psi":"MPa";let h="<h3>1. Axial force in each segment</h3><p>Cut the bar inside a segment and write ΣF<sub>x</sub> = 0 for the part to the left of the cut. With tension positive, the axial force equals minus the sum of the external loads (positive to the right) to the left of the cut.</p><table><tr><th>Segment</th><th>N ("+u+")</th><th>A ("+(p.us?"in.²":"mm²")+")</th><th>σ = N/A ("+su+")</th></tr>";
  s.N.forEach((n,i)=>{h+=`<tr><td>${sbSeg(i)}</td><td>${fmt(n)} (${n>0?"T":"C"})</td><td>${fmt(p.A[i],p.us?1:0)}</td><td>${sig(s.sg[i])} (${n>0?"T":"C"})</td></tr>`});
  h+=`</table><p class="note">The segment lengths and the material do not enter the stress calculation.</p><h3>2. Largest stress</h3><p class="final">Segment ${sbSeg(s.imax)}, with |σ| = ${sig(s.smax)} ${su}.</p>`;
  return h;
}
const SB={name:"Stepped bar: axial force and normal stress in each segment",
  generate:sbGenerate,figure:sbFigure,statement:sbStatement,solution:sbSolution,
  fields:(p,s)=>[...p.A.map((_,i)=>({id:"s"+i,label:`Stress in segment ${sbSeg(i)} (signed, tension +)`,unit:p.us?"psi":"MPa",signed:true})),
    {id:"imax",label:"Segment with the largest |σ|",unit:"",choices:p.A.map((_,i)=>sbSeg(i))}],
  truth:(p,s)=>{const o={imax:sbSeg(s.imax)};s.sg.forEach((v,i)=>o["s"+i]=v);return o},
  note:"Enter signed stresses; tension is positive."};

// ===== 2. two bars meeting at a pin that carries a weight: forces and the safe weight
function tbGenerate(seed){
  const r=mulberry32(seed);
  for(let k=0;k<5000;k++){
    const us=r()<0.4,al=pick(r,range(25,65,5)),be=pick(r,range(25,65,5));
    if(al+be<60||al+be>120) continue;
    const A=[pick(r,us?range(0.2,1.0,0.1):[200,300,400,500,600,800]),pick(r,us?range(0.2,1.0,0.1):[200,300,400,500,600,800])];
    const sw=[pick(r,us?range(12,24,2):range(80,160,10)),pick(r,us?range(12,24,2):range(80,160,10))];
    const p={us,al,be,A,sw},s=tbSolve(p);
    if(Math.abs(s.W[0]-s.W[1])<0.1*Math.min(...s.W)) continue;
    return {p,s};
  }
  throw new Error("no valid problem");
}
function tbSolve(p){
  const a=p.al*Math.PI/180,b=p.be*Math.PI/180,D=Math.sin(a+b);
  const k=[Math.cos(b)/D,Math.cos(a)/D];                    // P_AB/W and P_AC/W
  const cap=p.A.map((A,i)=>p.sw[i]*A/(p.us?1:1000));          // kips (ksi·in.²), or kN (MPa·mm² = N)
  const W=cap.map((c,i)=>c/k[i]),Ws=Math.min(...W);
  return {k,cap,W,Ws,gov:W[0]<W[1]?"AB":"AC"};
}
function tbFigure(p){
  const Ax=380,Ay=205,Lp=165,a=p.al*Math.PI/180,b=p.be*Math.PI/180;
  const Bx=Ax-Lp*Math.cos(a),By=Ay-Lp*Math.sin(a),Cx=Ax+Lp*Math.cos(b),Cy=Ay-Lp*Math.sin(b);
  const arc=(cx,cy,ang,left)=>{const r=34,x2=cx+(left?-1:1)*r*Math.cos(ang),y2=cy+r*Math.sin(ang);
    return LN(cx,cy,cx+(left?-1:1)*(r+14),cy,{c:C.dim,w:1,d:"3 3"})+`<path d="M ${cx+(left?-r:r)} ${cy} A ${r} ${r} 0 0 ${left?0:1} ${x2.toFixed(1)} ${y2.toFixed(1)}" fill="none" stroke="${C.dim}" stroke-width="1.2"/>`};
  const wl=(cx,cy,ang,left)=>{const r=56;return [cx+(left?-1:1)*r*Math.cos(ang/2),cy+r*Math.sin(ang/2)+5]};
  const [al_x,al_y]=wl(Bx,By,a,false),[be_x,be_y]=wl(Cx,Cy,b,true);
  let s=HATCH(Bx-22,By-24,44,24)+HATCH(Cx-22,Cy-24,44,24)
   +LN(Bx,By,Ax,Ay,{w:6,cap:1})+LN(Cx,Cy,Ax,Ay,{w:6,cap:1})+CI(Bx,By,5)+CI(Cx,Cy,5)+CI(Ax,Ay,6,{f:"#fff"})
   +arc(Bx,By,a,false)+arc(Cx,Cy,b,true)
   +TX(al_x+4,al_y,"α",{s:15,i:1,c:C.dim})+TX(be_x-4,be_y,"β",{s:15,i:1,c:C.dim})
   +AR(Ax,Ay,Ax,Ay+70)+TX(Ax+16,Ay+60,"W",{s:16,i:1,c:C.load,a:"start"})
   +TX(Bx-30,By+5,"B",{s:15,i:1,a:"end"})+TX(Cx+30,Cy+5,"C",{s:15,i:1,a:"start"})+TX(Ax-14,Ay+22,"A",{s:15,i:1,a:"end"})
   +TX((Bx+Ax)/2-6,(By+Ay)/2+30,`AB`,{s:13,c:C.dim})+TX((Cx+Ax)/2+6,(Cy+Ay)/2+30,`AC`,{s:13,c:C.dim});
  return SVG(760,290,s);
}
function tbStatement(p){
  const u=p.us?"in.²":"mm²",su=p.us?"ksi":"MPa",Wu=p.us?"kips":"kN";
  return `<p>A weight ${iv("W")} hangs from pin ${iv("A")}, which is held by two bars. Bar ${iv("AB")} makes an angle α = ${p.al}° with the horizontal and bar ${iv("AC")} makes an angle β = ${p.be}°. The bars are pinned to the supports at ${iv("B")} and ${iv("C")}; their weight is negligible. The cross-sectional areas are ${fmt(p.A[0],p.us?1:0)} ${u} (${iv("AB")}) and ${fmt(p.A[1],p.us?1:0)} ${u} (${iv("AC")}); the working stresses are ${p.sw[0]} ${su} (${iv("AB")}) and ${p.sw[1]} ${su} (${iv("AC")}).</p>
  <p>Express the bar forces as multiples of ${iv("W")}, then find the largest weight each bar can carry and the largest weight that can be hung safely.</p>`;
}
function tbSolution(p,s){
  const Wu=p.us?"kips":"kN",Fu=p.us?"kips":"kN";
  return `<h3>1. Equilibrium of pin A</h3><p>Both bars are two-force members; assume both in tension.</p>
  <p class="eq">ΣF<sub>x</sub> = 0: P<sub>AC</sub> cos β − P<sub>AB</sub> cos α = 0</p><br><p class="eq">ΣF<sub>y</sub> = 0: P<sub>AB</sub> sin α + P<sub>AC</sub> sin β − W = 0</p>
  <p>Solving, P<sub>AB</sub> = W cos β / sin(α+β) = ${sig(s.k[0],4)} W and P<sub>AC</sub> = W cos α / sin(α+β) = ${sig(s.k[1],4)} W.</p>
  <h3>2. Weight limited by each bar</h3>
  <p>Bar AB: P<sub>AB</sub> = σ<sub>w</sub>A = ${sig(s.cap[0])} ${Fu}, so W = ${sig(s.cap[0])}/${sig(s.k[0],4)} = ${sig(s.W[0])} ${Wu}.</p>
  <p>Bar AC: P<sub>AC</sub> = σ<sub>w</sub>A = ${sig(s.cap[1])} ${Fu}, so W = ${sig(s.cap[1])}/${sig(s.k[1],4)} = ${sig(s.W[1])} ${Wu}.</p>
  <h3>3. Safe weight</h3><p class="final">W<sub>safe</sub> = ${sig(s.Ws)} ${Wu}, governed by bar ${s.gov}. The larger value must be discarded because it would overstress the other bar.</p>`;
}
const TB={name:"Two bars supporting a weight: bar forces and safe load",
  generate:tbGenerate,figure:tbFigure,statement:tbStatement,solution:tbSolution,
  fields:(p,s)=>[{id:"kAB",label:"P_AB / W",unit:""},{id:"kAC",label:"P_AC / W",unit:""},
    {id:"W1",label:"Largest W allowed by bar AB",unit:p.us?"kips":"kN"},{id:"W2",label:"Largest W allowed by bar AC",unit:p.us?"kips":"kN"},
    {id:"Ws",label:"Largest safe W",unit:p.us?"kips":"kN"},{id:"gov",label:"Governing bar",unit:"",choices:["AB","AC"]}],
  truth:(p,s)=>({kAB:s.k[0],kAC:s.k[1],W1:s.W[0],W2:s.W[1],Ws:s.Ws,gov:s.gov}),
  note:"Answers within 2% are accepted."};

// ===== 3. Warren truss: member stresses and required area (method of joints, solved numerically)
function trSolve(p){
  const n=p.n,nodes=[];
  for(let i=0;i<=n;i++)nodes.push([i*p.a,0]);
  for(let i=0;i<n;i++)nodes.push([(i+0.5)*p.a,p.h]);
  const T=j=>n+1+j,mem=[];
  for(let i=0;i<n;i++)mem.push([i,i+1]);
  for(let i=0;i<n-1;i++)mem.push([T(i),T(i+1)]);
  for(let i=0;i<n;i++){mem.push([i,T(i)]);mem.push([T(i),i+1])}
  const m=mem.length,N=nodes.length,K=m+3,M=Array.from({length:2*N},()=>new Array(K+1).fill(0));
  mem.forEach(([i,j],k)=>{const dx=nodes[j][0]-nodes[i][0],dy=nodes[j][1]-nodes[i][1],L=Math.hypot(dx,dy);
    M[2*i][k]+=dx/L;M[2*i+1][k]+=dy/L;M[2*j][k]-=dx/L;M[2*j+1][k]-=dy/L});
  M[0][m]=1;M[1][m+1]=1;M[2*n+1][m+2]=1;                    // pin at node 0, roller at node n
  p.loads.forEach(([j,f])=>{M[2*j+1][K]-=-f});                // downward load f: -f in y; move to right side
  for(let c=0;c<K;c++){let pv=c;for(let r=c+1;r<2*N;r++)if(Math.abs(M[r][c])>Math.abs(M[pv][c]))pv=r;
    [M[c],M[pv]]=[M[pv],M[c]];for(let r=0;r<2*N;r++)if(r!==c){const f=M[r][c]/M[c][c];if(f)for(let q=c;q<=K;q++)M[r][q]-=f*M[c][q]}}
  const x=[];for(let c=0;c<K;c++)x.push(M[c][K]/M[c][c]);
  return {nodes,mem,F:x.slice(0,m),R:x.slice(m)};
}
function trGenerate(seed){
  const r=mulberry32(seed);
  for(let k=0;k<5000;k++){
    const us=r()<0.4,n=pick(r,[3,4,4]),a=pick(r,us?[6,8,10]:[3,4,5]),h=pick(r,us?[6,8,9,12]:[3,4,5]);
    const cand=[];for(let j=1;j<n;j++)cand.push(j);const top=[];for(let j=0;j<n;j++)top.push(n+1+j);
    const nl=pick(r,[2,3]),pickN=[...cand,...top];const chosen=new Set();while(chosen.size<nl)chosen.add(pick(r,pickN));
    const loads=[...chosen].map(j=>[j,pick(r,us?range(5,30,5):range(20,120,10))]);
    const p={us,n,a,h,loads,A:pick(r,us?[1.2,1.8,2.4,3.0]:[800,1000,1200,1400,1800])};
    const sol=trSolve(p);
    if(Math.abs(sol.R[1])<1e-9&&Math.abs(sol.R[2])<1e-9) continue;

    // members asked: one top chord, one bottom chord, one diagonal

    const ok=a=>a.filter(i=>Math.abs(F[i])>0.12*mx);

    const ask=[pick(r,D),pick(r,Tt),pick(r,B)];

    if(sw[1]<=0) continue;
    p.ask=ask;p.sw=sw;
    const s={sol,ask,R:sol.R};
    const Fa=ask.map(i=>F[i]);
    s.sg=Fa.map(f=>f*1000/p.A);                              // kN or kips → MPa (SI), or ksi (US: kips/in²)
    if(us)s.sg=Fa.map(f=>f/p.A);

function trMemName(sol,k,p){const [i,j]=sol.mem[k];return NODES[i]+NODES[j]}
function trFigure(p,s){

  const P=([x,y])=>[x0+x*sc,y0-y*sc];let b="";
  sol.mem.forEach(([i,j],k)=>{const [x1,y1]=P(sol.nodes[i]),[x2,y2]=P(sol.nodes[j]),hl=p.ask.includes(k);
    b+=LN(x1,y1,x2,y2,{c:hl?C.green:C.ln,w:hl?5:3.5,cap:1})});
  sol.nodes.forEach((nd,j)=>{const [x,y]=P(nd);b+=CI(x,y,4.5)+TX(x+15,y+(j<=n?((j===0||j===n)?42:24):-10),NODES[j],{s:14,i:1})});
  const [ax,ay]=P(sol.nodes[0]),[bx,by]=P(sol.nodes[n]);
  b+=`<polygon points="${ax},${ay+4} ${ax-12},${ay+22} ${ax+12},${ay+22}" fill="#eceae4" stroke="${C.ln}"/>`+CI(bx,by+12,8,{f:"#eceae4"})+LN(bx-14,by+22,bx+14,by+22);
  p.loads.forEach(([j,f])=>{const [x,y]=P(sol.nodes[j]);const top=j>n;
    b+=top?AR(x,y-52,x,y-5)+TX(x,y-58,`${f} ${p.us?"kips":"kN"}`,{s:13,c:C.load}):AR(x,y+6,x,y+52)+TX(x,y+70,`${f} ${p.us?"kips":"kN"}`,{s:13,c:C.load})});
  const u=p.us?"ft":"m";
  b+=DIMH(P(sol.nodes[0])[0],P(sol.nodes[1])[0],y0+96,`${p.a} ${u}`)+DIMV(x0-26,y0,y0-p.h*sc,`${p.h} ${u}`,{left:1});

function trStatement(p,s){
  const u=p.us?"in.²":"mm²",su=p.us?"ksi":"MPa",Fu=p.us?"kips":"kN";
  const nm=k=>trMemName(s.sol,k,p),ld=p.loads.map(([j,f])=>`${f} ${Fu} at ${iv(NODES[j])}`).join(", ");
  return `<p>The Warren truss shown has ${p.n} equal panels, each ${p.a} ${p.us?"ft":"m"} wide, and a height of ${p.h} ${p.us?"ft":"m"}. It is pinned at ${iv("A")} and supported by a roller at ${iv(NODES[p.n])}. Downward loads act at the joints: ${ld}. All members have the cross-sectional area ${fmt(p.A,p.us?1:0)} ${u}; member weights are neglected.</p>
  <p>Find the stresses in members ${iv(nm(p.ask[0]))}, ${iv(nm(p.ask[1]))}, and ${iv(nm(p.ask[2]))} (highlighted), with tension positive. Then find the smallest cross-sectional area of member ${iv(nm(p.ask[0]))} if the working stresses are ${p.sw[0]} ${su} in tension and ${p.sw[1]} ${su} in compression. Also find the vertical reaction at the roller.</p>`;
}
function trSolution(p,s){
  const sol=s.sol,Fu=p.us?"kips":"kN",su=p.us?"ksi":"MPa";
  let h=`<h3>1. Reactions</h3><p>From the equilibrium of the whole truss: A<sub>x</sub> = ${sig(sol.R[0])} ${Fu}, A<sub>y</sub> = ${sig(sol.R[1])} ${Fu}, and the roller reaction at ${NODES[p.n]} is ${sig(sol.R[2])} ${Fu}.</p>
  <h3>2. Member forces (method of joints, tension positive)</h3><table><tr><th>Member</th><th>Force (${Fu})</th><th></th></tr>`;
  sol.mem.forEach((_,k)=>{h+=`<tr><td>${trMemName(sol,k,p)}</td><td>${sig(sol.F[k])}</td><td>${Math.abs(sol.F[k])<1e-6?"zero":sol.F[k]>0?"T":"C"}</td></tr>`});
  h+=`</table><p class="note">Any member can also be found directly with the method of sections: cut through the member and two others, and take moments about the intersection of those two.</p><h3>3. Stresses in the highlighted members</h3><p>σ = N/A with A = ${fmt(p.A,p.us?1:0)} ${p.us?"in.²":"mm²"}.</p><table><tr><th>Member</th><th>N (${Fu})</th><th>σ (${su})</th></tr>`;
  p.ask.forEach((k,i)=>{h+=`<tr><td>${trMemName(sol,k,p)}</td><td>${sig(sol.F[k])}</td><td>${sig(s.sg[i])}</td></tr>`});
  const f0=sol.F[p.ask[0]];
  h+=`</table><h3>4. Required area of member ${trMemName(sol,p.ask[0],p)}</h3><p>The member is in ${f0>0?"tension":"compression"}, so σ<sub>w</sub> = ${f0>0?p.sw[0]:p.sw[1]} ${su} governs: A = |N|/σ<sub>w</sub> = <span class="final">${sig(s.Areq)} ${p.us?"in.²":"mm²"}</span>.</p>`;
  return h;
}
const TR={name:"Warren truss: member stresses by joints or sections",
  generate:trGenerate,figure:trFigure,statement:trStatement,solution:trSolution,
  fields:(p,s)=>[...p.ask.map((k,i)=>({id:"s"+i,label:`Stress in member ${trMemName(s.sol,k,p)} (signed, tension +)`,unit:p.us?"ksi":"MPa",signed:true})),
    {id:"A",label:`Smallest area of member ${trMemName(s.sol,p.ask[0],p)}`,unit:p.us?"in.²":"mm²"},
    {id:"Ry",label:`Vertical reaction at ${NODES[p.n]}`,unit:p.us?"kips":"kN"}],
  truth:(p,s)=>({s0:s.sg[0],s1:s.sg[1],s2:s.sg[2],A:s.Areq,Ry:s.R[2]}),
  note:"Enter signed stresses; tension is positive."};

// ===== Chapter 3 helpers. Base units: SI N, mm, MPa (torque N·mm); US lb, in., psi (torque lb·in.)
const TU=us=>us?{T:"lb·ft",tf:1/12,S:"ksi",sf:1/1000,L:"in.",Lb:"ft",lb:12,G:"× 10⁶ psi",Gf:1e-6}
               :{T:"N·m",tf:1/1000,S:"MPa",sf:1,L:"mm",Lb:"m",lb:1000,G:"GPa",Gf:1/1000};
const GM={steel:[80000,12e6],aluminum:[28000,4e6],bronze:[35000,6e6],copper:[47000,6.8e6]};
const Gm=(m,us)=>GM[m][us?1:0];
const Gstr=(m,us)=>`G = ${fmt(Gm(m,us)*TU(us).Gf,us?1:0)} ${TU(us).G}`.replace(".0 "," ");
const Jc=(d,di=0)=>Math.PI*(d**4-di**4)/32;
const deg=r=>r*180/Math.PI;
const tq=(v,us)=>sig(v*TU(us).tf,3), st=(v,us)=>sig(v*TU(us).sf,3), lb_=(v,us)=>sig(v/TU(us).lb,3);
const GFILL={steel:"#dfe4ea",aluminum:"#eef1f4",bronze:"#ecd3a6",copper:"#e9b996",wood:"#f2d9b0"};
// shaft segment as a cylinder seen from the side
const CYL=(x1,x2,yc,r,f="#dfe4ea")=>`<path d="M${x1},${yc-r} L${x2},${yc-r} A${r*0.28},${r} 0 0 1 ${x2},${yc+r} L${x1},${yc+r}" fill="${f}" stroke="${C.steelln}" stroke-width="1.5"/>`+`<ellipse cx="${x1}" cy="${yc}" rx="${r*0.28}" ry="${r}" fill="${f}" stroke="${C.steelln}" stroke-width="1.5"/>`;
// torque vector (right-hand rule): double-headed arrow along the axis
function TV(x,y,dir,lab,c=C.load){const L=56,x2=x+dir*L;const hd=xx=>`<polygon points="${xx},${y} ${xx-dir*11},${y-5} ${xx-dir*11},${y+5}" fill="${c}"/>`;
  return LN(x,y,x2-dir*6,y,{c,w:2.2})+hd(x2)+hd(x2-dir*10)+TX(x+dir*L/2,y-10,lab,{s:13,c})}
const WALLV=(x,y1,y2,left)=>HATCH(left?x-18:x,y1,18,y2-y1);

// ===== 1. circular shaft, solid or hollow: stress and angle of twist
function csGenerate(seed){
  const r=mulberry32(seed);
  for(let k=0;k<5000;k++){
    const us=r()<0.4,u=TU(us),m=pick(r,["steel","aluminum","bronze"]),hollow=r()<0.5;
    const d=pick(r,us?[1,1.5,2,2.5,3,4,5,6]:[25,30,40,50,60,75,80,100,120,150]),di=hollow?d*pick(r,[0.5,0.6,0.7,0.75,0.8]):0;
    const L=pick(r,us?[2,3,4,5,6,8,10]:[0.5,1,1.5,2,3,4])*u.lb,J=Jc(d,di),tt=pick(r,us?range(4000,16000,1000):range(30,110,10));
    let T=+(tt*J/(d/2)*u.tf).toPrecision(2)/u.tf;
    const tmax=T*(d/2)/J,tin=hollow?T*(di/2)/J:T*(d/4)/J,th=deg(T*L/(Gm(m,us)*J));
    if(th<0.3||th>8) continue;
    return {p:{us,m,hollow,d,di:+di.toFixed(us?3:1),L,T},s:{J,tmax,tin,th}};
  }

}
function csFigure(p){
  const u=TU(p.us),r=60,x1=170,x2=560,yc=140;
  let b=WALLV(x1-r*0.28,yc-90,yc+90,true)+CYL(x1,x2,yc,r,GFILL[p.m]);
  if(p.hollow)b+=`<ellipse cx="${x2}" cy="${yc}" rx="${r*0.28*p.di/p.d}" ry="${r*p.di/p.d}" fill="#fff" stroke="${C.steelln}" stroke-width="1.5"/>`;
  b+=TV(x2+30,yc,1,`T = ${tq(p.T,p.us)} ${u.T}`)+DIMH(x1,x2,yc+r+36,`L = ${lb_(p.L,p.us)} ${u.Lb}`)
   +TX(x2,yc-r-14,p.hollow?`outer d = ${p.d} ${u.L}, inner d = ${p.di} ${u.L}`:`d = ${p.d} ${u.L}`,{s:13,c:C.dim});
  return SVG(760,260,b);
}
function csStatement(p){
  const u=TU(p.us);
  return `<p>A ${p.hollow?"hollow":"solid"} ${p.m} shaft of length ${lb_(p.L,p.us)} ${u.Lb}${p.hollow?` with outer diameter ${p.d} ${u.L} and inner diameter ${p.di} ${u.L}`:` and diameter ${p.d} ${u.L}`} is built into the wall at one end and carries the torque T = ${tq(p.T,p.us)} ${u.T} at the free end. Use ${Gstr(p.m,p.us)}.</p>
  <p>Find the polar moment of inertia, the maximum shear stress, the shear stress ${p.hollow?"at the inner surface":"at half the outer radius"}, and the angle of twist of the shaft.</p>`;
}
function csSolution(p,s){
  const u=TU(p.us);
  return `<h3>1. Polar moment of inertia</h3><p class="eq">J = π(${p.hollow?`d<sub>o</sub>⁴ − d<sub>i</sub>⁴`:"d⁴"})/32 = ${sig(s.J,4)} ${u.L}⁴</p>
  <h3>2. Shear stresses</h3><p>The shear stress varies linearly with radius, τ = Tρ/J:</p>
  <p>τ<sub>max</sub> = T(d/2)/J = ${st(s.tmax,p.us)} ${u.S}; at ρ = ${p.hollow?"d<sub>i</sub>/2":"d/4"}, τ = ${st(s.tin,p.us)} ${u.S}.</p>
  <h3>3. Angle of twist</h3><p class="eq">θ = TL/(GJ) = ${sig(s.th*Math.PI/180)} rad = ${sig(s.th)}°</p>`;
}
const CS={name:"Circular shaft (solid or hollow): shear stress and angle of twist",
  generate:csGenerate,figure:csFigure,statement:csStatement,solution:csSolution,
  fields:p=>{const u=TU(p.us);return [{id:"J",label:"Polar moment of inertia",unit:u.L+"⁴"},{id:"tmax",label:"Maximum shear stress",unit:u.S},
    {id:"tin",label:p.hollow?"Shear stress at the inner surface":"Shear stress at half the outer radius",unit:u.S},{id:"th",label:"Angle of twist",unit:"degrees"}]},
  truth:(p,s)=>({J:s.J,tmax:s.tmax*TU(p.us).sf,tin:s.tin*TU(p.us).sf,th:s.th}),note:"Answers within 2% are accepted."};

// ===== 2. stepped shaft built into a wall, torques at the steps
function shGenerate(seed){
  const r=mulberry32(seed);
  for(let k=0;k<5000;k++){
    const us=r()<0.4,u=TU(us),n=pick(r,[2,3,3]),d=[],L=[],M=[],T=[];
    for(let i=0;i<n;i++){d.push(pick(r,us?[1,1.25,1.5,2,2.5,3]:[25,30,40,50,60,75]));L.push(pick(r,us?[2,3,4,5]:[0.5,0.8,1,1.2,1.5])*u.lb);
      M.push(r()<0.7?"steel":pick(r,["aluminum","bronze"]));T.push(pick(r,us?range(200,3000,100).map(v=>v*12):range(200,4000,100).map(v=>v*1000))*pick(r,[1,-1]))}
    const Ti=[];let c=0;for(let i=0;i<n;i++){c+=T[i];Ti.push(c)}
    if(Ti.some(v=>Math.abs(v)<Math.abs(T[0])*0.15)) continue;
    const tau=Ti.map((v,i)=>Math.abs(v)*16/(Math.PI*d[i]**3));
    if(Math.max(...tau)>(us?18000:120)||Math.min(...tau)<(us?1500:10)) continue;
    const srt=[...tau].sort((a,b)=>b-a);if(srt[1]>0.93*srt[0]) continue;
    const ph=Ti.map((v,i)=>v*L[i]/(Gm(M[i],us)*Jc(d[i]))),phA=Math.abs(ph.reduce((a,b)=>a+b,0));
    if(deg(phA)<0.2||deg(phA)>10) continue;
    return {p:{us,n,d,L,M,T},s:{Ti,tau,ph,phA:deg(phA),imax:tau.indexOf(srt[0])}};
  }
  throw new Error("no valid problem");
}
function shFigure(p){
  const u=TU(p.us),x0=110,W=520,tot=p.L.reduce((a,b)=>a+b,0),md=Math.max(...p.d),yc=150;let x=x0,b="";const xs=[x0];p.L.forEach(l=>{x+=W*l/tot;xs.push(x)});
  b+=WALLV(xs[p.n]+4,yc-90,yc+90,false);
  for(let i=p.n-1;i>=0;i--){const rr=22+38*p.d[i]/md;b+=CYL(xs[i],xs[i+1],yc,rr,GFILL[p.M[i]])+TX((xs[i]+xs[i+1])/2,yc+5,`${p.d[i]} ${u.L}`,{s:12})
    +DIMH(xs[i],xs[i+1],yc+90,`${lb_(p.L[i],p.us)} ${u.Lb}`)}
  p.T.forEach((t,i)=>{b+=TV(xs[i],yc-82-(i%2)*0,t>0?1:-1,`${tq(Math.abs(t),p.us)} ${u.T}`)+LN(xs[i],yc-76,xs[i],yc-60,{c:C.dim,w:1,d:"2 2"})+TX(xs[i],yc+70,NODES[i],{s:15,i:1})});
  b+=TX(xs[p.n]-10,yc+70,NODES[p.n],{s:15,i:1});
  return SVG(760,270,b);
}
function shStatement(p){
  const u=TU(p.us),mats=[...new Set(p.M)].map(m=>`${Gstr(m,p.us)} for ${m}`).join(", ");
  const Ts=p.T.map((t,i)=>`${tq(Math.abs(t),p.us)} ${u.T} at ${iv(NODES[i])}`).join(", ");
  return `<p>The solid shaft ${NODES[0]}${NODES[p.n]} is built into the wall at ${iv(NODES[p.n])}. Its ${p.n} segments have the diameters and lengths shown${new Set(p.M).size>1?"; segment materials are "+p.M.map((m,i)=>`${sbSeg(i)} ${m}`).join(", "):", and all segments are "+p.M[0]}. The torques ${Ts} act in the senses shown by the torque vectors (right-hand rule). Use ${mats}.</p>
  <p>Find the maximum shear stress in each segment, the segment with the largest stress, and the angle of rotation of end ${iv("A")}.</p>`;
}
function shSolution(p,s){
  const u=TU(p.us);let h=`<h3>1. Internal torques</h3><p>A free-body diagram of the part of the shaft to the left of a cut in each segment gives the internal torque as the sum of the applied torques on that part (vectors pointing right taken positive):</p><table><tr><th>Segment</th><th>T (${u.T})</th><th>d (${u.L})</th><th>τ<sub>max</sub> = 16|T|/(πd³) (${u.S})</th><th>θ = TL/(GJ) (rad)</th></tr>`;
  s.Ti.forEach((t,i)=>{h+=`<tr><td>${sbSeg(i)}</td><td>${tq(t,p.us)}</td><td>${p.d[i]}</td><td>${st(s.tau[i],p.us)}</td><td>${sig(s.ph[i])}</td></tr>`});
  return h+`</table><p>Largest stress: segment ${sbSeg(s.imax)}.</p><h3>2. Rotation of A</h3><p>The wall end does not rotate, so the rotation of A is the sum of the segment twists with their signs:</p><p class="final">|φ<sub>A</sub>| = ${sig(s.phA)}°</p>`;
}
const SH={name:"Stepped shaft with several torques: stresses and rotation of the free end",
  generate:shGenerate,figure:shFigure,statement:shStatement,solution:shSolution,
  fields:p=>[...p.d.map((_,i)=>({id:"t"+i,label:`Maximum shear stress in ${sbSeg(i)}`,unit:TU(p.us).S})),{id:"imax",label:"Segment with the largest stress",unit:"",choices:p.d.map((_,i)=>sbSeg(i))},{id:"ph",label:"Angle of rotation of A (magnitude)",unit:"degrees"}],
  truth:(p,s)=>{const o={imax:sbSeg(s.imax),ph:s.phA};s.tau.forEach((v,i)=>o["t"+i]=v*TU(p.us).sf);return o},note:"Answers within 2% are accepted."};

// ===== 3. gears on a rotating shaft: power, stress, relative rotation
function gpGenerate(seed){
  const r=mulberry32(seed);
  for(let k=0;k<5000;k++){
    const us=r()<0.4,u=TU(us),n=pick(r,[3,4]),inp=pick(r,[...Array(n).keys()]);
    const Pw=[];for(let i=0;i<n;i++)if(i!==inp)Pw[i]=pick(r,us?range(10,80,5):range(5,60,5));
    Pw[inp]=-Pw.reduce((a,b)=>a+(b||0),0);
    const freq=us?pick(r,[300,450,600,900,1200]):pick(r,[2,3,4,5,8,10]);   // rpm or Hz
    const Tg=Pw.map(P=>us?-P*63025/freq:-P*1e6/(2*Math.PI*freq));      // lb·in. or N·mm; input torque negative of outputs
    const d=pick(r,us?[1.5,2,2.5,3]:[40,50,60,75,80]),L=[];for(let i=0;i<n-1;i++)L.push(pick(r,us?[2,3,4,5]:[0.5,0.8,1,1.2,1.5])*u.lb);
    const Ti=[];let c=0;for(let i=0;i<n-1;i++){c+=Tg[i];Ti.push(c)}
    const Tm=Math.max(...Ti.map(Math.abs)),tmax=16*Tm/(Math.PI*d**3);
    if(tmax>(us?16000:110)||tmax<(us?2000:15)) continue;
    const G=Gm("steel",us),ph=Ti.reduce((a,t,i)=>a+t*L[i]/(G*Jc(d)),0);if(deg(Math.abs(ph))<0.1) continue;
    const tw=pick(r,us?[6000,8000,10000,12000]:[40,50,60,70]),dmin=Math.cbrt(16*Tm/(Math.PI*tw));
    return {p:{us,n,inp,Pw,freq,d,L,tw},s:{Tg,Ti,Tm,tmax,ph:deg(Math.abs(ph)),dmin}};
  }
  throw new Error("no valid problem");
}
function gpFigure(p){
  const u=TU(p.us),x0=120,W=520,tot=p.L.reduce((a,b)=>a+b,0),yc=150;let x=x0;const xs=[x0];p.L.forEach(l=>{x+=W*l/tot;xs.push(x)});
  let b=CYL(x0-30,xs[p.n-1]+30,yc,14,GFILL.steel);
  xs.forEach((X,i)=>{b+=RC(X-9,yc-62,18,124,{f:i===p.inp?"#cde1cd":"#c9ced6",c:C.steelln})+TX(X,yc+92,NODES[i],{s:15,i:1})
    +TX(X,yc-74,`${Math.abs(p.Pw[i])} ${p.us?"hp":"kW"} ${i===p.inp?"in":"out"}`,{s:12,c:i===p.inp?C.green:C.load})});
  for(let i=0;i<p.n-1;i++)b+=DIMH(xs[i],xs[i+1],yc+116,`${lb_(p.L[i],p.us)} ${u.Lb}`);
  b+=TX(380,24,`shaft diameter ${p.d} ${u.L}, ${p.us?p.freq+" rev/min":p.freq+" Hz"}`,{s:13,c:C.dim});
  return SVG(760,300,b);
}
function gpStatement(p){
  const u=TU(p.us),ps=p.Pw.map((P,i)=>i===p.inp?null:`${P} ${p.us?"hp":"kW"} at ${iv(NODES[i])}`).filter(Boolean).join(", ");
  return `<p>Gears ${NODES.slice(0,p.n).split("").map(iv).join(", ")} are attached to a solid steel shaft of diameter ${p.d} ${u.L} that rotates at ${p.us?p.freq+" rev/min":p.freq+" Hz"}. Gear ${iv(NODES[p.inp])} receives ${Math.abs(p.Pw[p.inp])} ${p.us?"hp":"kW"} from a motor, and the power is taken off at the other gears: ${ps}. The spacing of the gears is shown. Use ${Gstr("steel",p.us)} and neglect friction in the bearings.</p>

// beam: {L, sup:{kind:"ss",xa,xb}|{kind:"fixL"}|{kind:"fixR"}|{kind:"hinge",xh,xc}, P:[{x,F}] (F down +), C:[{x,C}] (clockwise +), W:[{a,b,w1,w2}] (down +)}

  bm.M=x=>R.filter(r=>r.x<x).reduce((a,r)=>a+r.R*(x-r.x),0)-bm.P.filter(q=>q.x<x).reduce((a,q)=>a+q.F*(x-q.x),0)+bm.W.reduce((a,d)=>a+dFM(d,-1,x,x)[1],0)
       +bm.C.filter(c=>c.x<x).reduce((a,c)=>a+c.C,0)+K.filter(c=>c.x<x).reduce((a,c)=>a+c.C,0);
  const ev=new Set([0,L]);bm.P.forEach(q=>ev.add(q.x));bm.C.forEach(q=>ev.add(q.x));bm.W.forEach(d=>{ev.add(d.a);ev.add(d.b)});R.forEach(r=>ev.add(r.x));if(s.xh!==undefined)ev.add(s.xh);

  for(let i=0;i+1<bm.ev.length;i++){const a=bm.ev[i],b=bm.ev[i+1],N=400;let pa=a+e,va=bm.V(pa);
    for(let k=1;k<=N;k++){const pb=a+(b-a)*k/N-(k===N?e:0),vb=bm.V(pb);
      if(vb===0&&va!==0){cand.push({x:pb,m:bm.M(pb),z:1})}

const SU=us=>us?{d:"in.",S:"psi",Mf:12,Vf:1}:{d:"mm",S:"MPa",Mf:1e6,Vf:1000};   // M(lb·ft)->lb·in, M(kN·m)->N·mm; V(lb)->lb, V(kN)->N
function secProps(rects){                     // rects {x0,b,y0,y1} measured from the bottom

  const t=y=>rects.filter(r=>y>=r.y0-1e-12&&y<=r.y1+1e-12).reduce((a,r)=>a+r.b,0);
  return {A,yb,I,H,ct:H-yb,cb:yb,Q,t};
}
function secDraw(rects,labs,o={}){

  let s="";rects.forEach(r=>{s+=RC(x0+r.x0*k,y0-r.y1*k,r.b*k,(r.y1-r.y0)*k,{f:o.fill||"#f2d9b0",c:C.ln})});
  const xl=300-Wd*k/2,xr=300+Wd*k/2;
  (o.lines||[]).forEach(y=>{s+=LN(xl-16,y0-y*k,xr+16,y0-y*k,{c:C.green,w:1.6,d:"6 3"})});
  if(o.Hl)s+=DIMV(xl-28,y0-H*k,y0,o.Hl,{left:1});
  labs.forEach((l,i)=>{s+=TX(470,40+i*20,l,{s:13,c:C.dim,a:"start"})});
  if(o.title)s+=TX(300,y0+24,o.title,{s:13,c:C.dim});

const R_=(x0,b,y0,y1)=>({x0,b,y0,y1});
function secT(bf,tf,tw,hw,top){return top?[R_(-tw/2,tw,0,hw),R_(-bf/2,bf,hw,hw+tf)]:[R_(-bf/2,bf,0,tf),R_(-tw/2,tw,tf,tf+hw)]}

// ----- 2. T-section on an overhanging beam: maximum tension and compression

// ===== Chapter 6 deflection engine: exact integration of v'' = M/(EI) for piecewise-polynomial M
// bm from bmSolve (kN, m or lb, ft); EI(x) in kN·m² or lb·ft²; bc: {kind:"ss",xa,xb,da,db} | {kind:"fixL"} | {kind:"fixR"}
function deflSolve(bm,EIf,bc,extra=[]){
  const L=bm.L,brk=new Set([...bm.ev,...extra,...(bm.EIbrk||[])]),xs=[];const b=[...brk].filter(x=>x>=0&&x<=L).sort((a,c)=>a-c);
  for(let i=0;i+1<b.length;i++){const n=200;for(let k=0;k<n;k++)xs.push(b[i]+(b[i+1]-b[i])*k/n)}xs.push(L);
  const e=1e-12*L,kap=s=>bm.M(s)/EIf(s),th=[0],v=[0];
  for(let i=0;i+1<xs.length;i++){const a=xs[i],c=xs[i+1],h=c-a;let I1=0,I2=0;
    GQ.forEach(([t,w])=>{const s=(a+c)/2+h/2*t,k=kap(Math.min(Math.max(s,a+e),c-e))*w*h/2;I1+=k;I2+=k*(c-s)});
    th.push(th[i]+I1);v.push(v[i]+th[i]*h+I2)}
  const loc=x=>{let i=xs.length-2;let lo=0,hi=xs.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(xs[m]<=x)lo=m;else hi=m}i=Math.min(lo,xs.length-2);
    const a=xs[i],h=x-a;if(h<=0)return [th[i],v[i]];let I1=0,I2=0;GQ.forEach(([t,w])=>{const s=a+h/2*(1+t),k=kap(Math.min(Math.max(s,a+e),x-e))*w*h/2;I1+=k;I2+=k*(x-s)});
    return [th[i]+I1,v[i]+th[i]*h+I2]};
  // general solution v = vp + C1 x + C2
  let C1,C2;
  if(bc.kind==="fixL"){C1=0;C2=0}
  else if(bc.kind==="fixR"){const [t,vv]=loc(L);C1=-t;C2=-vv-C1*L}
  else{const va=loc(bc.xa)[1],vb=loc(bc.xb)[1],da=bc.da||0,db=bc.db||0;C1=((db-vb)-(da-va))/(bc.xb-bc.xa);C2=da-va-C1*bc.xa}
  const V=x=>loc(x)[1]+C1*x+C2,TH=x=>loc(x)[0]+C1;
  // extremes of v: ends, breakpoints, zeros of slope
  const cand=[];b.forEach(x=>cand.push({x,v:V(x)}));
  for(let i=0;i+1<xs.length;i++){const ta=TH(xs[i]),tb=TH(xs[i+1]);if(ta===0)cand.push({x:xs[i],v:V(xs[i])});
    if(ta*tb<0){let l=xs[i],h=xs[i+1];for(let it=0;it<70;it++){const m=(l+h)/2;if(TH(m)*ta>0)l=m;else h=m}const x=(l+h)/2;cand.push({x,v:V(x),z:1})}}
  const dn=cand.reduce((a,c)=>c.v<a.v?c:a,{v:Infinity}),up=cand.reduce((a,c)=>c.v>a.v?c:a,{v:-Infinity});
  return {V,TH,dn,up,vmax:Math.abs(dn.v)>=Math.abs(up.v)?dn:up,C1,C2};
}
// units: EI from E and I; deflection display
const DU=us=>us?{E:"× 10⁶ psi",I:"in.⁴",d:"in.",dv:12,EI:(E,I)=>E*1e6*I/144,EIu:"lb·ft²"}:{E:"GPa",I:"mm⁴",d:"mm",dv:1000,EI:(E,I)=>E*I*1e-6,EIu:"kN·m²"};
const Ist=(I,us)=>us?`${sig(I,4)} in.⁴`:`${sig(I/1e6,4)} × 10⁶ mm⁴`;
function deflPlot(bm,sol,o={}){
  const u=DU(bm.us),x0=90,W=560,X=x=>x0+x*W/bm.L,N=300,pts=[];for(let i=0;i<=N;i++){const x=bm.L*i/N;pts.push([x,sol.V(x)*u.dv])}
  const mx=Math.max(1e-12,...pts.map(p=>Math.abs(p[1]))),H=60,y0=20+H,Y=v=>y0-v/mx*H;
  let s=LN(X(0),y0,X(bm.L),y0,{c:C.dim,w:1})+`<polyline points="${pts.map(p=>X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ")}" fill="none" stroke="#2a5d8f" stroke-width="2"/>`;
  (o.marks||[]).forEach(x=>{let v=sol.V(x)*u.dv;if(Math.abs(v)<1e-9*mx)v=0;s+=CI(X(x),Y(v),3,{f:"#2a5d8f",c:"#2a5d8f"})+TX(X(x),Y(v)+(v<0?16:-7),sig(v,3),{s:11})});
  s+=TX(X(0)-8,y0+4,`v (${u.d})`,{s:12,c:C.dim,a:"end"});
  return SVG(760,2*H+40,s);
}

// ===== Chapter 6 problem types. Loads in kN or lb, lengths in m or ft.
const MATS6=us=>[{n:"steel",E:us?29:200},{n:"aluminum",E:us?10:70},{n:"wood",E:us?1.6:12}];
function secRect6(r,us,wood){return wood?{b:pick(r,us?[2,3,4,6]:[50,75,100,150]),h:pick(r,us?[6,8,10,12]:[150,200,250,300])}:null}
function makeEI(r,us,mat){        // rectangle for wood; given I for metals
  if(mat.n==="wood"){const b=pick(r,us?[2,3,4,6]:[50,75,100,150]),h=pick(r,us?[6,8,10,12]:[150,200,250,300]);return {b,h,I:b*h**3/12,rect:true}}
  return {I:us?pick(r,[20,40,60,80,100,150,200,300]):pick(r,[2,5,10,20,40,60,100])*1e6,rect:false}}
const secStr=(s,us)=>s.rect?`a rectangular cross section ${s.b} ${us?"in.":"mm"} wide and ${s.h} ${us?"in.":"mm"} deep (I = bh³/12)`:`I = ${Ist(s.I,us)}`;
const radDeg=t=>`${sig(t,3)} rad = ${sig(t*180/Math.PI,3)}°`;
const solHead=(bm,sec,mat,EI)=>{const u=DU(bm.us),U=U4(bm.us);return `<h3>1. Reactions and moment</h3><p>${bmReactText(bm)}.</p>${bmDiagram(bm,"M")}
  <h3>2. Flexural rigidity</h3><p>I = ${Ist(sec.I,bm.us)}, E = ${mat.E} ${u.E}: EI = ${sig(EI,4)} ${u.EIu}.</p>
  <h3>3. Elastic curve</h3><p>Integrate EIv″ = M(x) twice (bracket functions give one expression for the whole beam): EIv = ∫∫M dx dx + C₁x + C₂, with the constants fixed by the support conditions. Equivalent results follow from the moment-area method or superposition of table cases.</p>`};
const okRange=(v,us,L)=>{const d=Math.abs(v)*DU(us).dv,Lmm=L*DU(us).dv;return d>Lmm/2000&&d<Lmm/80};

// ----- 1. simply supported beam: maximum deflection, slope at A, deflection at a point
function d1Generate(seed){
  const r=mulberry32(seed),us=r()<0.4;
  for(let k=0;k<20000;k++){
    const st=us?1:0.5,L=pick(r,us?[8,10,12,14,16]:[3,4,5,6,8]),mat=pick(r,MATS6(us)),sec=makeEI(r,us,mat);
    const P=[{x:pos(r,L,st),F:Fv(r,us)}],W=r()<0.5?[{a:0,b:L,w1:0,w2:0}]:[];if(W.length)W[0].w1=W[0].w2=Wv(r,us);else if(r()<0.5)P.push({x:pos(r,L,st),F:Fv(r,us)});
    if(P.length>1&&P[0].x===P[1].x) continue;
    const bm={us,L,sup:{kind:"ss",xa:0,xb:L},P,C:[],W};bmSolve(bm);const EI=DU(us).EI(mat.E,sec.I);
    const xq=pick(r,range(st,L-st,st).filter(x=>!P.some(q=>q.x===x)).concat([L/2]));
    const sol=deflSolve(bm,()=>EI,{kind:"ss",xa:0,xb:L},[xq]);if(!okRange(sol.vmax.v,us,L)) continue;
    return {p:{bm,mat,sec,xq},s:{EI,sol,thA:sol.TH(0),vq:sol.V(xq)}};
  }
  throw new Error("no valid problem");
}
const D1={name:"Simply supported beam: maximum deflection and slope",generate:d1Generate,
  figure:p=>bmDraw(p.bm,{section:p.xq}),
  statement:p=>{const U=U4(p.bm.us);return `<p>The simply supported ${p.mat.n} beam shown has ${secStr(p.sec,p.bm.us)}. Use E = ${p.mat.E} ${DU(p.bm.us).E} and neglect the weight of the beam.</p>
  <p>Find the slope at the left support, the deflection at x = ${fmtx(p.xq)} ${U.L} (dashed line), and the maximum deflection and its location.</p><p class="note">Deflections are positive upward; slopes are positive counterclockwise.</p>`},
  solution:(p,s)=>{const u=DU(p.bm.us),U=U4(p.bm.us);return solHead(p.bm,p.sec,p.mat,s.EI)+deflPlot(p.bm,s.sol,{marks:[p.xq,s.sol.dn.x]})+
  `<h3>4. Results</h3><p>Slope at A: θ<sub>A</sub> = ${radDeg(s.thA)}. At x = ${fmtx(p.xq)} ${U.L}: v = ${sig(s.vq*u.dv,4)} ${u.d}.</p><p class="final">Maximum deflection ${sig(s.sol.dn.v*u.dv,4)} ${u.d} at x = ${sig(s.sol.dn.x,4)} ${U.L}, where the slope is zero.</p>`},
  fields:p=>{const u=DU(p.bm.us),U=U4(p.bm.us);return [{id:"th",label:"Slope at the left support (signed)",unit:"degrees",signed:true},{id:"vq",label:"Deflection at the marked section (signed)",unit:u.d,signed:true},
    {id:"vm",label:"Maximum deflection (signed)",unit:u.d,signed:true},{id:"xm",label:"Its location from the left end",unit:U.L}]},
  truth:(p,s)=>({th:s.thA*180/Math.PI,vq:s.vq*DU(p.bm.us).dv,vm:s.sol.dn.v*DU(p.bm.us).dv,xm:s.sol.dn.x}),note:"Answers within 2% are accepted; upward deflection and counterclockwise slope are positive."};

// ----- 2. cantilever (possibly two segments with I and 2I)
function d2Generate(seed){
  const r=mulberry32(seed),us=r()<0.4;
  for(let k=0;k<20000;k++){
    const st=us?1:0.5,L=pick(r,us?[6,8,10,12]:[2,3,4,5]),mat=pick(r,MATS6(us).slice(0,2)),I0=us?pick(r,[20,40,60,80,150]):pick(r,[5,10,20,40,80,150])*1e6,step=r()<0.5;
    const xb=step?pos(r,L,st,L*0.3,L*0.7):null;
    const P=r()<0.7?[{x:pos(r,L,st,st,L),F:Fv(r,us)}]:[],W=[{a:pos(r,L,st,0,L-st),b:L,w1:0,w2:0}];W[0].w1=W[0].w2=Wv(r,us);if(r()<0.4)W[0].a=0;
    const C=!P.length?[{x:L,C:Cv(r,us)*pick(r,[1,-1])}]:[];
    const bm={us,L,sup:{kind:"fixL"},P,C,W};bmSolve(bm);bm.EIbrk=step?[xb]:[];
    const EI0=DU(us).EI(mat.E,I0),EIf=x=>step&&x<xb?2*EI0:EI0;
    const sol=deflSolve(bm,EIf,{kind:"fixL"});if(!okRange(sol.V(L),us,L)) continue;
    return {p:{bm,mat,I0,step,xb},s:{EI0,sol,vL:sol.V(L),tL:sol.TH(L)}};
  }
  throw new Error("no valid problem");
}
const D2={name:"Cantilever beam (uniform or stepped I): deflection and slope at the free end",generate:d2Generate,
  figure:p=>bmDraw(p.bm,p.step?{section:p.xb,steps:[[0,p.xb,18],[p.xb,p.bm.L,12]]}:{}),
  statement:p=>{const U=U4(p.bm.us),u=DU(p.bm.us);return `<p>The ${p.mat.n} cantilever beam shown is built into the wall at ${iv("A")}. ${p.step?`Segment between the wall and x = ${fmtx(p.xb)} ${U.L} has moment of inertia 2I₀; the rest of the beam has I₀, with`:"Its moment of inertia is"} I₀ = ${Ist(p.I0,p.bm.us)}. Use E = ${p.mat.E} ${u.E}; neglect the weight of the beam.</p>
  <p>Find the deflection and the slope at the free end.</p><p class="note">Deflections are positive upward; slopes are positive counterclockwise.</p>`},
  solution:(p,s)=>{const u=DU(p.bm.us);return `<h3>1. Moment diagram</h3>${bmDiagram(p.bm,"M")}<h3>2. Integration</h3><p>EI₀ = ${sig(s.EI0,4)} ${u.EIu}. ${p.step?"Integrate v″ = M/(EI) segment by segment; the stiffer segment uses 2EI₀, and v and v′ are continuous at the step. ":""}At the wall v = 0 and v′ = 0, so the integration constants are zero (or the moment-area method gives the free-end values directly as the first and second moments of the M/EI diagram about the free end).</p>${deflPlot(p.bm,s.sol,{marks:[p.bm.L]})}
  <p class="final">v = ${sig(s.vL*u.dv,4)} ${u.d}, θ = ${radDeg(s.tL)} at the free end.</p>`},
  fields:p=>{const u=DU(p.bm.us);return [{id:"v",label:"Deflection at the free end (signed)",unit:u.d,signed:true},{id:"t",label:"Slope at the free end (signed)",unit:"degrees",signed:true}]},
  truth:(p,s)=>({v:s.vL*DU(p.bm.us).dv,t:s.tL*180/Math.PI}),note:"Answers within 2% are accepted; upward deflection and counterclockwise slope are positive."};

// ----- 3. overhanging beam: deflection at the tip and at midspan
function d3Generate(seed){
  const r=mulberry32(seed),us=r()<0.4;
  for(let k=0;k<20000;k++){
    const st=us?1:0.5,L=pick(r,us?[10,12,14,16]:[4,5,6,8]),xb=pos(r,L,st,L*0.6,L-st),mat=pick(r,MATS6(us).slice(0,2)),sec=makeEI(r,us,mat);
    const P=[{x:L,F:Fv(r,us)}],W=r()<0.6?[{a:0,b:xb,w1:0,w2:0}]:[];if(W.length)W[0].w1=W[0].w2=Wv(r,us);
    const bm={us,L,sup:{kind:"ss",xa:0,xb},P,C:[],W};bmSolve(bm);const EI=DU(us).EI(mat.E,sec.I),xm=xb/2;
    const sol=deflSolve(bm,()=>EI,{kind:"ss",xa:0,xb},[xm]);const vt=sol.V(L),vm=sol.V(xm);
    if(!okRange(vt,us,L)||Math.abs(vm)<0.1*Math.abs(vt)) continue;
    return {p:{bm,mat,sec,xm},s:{EI,sol,vt,vm,tB:sol.TH(xb)}};
  }
  throw new Error("no valid problem");
}
const D3={name:"Overhanging beam: deflection at the free end and between the supports",generate:d3Generate,
  figure:p=>bmDraw(p.bm,{section:p.xm}),
  statement:p=>{const U=U4(p.bm.us);return `<p>The overhanging ${p.mat.n} beam shown has ${secStr(p.sec,p.bm.us)}; use E = ${p.mat.E} ${DU(p.bm.us).E} and neglect its weight.</p>
  <p>Find the slope at the roller support, the deflection at the free end, and the deflection midway between the supports (dashed line).</p><p class="note">Deflections are positive upward; slopes are positive counterclockwise.</p>`},
  solution:(p,s)=>{const u=DU(p.bm.us),U=U4(p.bm.us),xb=p.bm.sup.xb;return solHead(p.bm,p.sec,p.mat,s.EI)+deflPlot(p.bm,s.sol,{marks:[p.xm,p.bm.L]})+
  `<h3>4. Results</h3><p>Slope at the roller: θ = ${radDeg(s.tB)}. The free end moves by the overhang acting as a cantilever plus the rotation of the beam at the roller: v = θ·(overhang) + v<sub>cantilever</sub>.</p><p class="final">Free end: v = ${sig(s.vt*u.dv,4)} ${u.d}; midway between supports: v = ${sig(s.vm*u.dv,4)} ${u.d}.</p>`},
  fields:p=>{const u=DU(p.bm.us);return [{id:"t",label:"Slope at the roller (signed)",unit:"degrees",signed:true},{id:"vt",label:"Deflection at the free end (signed)",unit:u.d,signed:true},{id:"vm",label:"Deflection midway between supports (signed)",unit:u.d,signed:true}]},
  truth:(p,s)=>({t:s.tB*180/Math.PI,vt:s.vt*DU(p.bm.us).dv,vm:s.vm*DU(p.bm.us).dv}),note:"Answers within 2% are accepted; upward deflection and counterclockwise slope are positive."};

// ----- 4. partial or linearly varying load: midspan and maximum deflection
function d4Generate(seed){
  const r=mulberry32(seed),us=r()<0.4;
  for(let k=0;k<20000;k++){
    const st=us?1:0.5,L=pick(r,us?[8,10,12,16]:[4,5,6,8]),mat=pick(r,MATS6(us)),sec=makeEI(r,us,mat),lin=r()<0.4;
    const a=lin?0:pos(r,L,st,0,L/2),b=lin?L:pos(r,L,st,a+L/4,L);if(!lin&&a===0&&b===L) continue;
    const w=Wv(r,us),inc=r()<0.5,W=[{a,b,w1:lin&&!inc?w:lin?0:w,w2:lin&&inc?w:lin?0:w}];
    const bm={us,L,sup:{kind:"ss",xa:0,xb:L},P:[],C:[],W};bmSolve(bm);const EI=DU(us).EI(mat.E,sec.I);
    const sol=deflSolve(bm,()=>EI,{kind:"ss",xa:0,xb:L},[L/2]);if(!okRange(sol.dn.v,us,L)||Math.abs(sol.dn.x-L/2)<0.02*L) continue;
    return {p:{bm,mat,sec,lin},s:{EI,sol,vc:sol.V(L/2)}};
  }
  throw new Error("no valid problem");
}
const D4={name:"Partial or linearly varying load: midspan and maximum deflection",generate:d4Generate,
  figure:p=>bmDraw(p.bm),
  statement:p=>`<p>The simply supported ${p.mat.n} beam shown carries ${p.lin?"a linearly varying":"a uniformly distributed load over part of its length"} load and has ${secStr(p.sec,p.bm.us)}. Use E = ${p.mat.E} ${DU(p.bm.us).E}; neglect the weight of the beam.</p>
  <p>Find the midspan deflection, and the maximum deflection and its location.</p><p class="note">Deflections are positive upward.</p>`,
  solution:(p,s)=>{const u=DU(p.bm.us),U=U4(p.bm.us);return solHead(p.bm,p.sec,p.mat,s.EI)+deflPlot(p.bm,s.sol,{marks:[p.bm.L/2,s.sol.dn.x]})+
  `<h3>4. Results</h3><p>Midspan: v = ${sig(s.vc*u.dv,4)} ${u.d}. The maximum deflection is where v′ = 0, which is not at midspan because the load is not symmetric.</p><p class="final">v<sub>max</sub> = ${sig(s.sol.dn.v*u.dv,4)} ${u.d} at x = ${sig(s.sol.dn.x,4)} ${U.L}</p>`},
  fields:p=>{const u=DU(p.bm.us),U=U4(p.bm.us);return [{id:"vc",label:"Midspan deflection (signed)",unit:u.d,signed:true},{id:"vm",label:"Maximum deflection (signed)",unit:u.d,signed:true},{id:"xm",label:"Its location from the left end",unit:U.L}]},
  truth:(p,s)=>({vc:s.vc*DU(p.bm.us).dv,vm:s.sol.dn.v*DU(p.bm.us).dv,xm:s.sol.dn.x}),note:"Answers within 2% are accepted."};

// ----- 5. design for stiffness: required I and depth
function d5Generate(seed){
  const r=mulberry32(seed),us=r()<0.4;
  for(let k=0;k<20000;k++){
    const st=us?1:0.5,cant=r()<0.4,L=pick(r,us?[8,10,12,16,20]:[3,4,5,6,8]),wood=r()<0.5,E=wood?(us?1.6:12):(us?29:200);
    const W=[{a:0,b:L,w1:0,w2:0}];W[0].w1=W[0].w2=Wv(r,us);const P=r()<0.5?[{x:cant?L:pos(r,L,st),F:Fv(r,us)}]:[];
    const bm={us,L,sup:cant?{kind:"fixL"}:{kind:"ss",xa:0,xb:L},P,C:[],W};bmSolve(bm);
    const ratio=pick(r,cant?[180,240]:[240,360,480]),EI1=DU(us).EI(E,1);
    const sol=deflSolve(bm,()=>EI1,cant?{kind:"fixL"}:{kind:"ss",xa:0,xb:L});
    const v1=Math.abs(sol.vmax.v)*DU(us).dv,vall=L*DU(us).dv/ratio,Ireq=v1/vall,b=pick(r,us?[3,4,6,8]:[75,100,150,200]),h=Math.cbrt(12*Ireq/b);
    if(h>(us?30:800)||h<(us?3:80)) continue;
    return {p:{bm,cant,wood,E,ratio,b},s:{v1,vall,Ireq,h,sol}};
  }
  throw new Error("no valid problem");
}
const D5={name:"Design for stiffness: required moment of inertia and depth",generate:d5Generate,
  figure:p=>bmDraw(p.bm),
  statement:p=>{const u=DU(p.bm.us);return `<p>The ${p.cant?"cantilever":"simply supported"} ${p.wood?"wood":"steel"} beam shown (E = ${p.E} ${u.E}) must not deflect more than L/${p.ratio} under the loads shown. Neglect the weight of the beam.</p>
  <p>Find the allowable deflection, the smallest moment of inertia that satisfies the limit, and the smallest depth h of a rectangular section ${p.b} ${p.bm.us?"in.":"mm"} wide.</p>`},
  solution:(p,s)=>{const u=DU(p.bm.us);return `<h3>1. Deflection for unit EI</h3><p>Deflection is inversely proportional to I. With I = 1 ${u.I}, the largest deflection would be ${sig(s.v1,4)} ${u.d}.</p>${deflPlot(p.bm,s.sol)}
  <h3>2. Allowable deflection</h3><p>δ<sub>allow</sub> = L/${p.ratio} = ${sig(s.vall,4)} ${u.d}.</p>
  <h3>3. Required I and depth</h3><p>I<sub>req</sub> = (deflection for unit I)/δ<sub>allow</sub> = ${sig(s.Ireq,4)} ${u.I}.</p><p class="final">h = (12I/b)<sup>1/3</sup> = ${sig(s.h,4)} ${p.bm.us?"in.":"mm"}</p>`},
  fields:p=>{const u=DU(p.bm.us);return [{id:"va",label:"Allowable deflection",unit:u.d},{id:"I",label:"Required moment of inertia",unit:u.I},{id:"h",label:"Required depth",unit:p.bm.us?"in.":"mm"}]},
  truth:(p,s)=>({va:s.vall,I:s.Ireq,h:s.h}),note:"Answers within 2% are accepted."};

// ----- 6. beam on an elastic support (spring or rod)
function d6Generate(seed){
  const r=mulberry32(seed),us=r()<0.4;
  for(let k=0;k<20000;k++){
    const st=us?1:0.5,L=pick(r,us?[8,10,12,14]:[3,4,5,6]),mat=pick(r,MATS6(us).slice(0,2)),sec=makeEI(r,us,mat);
    const P=[{x:pos(r,L,st),F:Fv(r,us)}],bm={us,L,sup:{kind:"ss",xa:0,xb:L},P,C:[],W:[]};bmSolve(bm);
    const EI=DU(us).EI(mat.E,sec.I),kk=pick(r,us?[2000,5000,10000,20000,50000]:[200,500,1000,2000,5000]);     // lb/in. or kN/m

    const q=princ(sx,0,tau);if(q.R>(us?20000:150)||q.R<(us?2000:15)) continue;

  }

}

  figure:p=>{const u=p.us?"in.":"mm";let s=HATCH(100,70,18,140)+CYL(118,470,140,26,"#dfe4ea")+`<polygon points="470,128 470,152 600,230 600,206" fill="#c9ced6" stroke="${C.steelln}" stroke-width="1.5"/>`
     +AR(600,140,600,206)+TX(612,170,`F = ${p.F} ${p.us?"lb":"kN"}`,{s:13,c:C.load,a:"start"})+DIMH(118,470,190,`L = ${p.L} ${u}`)+TX(560,250,`arm length a = ${p.a} ${u} (horizontal, perpendicular to the shaft)`,{s:12,c:C.dim})
     +CI(130,114,4,{f:C.load,c:C.load})+TX(140,100,"A (top)",{s:12,c:C.dim,a:"start"})+CI(130,140,4,{f:"#2a5d8f",c:"#2a5d8f"})+TX(140,148,"B (side, at the neutral axis)",{s:12,c:C.dim,a:"start"})+TX(300,165,`d = ${p.d} ${u}`,{s:12,c:C.dim});
    return SVG(760,270,s)},
  statement:p=>{const u=p.us?"in.":"mm",S=p.us?"psi":"MPa";return `<p>A solid circular shaft of diameter ${p.d} ${u} is built into the wall and carries a rigid horizontal arm of length a = ${p.a} ${u} at distance L = ${p.L} ${u} from the wall. A vertical force F = ${p.F} ${p.us?"lb":"kN"} acts at the end of the arm.</p>
  <p>At the section next to the wall, find the principal stresses and the maximum in-plane shear stress at point A on top of the shaft, and the maximum in-plane shear stress at point B on the side (on the neutral axis), including transverse shear.</p>`},
  solution:(p,s)=>{const S=p.us?"psi":"MPa",u=p.us?"in.":"mm";return `<h3>1. Internal forces at the wall</h3><p>Moving F to the shaft axis gives a vertical force V = F, a bending moment M = FL, and a torque T = Fa.</p>
  <h3>2. Point A (top)</h3><p>σ = Mc/I = ${sig(s.sb,4)} ${S} (tension), τ = Tc/J = ${sig(s.tt,4)} ${S}; transverse shear is zero at the top.</p>
  <p class="eq">σ<sub>1,2</sub> = ${sig(s.top.s1,4)}, ${sig(s.top.s2,4)} ${S}; τ<sub>max</sub> = ${sig(s.top.R,4)} ${S}</p>${SVG(760,290,stressElem(s.sb,0,s.tt,0,{cx:170,cy:140,unit:S})+mohr(s.sb,0,s.tt))}
  <h3>3. Point B (side)</h3><p>σ = 0 on the neutral axis. Torsion and transverse shear act in the same direction at one side: τ = Tc/J + 4V/(3A) = ${sig(s.tt,4)} + ${sig(s.tv,4)} = ${sig(s.tt+s.tv,4)} ${S}, a state of pure shear.</p><p class="final">τ<sub>max</sub> at B = ${sig(s.side.R,4)} ${S}</p>`},
  fields:p=>{const S=p.us?"psi":"MPa";return [{id:"s1",label:"σ₁ at A",unit:S,signed:true},{id:"s2",label:"σ₂ at A (signed)",unit:S,signed:true},{id:"tA",label:"Maximum in-plane shear at A",unit:S},{id:"tB",label:"Maximum in-plane shear at B",unit:S}]},
  truth:(p,s)=>({s1:s.top.s1,s2:s.top.s2,tA:s.top.R,tB:s.side.R}),note:"Answers within 2% are accepted."};

// ----- 9. strain rosette
function m9Generate(seed){
  const r=mulberry32(seed),us=r()<0.4;
  for(let k=0;k<20000;k++){
    const deg60=r()<0.5,ex=pick(r,range(-900,900,25)),ey=pick(r,range(-900,900,25)),g=pick(r,range(-1200,1200,25));
    const eq=(th)=>(ex+ey)/2+(ex-ey)/2*Math.cos(2*th*D2R)+g/2*Math.sin(2*th*D2R);
    const angs=deg60?[0,60,120]:[0,45,90],rd=angs.map(a=>Math.round(eq(a)));
    // recover strains from the rounded readings
    let exr,eyr,gr;if(deg60){exr=rd[0];eyr=(2*(rd[1]+rd[2])-rd[0])/3;gr=2*(rd[1]-rd[2])/Math.sqrt(3)}else{exr=rd[0];eyr=rd[2];gr=2*rd[1]-rd[0]-rd[2]}
    const a=(exr+eyr)/2,R=Math.hypot((exr-eyr)/2,gr/2),e1=a+R,e2=a-R,tp=0.5*Math.atan2(gr,exr-eyr);
    if(Math.abs(gr)<50||R<100) continue;
    const m=pick(r,MATS6(us).slice(0,2)),E=m.E*(us?1e6:1000),nu=m.n==="steel"?0.3:0.33,s1=E/(1-nu*nu)*(e1+nu*e2)*1e-6,s2=E/(1-nu*nu)*(e2+nu*e1)*1e-6;
    if(Math.max(Math.abs(s1),Math.abs(s2))>(us?40000:250)) continue;
    return {p:{us,deg60,rd,angs,m,E,nu},s:{exr,eyr,gr,e1,e2,tp,gmax:2*R,s1,s2}};
  }
  throw new Error("no valid problem");
}
const M9={name:"Strain rosette: principal strains and principal stresses",generate:m9Generate,
  figure:p=>{let s="";const cx=240,cy=150;p.angs.forEach((a,i)=>{const L=100,x2=cx+L*Math.cos(a*D2R),y2=cy-L*Math.sin(a*D2R);
      s+=LN(cx,cy,x2,y2,{c:C.steelln,w:1.2,d:"3 3"})+`<rect x="${cx+60*Math.cos(a*D2R)-6}" y="${cy-60*Math.sin(a*D2R)-18}" width="12" height="36" fill="#f3d6d8" stroke="${C.load}" transform="rotate(${90-a} ${cx+60*Math.cos(a*D2R)} ${cy-60*Math.sin(a*D2R)})"/>`+TX(x2+12*Math.cos(a*D2R),y2-12*Math.sin(a*D2R)+4,`${"abc"[i]} (${a}°)`,{s:13,c:C.load})});
    s+=AR(cx,cy,cx+140,cy,C.dim,1)+TX(cx+146,cy+4,"x",{s:12,i:1,c:C.dim,a:"start"});
    s+=TX(470,90,`ε<tspan baseline-shift="sub" font-size="10">a</tspan> = ${p.rd[0]} × 10⁻⁶`,{s:14,a:"start"})+TX(470,114,`ε<tspan baseline-shift="sub" font-size="10">b</tspan> = ${p.rd[1]} × 10⁻⁶`,{s:14,a:"start"})+TX(470,138,`ε<tspan baseline-shift="sub" font-size="10">c</tspan> = ${p.rd[2]} × 10⁻⁶`,{s:14,a:"start"});
    return SVG(760,280,s)},
  statement:p=>`<p>A ${p.deg60?"60°":"45°"} strain rosette bonded to the surface of a ${p.m.n} part records ε<sub>a</sub> = ${p.rd[0]}, ε<sub>b</sub> = ${p.rd[1]}, and ε<sub>c</sub> = ${p.rd[2]} (× 10⁻⁶) for gauges at ${p.angs.join("°, ")}° counterclockwise from the x axis. Use E = ${p.m.E} ${DU(p.us).E} and ν = ${p.nu}; the surface is in plane stress.</p>
  <p>Find ε<sub>y</sub> and γ<sub>xy</sub>, the principal strains, the angle θ<sub>p</sub> from the x axis to the ε₁ direction, the maximum in-plane shear strain, and the principal stresses.</p>`,
  solution:(p,s)=>{const S=p.us?"psi":"MPa";return `<h3>1. Strain components</h3><p>Each gauge reads ε(θ) = (ε<sub>x</sub>+ε<sub>y</sub>)/2 + (ε<sub>x</sub>−ε<sub>y</sub>)/2 cos 2θ + (γ<sub>xy</sub>/2) sin 2θ. ${p.deg60?"For a 60° rosette: ε<sub>x</sub> = ε<sub>a</sub>, ε<sub>y</sub> = [2(ε<sub>b</sub>+ε<sub>c</sub>) − ε<sub>a</sub>]/3, γ<sub>xy</sub> = 2(ε<sub>b</sub>−ε<sub>c</sub>)/√3.":"For a 45° rosette: ε<sub>x</sub> = ε<sub>a</sub>, ε<sub>y</sub> = ε<sub>c</sub>, γ<sub>xy</sub> = 2ε<sub>b</sub> − ε<sub>a</sub> − ε<sub>c</sub>."}</p>
  <p>ε<sub>x</sub> = ${sig(s.exr,4)}, ε<sub>y</sub> = ${sig(s.eyr,4)}, γ<sub>xy</sub> = ${sig(s.gr,4)} (× 10⁻⁶).</p>
  <h3>2. Principal strains</h3><p class="eq">ε<sub>1,2</sub> = (ε<sub>x</sub>+ε<sub>y</sub>)/2 ± √[((ε<sub>x</sub>−ε<sub>y</sub>)/2)² + (γ<sub>xy</sub>/2)²] = ${sig(s.e1,4)}, ${sig(s.e2,4)} × 10⁻⁶</p><p>θ<sub>p</sub> = ½ atan2(γ<sub>xy</sub>, ε<sub>x</sub>−ε<sub>y</sub>) = ${sig(s.tp/D2R,4)}°; γ<sub>max</sub> = ε₁ − ε₂ = ${sig(s.gmax,4)} × 10⁻⁶.</p>
  <h3>3. Principal stresses (plane stress)</h3><p class="eq">σ₁ = E(ε₁ + νε₂)/(1−ν²) = ${sig(s.s1,4)} ${S}, σ₂ = E(ε₂ + νε₁)/(1−ν²) = ${sig(s.s2,4)} ${S}</p>`},
  fields:p=>{const S=p.us?"psi":"MPa";return [{id:"ey",label:"εy (signed)",unit:"× 10⁻⁶",signed:true},{id:"g",label:"γxy (signed)",unit:"× 10⁻⁶",signed:true},{id:"e1",label:"ε₁ (signed)",unit:"× 10⁻⁶",signed:true},{id:"e2",label:"ε₂ (signed)",unit:"× 10⁻⁶",signed:true},
    angF("tp","θp, from x to ε₁"),{id:"gm",label:"Maximum in-plane shear strain",unit:"× 10⁻⁶"},{id:"s1",label:"σ₁ (signed)",unit:S,signed:true},{id:"s2",label:"σ₂ (signed)",unit:S,signed:true}]},
  truth:(p,s)=>({ey:s.eyr,g:s.gr,e1:s.e1,e2:s.e2,tp:s.tp/D2R,gm:s.gmax,s1:s.s1,s2:s.s2}),note:"Answers within 2% are accepted; angles within 1°."};

const TEMPLATES={"pressure-vessel":M1,"weld-seam":M2,"eccentric-column":M3,"clamp":M4,"rotated-element":M5,"principal-stresses":M6,"axial-torque":M7,"crank-shaft":M8,"strain-rosette":M9};

const $=id=>document.getElementById(id);
let curKey,curSeed,cur;
const tidy=h=>h.replace(/\bin\.\.(?!\.)/g,"in.").replace(/\b([Aa]) (aluminum|inelastic|unequal)\b/g,"$1n $2");
function render(key,seed){
  curKey=key;curSeed=seed;const T=TEMPLATES[key];cur=T.generate(seed);const {p,s}=cur;
  $("typeSel").value=key;$("seedIn").value=seed;history.replaceState(null,"","#"+key+"-"+seed);
  $("fig").innerHTML=T.figure(p,s);$("statement").innerHTML=tidy(T.statement(p,s));
  $("answers").innerHTML=T.fields(p,s).map(f=>f.choices
    ?`<label>${tidy(f.label)}</label><select id="a_${f.id}"><option value="">choose</option>${f.choices.map(c=>`<option>${c}</option>`).join("")}</select><span class="mark" id="m_${f.id}"></span>`
    :`<label>${tidy(f.label)}</label><span><input type="text" id="a_${f.id}" autocomplete="off" inputmode="decimal"> ${f.unit||""}</span><span class="mark" id="m_${f.id}"></span>`).join("");
  $("ansNote").textContent=T.note||"";$("solution").innerHTML=tidy(T.solution(p,s));
  $("solution").style.display="none";$("solBtn").textContent="Show solution";
}
function check(){
  const T=TEMPLATES[curKey],{p,s}=cur,tr=T.truth(p,s);
  T.fields(p,s).forEach(f=>{
    const el=$("m_"+f.id),raw=$("a_"+f.id).value.trim();let ok=false;
    if(f.choices)ok=raw===tr[f.id];
    else{const v=parseFloat(raw.replace(/,/g,"")),t=tr[f.id];
      if(isFinite(v)&&f.abs!==undefined) ok=Math.abs(v-t)<=f.abs;
      else if(isFinite(v)) ok=f.signed?Math.abs(v-t)<=0.02*Math.abs(t)+1e-9:Math.abs(Math.abs(v)-Math.abs(t))<=0.02*Math.abs(t)+1e-9;
      if(isFinite(v)&&f.signed&&f.abs===undefined&&Math.abs(v)>0&&Math.sign(v)!==Math.sign(t)) ok=false}
    el.textContent=raw===""?"":ok?"Correct":"Not yet";el.className="mark "+(ok?"ok":"bad");
  });
}
const newSeed=()=>1+Math.floor(Math.random()*999999);
$("typeSel").innerHTML=Object.entries(TEMPLATES).map(([k,t])=>`<option value="${k}">${t.name}</option>`).join("");
$("typeSel").onchange=e=>render(e.target.value,newSeed());
$("newBtn").onclick=()=>render(curKey,newSeed());
$("loadBtn").onclick=()=>{const v=parseInt($("seedIn").value,10);if(v>0)render(curKey,v)};
$("checkBtn").onclick=check;
$("solBtn").onclick=e=>{const s=$("solution"),show=s.style.display!=="block";
  s.style.display=show?"block":"none";e.target.textContent=show?"Hide solution":"Show solution"};
(function(){const m=/^#([a-z0-9-]+?)-(\d+)$/.exec(location.hash);
  if(m&&TEMPLATES[m[1]])render(m[1],parseInt(m[2],10));else render(Object.keys(TEMPLATES)[0],newSeed())})();

</script>
